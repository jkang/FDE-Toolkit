title: "铁路订票服务 — OSM 战略地图（核心聚焦：客户服务体验提升）"
config:
  height:
    objectiveScore: 100
objectives:
  - name: "月度净满意出行人次 (MNS-T) 持续增长"
    value: "[推断] 2.5 - 3.2 亿人次/月（基于有效出行 * 满意度系数）"
    trend: "up"
    subObjectives:
      - name: "提升“主动关怀”与预判能力"
        value: "主动服务覆盖率 ≥ 60%"
        trend: "up"
        strategies:
          - "全链路异常感知：实时监控运行图、天气、换乘压力，预判受影响旅客"
          - "前置服务推送：在风险发生前，主动向受影响旅客推送替代方案或补救建议"
          - "个性化出行提醒：基于用户画像（如老人、儿童、商务）提供差异化的行程引导"
        metrics:
          - name: "主动服务覆盖率"
            calculation: "系统主动发起的服务触达人次 / 受异常/变更影响的总人次"
            value: "目标：≥ 60%"
            trend: "up"
          - name: "服务触发后的点击/确认率"
            calculation: "用户点击主动推送并确认建议的比例"
            value: "目标：≥ 35%"
            trend: "up"
        relatedScenarios:
          scenarios:
            - name: "晚点预警与换乘自动评估"
              description: "当第一程列车预计晚点导致第二程换乘时间不足时，系统主动弹出预警，并列出可改签的后续车次方案，支持一键锁定座位。"
            - name: "特殊旅客主动协助"
              description: "识别到订单包含高龄老人或重点旅客时，主动推送车站无障碍设施位置、重点旅客预约入口及行程节点语音提示。"

      - name: "增强信息透明度与预期管理"
        value: "候补进度透明度 100%"
        trend: "up"
        strategies:
          - "候补/排队可视化：将“黑盒”等待变为“进度条”式体验，展示预估等待时间"
          - "规则“人话化”解释：利用 AI 交互将复杂的退改阶梯费率、报销规则解释清楚"
          - "库存变动实时透明：对收藏/关注的车次提供库存回升的“秒级”推送"
        metrics:
          - name: "候补进度透明度"
            calculation: "提供进度展示的候补订单数 / 总候补订单数"
            value: "目标：100%"
            trend: "up"
          - name: "售后规则争议率"
            calculation: "因规则理解偏差导致的售后咨询数 / 总售后业务量"
            value: "目标：≤ 0.1%"
            trend: "down"
          - name: "服务净推荐值 (NPS)"
            calculation: "用户调研中（推荐者% - 贬损者%）"
            value: "目标：≥ 45%"
            trend: "up"
        relatedScenarios:
          scenarios:
            - name: "候补订单的“定心丸”体验"
              description: "候补页面不仅显示“候补中”，还显示“当前排第 N 位”、“预计 1 小时内兑现概率 80%”，并建议“若急需，可尝试换乘方案 X”。"
            - name: "退改签费用争议自助处理"
              description: "用户对退改签费用有疑问时，助手通过时间轴清晰展示：购票时间、发车时间、退票发起时间及对应的费率阶梯，消除信息差。"

      - name: "强化全链路服务韧性（变更与补救）"
        value: "异常补救成功率 ≥ 75%"
        trend: "up"
        strategies:
          - "出票失败即自动重订：支付成功但库存锁定失败时，立即在后台发起同席别/邻近席别重试"
          - "停运/变更的一键化协同：主票退改后，关联的餐饮、接送站、行程单等服务自动同步处置"
          - "改签决策智能化：根据用户行程紧急程度（如换乘、商务）智能排序最优改签方案"
          - "跨渠道服务一致性：确保 App、12306 客服热线、站内窗口的数据实时同步，不踢皮球"
        metrics:
          - name: "异常补救成功率"
            calculation: "通过系统补救方案最终成功的出行人次 / 初始订单失败的人次"
            value: "目标：≥ 75%"
            trend: "up"
          - name: "退改签自助完成率"
            calculation: "自助渠道（App/Web）闭环处理的变更量 / 总变更量"
            value: "目标：≥ 95%"
            trend: "up"
          - name: "服务解决率 (FCR)"
            calculation: "首次自助或人工触达即可闭环解决问题的比例"
            value: "目标：≥ 90%"
            trend: "up"
        relatedScenarios:
          scenarios:
            - name: "“支付即保障”的出票补救"
              description: "用户支付后出票失败，系统在 30 秒内自动匹配到 5 分钟后另一趟同方向列车有票，主动询问用户是否接受“平移”，用户确认后无需再次支付。"
            - name: "停运场景下的全家桶式退订"
              description: "列车停运后，系统自动发起退票流程，并询问：“您的订餐与约车服务也将受影响，是否一键取消并全额退款？”"

      - name: "保障峰值公平与体验底线"
        value: "高峰投诉率 ≤ 0.05%"
        trend: "down"
        strategies:
          - "峰值队列公平性：确保真实用户的请求按序排队，严厉打击脚本刷票，维护公平感"
          - "误伤控制护栏：在反作弊策略升级时，将正常用户的“误拦截率”作为一票否决指标"
          - "合规与隐私底线：在提升服务（如行程分析）时，严格遵循最小必要原则，不触碰隐私红线"
        metrics:
          - name: "高峰期投诉率"
            calculation: "高峰期间每万笔订单产生的服务投诉数"
            value: "目标：≤ 0.05%"
            trend: "down"
          - name: "异常拦截误伤率"
            calculation: "正常用户被系统拦截并申诉成功的比例"
            value: "目标：≤ 0.5%"
            trend: "down"
        relatedScenarios:
          scenarios:
            - name: "春运/大促期间的“公平排队”告知"
              description: "在极高并发下，系统引导用户进入“公平排队区”，明确告知当前前方人数和预计处理速度，缓解用户“狂点刷新”的挫败感。"
            - name: "隐私透明的行程管家"
              description: "系统提供“行程助手”分析建议时，明确展示所需权限及数据用途，并支持用户随时关闭，确保服务感不变成“监控感”。"
