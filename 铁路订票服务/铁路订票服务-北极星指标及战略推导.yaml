title: "铁路订票服务 — 以“服务体验”为核心的北极星指标分析"
planning_cycle: "2026 H2 - 2027 H1"
nsm:
  name: "月度净满意出行人次 (MNS-T)"
  target: "[推断] 2.5 - 3.2 亿 人次/月（基于有效出行 * 满意度系数）"
  unit: "人次/月"
  definition: "当月完成检票核验且用户反馈无负面体验（或通过服务闭环解决）的出行人次。计算公式：有效出行人次 * (1 - 负向服务事件率)。"
kpi_pyramid:
  - name: "服务体验"
    type: "核心体验指标"
    metrics:
      - name: "服务净推荐值 (NPS)"
        target: "≥ 45%"
        desc: "用户对全流程服务质量的推荐意愿"
      - name: "服务解决率 (FCR)"
        target: "≥ 90%"
        desc: "用户问题在首次触达（自助/人工）时得到解决的比例"
      - name: "主动服务覆盖率"
        target: "≥ 60%"
        desc: "系统在延误、停运等异常发生前，主动触达并提供方案的比例"
  - name: "售后与变更韧性"
    type: "服务闭环指标"
    metrics:
      - name: "退改签自助完成率"
        target: "≥ 95%"
        desc: "无需人工介入，通过 AI 助手或自助流程完成的退改签比例"
      - name: "变更处置中位时长"
        target: "≤ 3min"
        desc: "从接收运行变更通知到用户选定替代方案的平均决策与操作耗时"
      - name: "售后规则争议率"
        target: "≤ 0.1%"
        desc: "因退改签费率、资格等规则理解偏差导致的投诉或人工介入比例"
  - name: "交易韧性"
    type: "质量指标"
    metrics:
      - name: "出票成功率"
        target: "≥ 99.5%（日常） / ≥ 98.5%（高峰）"
        desc: "支付后最终出票成功的占比，重点关注高峰期的补救成功率"
      - name: "异常补救成功率"
        target: "≥ 75%"
        desc: "出票失败、停运、变更等情况下，通过系统自动推荐/改签最终成功的占比"
  - name: "信息透明"
    type: "效率指标"
    metrics:
      - name: "候补进度透明度"
        target: "100%"
        desc: "所有候补订单均提供进度提示与成功率区间预估"
      - name: "运行变更实时感知时延"
        target: "≤ 5min"
        desc: "从运行图调整到受影响旅客收到通知的时间差"
  - name: "系统稳健"
    type: "健康指标"
    metrics:
      - name: "高峰期投诉率"
        target: "≤ 0.05%"
        desc: "高峰期间每万单投诉量"
      - name: "隐私与合规事件数"
        target: "0"
        desc: "确保服务提升不以牺牲合规为代价"
strategies:
  - name: "从“被动响应”转向“主动关怀”的服务体系"
    priority: 0
    swot_ref: "S1 x O2"
    description: "利用 AI 识别潜在的行程中断风险（如晚点导致无法换乘），在用户感知前提供替代方案，将服务前置。"
    actions:
      - "构建全链路异常监控：天气、运行图、库存波动、换乘紧迫度"
      - "建立主动触达矩阵：App Push、短信、站内信，提供一键式补救入口"
    kpi_ref: "主动服务覆盖率 / 服务解决率 (FCR)"
  - name: "极端场景下的“透明化”与“确定性”保障"
    priority: 1
    swot_ref: "W2 x O2"
    description: "在高峰期和运行变更时，通过数据透明消除焦虑。即使无法出票，也要给用户清晰的“为什么”和“下一步建议”。"
    actions:
      - "候补/排队透明化：展示当前排队位置、预估等待时间、历史成功参考"
      - "规则白话化：将复杂的退改签、报销、学生票规则通过交互式助手解释清晰"
    kpi_ref: "候补进度透明度 / NPS"
  - name: "全链路服务韧性：出票失败即补偿/补救"
    priority: 2
    swot_ref: "S2 x O3"
    description: "把“支付成功”视为契约的开始。一旦由于系统或库存原因导致出票失败，必须由系统发起更高优先级的自动补位或替代推荐。"
    actions:
      - "自动补位引擎：出票失败后自动扫描跨席别、换乘、后续车次，提供快速确认通道"
      - "服务联动：票务变更自动同步订餐、接送站、行程单等延伸服务"
    kpi_ref: "异常补救成功率 / 出票成功率"
