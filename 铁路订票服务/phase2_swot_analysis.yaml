      name: "官方一致规则与状态机"
      evidence: "[推断] 拥有票额、规则与售后状态机的一致口径，具备可解释与可追溯优势"
    - id: "S2"
      name: "极大规模与高频入口"
      evidence: "2024 国家铁路旅客发送量 40.85 亿人次（统计公报）"
    - id: "S3"
      name: "服务生态扩展能力"
      evidence: "官网入口聚合包含订餐/约车/托运/旅游等"
    - id: "S4"
      name: "合规基础设施"
      evidence: "隐私政策、SDK 披露等公开文档体系"
  weaknesses:
    - id: "W1"
      name: "公共服务属性导致商业化空间受限"
      evidence: "[推断] 票价与规则受政策/舆情约束，体验换收费敏感"
    - id: "W2"
      name: "峰值稳定性压力"
      evidence: "[推断] 高峰并发与供给稀缺常态化，失败成本高"
    - id: "W3"
      name: "规则复杂导致体验不可控"
      evidence: "[推断] 多票种/优惠/学生资质/候补/退改签/运行变更规则叠加"
    - id: "W4"
      name: "风险治理成本高"
      evidence: "[推断] 反爬反黄牛、账号安全、误伤治理投入大"
  opportunities:
    - id: "O1"
      name: "一站式出行生态"
      evidence: "[推断] 酒店/接驳/餐饮/旅游承接出行链路需求"
    - id: "O2"
      name: "峰值体验产品化"
      evidence: "[推断] 排队可解释、进度透明、失败补救、替代方案推荐"
    - id: "O3"
      name: "重点旅客/团队/差旅数字化"
      evidence: "[推断] 提升特殊人群与组织型出行体验"
    - id: "O4"
      name: "合规数据驱动供需匹配"
      evidence: "[推断] 匿名化/汇总数据优化换乘推荐与候补策略"
  threats:
    - id: "T1"
      name: "监管持续收紧"
      evidence: "监管通报明确治理第三方平台宣传/隐私等不规范行为"
    - id: "T2"
      name: "隐私与安全事件风险"
      evidence: "[推断] 数据泄露/账号盗用将导致重大舆情与合规成本"
    - id: "T3"
      name: "供给侧不确定性"
      evidence: "[推断] 停运/晚点/运力调整引发集中售后与客服压力"
    - id: "T4"
      name: "跨方式竞争"
      evidence: "[推断] 航空/公路/自驾分流中长途与节假日需求"
cross_matrix:
  so:
