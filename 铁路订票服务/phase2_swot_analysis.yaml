      ref: "W1 x O1"
      summary: "商业化放在酒店/接驳/餐饮/旅游等可解释的体验增益模块"
  st:
    - id: "ST1"
      ref: "S4 x T1"
      summary: "合规前置：最小必要数据 + 可审计实验机制降低监管与舆情风险"
  wt:
