meta:
  company: "铁路订票服务"
  scenario: "退改签智能助手"
  businessDomain: "交通/出行"
  productName: "退改签智能助手"
  mode: "Modern SaaS 工作台"
  brandSource: "domain 推断"

brandProfile:
  primaryTone: "信任蓝 / 出行橙"
  primaryColor: "#1e3a8a"
  userGroup: "终端消费者"
  seriousness: "开放协同"
  maturity: "传统巨头"

designLanguage:
  colors:
    primary: "#1e3a8a"
    primaryDark: "#142a63"
    primaryLight: "#93b4e0"
    accent: "#f59e0b"
    success: "#16a34a"
    warning: "#d97706"
    danger: "#dc2626"
    info: "#0ea5e9"
    neutral:
      text: "#1f2937"
      textSecondary: "#595959"
      border: "#e2e8f0"
      bg: "#ffffff"
      bgAlt: "#f5f7fa"
    gradient:
      from: "#142a63"
      to: "#1e3a8a"
  typography:
    fontFamily: "MiSans, Inter, -apple-system, 'Microsoft YaHei', sans-serif"
    h1: { size: 26, weight: "600", lineHeight: 1.2, spacing: "-0.02em" }
    h2: { size: 20, weight: "600", lineHeight: 1.3, spacing: "0" }
    h3: { size: 16, weight: "500", lineHeight: 1.4, spacing: "0" }
    body: { size: 14, weight: "400", lineHeight: 1.55, spacing: "0" }
    label: { size: 12, weight: "600", lineHeight: 1.2, spacing: "0.05em", uppercase: true }
    caption: { size: 12, weight: "300", lineHeight: 1.4, spacing: "0" }
  spacing:
    scale: [4, 8, 12, 16, 24, 32, 48]
    contentMaxWidth: 1440
    cardPadding: 20
    sectionGap: 20
    elementGap: 12
  radius:
    sm: 6
    md: 10
    lg: 14
    pill: 999
  shadow:
    card: "0 1px 3px rgba(20, 42, 99, 0.08), 0 1px 2px rgba(20, 42, 99, 0.04)"
    raised: "0 4px 16px rgba(20, 42, 99, 0.12)"
  border:
    color: "#e2e8f0"
    width: 1
  components:
    card: { radius: 10, shadow: "card", background: "#ffffff", border: true }
    button: { radius: 8, transition: "0.15s ease-out", hoverOpacity: 0.85 }
    table: { density: "compact", rowHover: true, headerBg: "#f5f7fa" }
    input: { radius: 8, focusOutline: "#93b4e0" }
  states:
    hoverTime: "0.15s ease-out"
    focusOutline: "#93b4e0"
    loadingType: "skeleton"
    emptyStyle: "icon + hint + cta"
  layout:
    mode: "side"
    siderWidth: 216
    headerHeight: 56
  motion:
    transition: "0.15s ease-out"
    enableSpring: false
  responsive:
    breakpoints: [375, 768, 1024, 1440]
  diffChecklist:
    - "出行信任蓝主色已注入 ConfigProvider + CSS 变量（#1e3a8a / #142a63）"
    - "橙色强调用于「选定方案/一键处置」等对外动作，克制不滥用"
    - "字体系统覆盖全局 + 标题层级（26/20/16/14）"
    - "间距统一为 8pt 体系，卡片内距 20、区块间距 20"
    - "圆角（6/10/14）与阴影按出行产品气质定制（非默认 antd）"
    - "7 类元素按 componentSpecs 升级"
    - "六态（hover/focus/empty/loading/error/disabled）完备"
    - "响应式断点 375/768/1024/1440 生效"
    - "cursor-pointer 已加到所有可交互区"
    - "状态色语义一致：改签成功=成功、候补/换乘=警告、处置失败=危险"

componentSpecs:
  - { element: "steps", v2: { style: "退改签进度条 · 橙色 accent 当前步" } }
  - { element: "aiResultCard", v2: { style: "AI 洞察面板 · 带费率档位与排序依据" } }
  - { element: "table", v2: { style: "方案/关联服务表 · 状态徽章 + 风险标签" } }
  - { element: "statRow", v2: { style: "自助率/决策耗时指标区" } }
  - { element: "buttonRow", v2: { style: "主按钮实心 · hover 微抬升" } }
  - { element: "alert", v2: { style: "对外承诺闸门警示" } }
  - { element: "timeline", v2: { style: "处置流程状态追踪器" } }

diffChecklist:
  - "自定义主色是否已注入 ConfigProvider + CSS 变量"
  - "字体系统是否覆盖全局 + 标题层级"
  - "间距是否统一为 8pt 体系"
  - "圆角/阴影是否按产品气质定制（非默认 antd）"
  - "元素是否按 componentSpecs 升级"
  - "六态（hover/focus/empty/loading/error/disabled）是否完备"
  - "响应式断点 375/768/1024/1440 是否生效"
  - "cursor-pointer 是否加到所有可交互区"
