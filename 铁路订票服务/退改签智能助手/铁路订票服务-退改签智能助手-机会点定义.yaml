meta:
  title: "铁路订票服务 · 机会点定义"
  sectionNo: "3.1"
  version: "v1.0"
  date: "2026-09-10"
  business: "铁路订票服务"
  domain: "铁路票务售后（退票 / 改签 / 运行变更）"
  scenario: "退改签智能助手"
  problemRef: "承接问题：退改签阶梯费率规则生涩难懂、旅客无法直观预估损失；运行变更（晚点/停运）时面对数十备选改签方案难以快速锁定最优；主票退改后关联的餐饮/约车/行程单服务需手动逐个处理、易遗漏导致损失"
  opportunitySource: "核心票务 AI 机会地图 · 退改签智能助手（高焦虑、高复杂度售后场景）"

opportunities:
  - id: "OP1"
    order: 1
    name: "退改签规则实时转译（大白话费率解释）"
    type: "cognitive"
    rootCauseType: "阶梯费率规则生涩、法律条文式描述，旅客无法直观预估损失"
    capabilityMatch: "LLM 规则转译 / 确定性计费"
    e1: "为旅客构建「退改签规则实时转译」，把「自己读生涩的阶梯费率条款、猜退票损失」升级为「AI 结合当前订单实时转译为大白话说明 + 可视化费用对比」。"
    e2: "角色：核心票务旅客（日常/通勤/商务）、节假日高峰期旅客。\n场景：旅客在订单详情页发起退票或改签，AI 依据当前时间与发车时间差、票种与席别，实时算出阶梯费率并转译为易懂说明。"
    e3: "退改签阶梯费率（开车前 8 天以上免费、48 小时以上 5%、24–48 小时 10%、不足 24 小时 20% 等）专业生涩，旅客难以自行判断，易产生「退费陷阱」误解。"
    e4: "计费走确定性规则引擎（不靠 LLM 算钱）→ LLM 将规则结果转译为当前订单下的「大白话」→ 输出可视化费用对比表（退票损失 vs 改签成本）→ 旅客一目了然 → 把规则理解成本降到最低。"
    e5: "规则理解从读条款走向实时转译；旅客对退改损失的预期明确；投诉与误解下降。"
    valueBreakdown:
      - dimension: "覆盖范围"
        aligns: "⑥ 影响范围"
        metric: "全部退改签订单；受益角色：全体旅客"
      - dimension: "发生频度"
        aligns: "⑤ 发生频度"
        metric: "每次退改签一次"
      - dimension: "单次收益"
        aligns: "⑦ 每次发生对业务的影响"
        metric: "自行读条款 → 实时转译 + 费用对比；规则理解耗时下降"
      - dimension: "累计影响"
        aligns: "⑧ 累计对业务影响"
        metric: "「退费陷阱」误解减少；客服规则咨询进线量下降"

  - id: "OP2"
    order: 2
    name: "运行变更下的最优改签方案推荐"
    type: "innovation"
    rootCauseType: "晚点/停运时面对数十备选方案（直达/候补/换乘）难以快速锁定最优"
    capabilityMatch: "Agent / 多约束寻优 / 实时余票检索"
    e1: "为旅客构建「运行变更最优改签方案推荐」，把「在数十个备选里人工比对、难以锁定最优」升级为「基于偏好与实时余票并发检索 + 智能排序 Top 3 + 风险评估」。"
    e2: "角色：旅客（选择方案）、一线客服（辅助处置）。\n场景：列车晚点/停运事件触发，AI 结合旅客偏好（尽早出发、不接受换乘、席别一致等）与实时余票，并发检索直达/候补/换乘方案并排序推荐。"
    e3: "运行变更时备选方案众多，旅客在高压情境下难以快速决策；改签窗口有限，错过最优解损失大。"
    e4: "强推理模型做多约束方案寻优 → 并发检索直达/候补/换乘 → 结合历史同场景改签成功率大数据排序 → 输出 Top 3 方案卡片（含风险与损失评估）→ 旅客确认（对外必停）→ 决策耗时由 15–20 分钟降至秒级。"
    e5: "改签决策从人工比对走向智能寻优；高峰期改签成功率提升；决策耗时秒级。"
    valueBreakdown:
      - dimension: "覆盖范围"
        aligns: "⑥ 影响范围"
        metric: "全部运行变更受影响旅客；受益角色：旅客 + 一线客服"
      - dimension: "发生频度"
        aligns: "⑤ 发生频度"
        metric: "事件驱动（晚点/停运）"
      - dimension: "单次收益"
        aligns: "⑦ 每次发生对业务的影响"
        metric: "15–20 分钟人工决策 → 秒级推荐"
      - dimension: "累计影响"
        aligns: "⑧ 累计对业务影响"
        metric: "高峰期改签成功率提升；错失最优解导致的损失下降"

  - id: "OP3"
    order: 3
    name: "一体化关联服务同步处置"
    type: "repetitive"
    rootCauseType: "主票退改后关联的餐饮/约车/行程单需手动逐个处理，易遗漏"
    capabilityMatch: "跨业务编排 / 订单协同 / 一致性校验"
    e1: "为旅客构建「一体化关联服务同步处置」，把「主票退改后手动逐个注销/更新餐饮、约车、行程单」升级为「主票退改确认后自动同步处置全部关联服务并给出确认清单」。"
    e2: "角色：旅客（确认处置）、一线客服（异常协助）。\n场景：主票退改确认后，AI 依据跨业务订单关联协议，自动发起关联延伸服务（餐饮、约车、接送站、行程单）的同步注销或更新。"
    e3: "主票退改与关联服务割裂，需旅客手动逐个处理，易遗漏导致损失；跨业务一致性无保障。"
    e4: "依据跨业务订单关联协议识别关联订单 → 自动发起同步注销/更新 → 输出一体化服务同步清单与确认状态 → 异常项转客服 → 把关联服务遗漏损失降到最低。"
    e5: "关联服务处置从手动逐个走向一键同步；遗漏损失下降；跨业务一致性提升。"
    valueBreakdown:
      - dimension: "覆盖范围"
        aligns: "⑥ 影响范围"
        metric: "有延伸服务的退改签订单；受益角色：旅客 + 客服"
      - dimension: "发生频度"
        aligns: "⑤ 发生频度"
        metric: "每次主票退改一次"
      - dimension: "单次收益"
        aligns: "⑦ 每次发生对业务的影响"
        metric: "手动逐个处理 → 一键同步；关联处置耗时下降"
      - dimension: "累计影响"
        aligns: "⑧ 累计对业务影响"
        metric: "关联服务遗漏损失下降；跨业务一致性提升"

  - id: "OP4"
    order: 4
    name: "退改签全流程自助化"
    type: "repetitive"
    rootCauseType: "退改签依赖人工客服介入，高峰期进线量大、自助率低"
    capabilityMatch: "Agent / 流程编排 / HITL 兜底"
    e1: "为旅客构建「退改签全流程自助化」，把「遇到问题就打客服电话、排队等待」升级为「AI 引导自助完成规则解释 → 方案选择 → 一体化处置，复杂异常才转人工」。"
    e2: "角色：旅客（自助）、一线客服（仅承接复杂异常）。\n场景：从订单详情页或运行变更 Push 卡片进入，AI 引导完成退改签全流程，异常自动建单并附上下文转人工。"
    e3: "退改签流程依赖人工客服，高峰期进线量大、等待久，自助率低。"
    e4: "Agent 编排全流程自助 → 规则解释、方案推荐、一体化处置一气呵成 → 复杂异常自动建单并附完整上下文转人工 → 把退改签自助率推向 ≥95%、降低客服进线量。"
    e5: "退改签从人工介入走向全流程自助；自助率 ≥95%；客服进线量显著下降。"
    valueBreakdown:
      - dimension: "覆盖范围"
        aligns: "⑥ 影响范围"
        metric: "全部退改签场景；受益角色：旅客 + 一线客服"
      - dimension: "发生频度"
        aligns: "⑤ 发生频度"
        metric: "每次退改签一次"
      - dimension: "单次收益"
        aligns: "⑦ 每次发生对业务的影响"
        metric: "人工客服介入 → 自助完成；处理时长下降"
      - dimension: "累计影响"
        aligns: "⑧ 累计对业务影响"
        metric: "退改签自助率 ≥95%；人工客服进线量显著下降"
