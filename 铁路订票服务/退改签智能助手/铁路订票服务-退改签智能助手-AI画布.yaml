title: "铁路订票服务 — 退改签智能助手 AI 画布"
description: "针对铁路出行中“退票、改签、运行变更”这一高焦虑、高复杂度的售后场景，利用 AI 提供规则实时解释、最优方案推荐与一体化处置能力，提升旅客自主解决率并降低平台投诉。"
userRoles:
  - 核心票务旅客（日常/通勤/商务）
  - 节假日/春运高峰期旅客
  - 车站窗口/热线一线客服（辅助）
userPains:
  - 规则理解难：退改签阶梯费率描述专业生涩，用户无法直观预估损失。
  - 决策成本高：在运行变更（晚点/停运）时，面对数十个备选改签方案难以快速锁定最优解。
  - 流程碎片化：主票退改后，关联的餐饮、约车、行程单服务需手动逐个处理，易遗漏导致损失。
aiInput:
  - 原订单详情（车次、座席、票价、乘车人）
  - 当前时间点与发车时间差
  - 外部触发：列车实时运行状态（晚点时长、停运信息）
  - 旅客偏好（如：希望尽早出发、不接受换乘、席别必须一致等）
dataKnowledge:
  - 12306 官方票务与退改签费率知识库
  - 实时列车运行图与余票动态库存
  - 历史同场景改签成功率大数据模型
  - 跨业务订单关联协议（票务、餐饮、约车、接送站）
workflow:
  - 场景识别：根据用户操作或外部运行变更事件，自动拉起服务助手。
  - 规则转译：AI 将生涩的法律条文式规则实时转译为当前订单下的“大白话”说明。
  - 方案计算：基于用户偏好与实时余票，并发检索直达、候补、换乘等最优改签策略。
  - 一体化处置：确认方案后，自动发起主票退改及所有关联延伸服务的同步注销或更新。
modelUsage:
  - 策略决策：使用具有强逻辑推理能力的模型（如 Claude 3.5 Sonnet）进行多约束方案寻优。
  - 意图转译：轻量化模型进行用户诉求理解与规则摘要输出。
aiOutput:
  - 可视化费用对比表（退票损失 vs 改签成本）
  - 智能排序的 Top 3 改签方案卡片（含风险评估）
  - 一体化服务同步清单与确认状态
tools:
  - 票务核心交易接口（退/改/订）
  - 实时列车运行监控 API
  - 全业务订单协同中心（餐饮/约车联动）
  - 智能客服工单系统（异常自动建单）
productType:
  - 12306 App/Web 订单详情页深度集成组件
  - 运行变更 Push 通知卡片（一键式处置入口）
  - 站内智能终端（触摸屏）助手模式
userGains:
  - 决策耗时：由原来平均 15-20 分钟缩短至秒级推荐，提升高峰期改签成功率。
  - 服务成本：提升退改签场景自助率（目标 ≥95%），显著降低人工客服进线量。
  - 用户心智：消除“退费陷阱”误解，将售后危机转化为“官方关怀”的品牌溢价。
