subtitle: "单场景端到端：机会点定义 → AI画布 → To-be流程/CKD/任务拆解(P1)/规则挖掘(P2) → Agent本体 → Agent产品方案 → To-be旅程 → MVP原型 → UX优化 → 落地技术架构 → MVP成效指标 → 测试数据集"
executive_summary:
  - "一句话结论：把「自己读生涩条款 + 数十方案人工比对 + 关联服务手动逐个处理」升级为「<b>规则实时转译 + 费用对比 + 方案智能寻优 + 主票与关联服务一体化处置 + 复杂异常自动建单转人工</b>」，退改签自助率推向 ≥95%，决策耗时 15–20 分钟压到秒级。"
  - "本报告沿 <b>理需求 → 挖知识 → 建本体 → 生智能 → 评测</b> 给出可施工证据链：4 个机会点 · 18 个 L5 深度任务 · 10 条业务规则 · 8 个本体实体 · 5 个编排 Skill · 5 个原型页面 · 24 条测试用例。"
  - "技术路线：<b>Autonomous Planner</b>（1 编排 Agent + 5 Skill + 1 本体）；选择方案与发起退改交易为对外承诺，强制人工闸门。"
