meta:
  title: "铁路订票服务 · 退改签智能助手端到端深度任务流程地图"
  subtitle: "来自《任务流程挖掘清单》主表"
  version: "v1.0"
  date: "2026-09-10"
  scenarioName: "退改签智能助手"
  businessStage: "阶段1 任务流程挖掘 · P1"
  methodology: "阶段1方法（业务环节 L3 → 主要活动 L4 → 深度任务 L5）"
  inputs:
    - "《铁路订票服务-退改签智能助手-AI画布》"
    - "《铁路订票服务-退改签智能助手-To-be流程》"
    - "《铁路订票服务-核心票务AI机会地图》"
  sourceRef: "铁路订票服务-退改签智能助手-To-be流程.yaml 任务手账"
  kpi:
    - "退改签自助率"
    - "决策耗时"
    - "高峰期改签成功率"
    - "客服进线量"
    - "关联服务遗漏损失"

overview:
  l3Count: 5
  l4Count: 6
  l5Count: 18
  focusL3: "方案推荐"
  focusL4: "方案寻优"

legend:
  focusType: "p0"
  execution:
    - { type: "agent",  label: "Agent",   icon: "🤖" }
    - { type: "mixed",  label: "混合执行", icon: "🤝" }
    - { type: "human",  label: "人工",     icon: "👤" }
  convention: "L3 业务阶段 → L4 活动分组 → L5 可执行动作"

stages:
  - id: "S1"
    num: "01"
    name: "场景识别"
    l5Count: 3
    isFocus: false
    groups:
      - id: "G1_1"
        name: "事件与订单"
        isP0: false
        tasks:
          - { id: "t01", name: "监听运行变更与用户操作", actor: "agent" }
          - { id: "t02", name: "识别退改签场景类型", actor: "agent" }
          - { id: "t03", name: "拉取原订单与乘车人信息", actor: "agent" }
  - id: "S2"
    num: "02"
    name: "规则转译"
    l5Count: 4
    isFocus: false
    groups:
      - id: "G2_1"
        name: "费用试算"
        isP0: false
        tasks:
          - { id: "t04", name: "计算退改签阶梯费率", actor: "agent" }
          - { id: "t05", name: "规则转译为大白话", actor: "agent" }
          - { id: "t06", name: "输出可视化费用对比表", actor: "agent" }
          - { id: "t07", name: "确认费用理解", actor: "mixed" }
  - id: "S3"
    num: "03"
    name: "方案推荐"
    l5Count: 4
    isFocus: true
    groups:
      - id: "G3_1"
        name: "方案寻优"
        isP0: true
        tasks:
          - { id: "t08", name: "并发检索改签方案", actor: "agent" }
          - { id: "t09", name: "结合偏好与成功率排序", actor: "agent" }
          - { id: "t10", name: "生成风险评估与损失评估", actor: "agent" }
          - { id: "t11", name: "选择改签方案", actor: "mixed" }
  - id: "S4"
    num: "04"
    name: "一体化处置"
    l5Count: 4
    isFocus: false
    groups:
      - id: "G4_1"
        name: "主票处置"
        isP0: false
        tasks:
          - { id: "t12", name: "发起主票退/改交易", actor: "agent" }
      - id: "G4_2"
        name: "关联服务"
        isP0: false
        tasks:
          - { id: "t13", name: "识别关联延伸服务", actor: "agent" }
          - { id: "t14", name: "同步注销/更新关联服务", actor: "agent" }
          - { id: "t15", name: "跨业务一致性校验", actor: "agent" }
  - id: "S5"
    num: "05"
    name: "确认与后续"
    l5Count: 3
    isFocus: false
    groups:
      - id: "G5_1"
        name: "确认与通知"
        isP0: false
        tasks:
          - { id: "t16", name: "输出处置结果与确认清单", actor: "agent" }
          - { id: "t17", name: "承接复杂异常", actor: "human" }
          - { id: "t18", name: "通知推送与行程更新", actor: "agent" }

readingFlow:
  - "先看全链路：从事件触发到处置确认，形成退改签自助闭环"
  - "再找高价值 L4：『方案寻优』承载最密集的约束推理与人工放行"
  - "最后下钻 L5：拆成『检索 / 排序 / 评估 / 选择』四个可独立挂规则的动作"

focusDrill:
  before:
    l4Name: "方案寻优"
    whyTooCoarse: "它包含候选检索、综合排序、风险评估与人工选择等不同动作，输入输出与异常各不相同，不能直接作为最小执行单元。"
  approach: "访谈走查＋画布 workflow 还原 →"
  evidence:
    - "并发检索直达、候补、换乘等改签策略"
    - "结合旅客偏好与历史同场景改签成功率综合排序，输出 Top 3"
    - "为每个方案生成风险与损失评估"
    - "旅客在 Top 3 中选定方案（对外承诺前放行）"
  after: "下钻为 4 个能独立挂规则的动作，各自回答『查什么 / 怎么排 / 风险多大 / 选哪个』。"
focusSequence:
  - { id: "L5-1", name: "并发检索改签方案", question: "查什么候选" }
  - { id: "L5-2", name: "结合偏好与成功率排序", question: "依据什么排序" }
  - { id: "L5-3", name: "生成风险评估与损失评估", question: "风险多大" }
  - { id: "L5-4", name: "选择改签方案", question: "选哪个 / 谁拍板" }

taskTable:
  - l5: "并发检索改签方案"
    inputs: "原订单、实时余票、运行图"
    outputs: "直达/候补/换乘候选方案"
    ruleType: "关联关系类·余票-车次关联"
    exception: "无候选方案 → 兜底建议并放宽条件"
    actor: "agent"
  - l5: "结合偏好与成功率排序"
    inputs: "候选方案、旅客偏好、历史改签成功率"
    outputs: "Top 3 方案（含排序依据）"
    ruleType: "决策模型类·方案寻优排序规则"
    exception: "偏好冲突 → 给出权衡说明"
    actor: "agent"
  - l5: "生成风险评估与损失评估"
    inputs: "Top 3 方案"
    outputs: "方案卡片（含风险/损失）"
    ruleType: "模版范例类·方案卡片模板"
    exception: "风险无法评估 → 标注待确认"
    actor: "agent"
  - l5: "选择改签方案"
    inputs: "Top 3 方案卡片"
    outputs: "选定方案"
    ruleType: "决策模型类·方案选择放行"
    exception: "均不满意 → 放宽条件重算"
    actor: "mixed"

ioChain:
  - "运行变更事件 + 原订单详情"
  - "阶梯费率 + 大白话说明 + 费用对比表"
  - "候选改签方案 + Top 3 排序"
  - "选定方案"
  - "主票退改结果 + 关联服务处置结果"
  - "下游：处置确认清单 → 通知推送 → 行程更新"

learning:
  why: "每个 L5 各自只有一个核心动词，产出可观察，并可独立挂接规则（P2 规则挖掘据此绑定）。"
  key: "挖掘的关键不是改写名称，而是把专家真实执行的动作顺序、输入输出、判断依据和异常链路结构化。"

