meta:
  projectName: "railway-refund-change"
  productName: "退改签智能助手"
  businessDomain: "交通/出行"
  frontend: "react"
  designSystem: "antd"
  theme:
    source: "user"
    primary: "#1e3a8a"
    accent: "#f59e0b"
    layout: "side"
  ports:
    dev: 5173
    api: 8080

personas:
  - id: "biz_wang"
    name: "王敏"
    role: "商务旅客"
    department: "企业差旅"
    goals:
      - "行程变动时快速改签"
      - "清楚知道退改要花多少"
  - id: "return_li"
    name: "李婷"
    role: "节假日返乡旅客"
    department: "个人出行"
    goals:
      - "高峰期也能改到合适车次"
      - "关联服务不遗漏"
  - id: "csr_zhang"
    name: "张伟"
    role: "一线客服"
    department: "客服中心"
    goals:
      - "只处理复杂异常"
      - "异常单带完整上下文"

scenarios:
  - id: "s1"
    name: "列车晚点改签"
    personaId: "biz_wang"
    trigger: "列车 G1234 晚点 95 分钟，Push 卡片唤醒"
    goal: "秒级锁定最优改签方案并完成处置"
  - id: "s2"
    name: "计划性退票"
    personaId: "return_li"
    trigger: "行程取消，主动发起退票"
    goal: "看清退票损失，判断退还是改更划算"
  - id: "s3"
    name: "复杂异常转人工"
    personaId: "csr_zhang"
    trigger: "特殊票种计费存疑，规则盲区"
    goal: "带上下文一次性解决复杂争议"

dataModels:
  - name: "TicketOrder"
    description: "票务订单"
    fields:
      - { key: "orderNo", title: "订单号", type: "string" }
      - { key: "trainNo", title: "车次", type: "string" }
      - { key: "seatClass", title: "席别", type: "string" }
      - { key: "fare", title: "票价", type: "number" }
      - { key: "departTime", title: "发车时间", type: "string" }
      - { key: "status", title: "状态", type: "string" }
    mockData:
      - { orderNo: "E123456789", trainNo: "G1234", seatClass: "二等座", fare: 553, departTime: "2026-09-12 09:00", status: "有效" }
      - { orderNo: "E123456790", trainNo: "G2345", seatClass: "一等座", fare: 880, departTime: "2026-09-13 14:30", status: "有效" }
      - { orderNo: "E123456791", trainNo: "D3456", seatClass: "二等座", fare: 320, departTime: "2026-09-14 07:15", status: "有效" }
  - name: "ChangePlan"
    description: "改签方案"
    fields:
      - { key: "planId", title: "方案", type: "string" }
      - { key: "trainNo", title: "车次", type: "string" }
      - { key: "planType", title: "类型", type: "string" }
      - { key: "departTime", title: "出发时间", type: "string" }
      - { key: "matchScore", title: "匹配度", type: "string" }
      - { key: "riskLevel", title: "风险", type: "string" }
      - { key: "priceDiff", title: "票价差", type: "number" }
    mockData:
      - { planId: "方案1", trainNo: "G1236", planType: "直达", departTime: "10:30", matchScore: "95%", riskLevel: "低", priceDiff: 0 }
      - { planId: "方案2", trainNo: "G1240", planType: "换乘", departTime: "11:10", matchScore: "80%", riskLevel: "中", priceDiff: -26 }
      - { planId: "方案3", trainNo: "G1238", planType: "候补", departTime: "10:50", matchScore: "70%", riskLevel: "中", priceDiff: 0 }
  - name: "RelatedService"
    description: "关联延伸服务"
    fields:
      - { key: "serviceNo", title: "服务单号", type: "string" }
      - { key: "serviceType", title: "服务类型", type: "string" }
      - { key: "disposeStatus", title: "处置状态", type: "string" }
    mockData:
      - { serviceNo: "CT-8801", serviceType: "餐食", disposeStatus: "已更新" }
      - { serviceNo: "RD-3302", serviceType: "约车", disposeStatus: "已注销" }
      - { serviceNo: "IT-1105", serviceType: "行程单", disposeStatus: "已更新" }

pages:
  - id: "dashboard"
    title: "处置工作台总览"
    route: "/dashboard"
    icon: "DashboardOutlined"
    description: "退改签待办、运行变更与自助率概览"
    actions:
      - { name: "identifyScene", button: "识别场景并拉取订单" }
    sections:
      - type: "steps"
        current: 0
        items: ["场景识别", "规则转译", "方案推荐", "一体化处置", "确认后续"]
      - type: "statRow"
        stats:
          - { label: "待处置订单", value: 12, suffix: "单" }
          - { label: "运行变更影响", value: 3, suffix: "单" }
          - { label: "自助率", value: 95, suffix: "%" }
          - { label: "平均决策耗时", value: 8, suffix: "秒" }
      - type: "table"
        title: "待处理订单"
        data: "mock:TicketOrder"
        rowKey: "orderNo"
        columns:
          - { key: "orderNo", title: "订单号" }
          - { key: "trainNo", title: "车次" }
          - { key: "seatClass", title: "席别" }
          - { key: "fare", title: "票价" }
          - { key: "departTime", title: "发车时间" }
          - { key: "status", title: "状态", tag: { "有效": "success", "已改签": "processing", "已退票": "default" } }
      - type: "buttonRow"
        buttons:
          - { text: "进入规则转译", type: "primary", action: "navigate:/translate" }

  - id: "translate"
    title: "规则转译与费用对比"
    route: "/translate"
    icon: "FileTextOutlined"
    description: "阶梯费率实时转译为大白话，输出退票损失 vs 改签成本对比"
    actions:
      - { name: "translateFee", button: "计算并转译费用" }
    sections:
      - type: "steps"
        current: 1
        items: ["场景识别", "规则转译", "方案推荐", "一体化处置", "确认后续"]
      - type: "aiResultCard"
        title: "退改签费用转译与对比"
        bind: "translateFee"
        render: "kv"
      - type: "alert"
        message: "计费由确定性规则引擎计算，LLM 仅做规则转译，金额与结果一致"
        level: "info"
        description: "阶梯费率：开车前 8 天以上免费、48 小时以上 5%、24–48 小时 10%、不足 24 小时 20%（最低 2 元）；因铁路责任免费"
      - type: "buttonRow"
        buttons:
          - { text: "进入改签方案推荐", type: "primary", action: "navigate:/recommend" }

  - id: "recommend"
    title: "改签方案推荐"
    route: "/recommend"
    icon: "SwapOutlined"
    description: "并发检索直达/候补/换乘方案，结合偏好与成功率排序输出 Top 3（P0）"
    actions:
      - { name: "recommendPlans", button: "智能推荐改签方案" }
      - { name: "disposeChange", button: "选定并处置" }
    sections:
      - type: "steps"
        current: 2
        items: ["场景识别", "规则转译", "方案推荐", "一体化处置", "确认后续"]
      - type: "aiResultCard"
        title: "Top 3 改签方案（含风险与票价差）"
        bind: "recommendPlans"
        render: "table"
        columns:
          - { key: "planId", title: "方案" }
          - { key: "trainNo", title: "车次" }
          - { key: "planType", title: "类型", tag: { "直达": "success", "换乘": "warning", "候补": "processing" } }
          - { key: "departTime", title: "出发时间" }
          - { key: "matchScore", title: "匹配度" }
          - { key: "riskLevel", title: "风险", tag: { "低": "success", "中": "warning", "高": "error" } }
          - { key: "priceDiff", title: "票价差" }
      - type: "alert"
        message: "选择改签方案与发起退改交易是对外承诺，需旅客确认放行"
        level: "warning"
        description: "硬约束：席别一致不可突破；偏好冲突优先级：尽早出发 > 席别一致 > 不换乘"
      - type: "buttonRow"
        buttons:
          - { text: "智能推荐改签方案", type: "default", action: "recommendPlans" }
          - { text: "选定方案并处置", type: "primary", action: "disposeChange" }
          - { text: "进入一体化处置", type: "link", action: "navigate:/dispose" }

  - id: "dispose"
    title: "一体化处置"
    route: "/dispose"
    icon: "LinkOutlined"
    description: "发起主票退改并同步处置关联延伸服务（餐食/约车/行程单）"
    actions:
      - { name: "disposeChange", button: "执行一体化处置" }
    sections:
      - type: "steps"
        current: 3
        items: ["场景识别", "规则转译", "方案推荐", "一体化处置", "确认后续"]
      - type: "aiResultCard"
        title: "主票退改结果"
        bind: "disposeChange"
        render: "kv"
      - type: "table"
        title: "关联延伸服务处置状态"
        data: "mock:RelatedService"
        rowKey: "serviceNo"
        columns:
          - { key: "serviceNo", title: "服务单号" }
          - { key: "serviceType", title: "服务类型", tag: { "餐食": "processing", "约车": "default", "行程单": "processing" } }
          - { key: "disposeStatus", title: "处置状态", tag: { "已更新": "success", "已注销": "default", "处置失败": "error" } }
      - type: "buttonRow"
        buttons:
          - { text: "执行一体化处置", type: "primary", action: "disposeChange" }
          - { text: "进入确认与通知", type: "link", action: "navigate:/confirm" }

  - id: "confirm"
    title: "确认与通知"
    route: "/confirm"
    icon: "BellOutlined"
    description: "输出处置确认清单、通知推送与行程更新；复杂异常建单转客服"
    actions:
      - { name: "pushNotice", button: "推送处置结果并更新行程" }
    sections:
      - type: "steps"
        current: 4
        items: ["场景识别", "规则转译", "方案推荐", "一体化处置", "确认后续"]
      - type: "aiResultCard"
        title: "处置结果与通知"
        bind: "pushNotice"
        render: "kv"
      - type: "timeline"
        items:
          - { title: "场景已识别", status: "finish" }
          - { title: "费用已转译", status: "finish" }
          - { title: "方案已选定", status: "finish" }
          - { title: "主票与关联服务已处置", status: "finish" }
          - { title: "通知推送与行程更新", status: "process" }
      - type: "buttonRow"
        buttons:
          - { text: "推送处置结果并更新行程", type: "primary", action: "pushNotice" }

aiMocks:
  - name: "identifyScene"
    latency: 600
    response:
      summary: "识别为运行变更场景：列车 G1234 晚点 95 分钟，订单有效可退改"
      sceneType: "运行变更"
      order: { orderNo: "E123456789", trainNo: "G1234", seatClass: "二等座", fare: 553, departTime: "2026-09-12 09:00" }
  - name: "translateFee"
    latency: 700
    response:
      conclusion: "开车前约 30 小时退票，按 10% 档收取退票费 ¥55.3"
      basis: "当前距发车 30 小时，落在「24–48 小时」档位；最低收费 2 元"
      suggestion: "同日改签成本 ¥0，通常比退票更划算"
      refundLoss: "¥55.3"
      changeCost: "¥0"
  - name: "recommendPlans"
    latency: 900
    response:
      summary: "并发检索到 3 个候选方案（1 直达 / 1 换乘 / 1 候补），按偏好与历史成功率排序"
      items:
        - { planId: "方案1", trainNo: "G1236", planType: "直达", departTime: "10:30", matchScore: "95%", riskLevel: "低", priceDiff: 0 }
        - { planId: "方案2", trainNo: "G1240", planType: "换乘", departTime: "11:10", matchScore: "80%", riskLevel: "中", priceDiff: -26 }
        - { planId: "方案3", trainNo: "G1238", planType: "候补", departTime: "10:50", matchScore: "70%", riskLevel: "中", priceDiff: 0 }
  - name: "disposeChange"
    latency: 1000
    response:
      mainTicket: "改签成功：G1234 → G1236（10:30），席别一致，票价差 ¥0"
      relatedServices: "餐食已更新、约车已注销、行程单已更新"
      consistencyCheck: "跨业务一致性校验通过"
      status: "处置完成"
  - name: "pushNotice"
    latency: 500
    response:
      notice: "已推送处置结果并更新行程"
      newItinerary: "G1236 10:30 二等座"
      pushStatus: "已送达"
      exception: "无（异常将自动建单转客服）"

businessMocks:
  - name: "getOrder"
    system: "ticketing"
    latency: 200
    response:
      items:
        - { orderNo: "E123456789", trainNo: "G1234", seatClass: "二等座", fare: 553, departTime: "2026-09-12 09:00", status: "有效" }
        - { orderNo: "E123456790", trainNo: "G2345", seatClass: "一等座", fare: 880, departTime: "2026-09-13 14:30", status: "有效" }
  - name: "getRunStatus"
    system: "monitoring"
    latency: 200
    response:
      items:
        - { trainNo: "G1234", eventType: "delay", delayMinutes: 95 }
  - name: "getRelatedServices"
    system: "order-hub"
    latency: 200
    response:
      items:
        - { serviceNo: "CT-8801", serviceType: "餐食", disposeStatus: "已更新" }
        - { serviceNo: "RD-3302", serviceType: "约车", disposeStatus: "已注销" }
        - { serviceNo: "IT-1105", serviceType: "行程单", disposeStatus: "已更新" }

apiRoutes:
  - { name: "identifyScene", method: "POST", path: "/api/scene/identify", target: "ai:identifyScene" }
  - { name: "translateFee", method: "POST", path: "/api/fee/translate", target: "ai:translateFee" }
  - { name: "recommendPlans", method: "POST", path: "/api/plan/recommend", target: "ai:recommendPlans" }
  - { name: "disposeChange", method: "POST", path: "/api/change/dispose", target: "ai:disposeChange" }
  - { name: "pushNotice", method: "POST", path: "/api/notice/push", target: "ai:pushNotice" }
  - { name: "getOrder", method: "GET", path: "/api/order", target: "business:getOrder" }
  - { name: "getRunStatus", method: "GET", path: "/api/run-status", target: "business:getRunStatus" }
