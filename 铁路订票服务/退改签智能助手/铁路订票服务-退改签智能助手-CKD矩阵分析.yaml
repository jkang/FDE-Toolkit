title: "铁路订票服务 · 退改签智能助手 CKD 映射报告"
product: "退改签智能助手"
description: "围绕铁路退改签全链路（场景识别 → 规则转译 → 方案推荐 → 一体化处置 → 确认后续），梳理每一步 AI 执行所需的上下文、知识与数据资产，为 RAG、规则引擎与接口集成提供资产清单。"
steps:
  - step_name: "1. 场景识别与订单拉取"
    ckd_items:
      - context_name: "列车实时运行状态"
        description: "晚点时长、停运信息等外部触发事件，用于自动拉起服务助手。"
        type: "API 数据"
        storage: "实时列车运行监控 API"
        volume: "实时流"
        ai_init: false
        frequency: "实时事件驱动"
        retrieval: "事件订阅"
        status: "已支持"
      - context_name: "原订单详情（车次/座席/票价/乘车人）"
        description: "退改签处置的业务主线数据，含票种、席别、票价与乘车人。"
        type: "API 数据 / 结构化"
        storage: "票务核心交易系统"
        volume: "按订单"
        ai_init: false
        frequency: "实时"
        retrieval: "订单号精确查询"
        status: "已支持"
      - context_name: "场景识别规则"
        description: "区分退票/改签/运行变更场景的判定规则与处置路径。"
        type: "规则引擎配置"
        storage: "规则中心 / JSON"
        volume: "<20 条规则"
        ai_init: true
        frequency: "季度更新"
        retrieval: "规则匹配"
        status: "建设中"

  - step_name: "2. 规则转译与费用试算"
    ckd_items:
      - context_name: "12306 退改签阶梯费率知识库"
        description: "官方退票/改签费率规则（开车前 8 天以上免费、48 小时以上 5%、24–48 小时 10%、不足 24 小时 20% 等，最低 2 元）及特殊票种规则。"
        type: "规则引擎配置 / 知识库"
        storage: "规则中心 + 向量库"
        volume: "<100 条规则"
        ai_init: true
        frequency: "随政策更新"
        retrieval: "规则引擎计算 + RAG 检索"
        status: "建设中"
      - context_name: "规则转译话术模板"
        description: "将生涩条款转译为当前订单下「大白话」说明的模板与口径。"
        type: "Prompt Template / 模版范例"
        storage: "配置中心 / 版本库"
        volume: "<20 模板"
        ai_init: true
        frequency: "随发版"
        retrieval: "模板注入"
        status: "建设中"
      - context_name: "当前时间与发车时间差"
        description: "决定阶梯费率档位的确定性计算因子。"
        type: "请求上下文"
        storage: "运行时计算"
        volume: "实时"
        ai_init: false
        frequency: "实时"
        retrieval: "时间差计算"
        status: "已支持"

  - step_name: "3. 改签方案计算与推荐"
    ckd_items:
      - context_name: "实时列车运行图与余票动态库存"
        description: "直达/候补/换乘候选方案的检索基准。"
        type: "API 数据"
        storage: "票务核心 / 余票库存"
        volume: "实时"
        ai_init: false
        frequency: "实时"
        retrieval: "并发检索"
        status: "已支持"
      - context_name: "旅客偏好"
        description: "尽早出发、不接受换乘、席别必须一致等个性化约束。"
        type: "请求上下文"
        storage: "会话上下文 / 画像"
        volume: "按旅客"
        ai_init: false
        frequency: "实时"
        retrieval: "会话解析"
        status: "已支持"
      - context_name: "历史同场景改签成功率大数据模型"
        description: "用于方案排序加权的历史成功率模型。"
        type: "模型 / 特征"
        storage: "特征库 / 模型服务"
        volume: "历史全量"
        ai_init: true
        frequency: "月度训练"
        retrieval: "模型推理"
        status: "待规划"

  - step_name: "4. 一体化处置（主票 + 关联服务）"
    ckd_items:
      - context_name: "票务核心交易接口（退/改/订）"
        description: "发起主票退票/改签交易的接口能力与字段契约。"
        type: "API 数据"
        storage: "票务核心交易系统"
        volume: "按订单"
        ai_init: false
        frequency: "实时调用"
        retrieval: "接口调用"
        status: "已支持"
      - context_name: "跨业务订单关联协议"
        description: "票务、餐饮、约车、接送站、行程单的关联关系与处置协议。"
        type: "关联关系类知识"
        storage: "关联协议库 / 配置"
        volume: "<50 条"
        ai_init: true
        frequency: "季度更新"
        retrieval: "关联遍历"
        status: "待规划"
      - context_name: "全业务订单协同中心"
        description: "关联延伸服务的同步注销/更新执行通道。"
        type: "API 数据"
        storage: "订单协同中心（餐饮/约车联动）"
        volume: "按关联订单"
        ai_init: false
        frequency: "实时调用"
        retrieval: "接口调用"
        status: "待规划"

  - step_name: "5. 处置确认与后续"
    ckd_items:
      - context_name: "处置结果与确认清单"
        description: "主票退改结果、关联服务处置结果与一致性校验结论。"
        type: "关系型数据"
        storage: "处置记录表 / 工单系统"
        volume: "按订单"
        ai_init: false
        frequency: "实时"
        retrieval: "订单号查询"
        status: "建设中"
      - context_name: "异常升级路径（操作流程类）"
        description: "复杂异常自动建单与升级客服的路径与话术。"
        type: "操作流程类知识"
        storage: "知识库 / SOP"
        volume: "覆盖典型异常 ≥80%"
        ai_init: true
        frequency: "季度更新"
        retrieval: "语义检索 + 建议生成"
        status: "待规划"
      - context_name: "通知与行程推送通道"
        description: "Push 通知卡片与行程更新的推送通道。"
        type: "API 数据"
        storage: "Push / 消息网关"
        volume: "按订单"
        ai_init: false
        frequency: "实时"
        retrieval: "消息推送"
        status: "已支持"
