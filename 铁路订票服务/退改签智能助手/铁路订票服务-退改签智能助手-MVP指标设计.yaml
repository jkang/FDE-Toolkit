title: "退改签智能助手 · MVP 指标设计与上线门禁"
product_name: "退改签智能助手"
go_no_go_statement: "当 退改签自助率 ≥95%、规则转译准确率 ≥98%、决策耗时 ≤ 秒级、退改交易失败率 ≤1%、关联服务遗漏率 ≤ 目标值 且 无依据推断率 ≤3% 时，允许灰度上线。"
target_metrics:
  - name: "退改签自助率"
    dimension: "业务"
    logic: "无需人工介入即完成退改签的订单数 / 退改签总订单数"
    threshold: "≥ 95%"
    source: "工作台流程日志 + 客服工单"
  - name: "决策耗时"
    dimension: "业务"
    logic: "从场景触发到方案选定的平均耗时"
    threshold: "秒级（基线 15–20 分钟）"
    source: "流程埋点"
  - name: "高峰期改签成功率"
    dimension: "业务"
    logic: "高峰期改签请求成功完成数 / 改签请求总数"
    threshold: "提升（基线待回填）"
    source: "票务核心 + 推荐记录"
  - name: "关联服务遗漏率"
    dimension: "业务"
    logic: "存在未处置关联服务的退改订单数 / 有延伸服务的退改订单数"
    threshold: "≤ 目标值（待回填）"
    source: "订单协同中心 + 一致性校验"
  - name: "规则转译准确率"
    dimension: "模型"
    logic: "转译说明金额/档位与规则引擎结果一致的样本占比"
    threshold: "≥ 98%"
    source: "离线测试集（AI 测试数据集）"
  - name: "方案推荐采纳率"
    dimension: "模型"
    logic: "旅客选定方案落在 Top 3 推荐中的比例"
    threshold: "≥ 目标值（待回填）"
    source: "推荐与选定记录"
  - name: "无依据推断率（幻觉率）"
    dimension: "模型"
    logic: "在规则/数据不足时仍给出确定性费率或方案的占比"
    threshold: "≤ 3%"
    source: "自研评估脚本 + 人工抽检"
  - name: "接口成功率"
    dimension: "系统"
    logic: "票务核心 / 运行监控 / 订单协同 / Push 成功调用占比"
    threshold: "≥ 99%"
    source: "接口网关监控"
  - name: "P95 响应延迟"
    dimension: "系统"
    logic: "95% 请求的端到端响应时间"
    threshold: "≤ 3s"
    source: "APM 监控"
  - name: "退改交易失败率"
    dimension: "系统"
    logic: "主票退改交易失败次数 / 交易总次数"
    threshold: "≤ 1%"
    source: "票务核心交易日志"
  - name: "旅客操作步骤减少"
    dimension: "体验"
    logic: "（改造前人工步骤 - 改造后人工步骤）/ 改造前人工步骤"
    threshold: "≥ 50%"
    source: "流程埋点对比"
  - name: "方案卡片可理解度"
    dimension: "体验"
    logic: "旅客对方案/费用说明的理解度评分（问卷/CSAT）"
    threshold: "≥ 目标值（待回填）"
    source: "体验问卷 + CSAT"
  - name: "通知触达率"
    dimension: "体验"
    logic: "成功送达的处置通知数 / 应通知总数"
    threshold: "≥ 95%"
    source: "Push 推送回执"
monitoring_plan:
  - name: "平均 Token 消耗"
    layer: "模型"
    logic: "单次规则转译 + 方案说明消耗的 Input+Output Token"
    range: "600-1200"
    alert: ">2000"
    meaning: "上下文注入过多或 Prompt 泄露风险"
  - name: "转译一致性偏差"
    layer: "模型"
    logic: "转译说明金额与规则引擎结果不一致的样本占比"
    range: "= 0"
    alert: "> 0.5%"
    meaning: "LLM 越权算钱或口径漂移"
  - name: "规则命中率"
    layer: "检索"
    logic: "阶梯费率 / 寻优 / 关联处置规则成功命中的比例"
    range: "≥ 95%"
    alert: "< 88%"
    meaning: "规则库缺失或政策变更"
  - name: "接口错误率"
    layer: "系统"
    logic: "票务核心/运行监控/协同中心 5xx 与业务错误占比"
    range: "< 1%"
    alert: "> 3%"
    meaning: "上游限流或字段契约变更"
  - name: "退改交易失败率"
    layer: "系统"
    logic: "交易失败次数 / 交易总次数"
    range: "≤ 1%"
    alert: "> 3%"
    meaning: "票务核心校验失败或库存冲突"
  - name: "人工转接分布"
    layer: "业务"
    logic: "各环节（识别/转译/推荐/处置）转人工的比例分布"
    range: "均衡分布"
    alert: "单一环节 >50%"
    meaning: "特定环节知识缺失或模型盲区"
  - name: "异常类型分布"
    layer: "业务"
    logic: "各异常类型（不可退改/特殊票种/无候选/交易失败/关联失败）占比"
    range: "随业务分布"
    alert: "单一类型 >40%"
    meaning: "上游数据质量问题或规则口径偏差"
test_set_strategy:
  golden_path: 50
  hard_cases: 30
  edge_cases: 20
