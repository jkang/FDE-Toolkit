  scenarioName: "退改签智能助手"
  businessStage: "阶段2 任务处理规则挖掘 · P2"
  methodology: "阶段2方法（五类任务处理规则：决策/模板/术语/提取点/关联）"
  inputs:
    - "《铁路订票服务-退改签智能助手-任务流程拆解》（18 个深度任务使用点 + 输入输出 + 规则依据类型）"
    - "《铁路订票服务-退改签智能助手-AI画布》（dataKnowledge/workflow 识别的规则类型）"
    - "客户素材《铁路订票服务-核心票务AI机会地图》"
