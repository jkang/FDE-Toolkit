legend:
  bindingNote: "每条规则/样本均绑定到使用点；内容可验证、来源可追溯。"
  conflictNote: "知识缺口如实标注，不由 Skill 猜测补全；越权问题反馈上游。"
  ruleTypes:
    - { type: "decision",   label: "决策模型类",      icon: "⚖️", desc: "怎么算、怎么判、走哪条路径" }
    - { type: "template",   label: "模版范例类",      icon: "📝", desc: "照什么结构和范例生成" }
    - { type: "dictionary", label: "术语字典类",      icon: "📖", desc: "词、缩写、业务口径" }
    - { type: "extraction", label: "关键信息提取要点", icon: "🔍", desc: "专家看资料重点看什么" }
    - { type: "relation",   label: "关联关系类",      icon: "🔗", desc: "对象之间怎么关联" }

categories:
  decision:
    - id: "rd_01"
      name: "退改签阶梯费率规则"
      usagePoints: ["计算退改签阶梯费率"]
      factors:
        - { name: "开车前时间差", def: "当前时间到发车时间的时间差（决定费率档位）", source: "运行时计算", deterministic: true }
        - { name: "票种/席别", def: "全价票/学生票/儿童票等特殊票种规则", source: "订单 + 规则库", deterministic: true }
        - { name: "最低收费", def: "退票费最低收取标准（2 元）", source: "12306 规则库", deterministic: true }
        - { name: "责任归属", def: "因铁路责任（晚点/停运）不收费", source: "运行监控 + 规则库", deterministic: true }
      branches:
        - { cond: "开车前 8 天（含）以上", action: "→ 不收取退票费", priority: 1 }
        - { cond: "开车前 48 小时以上、不足 8 天", action: "→ 收取 5% 退票费", priority: 2 }
        - { cond: "开车前 24 小时以上、不足 48 小时", action: "→ 收取 10% 退票费", priority: 3 }
        - { cond: "开车前不足 24 小时", action: "→ 收取 20% 退票费", priority: 4 }
        - { cond: "因铁路责任（晚点/停运）", action: "→ 全额退票/免费改签", priority: 0 }
      arbitration: "计费走确定性规则引擎，不靠 LLM 算钱；最低收费 2 元；改签后再次退票按改签后票面口径。"
      exception: "特殊票种或规则盲区 → 转规则兜底/人工；计费与说明不一致 → 以规则引擎结果为准。"
      summary: "按开车前时间差档位、票种与责任归属确定性计算退改签费用。"
    - id: "rd_02"
      name: "改签方案寻优排序规则"
      usagePoints: ["结合偏好与成功率排序"]
      factors:
        - { name: "旅客偏好", def: "尽早出发/不接受换乘/席别必须一致等约束", source: "会话上下文", deterministic: false }
        - { name: "余票可得性", def: "候选方案的实时余票与候补概率", source: "余票库存", deterministic: false }
        - { name: "历史改签成功率", def: "历史同场景改签成功率大数据", source: "大数据模型", deterministic: false }
        - { name: "票价差与损失", def: "改签成本与退票损失的对比", source: "计费结果", deterministic: true }
      branches:
        - { cond: "满足全部偏好且有直达", action: "→ 高分推荐（Top 1）", priority: 1 }
        - { cond: "部分满足偏好", action: "→ 标注权衡后推荐", priority: 2 }
        - { cond: "无满足偏好的方案", action: "→ 放宽条件重算并说明", priority: 3 }
      arbitration: "偏好冲突时优先级：尽早出发 > 席别一致 > 不换乘；硬约束（席别一致）不可突破。"
      exception: "偏好冲突/无候选 → 给出权衡说明或放宽条件重算。"
      summary: "按偏好与历史成功率加权排序，输出 Top 3 并标注权衡。"
    - id: "rd_03"
      name: "退改签场景识别规则"
      usagePoints: ["识别退改签场景类型"]
      factors:
        - { name: "外部事件", def: "列车晚点/停运状态", source: "运行监控 API", deterministic: true }
        - { name: "用户操作", def: "用户在订单页发起的退票/改签动作", source: "用户操作事件", deterministic: true }
        - { name: "订单状态", def: "订单是否可退/可改（时间、状态约束）", source: "票务核心", deterministic: true }
      branches:
        - { cond: "列车晚点/停运", action: "→ 运行变更处置路径", priority: 1 }
        - { cond: "用户发起退票", action: "→ 退票处置路径", priority: 2 }
        - { cond: "用户发起改签", action: "→ 改签处置路径", priority: 3 }
      arbitration: "运行变更优先于用户主动操作；订单不可退改时直接提示并终止。"
      exception: "意图不明 → 追问澄清；订单已失效 → 提示并终止。"
      summary: "依据外部事件、用户操作与订单状态识别退改签场景并选定处置路径。"
    - id: "rd_04"
      name: "关联延伸服务处置规则"
      usagePoints: ["同步注销/更新关联服务", "跨业务一致性校验"]
      factors:
        - { name: "跨业务关联协议", def: "票务与餐饮/约车/接送站/行程单的关联关系", source: "关联协议库", deterministic: true }
        - { name: "主票处置结果", def: "主票退票/改签后的车次与席别变化", source: "票务核心", deterministic: true }
        - { name: "关联订单状态", def: "关联服务订单的当前状态", source: "订单协同中心", deterministic: true }
      branches:
        - { cond: "主票退票", action: "→ 关联服务同步注销/退款", priority: 1 }
        - { cond: "主票改签（车次变化）", action: "→ 关联服务按协议更新或注销", priority: 2 }
        - { cond: "无关联服务", action: "→ 不适用", priority: 3 }
      arbitration: "以主票处置结果为准，关联服务同步处置；一致性校验不通过需回滚或转人工。"
      exception: "关联不明/处置失败 → 转客服人工处理。"
      summary: "依据跨业务关联协议同步处置关联延伸服务并做一致性校验。"

  template:
    - id: "rt_01"
      name: "规则转译话术模板"
      usagePoints: ["规则转译为大白话"]
      skeleton:
        - { part: "① 结论", fixed: "固定栏（当前订单退/改需支付多少、为什么）", variable: "随费率计算结果动态填充" }
        - { part: "② 依据", fixed: "固定栏（对应哪条费率档位与时间差）", variable: "随订单时间动态填充" }
        - { part: "③ 建议", fixed: "固定栏（退 vs 改哪个更划算）", variable: "随费用对比动态填充" }
      dynamicFields:
        - { field: "费率档位", source: "来自阶梯费率规则计算结果" }
        - { field: "时间差", source: "来自当前时间与发车时间差" }
      generationRules: "先给结论、再给依据、最后给建议；禁止只贴条款原文。"
      complianceRules: "话术中的金额必须与规则引擎结果一致，不得由 LLM 估算。"
      samples:
        - { label: "典型 · 开车前 30 小时退票", note: "结论：收 10% 退票费 ¥XX；依据：24–48 小时档；建议：改签可能更省" }
        - { label: "反面 · 只贴条款", note: "直接贴「开车前 24 小时以上不足 48 小时收取 10%」不符合要求" }
      fieldSource: "依据 AI 画布 workflow「规则转译」与 12306 阶梯费率口径整理。"
    - id: "rt_02"
      name: "费用对比表模板"
      usagePoints: ["输出可视化费用对比表"]
      skeleton:
        - { part: "① 方案行", fixed: "固定栏（退票 / 改签）", variable: "随方案动态填充" }
        - { part: "② 成本列", fixed: "固定栏（退票损失 / 改签成本 / 票价差）", variable: "随计费结果动态填充" }
        - { part: "③ 结论列", fixed: "固定栏（更划算的选项）", variable: "随对比结果动态填充" }
      dynamicFields:
        - { field: "退票损失", source: "来自阶梯费率计算" }
        - { field: "改签成本", source: "来自改签差价计算" }
      generationRules: "并排列出退票与改签的成本，突出更优选项。"
      complianceRules: "金额必须来自确定性计费，禁止占位或估算。"
      samples:
        - { label: "典型 · 退 vs 改", note: "退票损失 ¥52 vs 改签成本 ¥0（同日改签），推荐改签" }
        - { label: "反面 · 缺计费依据", note: "只给一个数字无档位说明，不可信" }
      fieldSource: "依据 AI 画布 aiOutput「可视化费用对比表」整理。"
    - id: "rt_03"
      name: "改签方案卡片模板"
      usagePoints: ["生成风险评估与损失评估"]
      skeleton:
        - { part: "① 方案头", fixed: "固定栏（车次/出发到达时间/席别）", variable: "随方案动态填充" }
        - { part: "② 匹配度", fixed: "固定栏（偏好满足情况）", variable: "随偏好比对动态填充" }
        - { part: "③ 风险与损失", fixed: "固定栏（余票风险/换乘风险/票价差）", variable: "随评估结果动态填充" }
      dynamicFields:
        - { field: "历史改签成功率", source: "来自大数据模型" }
        - { field: "票价差", source: "来自计费结果" }
      generationRules: "Top 3 方案各一张卡片，标注偏好匹配度与风险等级。"
      complianceRules: "风险等级必须有依据，禁止无依据的乐观标注。"
      samples:
        - { label: "典型 · 直达方案", note: "偏好全满足、余票充足、风险低" }
        - { label: "反面 · 无风险依据", note: "标注「风险低」但无余票/换乘依据" }
      fieldSource: "依据 AI 画布 aiOutput「Top 3 改签方案卡片（含风险评估）」整理。"

  dictionary:
    - id: "rdict_01"
      name: "铁路票务退改签术语字典"
      aliases: ["车次", "席别", "改签", "候补", "阶梯费率", "运行变更", "行程单"]
      definition: "铁路退改签全链路统一业务口径词表，供规则转译、方案推荐与一体化处置共同引用。"
      entries:
        - { term: "车次", def: "列车编号（如 G1234），退改签与方案检索的核心标识", context: "场景识别/方案推荐" }
        - { term: "席别", def: "商务/一等/二等/无座等座席等级", context: "改签方案约束" }
        - { term: "改签", def: "变更乘车日期/车次/席别，多退少补", context: "方案推荐" }
        - { term: "候补", def: "无票时提交候补购票，按排队兑现", context: "方案检索" }
        - { term: "阶梯费率", def: "按开车前时间差分档收取的退票费", context: "规则转译" }
        - { term: "运行变更", def: "列车晚点/停运等铁路责任事件", context: "场景识别" }
        - { term: "行程单", def: "报销用行程凭证，可关联退改签", context: "一体化处置" }
      maintainer: "票务运营与客服团队，随政策更新"
      referenced: ["规则转译", "方案推荐", "一体化处置"]
      usagePoints: ["规则转译为大白话", "识别退改签场景类型"]

  extraction:
    - id: "rext_01"
      name: "原订单关键字段提取要点"
      usagePoints: ["拉取原订单与乘车人信息"]
      fields:
        - { fieldName: "订单号", definition: "票务订单唯一标识", typicalLocations: ["订单详情页", "接口返回"], variants: ["数字/字母组合"], pitfalls: ["多订单需逐单处理"] }
        - { fieldName: "车次", definition: "列车编号", typicalLocations: ["订单详情页", "接口"], variants: ["G/D/K 等"], pitfalls: ["与改签目标车次区分"] }
        - { fieldName: "席别", definition: "座席等级", typicalLocations: ["订单详情页"], variants: ["商务/一等/二等/无座"], pitfalls: ["改签席别一致性判断依赖此字段"] }
        - { fieldName: "票价", definition: "票面价格", typicalLocations: ["订单详情页"], variants: ["含/不含附加"], pitfalls: ["计费基准需明确"] }
        - { fieldName: "乘车人", definition: "乘车人姓名与证件", typicalLocations: ["订单详情页"], variants: ["多乘车人"], pitfalls: ["多人订单需按人处理"] }
      acceptance: "订单关键字段抽取准确率 ≥99%（关键字段少、结构化程度高）；缺失 → 转人工/兜底。"
      samples: ["订单接口返回结构化字段，直接映射；多乘车人订单按人拆分处置"]

  relation:
    - id: "rrel_01"
      name: "票务订单—延伸服务关联关系"
      fromObject: "票务订单"
      toObject: "餐饮 / 约车 / 接送站 / 行程单 订单"
      objectType: "订单号 ↔ 关联业务单号"
      meaning: "用票务订单号贯穿主票退改与关联延伸服务处置，作为一体化同步与一致性校验的主键锚点。"
      rules:
        establish: "主票订单关联餐饮/约车/接送站/行程单订单；主票退改时按关联协议同步处置"
        special: "一张主票可关联多个延伸服务；改签（车次变化）时部分服务更新、部分注销；无关联时标不适用"
      scenarios: ["一体化处置", "一致性校验", "通知推送"]
      usagePoints: ["识别关联延伸服务", "同步注销/更新关联服务", "跨业务一致性校验"]
      extra: "关联服务未一致性校验通过前不得标记处置完成；异常项转客服。"

reconciliation:
  - task: "计算退改签阶梯费率"
    rule: "退改签阶梯费率规则"
    factor: "开车前时间差、票种、最低收费、责任归属"
    arbitration: "确定性规则引擎计算；最低 2 元；铁路责任免费"
    exception: "特殊票种/规则盲区 → 转规则兜底/人工"
    checks: { ruleFound: true, usageFound: true, nameMatch: true, exceptionMatch: true }
  - task: "结合偏好与成功率排序"
    rule: "改签方案寻优排序规则"
    factor: "旅客偏好、余票可得性、历史改签成功率、票价差"
    arbitration: "偏好冲突优先级：尽早出发 > 席别一致 > 不换乘"
    exception: "偏好冲突/无候选 → 权衡说明或放宽重算"
    checks: { ruleFound: true, usageFound: true, nameMatch: true, exceptionMatch: true }
  - task: "识别退改签场景类型"
    rule: "退改签场景识别规则"
    factor: "外部事件、用户操作、订单状态"
    arbitration: "运行变更优先于用户主动操作；不可退改直接终止"
    exception: "意图不明 → 追问；订单失效 → 终止"
    checks: { ruleFound: true, usageFound: true, nameMatch: true, exceptionMatch: true }
  - task: "同步注销/更新关联服务"
    rule: "关联延伸服务处置规则"
    factor: "跨业务关联协议、主票处置结果、关联订单状态"
    arbitration: "以主票结果为准；一致性校验不通过回滚/转人工"
    exception: "关联不明/处置失败 → 转客服"
    checks: { ruleFound: true, usageFound: true, nameMatch: true, exceptionMatch: true }
