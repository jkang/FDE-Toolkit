title: "X奶粉 · 分仓智能补货统一报告"
subtitle: "单场景端到端：机会点定义 → AI画布 → To-be流程 → CKD映射 → 任务流程拆解（P1）→ 业务规则挖掘（P2）→ Agent本体设计 → Agent产品方案 → To-be旅程 → MVP原型 → UX设计报告 → 落地技术架构 → MVP指标设计 → AI测试数据集"
executive_summary:
  - "一句话结论：把「半自动化的 Excel 推式分货」升级为「<b>推拉结合 + 多约束全局优化</b>」的智能分仓补货——Agent 拉取全仓网现货/在途/待检/合格库存与未来 14 天需求，按 DOS 分级识别缺口与积压，多约束求解生成多版分配方案，人工只在关键确认点介入。"
  - "本报告沿 <b>理需求 → 挖知识 → 建本体 → 生智能 → 评测</b> 给出可施工证据链：1 个机会点 · 5 个 To-be 阶段 · 21 个 L5 深度任务 · 14 条业务规则 · 14 个本体实体 · 5 个编排 Skill · 6 个原型页面 · 20 条测试用例。"
  - "技术路线：<b>Autonomous Planner</b>（1 编排 Agent + 5 Skill + 1 共享本体）；「对外下发补货单」「分配量偏离京慧建议量」「安全水位调整」保留人工闸门与规则护栏兜底。"
