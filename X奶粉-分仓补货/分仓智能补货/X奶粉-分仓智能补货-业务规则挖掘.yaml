  date: "2026-09-10"
  scenarioName: "分仓智能补货"
  businessStage: "挖知识 阶段2 任务处理规则挖掘 · P2"
  methodology: "阶段2方法（五类任务处理规则：决策/模板/术语/提取点/关联）"
  inputs:
    - "《X奶粉-分仓智能补货-任务流程拆解》（P1：21 个使用点 + 输入输出 + 规则依据类型占位）"
    - "《X奶粉-分仓智能补货-AI画布》（dataKnowledge / workflow 识别的规则类型）"
    - "SRP《11-分仓智能补货_数据与知识资产盘点》（14 条知识资产）"
    - "客户素材《奶粉分仓补货数据库表字段》《OSL 场景信息采集表（含示例）》"
  sourceRef: "X奶粉-分仓智能补货-任务流程拆解.yaml 使用点 + _cache-使用点清单.yaml + 知识资产清单"
  kpi:
    - "分货效率"
    - "分仓有货率"
    - "库存周转率"
