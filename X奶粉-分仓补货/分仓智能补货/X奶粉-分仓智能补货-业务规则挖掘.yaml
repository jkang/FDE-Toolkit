reconciliation:
  - task: "计算各仓库存天数并判定缺口等级"
    rule: "缺口分级规则（DOS 分级）"
    factor: "DOS、未来14天需求、促销计划"
    arbitration: "可发量约束>时效优先>优先级；促销抑制蓝色积压"
    exception: "阈值边界冲突→拉人"
    checks: { ruleFound: true, usageFound: true, nameMatch: true, exceptionMatch: true }
  - task: "计算各仓目标备货率与补货优先级"
