    factor: "生产备货率、订单完成率、旬度标准进度、区域类型"
    arbitration: "目标备货率封顶100%；服务水平优先"
    exception: "进度超限/封顶→HITL"
    checks: { ruleFound: true, usageFound: true, nameMatch: true, exceptionMatch: true }
  - task: "计算建议补货量"
    rule: "多约束分配量优化规则"
    factor: "京慧建议量、可发量、运输时效、多约束集合"
    arbitration: "可发量约束>时效优先>京慧建议量"
    exception: "偏离京慧建议量→写入前必停"
    checks: { ruleFound: true, usageFound: true, nameMatch: true, exceptionMatch: true }
  - task: "校验收发仓/SKU/数量/时效"
    rule: "补货单校验规则"
    factor: "收发仓合法性、SKU在册、数量≤可发量、时效满足ETA"
    arbitration: "库存不足/时效超期/字段缺失不得漏判"
    exception: "校验不过→退回调整并拉人"
    checks: { ruleFound: true, usageFound: true, nameMatch: true, exceptionMatch: true }
  - task: "核对入库实收与差异"
    rule: "入库差异判定规则"
    factor: "调拨数量、实收数量、差异率、破损率"
    arbitration: "差异未关闭前不计入可发量"
    exception: "差异率>0.5%→生成差异单并拉人"
    checks: { ruleFound: true, usageFound: true, nameMatch: true, exceptionMatch: true }
  - task: "统计复盘指标并生成调参建议"
    rule: "复盘调参规则"
    factor: "时效达成率、缺货缓解率、周转率、入库差异率"
    arbitration: "时效达成率优先于周转优化"
    exception: "指标异常恶化→拉人审批"
    checks: { ruleFound: true, usageFound: true, nameMatch: true, exceptionMatch: true }
