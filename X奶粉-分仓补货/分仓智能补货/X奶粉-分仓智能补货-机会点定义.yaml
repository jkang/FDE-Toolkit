  date: "2026-09-10"
  business: "X（乳制品事业部 / 奶粉）"
  domain: "供应链 · 需求与供应计划（分货与补货）"
  scenario: "分仓智能补货"
  problemRef: "承接《分仓智能补货_现状痛点汇总》问题①：分货数据准备与分配核算高度依赖人工 Excel 与老计划员隐性经验，多仓×多 SKU×多约束下人工无法全局最优，分货效率低、有货率与周转/新鲜度难兼顾"
  opportunitySource: "AI 需求场景全景图 · 业务 Agent A2「分仓智能补货」（价值流② 需求与供应计划 · 聚焦范围①）"

opportunities:
  - id: "OP1"
    order: 1
    name: "分仓智能补货 Agent · 多约束智能分货"
    type: "innovation"
    rootCauseType: "复杂度高靠专家经验（分配量/备货率/安全水位/积兆逻辑均为隐性经验）+ 操作量大靠人工（待检/合格/在途/库存经 Excel 汇总、逐仓逐 SKU 核算分配）"
    capabilityMatch: "Agent / 运筹优化（多约束全局求解）/ 数据集成 / 知识沉淀 / 决策解释"
    e1: "为X奶粉事业部的物流计划岗构建「分仓智能补货 Agent」，把「半自动化的 Excel 推式分货」升级为「推拉结合 + 多约束全局优化的智能分仓补货」：从全仓网供需缺口识别、分货数据底表自动汇总，到多约束分配方案编制与人工确认、补货单生成校验下发、执行跟踪与月度复盘，端到端由 Agent 主驱动，人工只在关键确认点介入。"
    e2: "角色：物流计划岗（分货方案确认/微调/下发/复盘审批）、调度组（分货底表口径复核）、仓储/物流岗（执行跟踪与入库异常处理）。\n场景：每个分货周期，物流计划岗拿到「分仓销售计划 + 各仓现货/在途/待检/合格库存 + 促销计划」后启动，从货源评估到补货单下发、入库同步、月末复盘形成闭环。"
    e3: "① 分货覆盖 4 基地仓 × 9+ 销售分仓 × 近 700 SKU，待检/合格/在途/库存经 Excel 传递汇总（约 1 天/轮），分配量在京慧建议量上逐仓逐 SKU 人工调整（约 1 天/轮）；② 分配量、备货率、安全水位、异常诊断（积兆逻辑）、复盘调参高度依赖老计划员隐性经验，未固化、难传承；③ 多约束下人工无法全局最优，易多补/缺补，导致部分仓缺货、部分仓积压；④ 分货计划未与促销计划实时联动，大促放量击穿补货节奏，TMS/WMS 与分货系统未打通。"
    e4: "用 Agent 编排确定性服务（库存/在途/需求数据拉取与校验、DOS 分级、备货率计算、多约束分配优化求解、补货单校验），把「多仓 × 多 SKU × 多约束（库存/在途/待检/合格/新鲜度/促销）」的全局寻优交给机器按统一口径执行；LLM 负责缺口与异常的解释、备选方案生成与调参建议；「分配量偏离京慧建议量」「对外下发补货单」「安全水位调整」保留人工闸门与规则护栏兜底 → 把分货方案编制由约 1.5 天/轮向小时级收敛，并让分仓有货率、库存周转率、新鲜度一起改善。"
    e5: "分货数据准备 + 方案编制由约 2.5 天/轮压缩至小时级；多约束全局优化减少多补/缺补；隐性经验固化为可复用规则；补货单秒级生成校验下发；月末复盘由约 1 天/月压缩至分钟级。"
    valueBreakdown:
      - dimension: "覆盖范围"
        aligns: "⑥ 影响范围"
        metric: "4 基地仓 × 9+ 销售分仓 × 近 700 SKU；受益角色：物流计划岗 + 调度组 + 仓储/物流岗；系统链路：现货库存/在途库存/销售计划/京慧一盘货/奶粉分仓补调系统/TMS/WMS/物流调度/财务核算"
      - dimension: "发生频度"
        aligns: "⑤ 发生频度"
        metric: "每个分货周期 1 轮（高频，含异常分支）；复盘 1 次/月；大促放量期触发额外分货轮次"
      - dimension: "单次收益"
        aligns: "⑦ 每次发生对业务的影响"
        metric: "分货数据准备约 1 天/轮 → 分钟级；分配方案编制约 1 天/轮 → 小时级；补货单生成约 0.5 天/批 → 秒级；执行跟踪由人工 4h 刷新 → 4h 自动刷新（As-Is 基线均为 [待客户确认]）"
      - dimension: "累计影响"
        aligns: "⑧ 累计对业务影响"
        metric: "分货效率、分仓有货率、库存周转率、新鲜度四个 KPI 协同改善；复盘阈值 时效达成率≥90%、缺货缓解率≥85%、周转率同比降幅≤10%、入库差异率≤0.5%；隐性经验沉淀、可传承"
