title: "X奶粉 · 分仓智能补货 Agent 测试数据集"
product_name: "分仓智能补货 Agent"
summary:
  total_cases: 20
  distribution:
    golden: 50
    hard: 30
    edge: 20
test_cases:
  # ================= Golden Path · 主路径（10 条 · 50%） =================
  - id: "C-001"
    scenario: "全仓网缺口识别与 DOS 分级"
    type: "Golden Path"
    input: |
      {
        "task": "识别全仓网缺口",
        "warehouses": [
          {"site_code": "BJ-SY", "type": "sales", "stock": 1800, "transit": 300, "allocated": 0, "avgDailyPlan": 300},
          {"site_code": "GZ-01", "type": "sales", "stock": 1250, "transit": 100, "allocated": 0, "avgDailyPlan": 250},
          {"site_code": "JN-01", "type": "sales", "stock": 9300, "transit": 0, "allocated": 0, "avgDailyPlan": 150}
        ],
        "promoSkus": []
      }
    expected_intermediate: "命中 rd_01 缺口分级规则；计算 DOS=(库存+在途+分配)/日均计划：BJ-SY=7.0、GZ-01=5.4、JN-01=62.0；BJ-SY 落 7 天边界需标注。"
    expected_output: "GZ-01 红色紧急补货（DOS 5.4<7）；JN-01 蓝色积压预警（DOS 62>60 且无促销）；BJ-SY 边界冲突待人工确认。"
    notes: "验证 DOS 分级主路径；注意 7 天边界不被静默归入红/黄。"
  - id: "C-002"
    scenario: "目标备货率计算（订单进度+20% 封顶 100%）"
    type: "Golden Path"
    input: |
      {
        "task": "计算各仓目标备货率",
        "rows": [
          {"site_code": "BJ-SY", "orderProgress": 0.65, "旬度标准进度": 0.50, "region": "core"},
          {"site_code": "HS-01", "orderProgress": 0.92, "旬度标准进度": 0.50, "region": "remote"}
        ]
      }
    expected_intermediate: "命中 rd_02；BJ-SY 目标备货率=0.65+0.20=0.85；HS-01=0.92+0.20=1.12→封顶 1.00，偏远区域再上调缓冲。"
    expected_output: "BJ-SY 目标备货率 85%；HS-01 目标备货率 100%（封顶）+ 偏远缓冲，触发 HITL 确认。"
    notes: "验证封顶 100% 与偏远上调；订单进度超旬度标准触发确认。"
  - id: "C-003"
    scenario: "多约束分配求解（可发量约束优先）"
    type: "Golden Path"
    input: |
      {
        "task": "生成分货方案",
        "plan": [{"to": "BJ-SY", "sku": "金领冠珍护3段800g", "suggest": 1200, "targetStock": 2400, "currentStock": 1800}],
        "source": {"from": "TJ-BASE", "available": 1650, "eta": 1}
      }
    expected_intermediate: "命中 rd_03；建议补货量=2400-1800=600；按可发量约束>时效优先>京慧建议量求解，分配量 600 ≤ 可发量 1650。"
    expected_output: "分配量 600 罐（未偏离京慧建议量 1200），分配后库存天数约 8 天，方案A 均衡版生成。"
    notes: "验证基础分配求解与硬约束（≤可发量）。"
  - id: "C-004"
    scenario: "分配量偏离京慧建议量触发 HITL"
    type: "Golden Path"
    input: |
      {
        "task": "生成分货方案",
        "plan": [{"to": "BJ-SY", "sku": "金领冠珍护3段800g", "suggest": 1200, "available": 1650}],
        "promo": [{"sku": "金领冠珍护3段800g", "upliftRatio": 0.12}]
      }
    expected_intermediate: "命中 rd_03；促销放量使求解分配量=1344，偏离京慧建议量 +12%；触发 HITL（写入前必停）。"
    expected_output: "方案标注『北京顺义仓分配量较京慧建议量上调 12%（促销放量），待确认』，未确认前不得写入分配量。"
    notes: "验证硬约束：偏离京慧建议量必须人工确认，禁止静默覆盖。"
  - id: "C-005"
    scenario: "人工微调分配量并重新校验"
    type: "Golden Path"
    input: |
      {
        "task": "人工确认与微调",
        "edits": [{"site_code": "TJ-WQ", "oldAlloc": 720, "newAlloc": 800, "reason": "凑车"}],
        "available": 900
      }
    expected_intermediate: "命中 rd_03 与 rt_01；微调 +80 在凑车 ±200 件内，重新执行可发量/安全水位校验。"
    expected_output: "天津武清仓分配量更新为 800 罐，约束校验全部通过，修改原因『凑车』留痕。"
    notes: "验证微调后重校验与留痕；修改原因必填。"
  - id: "C-006"
    scenario: "补货单生成与 4 项校验通过"
    type: "Golden Path"
    input: |
      {
        "task": "生成并校验补货单",
        "order": {"from": "TJ-BASE", "to": "BJ-SY", "sku": "金领冠珍护3段800g", "qty": 1344, "available": 1650, "eta": 2, "etaRequired": 3}
      }
    expected_intermediate: "命中 rt_03 + rd_04；校验收发仓合法性/SKU 在册/数量≤可发量/时效≤ETA 四项。"
    expected_output: "补货单 PR-2026-0821-016 生成，4/4 校验通过，可进入下发门禁。"
    notes: "验证补货单模板与 4 项确定性校验。"
  - id: "C-007"
    scenario: "补货单对外下发 + 10 秒撤销"
    type: "Golden Path"
    input: |
      { "task": "下发补货单", "orderNo": "PR-2026-0821-016", "checkPassed": true, "confirm": true }
    expected_intermediate: "命中 rd_04 硬约束；对外下发为 gate，人工放行后写物流调度+财务，保留 10 秒撤销窗口。"
    expected_output: "补货单已下发物流调度+财务；提示『已下发，10 秒内可撤销』；撤销则回滚至待下发。"
    notes: "验证对外下发必停 + 撤销回滚。"
  - id: "C-008"
    scenario: "在途定位与延误预警"
    type: "Golden Path"
    input: |
      { "task": "执行跟踪", "orders": [{"orderNo": "PR-2026-0821-016", "position": "京津高速·廊坊段", "status": "在途", "delayHours": 2}] }
    expected_intermediate: "命中 rrel_01；延误 2h 未达 24h/48h 阈值，仅提示不拉人。"
    expected_output: "在途台账更新；无延误预警（2h<24h）。"
    notes: "验证延误阈值（>24h/48h 才预警）。"
  - id: "C-009"
    scenario: "入库差异 ≤0.5% 记正常损耗"
    type: "Golden Path"
    input: |
      { "task": "核对入库实收", "orderNo": "PR-2026-0815-009", "dispatched": 900, "received": 897 }
    expected_intermediate: "命中 rd_05；差异率=(900-897)/900=0.33% ≤0.5%。"
    expected_output: "按实收 897 同步可发量/DOS，标记正常损耗，关闭调拨单，不生成差异单。"
    notes: "验证差异率阈值与按实收同步。"
  - id: "C-010"
    scenario: "月度复盘达标并生成调参建议"
    type: "Golden Path"
    input: |
      { "task": "生成月度复盘", "metrics": {"时效达成率": 0.92, "缺货缓解率": 0.88, "周转天数同比": -0.08, "入库差异率": 0.0033} }
    expected_intermediate: "命中 rd_06 + rt_02；四项指标均达标（≥90%/≥85%/≤10%/≤0.5%）。"
    expected_output: "复盘报告：全部达标；建议华北安全水位 14→12 天，审批后下一周期生效。"
    notes: "验证复盘模板与达标分支。"
  # ================= Hard Case · 困难样例（6 条 · 30%） =================
  - id: "C-011"
    scenario: "时效最优仓可发量不足 → 拆分多仓补足"
    type: "Hard Case"
    input: |
      {
        "task": "生成分货方案",
        "plan": [{"to": "BJ-SY", "sku": "金领冠珍护3段800g", "need": 1500}],
        "sources": [
          {"from": "TJ-BASE", "available": 900, "eta": 1},
          {"from": "HF-BASE", "available": 700, "eta": 2.5}
        ]
      }
    expected_intermediate: "命中 rd_03；时效最优仓 TJ-BASE 可发量 900 不足 1500，按可发量约束>时效优先拆分 HF-BASE 补足 600。"
    expected_output: "拆分方案：TJ-BASE 900 + HF-BASE 600 = 1500，满足缺口且总时效可接受。"
    notes: "验证多仓拆分补足逻辑（多约束求解难点）。"
  - id: "C-012"
    scenario: "促销期 DOS 高但不判积压"
    type: "Hard Case"
    input: |
      {
        "task": "缺口分级",
        "warehouse": {"site_code": "KM-01", "stock": 12000, "transit": 0, "avgDailyPlan": 180},
        "promo": [{"site_code": "KM-01", "sku": "金领冠珍护3段800g", "active": true}]
      }
    expected_intermediate: "命中 rd_01；DOS=66.7>60，但该仓处于促销放量期，抑制蓝色积压判定。"
    expected_output: "KM-01 不判蓝色积压（促销期抑制），归为正常/关注，避免误控量。"
    notes: "验证促销抑制蓝色积压的例外规则。"
  - id: "C-013"
    scenario: "急缺仓优先 vs 积压仓控量 的仲裁"
    type: "Hard Case"
    input: |
      {
        "task": "生成分货方案",
        "plan": [
          {"to": "GZ-01", "level": "red", "suggest": 980},
          {"to": "JN-01", "level": "blue", "suggest": 300}
        ],
        "source": {"from": "TJ-BASE", "available": 1000}
      }
    expected_intermediate: "命中 rd_03；货源不足以同时满足，按急缺优先→积压控量仲裁：GZ-01 优先分配，JN-01 不再增配。"
    expected_output: "GZ-01 分配 980（急缺优先）；JN-01 分配 0/仅维持（积压控量），并说明仲裁依据。"
    notes: "验证多目标冲突下的仲裁优先级。"
  - id: "C-014"
    scenario: "多项复盘指标矛盾（时效优先于周转）"
    type: "Hard Case"
    input: |
      { "task": "生成月度复盘", "metrics": {"时效达成率": 0.86, "周转天数同比": -0.15} }
    expected_intermediate: "命中 rd_06；时效<90% 未达标、周转降幅 15%>10% 也未达标，两项矛盾。"
    expected_output: "以时效达成率优先，建议优化物流/上调安全水位；周转改善让位于服务水平，不因周转单指标下调水位。"
    notes: "验证多指标矛盾仲裁（时效>周转）。"
  - id: "C-015"
    scenario: "凑车微调超出 ±200 件边界"
    type: "Hard Case"
    input: |
      { "task": "人工微调", "edits": [{"site_code": "BJ-SY", "oldAlloc": 1200, "newAlloc": 1600, "reason": "凑车"}], "available": 1650 }
    expected_intermediate: "命中 rd_03；微调 +400 超凑车 ±200 件上限，需退回重算并提示超界。"
    expected_output: "提示『超出凑车微调 ±200 件上限』，要求说明理由或改用整版重算，不直接写入。"
    notes: "验证凑车微调边界约束。"
  - id: "C-016"
    scenario: "在途口径混淆（在途总量 vs 已下发未发货）"
    type: "Hard Case"
    input: |
      {
        "task": "汇总底表",
        "raw": {"store_transit": 3200, "issuedNotShipped": 900, "site_code": "TJ-BASE"}
      }
    expected_intermediate: "命中 rext_01 + rdict_01；在途应取『在途总量』store_transit=3200，而非『已下发未发货』900。"
    expected_output: "底表在途字段=3200；标注易错点（勿取已下发未发货），防止低估货源。"
    notes: "验证关键字段提取的易错变体识别。"
  # ================= Edge Case · 边界样例（4 条 · 20%） =================
  - id: "C-017"
    scenario: "DOS 恰落在 7 天边界"
    type: "Edge Case"
    input: |
      { "task": "缺口分级", "warehouse": {"site_code": "BJ-SY", "stock": 2100, "transit": 0, "allocated": 0, "avgDailyPlan": 300} }
    expected_intermediate: "命中 rd_01；DOS=7.0 恰在红/黄边界，自动判定不可靠。"
    expected_output: "标记『DOS 边界冲突（7 天）』转人工确认，不静默归入红色或黄色。"
    notes: "验证边界冲突必须转人工（HITL）。"
  - id: "C-018"
    scenario: "TMS 物流预警未接通 → 降级估算"
    type: "Edge Case"
    input: |
      { "task": "异常诊断", "source": "HF-BASE", "tmsAvailable": false }
    expected_intermediate: "命中 rd_03 降级分支；TMS 预警数据缺失，按历史运输时效估算。"
    expected_output: "输出备选并显式标注『物流预警未接通，按历史时效估算（降级），建议人工复核』，不得静默按正常处理。"
    notes: "验证数据缺失时的降级与显式标注。"
  - id: "C-019"
    scenario: "目标备货率 >100% 封顶"
    type: "Edge Case"
    input: |
      { "task": "计算目标备货率", "orderProgress": 0.95, "旬度标准进度": 0.50 }
    expected_intermediate: "命中 rd_02；0.95+0.20=1.15>100%。"
    expected_output: "目标备货率封顶 100%，并触发订单进度超限的 HITL 确认。"
    notes: "验证封顶规则与超限确认。"
  - id: "C-020"
    scenario: "分配量超可发量（硬约束红线）"
    type: "Edge Case"
    input: |
      { "task": "校验分配方案", "row": {"to": "BJ-SY", "alloc": 1800}, "source": {"from": "TJ-BASE", "available": 1650} }
    expected_intermediate: "命中 rd_03/rd_04 硬约束；分配量 1800 > 可发量 1650。"
    expected_output: "拒绝该分配（超可发量），退回重算并标注冲突项；不得生成/下发超发补货单。"
    notes: "验证可发量硬约束不可突破（安全红线）。"
