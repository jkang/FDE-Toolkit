title: "分仓智能补货"
description: "把X奶粉事业部「半自动化 Excel 推式分货」升级为「推拉结合 + 多约束全局优化」的智能分仓补货，Agent 主驱动、人工只在关键确认点介入。"
userRoles:
  - "物流计划岗（分货方案确认/微调/下发/复盘审批）"
  - "调度组（分货数据底表准备与口径复核）"
  - "仓储/物流岗（执行跟踪、入库验收、大日期巡检）"
userPains:
  - "待检/合格/在途/库存经 Excel 传递汇总，约 1 天/轮；分配量在京慧建议量上逐仓逐 SKU 人工调整，约 1 天/轮"
  - "分配量、备货率、安全水位、异常诊断（积兆逻辑）、复盘调参高度依赖老计划员隐性经验，未固化难传承"
  - "多仓 × 多 SKU × 多约束（库存/在途/待检/合格/新鲜度/促销）下人工无法全局最优，易多补/缺补，部分仓缺货、部分仓积压"
  - "分货计划未与促销计划实时联动，大促放量击穿补货节奏；TMS/WMS 与分货系统未打通，执行跟踪靠人工 4h 刷新"
aiInput:
  - "分仓销售计划（分仓×SKU×月度/日均）"
  - "各仓现货/在途/待检/合格库存数据"
  - "促销计划（140+ 广促品指标）"
  - "京慧建议量（京慧一盘货）"
  - "仓网主数据 / 产品主数据 / 分货周期参数（促销放量、旬度进度）"
dataKnowledge:
  - "奶粉分仓补货数据库表字段（现货库存/在途库存/销售计划/实际销量/正向调拨/横向调拨/分仓大日期库存/TMS/WMS 字段）"
  - "缺口分级规则（DOS 分级：红<7 / 黄 7-14 / 蓝>60 且无促销）"
  - "备货率分配规则（目标备货率=订单进度+20% 封顶 100%）"
  - "分配量调整经验（京慧建议量基础上的人工微调逻辑）"
  - "积兆逻辑（异常诊断）[伪经验候选·待业务专家二轮验证]"
  - "安全水位设置经验（区域+渠道差异化）"
  - "分货方案 / 月度复盘报告模版"
  - "待检/合格/可发量/DOS 等业务口径定义"
  - "基地仓—销售仓—产品—SKU—渠道关联关系"
workflow:
  - actor: "human"
    action: "物流计划岗确认分仓销售计划与促销计划，设定本轮分货周期参数（促销放量、旬度进度）"
  - actor: "agent"
    action: "拉取全仓现货/在途/待检/合格库存与需求，按 DOS 分级识别全仓网缺口与积压"
  - actor: "agent"
    action: "汇总分货数据底表并校验字段口径完整性（可发量/待检/合格/在途/生产备货率/大日期）"
  - actor: "agent"
    action: "计算生产备货率/订单完成率与目标备货率、各仓补货优先级，多约束求解生成多版分配方案"
  - actor: "hybrid"
    action: "物流计划岗审核确认/微调分配量，Agent 重新校验库存/在途/效期/促销多约束"
  - actor: "agent"
    action: "生成标准化补货单并校验收发仓/SKU/数量/时效"
  - actor: "hybrid"
    action: "物流计划岗确认后下发（必停+10 秒撤销窗口），Agent 推送物流调度与财务核算"
  - actor: "agent"
    action: "抓取 TMS 在途定位、核对 WMS 入库差异，同步可发量/DOS 并预警"
  - actor: "hybrid"
    action: "物流计划岗审批复盘调参建议，参数下一周期生效"
modelUsage:
  - "核心编排：Claude / GPT-4o 级大模型，负责对话、缺口与异常解释、备选方案生成与调参建议"
  - "运筹优化引擎：多约束全局分配求解（可发量/在途/效期/促销/安全水位约束），确定性计算"
  - "数据集成层：库存/在途/销售计划/京慧建议量/TMS/WMS 的结构化拉取与口径校验"
aiOutput:
  - "全仓网供需视图与缺口告警清单（红/黄/蓝分级）"
  - "多版分货分配方案（京慧建议量/可发量/分配量/分配后库存天数）与 HITL 待确认项"
  - "标准化补货单（含校验结果与下发状态，保留撤销窗口）"
  - "在途台账、延误/破损预警、入库差异处理单"
  - "月度复盘报告与调参建议"
systemIntegration:
  - system: "现货库存/在途库存/销售计划系统"
    direction: "upstream"
    purpose: "读取各仓可发量/待检/合格/在途与未来 14 天分仓销售计划，作为缺口识别与分配输入"
  - system: "京慧一盘货"
    direction: "upstream"
    purpose: "读取京慧建议量作为分配参考基线"
  - system: "奶粉分仓补调系统"
    direction: "bidirectional"
    purpose: "读取建议量、写回分配量与补货单"
  - system: "APS / S&OP"
    direction: "upstream"
    purpose: "读取生产计划/供应约束，作为分配的可供上限"
  - system: "TMS 运输管理系统"
    direction: "upstream"
    purpose: "读取车辆定位/运输状态/里程，生成在途台账与延误预警"
  - system: "WMS 仓储管理系统"
    direction: "upstream"
    purpose: "读取入库验收/实收数量/差异率，触发库存同步与差异处理"
  - system: "物流调度系统"
    direction: "downstream"
    purpose: "下发补货单并回写执行状态"
  - system: "财务核算系统"
    direction: "downstream"
    purpose: "下发补货单用于核算与对账"
productType:
  - "嵌入物流计划岗工作流的「分货工作台」（Agent 对话流 + 分货方案工作台 Artifact）· B2B 自用"
  - "与京慧一盘货、奶粉分仓补调系统相邻：只读建议量、读写分配量，不替代其库存/调拨能力"
businessGains:
  - "分货数据准备 + 分配方案编制由约 2.5 天/轮压缩至小时级（As-Is 基线 [待客户确认]，降幅约 80%+）"
  - "补货单生成校验由约 0.5 天/批压缩至秒级；执行跟踪由人工 4h 刷新 → 4h 自动刷新"
  - "缺货缓解率 ≥85%、时效达成率 ≥90%（复盘阈值口径）"
  - "库存周转天数同比降幅 ≤10%（复盘阈值口径）"
  - "新鲜度/临期占比改善：大日期库存预警前置，目标 [待客户确认]"
  - "月末复盘由约 1 天/月压缩至分钟级"
