title: "X奶粉事业部 · 分仓智能补货 To-be 旅程设计（SKP 精化版）"
meta:
  mode: "to-be"
  source: "AI画布《X奶粉-分仓智能补货-AI画布》+ To-be流程《X奶粉-分仓智能补货-To-be流程》+ 任务流程拆解《X奶粉-分仓智能补货-任务流程拆解》(P1 · 21 L5) + 业务规则挖掘《X奶粉-分仓智能补货-业务规则挖掘》(P2 · 14 规则) + 本体《X奶粉-分仓智能补货-本体设计》"
  scenarioName: "分仓智能补货"
  productType: "分货工作台（Agent 对话流 + 分货方案工作台 Artifact）· B2B 自用 · 嵌入物流计划岗工作流"
personas:
  - id: "planner_wang"
    name: "王立群"
    role: "物流计划岗"
    department: "计划部"
    background: "负责X奶粉事业部每轮分货周期：把分仓销售计划+各仓库存/在途/待检/合格数据+促销计划，变成一份可直接下发的分货方案；当前靠人工 Excel 推式分货，分配量在京慧建议量上逐仓逐 SKU 人工调整。"
    goals:
      - "一屏识别全国仓网缺口（DOS 分级：红<7 / 黄7-14 / 蓝>60 且无促销）"
      - "多约束下一次算完分配方案（目标备货率=订单进度+20% 封顶100%），只需确认与微调"
      - "补货单合规下发（对外下发必停确认）并跟踪执行到入库、月末自动出复盘"
    painPoints:
      - "分货数据准备经 Excel 汇总（待检/合格/在途/库存），约 1 天/轮"
      - "分配量依赖老计划员隐性经验（备货率分配/分配量调整/积兆逻辑），未固化难传承"
      - "多仓×多SKU×多约束下人工无法全局最优，易多补或缺补"
      - "分货与促销计划未实时联动，大促放量击穿补货节奏"
    dataProfile:
      typicalValues:
        - "分货周期数据：4 基地仓×9+ 销售分仓×近 700 SKU；单仓备货率 80%~95%（如北京顺义 80%、天津武清 95%）"
        - "决策阈值：DOS<7 红 / 7-14 黄 / >60 蓝；目标备货率=订单进度+20% 封顶100%（中旬标准 50%）"
        - "复盘阈值：时效达成率≥90%、缺货缓解率≥85%、周转率同比降幅≤10%、入库差异率≤0.5%"
      frequency: "高频（每分货周期 1 轮，含异常分支）"
      commonErrors:
        - "待检与合格库存混用，可发量口径算错"
        - "在途误取「已下发未发货」导致低估货源"
        - "分配量超可发量约束，触发返工"
  - id: "dispatcher_li"
    name: "李梅"
    role: "调度组"
    department: "数据调度"
    background: "负责分货数据底表准备与口径校验：把各仓待检/合格/在途/库存数据汇总成一张底表，确保字段口径一致后交物流计划岗使用。"
    goals:
      - "底表口径校验通过（待检/合格分开取值、在途取在途总量）"
      - "字段缺失/口径不一致自动标红进入 HITL 复核"
    painPoints:
      - "Excel 汇总数据易错，待检/合格混用、在途口径混淆"
      - "关键字段识别依赖人工核对，准确率无保障"
    dataProfile:
      typicalValues:
        - "底表字段：可发量/待检/合格/在途总量/生产备货率/大日期库存（big_date_num）"
      frequency: "每分货周期 1 次"
      commonErrors:
        - "待检与合格混用"
        - "在途总量与已下发未发货混淆"
  - id: "wh_zhang"
    name: "张伟"
    role: "仓储物流岗"
    department: "仓储物流"
    background: "负责执行跟踪与入库验收：TMS 在途监控、WMS 入库实收核对与差异处理、大日期库存巡检。"
    goals:
      - "延误>24h/48h、破损率>1% 自动预警，不再人工 4h 刷新台账"
      - "入库差异率>0.5% 自动生成差异处理单推送财务与仓管"
    painPoints:
      - "执行跟踪靠人工 4 小时刷新一次 TMS 台账"
      - "入库差异人工核对，返工耗时"
    dataProfile:
      typicalValues:
        - "在途台账：车辆定位/运输状态/预计到货；WMS 运单实收/差异率"
      frequency: "持续（4h 自动刷新）"
      commonErrors:
        - "延误预警滞后，差异单生成不及时"
scenarios:
  - id: "s1"
    name: "常规分货周期：缺口识别 → 多约束方案 → HITL 确认 → 下发"
    personaId: "planner_wang"
    trigger: "物流计划岗在每个分货周期拿到「分仓销售计划 + 各仓现货/在途/待检/合格库存 + 促销计划」后启动"
    businessData:
      - "4 基地仓现货/在途/待检/合格库存（准实时）"
      - "11 销售分仓未来 14 天销售计划 + 京慧建议量 + 促销计划（140+ 广促品）"
      - "决策规则：DOS 分级、目标备货率=订单进度+20% 封顶100%、可发量约束"
    goal: "分货方案编制由约 1.5 天/轮压缩至小时级：一次算出满足约束的分配方案，人工只需确认 HITL 项与微调"
  - id: "s2"
    name: "异常分货：基地仓可发量不足 → 备选方案拆分补足"
    personaId: "planner_wang"
    trigger: "分货方案求解时基地仓可发量不足覆盖缺口，或物流预警数据缺失"
    businessData:
      - "仓网距离/运输时效/各仓可发量（仓网主数据）"
      - "物流预警（TMS，评级 C 需开发，可能降级）"
    goal: "按「可发量约束 > 时效优先」仲裁规则自动拆分多仓补足，输出备选方案；数据缺失时降级提示并升级人工"
  - id: "s3"
    name: "月度执行复盘与参数迭代审批"
    personaId: "planner_wang"
    trigger: "每月月末，基于补货时效达成率/缺货缓解率/周转率自动生成复盘报告"
    businessData:
      - "复盘指标：时效达成率（≥90%）、缺货缓解率（≥85%）、周转率（同比降幅≤10%）、入库差异率（≤0.5%）"
    goal: "复盘报告自动生成 + 短板分析 + 调参建议，计划员审批后参数下一周期生效"
stages:
  - name: "① 货源评估与分货数据准备"
    actions:
      - name: "汇总全国可分配库存与在途"
        owner: "Agent"
        touchpoints: "分货工作台 · 对话流 + 供需全景 Artifact"
        thoughts:
          - "希望 AI 直接拉齐 4 基地仓可发量+在途，别再让我比对多张 Excel"
        userInputs:
          - type: "系统自动拉取"
            name: "现货库存 / 在途库存 / 销售计划 / 未发订单"
            format: "库存系统 + 奶粉分仓补调系统 API"
            example: "天津基地仓：可发量 62000 / 在途 18000 / 待检 5200"
            content: "4 基地仓可发量/待检/合格/在途/已下发未发货；未来 14 天分仓销售计划"
        aiInteraction:
          aiAction: "拉取全仓数据，按产品编码 product_code、仓库编码 site_code 关联，汇总全国供需视图"
          suggestions:
            - "帮我看看全国仓网现在的货源情况"
            - "识别全仓网缺口"
        visibleData:
          - "全国供需视图：4 基地仓可发量/在途/DOS；9+ 销售分仓供需匹配"
          - "关键字段识别：待检/合格分开取值、在途取「在途总量」（易错点已标）"
        designNotes:
          - "数据准备由约 0.5~1 天/轮压缩至分钟级"
          - "字段口径异常自动标红进入 HITL 复核（验收：漏标率 100% 兜底）"
      - name: "计算各仓库存天数并判定缺口等级"
        owner: "Agent"
        touchpoints: "供需全景看板 · 缺口告警清单（红/黄/蓝）"
        thoughts:
          - "DOS 分级口径（红<7 / 黄7-14 / 蓝>60 且无促销）要帮我自动算好"
        userInputs:
          - type: "系统自动带入"
            name: "各仓库存天数 + 未来14天需求 + 促销计划"
            format: "计算字段 + 销售计划 + 促销管理"
            example: "北京顺义仓：DOS 5 天 < 7 → 红色紧急补货"
            content: "DOS=(库存+在途+分配)/日均销售计划；促销抑制蓝积压预警"
        aiInteraction:
          aiAction: "判定缺口等级：红=可发量+在途<未来7天需求 且 DOS<7；黄=7≤DOS<14；蓝=DOS>60 且无促销"
          suggestions:
            - "查看缺口告警清单"
            - "钻取到仓×SKU 明细"
        visibleData:
          - "缺口告警清单：红色 2 项（北京顺义仓 DOS 5/6 天）、黄色 5 项、蓝色积压 3 项（柳州/济南 安儿宝）"
          - "促销抑制提示：促销期 DOS 高不触发蓝色积压预警"
        designNotes:
          - "老计划员半天比对 → AI 一屏红黄蓝分级图（规则 rd_01 缺口分级·DOS；rext_01 字段提取要点；rdict_01 口径词典）"
          - "阈值边界冲突（如 DOS 恰在 7 天边界）触发 HITL 拉人"
      - name: "汇总分货数据底表并校验口径完整性"
        owner: "混合（Agent 汇总 · 调度组复核）"
        touchpoints: "底表准备视图 · 口径校验结果"
        thoughts:
          - "待检/合格混用、在途口径错是最常见的坑，希望 AI 帮我兜住"
        userInputs:
          - type: "文件/系统导入"
            name: "待检/合格/在途/库存原始数据"
            format: "Excel 或系统导出"
            example: "现货库存 status 列（待检/合格）、在途 store_transit 列"
            content: "可发量（典型位置：现货库存「可发量」列，变体：抵扣后库存）；待检/合格（status 列）；在途总量（store_transit 列）；生产备货率；大日期库存（big_date_num 列）"
        aiInteraction:
          aiAction: "按字段注释口径汇总底表并校验完整性；字段缺失/口径不一致标红"
          suggestions:
            - "校验底表口径完整性"
            - "标注关键字段易错点"
        visibleData:
          - "校验结果：可发量/待检/合格/在途/生产备货率/大日期 6 项口径核对"
          - "异常项：0 项（示例）；关键字段识别准确率 ≥98%"
        designNotes:
          - "口径校验由人工逐列核对 → 系统自动校验 + 标红 HITL"
  - name: "② 分货方案编制（P0）"
    actions:
      - name: "计算各仓备货率与目标备货率"
        owner: "Agent"
        touchpoints: "分货方案工作台 · 备货率计算明细"
        thoughts:
          - "目标备货率=订单进度+20% 封顶 100% 的公式要自动算，别让我心算"
        userInputs:
          - type: "系统自动带入"
            name: "现货/在途/本月已出库/销售计划/未发订单"
            format: "库存系统 + 实际销量 + 销售计划"
            example: "中旬标准进度 50%；订单完成率 65% → 目标备货率 = 65%+20% = 85%"
            content: "生产备货率=(现货+在途+本月已出库)/销售计划；订单完成率=(当月未发+本月累出)/销售计划；旬度标准进度（中旬 50%）"
        aiInteraction:
          aiAction: "计算生产备货率与订单完成率，按「目标备货率=订单进度+20% 封顶100%」公式计算各仓目标备货率"
          suggestions:
            - "按本周销售计划帮我出分货方案"
            - "查看备货率计算明细"
        visibleData:
          - "各仓目标备货率：北京顺义 100%（封顶）、天津武清 95%、广州 88%"
          - "订单完成率与旬度进度对照（超标准 → 目标备货率上浮）"
        designNotes:
          - "备货率计算从约 0.5 天/轮压缩至分钟级"
          - "目标备货率>100% 封顶（SOP），订单进度超限触发 HITL"
      - name: "计算建议补货量并选择发货仓"
        owner: "Agent"
        touchpoints: "分货方案工作台 · 建议补货量 + 发货仓推荐"
        thoughts:
          - "就近优先选仓（可发量覆盖且时效最快）希望 AI 直接推荐，可发量不足要提示我"
        userInputs:
          - type: "系统自动带入"
            name: "京慧建议量 / 可发量 / 运输时效 / 区域类型"
            format: "京慧一盘货 + 现货库存 + 仓网主数据"
            example: "北京顺义：京慧建议 1200，可发量 1650，天津基地仓时效 1 天（最近）"
            content: "建议补货量=目标库存口径-当前口径库存；可发量=发货仓库存-已分配量；就近优先=可发量覆盖 且 时效最快"
        aiInteraction:
          aiAction: "计算建议补货量，按「可发量覆盖 且 时效最快」就近优先选择发货仓；建议量偏离京慧或可发量不足时 HITL"
          suggestions:
            - "计算建议补货量"
            - "推荐发货仓"
        visibleData:
          - "建议补货量清单 + 推荐发货仓（天津基地仓·时效 1 天）"
          - "HITL 提示：北京顺义分配量较京慧建议上调 12%（促销放量，待确认）"
        designNotes:
          - "冲突仲裁：可发量约束 > 时效优先；时效最优仓可发量不足时拆分多仓补足"
          - "建议量偏离京慧 → 写入前必停（HITL）"
      - name: "生成多版分配方案并人工确认（HITL）"
        owner: "混合（Agent 生成 · 计划员确认/微调）"
        touchpoints: "分货方案工作台 · 方案 A/B 对比 + HITL 拦截横幅"
        thoughts:
          - "多版方案对比 + 分配量可编辑 + 修改留痕，确认后重新校验约束"
        userInputs:
          - type: "页面内编辑"
            name: "分配量人工微调 + 修改原因"
            format: "方案工作台可编辑表格"
            example: "确认顺义 1344 罐；把天津武清仓改到 800 罐"
            content: "分配量（≤可发量）；凑车微调 ±200 件；修改原因留痕（促销放量/周转快压量/在途延误补充等）"
        aiInteraction:
          aiAction: "生成多版分配方案（A 均衡版/B 优先版），HITL 拦截待确认项，人工修改后重新校验约束"
          suggestions:
            - "确认并写入分配量"
            - "改用方案B（优先版）"
            - "修改后重新校验"
        visibleData:
          - "方案对比表：建议量/分配量/分配后库存天数/优先级"
          - "HITL 拦截：北京顺义仓 +12%（促销放量）待确认；天津武清 800 罐（人工修改）"
          - "约束校验：可发量不超 · 安全水位达标 · 凑车 ±200 件 · 分配后库存天数"
        designNotes:
          - "方案编制由约 1 天/轮压缩至分钟级（全场景 P0；规则 rd_02 备货率 / rd_03 多约束分配 / rt_01 分货方案模板 / rrel_01 关联关系）"
          - "人工修改自动留痕（模版范例类·分货方案模版：方案头/明细/效果预估/待确认项）"
  - name: "③ 补货单生成与下发"
    actions:
      - name: "生成标准化补货单并校验字段"
        owner: "Agent"
        touchpoints: "补货单 Artifact · 校验结果"
        thoughts:
          - "4 项校验（收发仓/SKU/数量/时效）要自动做，别等人工逐单核对"
        userInputs:
          - type: "系统自动带入"
            name: "确认后的分配方案 + SKU/收发仓主数据"
            format: "分货方案工作台 → 补货单"
            example: "PR-2026-0821-016：天津基地仓 → 北京顺义仓，金领冠珍护3段800g 1344 罐，时效 2 天"
            content: "补货单字段：调拨单号/发货仓/收货仓/SKU/数量/时效"
        aiInteraction:
          aiAction: "按确认方案生成标准化补货单，校验收发仓合法性/SKU 编码在册/数量≤可发量/时效满足 ETA"
          suggestions:
            - "生成补货单"
            - "查看校验结果"
        visibleData:
          - "补货单：4 张，校验 4/4 全部通过（库存不足/时效超期/字段缺失无遗漏）"
        designNotes:
          - "补货单生成由约 0.5 天/批压缩至秒级"
          - "校验不过 → 退回调整并拉人（HITL）"
      - name: "下发补货单（必停确认 + 撤销窗口）"
        owner: "混合（Agent 下发 · 计划员确认）"
        touchpoints: "补货单 Artifact · 撤销 Toast"
        thoughts:
          - "对外下发是合规红线，Agent 必须停下来让我确认；下发后 10 秒内可撤销兜底"
        userInputs:
          - type: "确认操作"
            name: "下发确认"
            format: "按钮确认"
            example: "「方案确认，生成补货单并下发」→ 确认下发"
            content: "对外下发 → 必停确认（SKP 深度任务·下发补货单）；撤销窗口 10 秒"
        aiInteraction:
          aiAction: "校验通过后写入物流调度 + 财务核算，保留 10 秒撤销窗口（可回滚）"
          suggestions:
            - "方案确认，生成补货单并下发"
            - "撤销下发（10 秒内）"
        visibleData:
          - "下发结果：4 张补货单已下发物流调度+财务，批次 TB-20260823"
          - "撤销 Toast：10 秒倒计时，可回滚物流调度与财务侧"
        designNotes:
          - "对外下发必停（合规要求；规则 rd_04 补货单校验·硬约束），撤销窗口兜底人工误操作"
          - "撤销后补货单回到「待下发」状态，可重新下发"
  - name: "④ 执行跟踪与入库同步"
    actions:
      - name: "抓取在途定位并判定预警"
        owner: "Agent"
        touchpoints: "执行跟踪看板 · 延误预警"
        thoughts:
          - "延误>24h/48h、破损率>1% 自动预警，别等我 4 小时刷一次台账"
        userInputs:
          - type: "系统自动拉取"
            name: "车辆定位 / 运输状态 / 预计到货"
            format: "TMS GPS（4h 自动刷新）"
            example: "TB-20260823-001：津A·8K32F 京津高速·王庆坨出口 运输中 62%"
            content: "定位/速度/里程/状态/天气；延误>24h/48h 触发拉人"
        aiInteraction:
          aiAction: "抓取 TMS 定位生成在途台账，延误>24h/48h 自动预警并拉人；破损率>1% 生成异常工单"
          suggestions:
            - "刷新执行跟踪"
            - "查看延误预警明细"
        visibleData:
          - "在途台账：车辆/位置/状态/进度（4h 自动刷新）"
          - "延误预警：TB-20260823-003 拥堵预计延误 2h（未超 24h 阈值，仅提示）"
        designNotes:
          - "人工 4h 刷新 → Agent 自动刷新 + 阈值预警"
          - "关联关系类：基地仓-销售仓-产品-SKU-渠道关联网络"
      - name: "核对入库实收与差异"
        owner: "Agent"
        touchpoints: "执行跟踪看板 · 差异记录"
        thoughts:
          - "差异率≤0.5% 正常损耗自动同步；>0.5% 自动生成差异单追责"
        userInputs:
          - type: "系统自动拉取"
            name: "WMS 入库验收（运单实收/差异率）"
            format: "WMS API（准实时）"
            example: "TB-20260823-004：调拨 900，实收 897，差异率 0.33% ≤ 0.5% 正常损耗"
            content: "差异率=(调拨数量-实收数量)/调拨数量；破损率>1% 单独异常工单"
        aiInteraction:
          aiAction: "核对实收与调拨数量：差异率≤0.5% 按实收同步并标记正常损耗；>0.5% 生成差异处理单推送财务与仓管"
          suggestions:
            - "查看入库差异记录"
        visibleData:
          - "差异记录：0.33% 正常损耗（已同步）；差异率阈值 0.5%"
        designNotes:
          - "差异判定从人工核对 → 自动判定 + 追责单自动推送（规则 rd_05 入库差异判定；差异率 0.5% / 破损率 1% 阈值）"
          - "差异率>0.5% → 拉人（HITL）"
      - name: "同步库存指标并关闭调拨单"
        owner: "Agent"
        touchpoints: "库存指标更新 · 调拨单状态"
        thoughts:
          - "入库后可发量/DOS 要自动同步，别让我手动维护"
        userInputs:
          - type: "系统自动执行"
            name: "实收数量"
            format: "WMS → 库存系统"
            example: "北京顺义仓可发量 +897 罐，DOS 更新"
            content: "同步可发量/库存天数（DOS），关闭调拨单"
        aiInteraction:
          aiAction: "按实收同步可发量与 DOS，关闭调拨单；同步失败自动重试或拉人"
          suggestions:
            - "查看库存指标同步结果"
        visibleData:
          - "更新后库存指标：可发量/DOS 已同步，调拨单已关闭"
        designNotes:
          - "入库差异核对与库存同步人工约 0.5 天/批 → 自动秒级同步"
  - name: "⑤ 库存监控与效果复盘"
    actions:
      - name: "计算库存天数并设置安全水位"
        owner: "混合（Agent 计算 · 计划员审批）"
        touchpoints: "库存计划视图 · 安全水位调整审批"
        thoughts:
          - "安全水位按区域+渠道差异化（电商低水位、线下高水位、偏远上调），调整需审批"
        userInputs:
          - type: "系统自动带入"
            name: "各仓库存天数 / 渠道差异 / 区域类型"
            format: "库存系统 + 渠道管理 + 仓主数据"
            example: "华北电商渠道 12 天、线下 16 天；偏远仓上调 3 天"
            content: "库存天数=各仓库存/日均需求；渠道差异：电商求 28 天新鲜（低水位）、线下需安全缓冲（高水位）；区域：偏远上调"
        aiInteraction:
          aiAction: "按区域+渠道计算差异化安全水位，输出调整建议，审批后生效"
          suggestions:
            - "查看安全水位建议"
        visibleData:
          - "各仓安全水位：电商 12 天 / 线下 16 天 / 偏远 +3 天（待审批）"
        designNotes:
          - "服务水平和不断货优先于周转（冲突仲裁 → HITL 复核）"
      - name: "巡检大日期库存"
        owner: "Agent"
        touchpoints: "临期预警 · 大日期监控"
        thoughts:
          - "临期风险自动巡检，别靠人工盯效期"
        userInputs:
          - type: "系统自动拉取"
            name: "分仓大日期库存 / 效期"
            format: "分仓大日期库存表（big_date_num 列）"
            example: "广州白云仓大日期占比 6.8%，建议促销联动消化"
            content: "大日期判定（待业务专家二轮验证），临期风险 → 拉人"
        aiInteraction:
          aiAction: "巡检各仓大日期库存，临期风险自动预警并建议促销联动消化"
          suggestions:
            - "查看临期预警"
        visibleData:
          - "临期预警：广州白云仓大日期占比 6.8%（建议促销联动消化）"
        designNotes:
          - "「大日期判定」经验待二轮验证，原型标注概念级"
          - "对应 KPI：提高新鲜度"
      - name: "统计复盘指标并生成调参建议"
        owner: "Agent"
        touchpoints: "月度复盘报告 · 调参建议审批"
        thoughts:
          - "复盘报告要按「指标总览→短板分析→调参建议→审批」结构自动出，别让我手工拉数"
        userInputs:
          - type: "系统自动带入"
            name: "时效达成率 / 缺货缓解率 / 周转率"
            format: "复盘指标（TMS 台账 + 库存监控报表）"
            example: "时效达成率 92%（≥90% 达标）、缺货缓解率 88%（≥85% 达标）、周转天数 24 天（同比 -8% ≤10%）"
            content: "复盘阈值：时效达成率<90% 优化物流/上调水位；缺货缓解率<85% 优化预测/促销上浮；周转率同比降>10% 下调水位"
        aiInteraction:
          aiAction: "统计复盘指标，按阈值触发调参建议（指标异常恶化 → 拉人审批）；生成复盘报告（模版范例类：指标总览→短板分析→调参建议→审批）"
          suggestions:
            - "生成月度复盘报告"
            - "审批调参建议（参数下一周期生效）"
        visibleData:
          - "复盘报告：时效达成率 92%、缺货缓解率 88%、周转 24 天、新鲜度 94%"
          - "短板分析：华南广州白云仓大日期占比偏高（6.8%）"
          - "调参建议：华北安全水位 14→12 天（预计释放 1.1 万罐）；华南维持水位加强促销联动"
        designNotes:
          - "复盘由约 1 天/月压缩至分钟级"
          - "多项指标矛盾时：时效达成率优先于周转优化（专家确认仲裁）"
handoff:
  paths:
    - "主路径：① 缺口识别 → ② 方案编制（HITL 确认/微调） → ③ 补货单校验下发（必停+撤销窗口） → ④ 执行跟踪与入库同步 → ⑤ 复盘调参审批"
    - "分支：基地仓可发量不足 → 按「可发量约束>时效优先」拆分多仓补足，输出备选方案"
    - "异常：物流预警数据缺失 → 按历史运输时效估算 + 降级提示，升级人工复核"
    - "边界：目标备货率>100% 封顶；差异率>0.5% 生成差异单拉人；延误>24h/48h 预警拉人"
  pages:
    - "分货工作台 /workbench（Agent 对话流 · 状态徽章 · 4 条故事线入口）"
    - "全仓网供需全景 /supply（供需视图 + 缺口告警红/黄/蓝）"
    - "分货方案工作台 /allocation（方案 A/B 对比 · HITL · 目标备货率 · 修改留痕）"
    - "异常诊断与备选方案 /exception（备选方案对比 · 可发量约束优先 · 错误态降级）"
    - "补货单与执行跟踪 /replenish（补货单 · 撤销 Toast · 在途监控 · 入库差异）"
    - "月度复盘报告 /review（指标总览 · 短板分析 · 调参审批）"
  dataEntities:
    - "现货库存（准实时 · 可发量/待检/合格）"
    - "在途库存（准实时 · 在途总量/已下发未发货）"
    - "销售计划（批量 · 分仓×SKU×14天）"
    - "京慧建议量（京慧一盘货）"
    - "生产备货率 / 订单完成率（计算字段）"
    - "WMS 入库验收（准实时 · 运单实收/差异率）"
    - "TMS 定位（4h · 车辆/状态/延误）"
  suggestions:
    - "帮我看看全国仓网现在的货源情况"
    - "按这周销售计划帮我出分货方案"
    - "华北基地仓可发量不足，怎么办"
    - "方案确认，生成补货单并下发"
