  - name: "storyPlan"
    latency: 1800
    response:
      summary: "已读京慧建议量/可发量/备货率，按 促销放量→急缺优先→积压控量 优先级完成多约束求解。北京顺义仓分配量上调 12% 触发 HITL，请确认后生效。"
      items:
