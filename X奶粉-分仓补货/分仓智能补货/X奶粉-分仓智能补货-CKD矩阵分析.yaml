title: "X奶粉 · 分仓智能补货 CKD 映射报告"
product: "分仓智能补货 Agent"
description: "对X奶粉事业部「基地仓→销售分仓」分货补货工作流进行 CKD 梳理，明确从货源评估、缺口识别、多约束分配方案生成，到补货单下发、执行跟踪与效果复盘全链路所需的上下文（Context）、知识（Knowledge）与数据（Data）资产依赖，为 RAG 与提示词工程提供资产清单。"
steps:
  - step_name: "1. 全仓网供需视图与缺口识别"
    ckd_items:
      - context_name: "本轮分货周期参数"
        description: "随会话/请求动态带入的当前分货周期参数：促销放量、旬度标准进度、分货范围，用于校准缺口判定与目标备货率。"
        type: "会话上下文 / 参数对象"
        storage: "Agent 会话状态 / 分货工作台表单"
        volume: "每轮 1 份，字段 < 10"
        ai_init: false
        frequency: "每分货周期更新"
        retrieval: "会话上下文直接带入"
        status: "待规划"
      - context_name: "分仓销售计划（未来14天）"
        description: "分仓 × SKU × 月度/日均销售计划，是缺口识别与 DOS 计算的需求基准。"
        type: "结构化数据 / API 数据"
        storage: "销售计划表（关系型数据库，需导出）"
        volume: "4 基地仓 × 9+ 销售仓 × 近 700 SKU"
        ai_init: false
        frequency: "批量（按分货周期）"
        retrieval: "分仓×SKU 精确查询 / 批量拉取"
        status: "已支持（评级 B · 需导出）"
      - context_name: "现货/在途/待检/合格库存"
        description: "各仓可发量、待检、合格、在途库存，是供需视图与缺口分级的核心数据源；口径易错（待检/合格混用、在途取「已下发未发货」）。"
        type: "结构化数据 / API 数据"
        storage: "现货库存表 / 在途库存表（需导出）"
        volume: "准实时刷新，全仓网全 SKU"
        ai_init: false
        frequency: "准实时"
        retrieval: "site_code × product_code 精确查询"
        status: "已支持（评级 B · 需导出）"
      - context_name: "缺口分级规则（DOS 分级）"
        description: "判定缺口/积压等级的业务规则：DOS<7 红紧急补货、7≤DOS<14 黄常规补货、DOS>60 且无促销 蓝积压预警。"
        type: "规则 / 决策模型"
        storage: "规则知识库（JSON / 规则表）"
        volume: "分级规则 < 20 条"
        ai_init: true
        frequency: "随规则变化更新"
        retrieval: "规则引擎匹配"
        status: "待规划（知识资产·已识别待二轮验证）"

  - step_name: "2. 分货数据底表准备与口径校验"
    ckd_items:
      - context_name: "分货数据底表模板"
        description: "分货数据底表的固定骨架（可发量/待检/合格/在途总量/生产备货率/大日期库存等列），Agent 按模板汇总并填充。"
        type: "Prompt Template / 模版"
        storage: "模板文件 / 配置"
        volume: "1 套模板，< 20 列"
        ai_init: true
        frequency: "字段变化时更新"
        retrieval: "模板直接引用"
        status: "待规划"
      - context_name: "业务口径字典（待检/合格/可发量/DOS/在途总量）"
        description: "统一业务口径词表，支撑底表字段口径校验与术语 hover 解释，避免待检/合格混用、在途口径混淆。"
        type: "静态字典 / 术语表"
        storage: "Redis / 内存缓存 或配置表"
        volume: "词条 < 40"
        ai_init: false
        frequency: "口径变化时更新"
        retrieval: "Key-Value 查询"
        status: "待规划（知识资产·术语字典类）"
      - context_name: "分货数据关键字段识别要点"
        description: "专家看底表重点看什么：可发量典型位置（现货库存「可发量」列）、待检/合格（status 列）、在途总量（store_transit 列）、大日期（big_date_num 列）及易错变体。"
        type: "提取要点 / 规则"
        storage: "配置 / 知识库"
        volume: "字段要点 < 15 条"
        ai_init: true
        frequency: "字段变化时更新"
        retrieval: "字段规则匹配"
        status: "待规划（知识资产·关键信息提取要点）"
      - context_name: "大日期库存数据"
        description: "分仓大日期/临期库存（big_date_num），用于底表新鲜度字段与后续临期预警。"
        type: "结构化数据 / API 数据"
        storage: "分仓大日期库存表（需导出）"
        volume: "全仓网全 SKU"
        ai_init: false
        frequency: "准实时"
        retrieval: "site_code × product_code 查询"
        status: "已支持（评级 B · 需导出）"

  - step_name: "3. 备货率与补货优先级计算"
    ckd_items:
      - context_name: "实际销量（本月已出库/前3月均销/未发订单）"
        description: "计算生产备货率与订单完成率的分子来源，含当月订单、已出库、前 3 月均销、未发货。"
        type: "结构化数据 / API 数据"
        storage: "实际销量表（需导出）"
        volume: "分仓×SKU×月度"
        ai_init: false
        frequency: "批量"
        retrieval: "分仓×SKU 查询"
        status: "已支持（评级 B · 需导出）"
      - context_name: "备货率分配规则（目标备货率）"
        description: "目标备货率=订单进度+20% 封顶 100%，并按区域类型（核心/偏远）与渠道差异化；是优先级排序的核心规则。"
        type: "规则 / 决策模型"
        storage: "规则知识库 / 配置表"
        volume: "规则 < 20 条"
        ai_init: true
        frequency: "月度复核"
        retrieval: "规则引擎匹配"
        status: "待规划（知识资产·决策模型类）"
      - context_name: "促销计划（140+ 广促品指标）"
        description: "促销放量计划，用于备货率上浮、抑制积压预警与分配量调整；当前与分货计划未实时联动。"
        type: "结构化数据 / API 数据"
        storage: "促销管理系统 / 分货底表"
        volume: "140+ 广促品指标"
        ai_init: false
        frequency: "按促销周期"
        retrieval: "分仓×SKU×促销期 查询"
        status: "建设中（待集成）"

  - step_name: "4. 多约束分配方案生成与人工确认（P0）"
    ckd_items:
      - context_name: "京慧建议量"
        description: "京慧一盘货给出的初始建议补货量，作为分配方案参考基线；建议量偏离时必须触发 HITL 人工确认。"
        type: "API 数据"
        storage: "京慧一盘货系统（只读）"
        volume: "分仓×SKU 建议量"
        ai_init: false
        frequency: "按分货周期"
        retrieval: "分仓×SKU 查询"
        status: "已支持（相邻系统·只读）"
      - context_name: "多约束分配优化规则"
        description: "分配量求解的业务约束与仲裁：可发量约束 > 时效优先 > 京慧建议量；库存/在途/待检/合格/新鲜度/促销多约束，急缺优先/积压控量/促销上浮。"
        type: "规则 / 运筹优化模型"
        storage: "优化引擎 + 规则配置"
        volume: "约束/仲裁规则 < 30 条"
        ai_init: true
        frequency: "月度复核"
        retrieval: "优化求解 + 规则匹配"
        status: "待规划（知识资产·决策模型类）"
      - context_name: "分货方案模板"
        description: "分货方案的固定骨架（方案头/明细表/效果预估/待确认项）与可变字段来源，支撑多版方案 Artifact 渲染与人工微调。"
        type: "Prompt Template / 模版"
        storage: "模板文件 / 配置"
        volume: "1 套模板，4 段"
        ai_init: true
        frequency: "季度复核"
        retrieval: "模板直接引用"
        status: "待规划（知识资产·模版范例类）"
      - context_name: "仓网主数据 / 产品主数据"
        description: "基地仓/销售仓编码、仓网距离、运输时效、区域类型；产品编码/品牌/规格/事业部，用于选仓与约束求解。"
        type: "结构化数据 / 主数据"
        storage: "仓主数据表 / 产品主数据表"
        volume: "4 基地仓 + 9+ 销售仓；近 700 SKU"
        ai_init: false
        frequency: "批量（仓网/产品变化时更新）"
        retrieval: "site_code / product_code 精确查询"
        status: "已支持（评级 A · 直接获取）"
      - context_name: "基地仓—销售仓—产品—SKU—渠道关联"
        description: "全仓网对象关联网络：site_code 贯通收发仓、product_code 贯通产品与分货对象、渠道区分新鲜度口径，用于选仓与分配对象识别。"
        type: "图谱 / 关联关系"
        storage: "图数据库 / 关系表"
        volume: "全仓网仓—品—渠道关联"
        ai_init: true
        frequency: "仓网/渠道变化时更新"
        retrieval: "关系路径查询"
        status: "待规划（知识资产·关联关系类）"

  - step_name: "5. 异常诊断与备选方案"
    ckd_items:
      - context_name: "积兆逻辑（异常诊断）"
        description: "基地仓缺货/物流受阻时检索周边资源生成备选方案的经验逻辑；当前为伪经验候选，待业务专家二轮验证。"
        type: "规则 / 决策模型"
        storage: "规则知识库 / 知识图谱"
        volume: "异常分支规则 < 20 条"
        ai_init: true
        frequency: "季度复核"
        retrieval: "规则匹配 + 图检索"
        status: "待规划（[伪经验候选·待二轮验证]）"
      - context_name: "物流预警 / 运输时效"
        description: "TMS 物流预警、历史运输时效，用于备选方案的成本/时效/库存均衡评分；数据缺失时降级为历史时效估算。"
        type: "API 数据"
        storage: "TMS 运输管理系统"
        volume: "在途运单级"
        ai_init: false
        frequency: "4h 刷新"
        retrieval: "运单/线路查询"
        status: "需开发（评级 C）"
      - context_name: "安全水位"
        description: "各仓差异化安全库存水位，异常诊断与备选方案的安全约束。"
        type: "结构化数据 / 计算字段"
        storage: "库存监控报表 / 安全水位表"
        volume: "分仓×SKU 水位"
        ai_init: true
        frequency: "季度复核"
        retrieval: "分仓×SKU 查询"
        status: "待规划（知识资产·决策模型类）"

  - step_name: "6. 补货单生成、校验与下发"
    ckd_items:
      - context_name: "补货单模板"
        description: "标准化补货单固定骨架：调拨单号/发货仓/收货仓/SKU/数量/时效，按确认方案填充。"
        type: "Prompt Template / 模版"
        storage: "模板文件 / 配置"
        volume: "1 套模板，6 字段"
        ai_init: true
        frequency: "规则变化时更新"
        retrieval: "模板直接引用"
        status: "待规划（知识资产·模版范例类）"
      - context_name: "补货单校验规则"
        description: "生成补货单时的 4 项校验：收发仓合法性、SKU 编码在册、数量≤可发量、时效满足 ETA；校验不过退回调整。"
        type: "规则 / 校验规则"
        storage: "规则知识库 / 校验引擎"
        volume: "校验项 < 10 条"
        ai_init: true
        frequency: "规则变化时更新"
        retrieval: "规则引擎匹配"
        status: "待规划（知识资产·操作流程类）"
      - context_name: "SKU/收发仓主数据"
        description: "SKU 编码在册状态、收发仓合法性，校验规则的数据依赖。"
        type: "结构化数据 / 主数据"
        storage: "产品主数据表 / 仓主数据表"
        volume: "近 700 SKU / 13+ 仓"
        ai_init: false
        frequency: "批量"
        retrieval: "编码精确查询"
        status: "已支持（评级 A · 直接获取）"

  - step_name: "7. 执行跟踪与入库同步"
    ckd_items:
      - context_name: "运输定位（GPS）/ 运输状态"
        description: "TMS 车辆定位、速度、里程、状态、天气，用于生成在途台账并判定延误>24h/48h。"
        type: "API 数据 / 时序数据"
        storage: "TMS 运输管理系统"
        volume: "在途运单级，4h 刷新"
        ai_init: false
        frequency: "4h 刷新"
        retrieval: "运单/车牌查询"
        status: "需开发（评级 C）"
      - context_name: "WMS 入库验收（实收/差异率）"
        description: "运单、实收数量、差异率，用于核对入库实收与调拨数量；差异率≤0.5% 正常损耗，>0.5% 生成差异单。"
        type: "API 数据"
        storage: "WMS 仓储管理系统"
        volume: "入库批次级，准实时"
        ai_init: false
        frequency: "准实时"
        retrieval: "运单号/ERP单号查询"
        status: "需开发（评级 D）"
      - context_name: "入库差异判定规则"
        description: "差异率≤0.5% 按实收同步并标记正常损耗；>0.5% 生成差异处理单推送财务与仓管；破损率>1% 单独异常工单。"
        type: "规则 / 决策模型"
        storage: "规则知识库 / SOP"
        volume: "分支规则 < 10 条"
        ai_init: true
        frequency: "规则变化时更新"
        retrieval: "规则引擎匹配"
        status: "待规划（知识资产·决策模型类）"
      - context_name: "可发量 / DOS 口径"
        description: "同步库存指标时的计算口径：可发量=发货仓库存-已分配量；DOS=(库存+在途+分配)/日均计划。"
        type: "静态字典 / 计算口径"
        storage: "口径字典 / 计算服务"
        volume: "口径 < 20 条"
        ai_init: false
        frequency: "口径变化时更新"
        retrieval: "Key-Value 查询"
        status: "待规划（知识资产·术语字典类）"

  - step_name: "8. 库存监控与效果复盘"
    ckd_items:
      - context_name: "库存监控报表（备货率/订单完成率/发货缺口）"
        description: "派生报表，含备货率、订单完成率、发货缺口，用于库存天数与安全水位计算。"
        type: "结构化数据 / 派生报表"
        storage: "库存监控报表（需导出）"
        volume: "分仓×SKU 派生指标"
        ai_init: false
        frequency: "批量"
        retrieval: "分仓×SKU 查询"
        status: "已支持（评级 B · 需导出）"
      - context_name: "安全水位设置经验"
        description: "按区域+渠道差异化设置安全水位（电商低水位求新鲜、线下高水位保缓冲、偏远上调）；服务水平与周转冲突时人工审批。"
        type: "规则 / 决策模型"
        storage: "规则知识库 / 配置表"
        volume: "水位规则 < 20 条"
        ai_init: true
        frequency: "季度复核"
        retrieval: "规则引擎匹配"
        status: "待规划（知识资产·决策模型类）"
      - context_name: "大日期判定经验"
        description: "判断临期/大日期风险阈值的经验；当前类型待定，待业务专家二轮验证。"
        type: "规则 / 决策模型"
        storage: "规则知识库"
        volume: "判定规则 < 10 条"
        ai_init: true
        frequency: "随效期规则更新"
        retrieval: "规则引擎匹配"
        status: "待规划（[类型待定·待二轮验证]）"
      - context_name: "复盘指标（时效达成率/缺货缓解率/周转率/入库差异率）"
        description: "月度复盘指标，含时效达成率、缺货缓解率、周转率、入库差异率；阈值触发调参建议。"
        type: "结构化数据 / Excel 底表"
        storage: "复盘底表（Excel，需开发）"
        volume: "月度指标，历史参数值"
        ai_init: false
        frequency: "月度"
        retrieval: "指标批量查询"
        status: "需开发（评级 C）"
      - context_name: "复盘报告模板 + 复盘调参规则"
        description: "复盘报告固定骨架（指标总览→短板分析→调参建议→审批）与调参规则：时效<90% 优化物流/上调水位；缺货缓解<85% 优化预测/促销上浮；周转同比降>10% 下调水位。"
        type: "Prompt Template + 规则"
        storage: "模板文件 + 规则知识库"
        volume: "1 套模板 + 调参规则 < 15 条"
        ai_init: true
        frequency: "月度复核"
        retrieval: "模板引用 + 规则匹配"
        status: "待规划（知识资产·模版范例类/决策模型类）"
