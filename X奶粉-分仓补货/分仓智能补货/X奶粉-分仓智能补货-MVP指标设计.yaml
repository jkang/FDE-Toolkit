title: "X奶粉 · 分仓智能补货 MVP 验证方案"
product_name: "分仓智能补货 Agent"
go_no_go_statement: "当 缺口分级一致率 ≥90% 且 分配量约束满足率 =100% 且 京慧偏离识别召回率 ≥95% 且 缺货缓解率 ≥85% 且 分货方案编制时长 ≤2h 时，允许灰度上线。"
target_metrics:
  # ---------- 业务维度 ----------
  - name: "分货方案人工采纳率"
    dimension: "业务"
    logic: "人工确认后未回退重做的方案数 / 生成方案总数"
    threshold: "≥85%"
    source: "分货工作台埋点 + 方案版本记录"
  - name: "分配量人工修正率"
    dimension: "业务"
    logic: "人工修改过的仓×SKU 行数 / 总分配行数"
    threshold: "≤15%"
    source: "方案工作台编辑留痕"
  - name: "分货方案编制时长"
    dimension: "业务"
    logic: "单轮从底表就绪到方案确认的端到端时长（P50）"
    threshold: "≤2h（As-Is 约 1.5 天/轮 [待客户确认]）"
    source: "工作台操作日志"
  - name: "缺货缓解率"
    dimension: "业务"
    logic: "缺货缓解仓次 / 缺货总仓次"
    threshold: "≥85%"
    source: "库存监控报表"
  - name: "库存周转天数同比降幅"
    dimension: "业务"
    logic: "(本期周转天数 - 去年同期) / 去年同期"
    threshold: "≤10%"
    source: "库存监控报表"
  - name: "时效达成率"
    dimension: "业务"
    logic: "按期到达批次 / 总批次"
    threshold: "≥90%"
    source: "TMS 台账"
  # ---------- 模型维度 ----------
  - name: "缺口分级一致率"
    dimension: "模型"
    logic: "AI 红/黄/蓝分级与专家盲测一致的行数 / 总行数（DOS 分级 rd_01）"
    threshold: "≥90%"
    source: "离线测试集 + 专家盲测"
  - name: "分配量约束满足率"
    dimension: "模型"
    logic: "满足可发量/安全水位/封顶 100% 约束的分配行数 / 总分配行数（rd_02/rd_03）"
    threshold: "=100%（硬约束，不允许突破）"
    source: "约束校验引擎"
  - name: "京慧偏离识别召回率"
    dimension: "模型"
    logic: "被正确标记为偏离京慧建议量的行数 / 实际偏离行数（rd_03 HITL 触发）"
    threshold: "≥95%"
    source: "离线测试集"
  - name: "关键字段识别准确率"
    dimension: "模型"
    logic: "底表 6 项口径（可发量/待检/合格/在途/生产备货率/大日期）识别正确数 / 总数（rext_01）"
    threshold: "≥98%（待检/合格混用漏标率 0）"
    source: "底表口径校验日志"
  - name: "入库差异判定准确率"
    dimension: "模型"
    logic: "差异率/破损率阈值判定正确的批次 / 总批次（rd_05）"
    threshold: "≥98%"
    source: "WMS 验收 + 差异单核对"
  # ---------- 系统维度 ----------
  - name: "API 成功率"
    dimension: "系统"
    logic: "非 5xx 成功响应数 / 总请求数"
    threshold: "≥99.5%"
    source: "APM 监控"
  - name: "分货方案生成延迟 P95"
    dimension: "系统"
    logic: "全仓网×全 SKU 多约束求解的 95 分位响应时间"
    threshold: "≤60s"
    source: "APM / 求解服务日志"
  - name: "口径/Schema 合规率"
    dimension: "系统"
    logic: "补货单与方案字段符合主数据与口径规范的比例"
    threshold: "=100%"
    source: "校验引擎"
  # ---------- 体验维度 ----------
  - name: "HITL 待确认项平均处理时长"
    dimension: "体验"
    logic: "从 HITL 拦截到人工确认的平均耗时"
    threshold: "≤5min"
    source: "工作台交互埋点"
  - name: "计划员任务自助完成率"
    dimension: "体验"
    logic: "未求助人工/未升级的完成任务数 / 总任务数"
    threshold: "≥95%"
    source: "会话埋点 + 升级记录"
  - name: "用户满意度"
    dimension: "体验"
    logic: "试点用户 5 分制评分均值"
    threshold: "≥4.2 / 5"
    source: "试点问卷"
  # ---------- 成本维度（必选） ----------
  - name: "单轮分货处理成本"
    dimension: "成本"
    logic: "单轮分货（全仓网×核心 SKU）LLM + 求解 + 数据拉取的综合成本"
    threshold: "≤¥2.0/轮 [待确认]"
    source: "成本核算 / Token 计量"
monitoring_plan:
  - name: "缺口分级边界冲突率"
    layer: "模型"
    logic: "DOS 落在 7/14/60 边界并触发人工确认的比例"
    range: "≤5%"
    alert: ">15%"
    meaning: "分级阈值口径不稳或数据波动大，需复核 rd_01 口径"
  - name: "约束不可行率"
    layer: "模型"
    logic: "多约束求解无可行解、进入备选/升级的比例"
    range: "≤3%"
    alert: ">10%"
    meaning: "可发量不足或约束过紧，需评估拆分补足或调整周期"
  - name: "关键字段缺失/口径异常率"
    layer: "检索"
    logic: "底表 6 项口径校验标红字段数 / 总字段数"
    range: "≤1%"
    alert: ">5%"
    meaning: "上游数据源口径退化，需调度组复核"
  - name: "Token 消耗 / 单轮"
    layer: "模型"
    logic: "单轮分货 LLM Input+Output Token 合计"
    range: "≤120k"
    alert: ">250k"
    meaning: "上下文注入过多或方案组版冗长，需裁剪 Prompt"
  - name: "错误率 (Error Rate)"
    layer: "系统"
    logic: "API 5xx 错误请求占比"
    range: "<0.1%"
    alert: ">1%"
    meaning: "后端服务崩溃或下游库存/京慧接口限流"
  - name: "库存同步失败率"
    layer: "系统"
    logic: "可发量/DOS 同步失败批次 / 总批次"
    range: "≤0.5%"
    alert: ">2%"
    meaning: "WMS/库存系统写入异常，需重试或通知 IT"
  - name: "HITL 转人工原因分布"
    layer: "业务"
    logic: "京慧偏离/边界冲突/约束不可行/数据降级各占比"
    range: "以京慧偏离为主"
    alert: "单一原因 >50%"
    meaning: "特定规则或数据源失效，定位 rd_01/rd_03/数据接口"
  - name: "分配量修正原因分布"
    layer: "业务"
    logic: "人工修改分配量的原因分类占比"
    range: "促销放量/凑车为主"
    alert: "修正率 >15%"
    meaning: "AI 方案与专家经验偏差大，需回灌调参"
test_set_strategy:
  golden_path: 50
  hard_cases: 30
  edge_cases: 20
