title: "X奶粉事业部 — 推拉结合智能分仓补货计划体系 北极星指标与战略推导"
planning_cycle: "2026 - 2027"
nsm:
  name: "分仓订单满足率（加权有货率）"
  target: "≥ 98%"
  unit: "%"
  definition: "各销售分仓覆盖渠道客户订单中，按品×仓×时段足量、准时、新鲜（在库可售且未临期）满足的订单金额加权占比。在库存周转与商品新鲜度 KPI 达标约束下追求最大化——即'货在正确的仓、正确的时间、以正确的新鲜度满足订单'。"
kpi_pyramid:
  - name: "需求洞察增长"
    type: "增长指标"
    metrics:
      - name: "销售计划预测准确率（品×仓×周）"
        target: "≥ 85%"
        desc: "分仓销售计划与真实动销偏差，替代 Excel 拍脑袋"
      - name: "预测覆盖 SKU 占比（增量/高值品优先）"
        target: "核心 SKU 100%"
        desc: "婴配/成人/羊奶/特配核心品全覆盖预测"
  - name: "分货补货效率"
    type: "效率指标"
    metrics:
      - name: "补货计划生成时效"
        target: "人天→分钟级"
        desc: "Excel 人工 3-5 天 → 系统分钟级生成+人工复核"
      - name: "库存周转天数（分仓口径）"
        target: "下降 15%+"
        desc: "同口径对比，降低库存资金占用"
      - name: "跨仓履约占比"
        target: "显著下降"
        desc: "减少异地仓发货，降低物流成本与履约时长"
  - name: "订单满足质量"
    type: "质量指标"
    metrics:
      - name: "分仓有货率 / 订单满足率"
        target: "≥ 98%"
        desc: "北极星指标，线上电商+线下经销商加权"
      - name: "商品新鲜度（临期库存占比/平均货龄）"
        target: "临期占比 < 3%"
        desc: "FEFO 先进先出，过期损耗持续下降"
  - name: "经营健康"
    type: "健康指标"
    metrics:
      - name: "库存总成本/资金占用下降"
        target: "量化 ROI ≥ 3x"
        desc: "周转提升×资金成本，对齐集团现金流改善诉求"
      - name: "缺货损失额"
        target: "下降 30%+"
        desc: "缺货丢单金额，直接守护 18.3% 婴配粉份额"
strategies:
  - name: "销售计划精细化与需求预测中台"
    priority: 0
    swot_ref: "W1/W2 × O1/O3"
    description: "建设品×仓×周颗粒度的销售预测与计划体系，以历史动销+渠道活动+季节/大促信号驱动，替代人工经验推量；优先覆盖成人奶粉、羊奶粉、特配等增量高值 SKU，为补货提供'拉'的需求输入。"
    actions:
      - "清洗并拉通工厂/分仓/渠道三侧订单与库存历史数据，建立主数据"
      - "上线分仓需求预测模型（统计+ML 混合），周滚动刷新"
      - "建立渠道活动/大促/新品上市事件库，纳入预测特征"
    kpi_ref: "预测准确率 / 预测覆盖 SKU 占比"
  - name: "分仓智能补货引擎（推拉结合）"
    priority: 0
    swot_ref: "S3 × O1 / S1×O2"
    description: "基于预测的'拉'与产能/安全库存的'推'结合，构建多级库存补货优化模型，自动生成各分仓补货计划（数量+时间+来源仓），人工仅做例外复核；从'人工推式分货'升级为'系统推拉结合'。"
    actions:
      - "定义分仓安全库存策略（按 SKU 波动性分层设置服务水平）"
      - "部署多级库存补货优化（工厂/基地仓→销售分仓）算法"
      - "补货计划审批流数字化，保留人工干预与例外管理"
    kpi_ref: "补货计划生成时效 / 分仓有货率 / 库存周转天数"
  - name: "全网库存协同与销售仓横向调拨"
    priority: 1
    swot_ref: "S2 × O2 / W3 × O4"
    description: "建立全网分仓库存可视与供需平衡视图，冷热不均时优先触发分仓间横向调拨而非跨仓履约/加急生产，降低总库存水位与异地发货成本，实现'货在正确的仓'。"
    actions:
      - "上线全网库存可视看板（分仓×SKU×库龄/货龄）"
      - "构建分仓间调拨优化决策（成本/时效/新鲜度约束）"
      - "冷热仓自动平衡规则：慢仓调快仓、临期品前置预警调拨"
    kpi_ref: "跨仓履约占比 / 库存周转天数 / 临期库存占比"
  - name: "商品新鲜度与日期健康度管理"
    priority: 1
    swot_ref: "S4 × T2 / W4 × T5"
    description: "将保质期/货龄约束内嵌补货与调拨规则，FEFO 先进先出、临期预警、临期品自动触发调拨/促销/退货建议，防止旧货积压与过期损耗，维护婴配粉品牌信任。"
    actions:
      - "建立分仓 SKU 货龄台账与 FEFO 出库规则"
      - "临期（如剩余 1/3 保质期）自动预警与处置建议"
      - "把货龄指标纳入分仓/物流考核"
    kpi_ref: "临期库存占比 / 平均货龄 / 过期损耗"
  - name: "主数据治理与跨职能协同机制"
    priority: 2
    swot_ref: "W1/W5 × T4"
    description: "先治理品×仓×渠道主数据与库存/订单数据质量，再上算法，避免'脏数据喂坏模型'；建立生产、物流、销售分仓、渠道计划共享的补货计划中台与统一考核口径（有货率/周转/鲜度三方共担）。"
    actions:
      - "开展主数据盘点与清洗（SKU、仓、渠道、批次/效期）"
      - "建立统一补货计划中台与 RACI 协同流程"
      - "统一跨部门 KPI 口径并纳入事业部考核"
    kpi_ref: "数据一致率 / 跨部门计划达成一致率"
