meta:
  company: "X销售收入确认"
  scenario: "POD收入确认"
  businessDomain: "金融/财务"
  productName: "销售POD收入确认工作台"
  mode: "Modern SaaS 工作台"
  brandSource: "domain 推断"

brandProfile:
  primaryTone: "信任蓝 / 权威深蓝"
  primaryColor: "#1e3a5f"
  userGroup: "内部员工"
  seriousness: "合规严苛"
  maturity: "专业细分"

designLanguage:
  colors:
    primary: "#1e3a5f"
    primaryDark: "#12263f"
    primaryLight: "#6b8fb5"
    accent: "#c9a227"
    success: "#16a34a"
    warning: "#d97706"
    danger: "#dc2626"
    info: "#0ea5e9"
    neutral:
      text: "#1f2937"
      textSecondary: "#595959"
      border: "#e2e8f0"
      bg: "#ffffff"
      bgAlt: "#f5f7fa"
    gradient:
      from: "#12263f"
      to: "#1e3a5f"
  typography:
    fontFamily: "MiSans, Inter, -apple-system, 'Microsoft YaHei', sans-serif"
    h1: { size: 26, weight: "600", lineHeight: 1.2, spacing: "-0.02em" }
    h2: { size: 20, weight: "600", lineHeight: 1.3, spacing: "0" }
    h3: { size: 16, weight: "500", lineHeight: 1.4, spacing: "0" }
    body: { size: 14, weight: "400", lineHeight: 1.55, spacing: "0" }
    label: { size: 12, weight: "600", lineHeight: 1.2, spacing: "0.05em", uppercase: true }
    caption: { size: 12, weight: "300", lineHeight: 1.4, spacing: "0" }
  spacing:
    scale: [4, 8, 12, 16, 24, 32, 48]
    contentMaxWidth: 1440
    cardPadding: 20
    sectionGap: 20
    elementGap: 12
  radius:
    sm: 4
    md: 8
    lg: 12
    pill: 999
  shadow:
    card: "0 1px 3px rgba(18, 38, 63, 0.08), 0 1px 2px rgba(18, 38, 63, 0.04)"
    raised: "0 4px 16px rgba(18, 38, 63, 0.12)"
  border:
    color: "#e2e8f0"
    width: 1
  components:
    card: { radius: 8, shadow: "card", background: "#ffffff", border: true }
    button: { radius: 6, transition: "0.15s ease-out", hoverOpacity: 0.85 }
    table: { density: "compact", rowHover: true, headerBg: "#f5f7fa" }
    input: { radius: 6, focusOutline: "#6b8fb5" }
  states:
    hoverTime: "0.15s ease-out"
    focusOutline: "#6b8fb5"
    loadingType: "skeleton"
    emptyStyle: "icon + hint + cta"
  layout:
    mode: "side"
    siderWidth: 216
    headerHeight: 56
  motion:
    transition: "0.15s ease-out"
    enableSpring: false
  responsive:
    breakpoints: [375, 768, 1024, 1440]
  diffChecklist:
    - "权威深蓝主色已注入 ConfigProvider + CSS 变量（#1e3a5f / #12263f）"
    - "金色强调色用于关键指标与 POD 确认等对外动作，克制不滥用"
    - "字体系统覆盖全局 + 标题层级（26/20/16/14）"
    - "间距统一为 8pt 体系，卡片内距 20、区块间距 20"
    - "圆角（4/8/12）与阴影按金融权威气质定制（非默认 antd）"
    - "11 类元素按 componentSpecs 升级"
    - "六态（hover/focus/empty/loading/error/disabled）完备"
    - "响应式断点 375/768/1024/1440 生效"
    - "cursor-pointer 已加到所有可交互区"
    - "状态色语义一致：POD 已确认=成功、条件缺口=警告、过账失败=危险"

componentSpecs:
  - { element: "steps", v2: { style: "流程进度条 · 金色 accent 当前步" } }
  - { element: "uploadCard", v2: { style: "拖拽区 focus ring · 采集刷新" } }
  - { element: "aiResultCard", v2: { style: "AI 洞察面板 · 带来源与置信度" } }
  - { element: "table", v2: { style: "斑马行 + 表头吸顶 + 状态徽章" } }
  - { element: "statRow", v2: { style: "指标英雄区 · 数字强调" } }
  - { element: "buttonRow", v2: { style: "主按钮实心 · hover 微抬升" } }
  - { element: "alert", v2: { style: "带图标描边 · POD 闸门警示" } }
  - { element: "timeline", v2: { style: "过账状态追踪器" } }
  - { element: "chatPanel", v2: { style: "AI 助手 · 建议 chips" } }
  - { element: "formCard", v2: { style: "字段分组 · 标签上置" } }
  - { element: "tagRow", v2: { style: "状态胶囊 chips" } }

diffChecklist:
  - "自定义主色是否已注入 ConfigProvider + CSS 变量"
  - "字体系统是否覆盖全局 + 标题层级"
  - "间距是否统一为 8pt 体系"
  - "圆角/阴影是否按产品气质定制（非默认 antd）"
  - "11 类元素是否按 componentSpecs 升级"
  - "六态（hover/focus/empty/loading/error/disabled）是否完备"
  - "响应式断点 375/768/1024/1440 是否生效"
  - "cursor-pointer 是否加到所有可交互区"
