title: "X销售收入确认 · 销售POD收入确认 To-be 旅程设计"
meta:
  mode: "to-be"
  source: "AI画布: X销售收入确认/POD收入确认/X销售收入确认-POD收入确认-AI画布.yaml"
  scenarioName: "销售POD收入确认"
  productType: "内嵌企业门户的销售POD收入确认工作台（六个一级页面 + 资料预览弹窗）+ 首页驾驶舱待办"
personas:
  - id: "cs_wang"
    name: "王静"
    role: "CS（销售支持）"
    department: "销售/客户服务"
    background: "负责客户对账与 POD 确认，日均处理数十张交货单，日常在 SAP、邮件、对账单 Excel 之间切换"
    goals:
      - "快速完成对账并清理差异，尽快推进 POD 确认"
      - "避免因资料不全或差异未清导致收入确认延误"
    painPoints:
      - "物流发运单号与签收资料散落在邮件与公共文件夹，靠人工翻找"
      - "客户反馈与 SAP 靠人工逐行比对，差异口径不统一、易错漏"
      - "POD 确认条件分散在多个系统，靠人工判断是否齐备"
    dataProfile:
      typicalValues:
        - "待处理交货单：按客户/周期一次 20~50 张"
        - "对账单：客户反馈文件含数量/金额差异，容差外差异需处理"
      frequency: "高频"
      commonErrors:
        - "差异原因未说明即标记完成"
        - "签收资料低置信度未复核即使用"
  - id: "logistics_li"
    name: "李强"
    role: "物流人员"
    department: "物流/仓储"
    background: "负责物流发运关联与签收资料补充，日常处理仓库与承运商邮件"
    goals:
      - "快速处理关联异常，保证签收凭据齐全"
      - "物流发运单号可追溯、不破坏审计链"
    painPoints:
      - "邮件格式不统一，发运单号靠人工抄录"
      - "关联异常需反复与仓库/承运商沟通补邮件"
    dataProfile:
      typicalValues:
        - "每日邮件：仓库/承运商发运与签收邮件数十封"
        - "关联异常：低置信度或缺失发运单号条目"
      frequency: "中高频"
      commonErrors:
        - "补件未留痕导致审计链断裂"
  - id: "finance_chen"
    name: "陈敏"
    role: "财务"
    department: "财务"
    background: "负责发票过账、打印与归档，关注过账准确性与凭证完整"
    goals:
      - "快速完成过账并回写凭证"
      - "过账失败可追溯、可人工确认后重试"
    painPoints:
      - "过账前需反复确认 POD 与预制发票状态"
      - "归档缺件、资料分散"
    dataProfile:
      typicalValues:
        - "待过账记录：POD 已确认且预制发票已生成"
        - "过账失败返回信息需人工判断后重试"
      frequency: "高频"
      commonErrors:
        - "对过账失败自动重试导致重复过账"
handoff:
  paths:
    - "主路径：进入工作台 → 采集与关联确认 → 对账与差异处理 → POD 匹配确认 → 过账归档"
    - "分支：物流关联异常 → 补邮件/补充说明留痕后重新关联"
    - "异常：POD 确认条件缺口 → 阻断并生成待办，补齐后重新校验"
    - "边界：识别低置信度 → 标黄转人工复核，不阻塞其它单据"
scenarios:
  - id: "s1"
    name: "标准交货单的 POD 确认"
    personaId: "cs_wang"
    trigger: "CS 进入工作台，看到一批已完成对账、条件齐备的交货单待 POD 确认"
    businessData:
      - "待处理交货单（客户/周期）"
      - "横向匹配五要素状态（交货单/物流关联/签收/对账/借贷项）"
    goal: "5 分钟内完成多张交货单的 POD 匹配确认并自动触发预制发票"
  - id: "s2"
    name: "物流关联异常与签收补件"
    personaId: "logistics_li"
    trigger: "邮件识别发运单号缺失或冲突，交货单长期未关联或未签收"
    businessData:
      - "关联异常清单（低置信度/冲突/缺失）"
      - "公共邮箱邮件原文与签收资料"
    goal: "通过补邮件/补充说明修正关联并留痕，恢复审计链"
  - id: "s3"
    name: "发票过账与归档"
    personaId: "finance_chen"
    trigger: "POD 已确认、预制发票已生成，进入财务待过账清单"
    businessData:
      - "待过账清单（预制发票号/交货单/金额）"
      - "SAP 过账返回凭证信息"
    goal: "完成过账、回写凭证并打印归档，闭环收入确认"
stages:
  - name: "进入工作台"
    actions:
      - name: "查看首页驾驶舱与待办"
        owner: "CS"
        touchpoints: "工作台首页 · 驾驶舱与待办清单"
        thoughts:
          - "希望一眼看到哪些交货单卡在哪一步、哪些已超期"
        userInputs:
          - type: "系统自动带入"
            name: "全局看板与待办"
            format: "页面实时数据"
            example: "物流分支 3 节点 / 对账分支 2 节点 / 待 POD 确认 18 张 / 超期异常 4 类"
            content: "流程节点数量、待办清单、超期异常"
        aiInteraction:
          aiAction: "按角色与数据范围过滤待办，计算并展示四类超期异常"
          suggestions:
            - "查看我的待办"
            - "只看超期异常"
            - "查看某张交货单全链路"
        visibleData:
          - "驾驶舱：物流三分支 + 对账两分支 + POD 匹配 + 发票过账数量"
          - "超期异常：已发货未取发运单 3 单 / 已取得未签收 5 单 / 已发货未创建对账单 2 单 / 具备条件未 POD 确认 4 单"
        designNotes:
          - "主看板全局公开、待办按角色过滤，管理层实时可见进度与阻塞"
  - name: "采集与关联确认"
    actions:
      - name: "确认物流发运关联与签收资料"
        owner: "物流人员 / CS"
        touchpoints: "数据采集中心 · 识别结果卡"
        thoughts:
          - "希望系统自动识别发运单号，我只需处理异常"
        userInputs:
          - type: "系统自动拉取"
            name: "公共邮箱邮件 + 公共文件夹签收/POD"
            format: "邮件/文件"
            example: "邮件主题含 DN 8000123456，附件签收单 PDF"
            content: "交货单号、承运商、发运单号、签收人/时间/结果"
        aiInteraction:
          aiAction: "识别邮件关键字段建立交货单-发运单关联，OCR 识别签收/POD 字段并返回置信度"
          suggestions:
            - "查看邮件原文出处"
            - "复核低置信度条目"
            - "补邮件/补充说明"
        visibleData:
          - "识别结果：3 张交货单已关联发运单号，1 张低置信度标黄"
          - "签收资料：签收人/时间/结果 + 置信度（低置信度待复核）"
        designNotes:
          - "发运单号以邮件原文为依据、不开放手工改写；低置信度转人工复核"
  - name: "对账与差异处理"
    actions:
      - name: "创建对账单并处理差异"
        owner: "CS"
        touchpoints: "对账单工作台 · 明细与差异卡"
        thoughts:
          - "希望客户反馈一上传就自动比对出差异和原因"
        userInputs:
          - type: "文件上传"
            name: "客户反馈对账文件"
            format: "Excel/PDF"
            example: "客户反馈：交货单 8000123456 数量少 1 箱"
            content: "客户确认数量、金额、差异说明"
        aiInteraction:
          aiAction: "按客户一致性/交货单存在性/数量金额一致性/重复缺失/容差规则自动比对并归因，建议借贷项"
          suggestions:
            - "查看差异归因"
            - "生成借贷项"
            - "标记差异已处理"
        visibleData:
          - "差异清单：2 条差异（1 条容差内、1 条超容差标红）"
          - "借贷项建议：借项 ¥1,200（超容差差异）"
        designNotes:
          - "差异逐条归因并标注出处；超容差差异转人工裁决；借贷项未完成不开放 POD 确认"
  - name: "POD 匹配与确认"
    actions:
      - name: "一屏匹配并一键 POD 确认"
        owner: "CS"
        touchpoints: "POD 匹配工作台 · 横向匹配表"
        thoughts:
          - "希望五个条件是否齐备一屏看清，缺什么直接告诉我"
        userInputs:
          - type: "选择确认"
            name: "POD 匹配结论"
            format: "页面内确认"
            example: "交货单 8000123456：五要素齐备，可确认"
            content: "交货单/物流关联/签收/对账/借贷项状态 + 匹配结论"
        aiInteraction:
          aiAction: "汇总五要素状态、校验 POD 确认条件并给出可解释结论与缺口，确认后自动触发 SAP 预制发票"
          suggestions:
            - "查看条件缺口"
            - "一键 POD 确认"
            - "升级经理审批"
        visibleData:
          - "横向匹配表：五要素状态徽章（4 绿 1 黄）"
          - "确认结果：POD 已确认，POD 日志已生成，预制发票号已生成"
        designNotes:
          - "POD 确认是对外确认收入的强制人工闸门；条件缺口阻断并生成待办"
  - name: "过账与归档"
    actions:
      - name: "执行过账并打印归档"
        owner: "财务"
        touchpoints: "发票过账页面 · 待过账清单 / 资料预览弹窗"
        thoughts:
          - "希望过账失败能看清原因，人工确认后再重试"
        userInputs:
          - type: "手工触发"
            name: "预制发票过账"
            format: "页面操作"
            example: "预制发票 PI-2026-0901-001 过账"
            content: "预制发票号、交货单、金额"
        aiInteraction:
          aiAction: "校验权限后调用 SAP 过账，回写凭证号/会计期间/过账状态；失败记录返回信息并提示人工确认后重试"
          suggestions:
            - "查看过账凭证"
            - "打印并归档"
            - "失败后人工重试"
        visibleData:
          - "过账结果：凭证号 1000234567，会计期间 2026-09，状态已过账"
          - "归档记录：归档人/时间/资料清单（交货单/签收/POD/对账单/POD日志/预制发票/凭证）"
        designNotes:
          - "过账失败不自动无限重试，须财务确认后手工重试；缺件不得归档"
