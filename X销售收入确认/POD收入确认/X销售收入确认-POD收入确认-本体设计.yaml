title: X销售收入确认-销售POD收入确认-Agent本体设计
domain: 销售 / 收入确认
scenario_description: "从 SAP 交货单采集、物流发运关联与签收资料识别，到对账差异处理、POD 确认、预制发票与财务过账的端到端收入确认场景"
target_agent_role: 销售POD收入确认助手（Sales POD Revenue Recognition Assistant）

entities:
  - id: delivery_order
    name: 交货单（Delivery Order / DN）
    type: core
    description: "SAP 交货单，是收入确认的业务主线与 POD 确认的颗粒度锚点"
    attributes:
      - name: delivery_no
        type: string
        description: SAP 交货单号 / DN
      - name: customer_code
        type: string
        description: 客户编码
      - name: amount
        type: number
        description: 交货金额
      - name: delivery_status
        type: enum
        values: [created, delivered, cancelled]
        description: 交货状态
      - name: reconciliation_status
        type: enum
        values: [not_created, created, downloaded, feedback_uploaded, reconciled, difference]
        description: 对账状态
      - name: pod_status
        type: enum
        values: [not_confirmed, pod_confirmed, confirm_failed]
        description: POD 状态
    key_distinctions:
      - "交货单已出库 ≠ 已取得有效签收凭据"
      - "交货单存在 ≠ 已完成对账或已 POD 确认"
      - "一张交货单可有多个 POD 资料，但只有 1 个最终 POD 确认"

  - id: shipment_relation
    name: 物流发运关联（Shipment Relation）
    type: event
    description: "交货单与物流发运单号的关联记录，来源于公共邮箱邮件的识别结果"
    attributes:
      - name: delivery_no
        type: string
        description: 交货单号
      - name: carrier_name
        type: string
        description: 物流公司/承运商
      - name: shipment_no
        type: string
        description: 物流发运单号
      - name: source_type
        type: enum
        values: [mail, manual_note]
        description: 来源（公共邮箱 / 手工补充说明）
      - name: is_manual_modified
        type: boolean
        description: 是否手工修改，原则上为否
    key_distinctions:
      - "物流发运单号以邮件原文为唯一依据，不开放直接手工改写"
      - "已关联 ≠ 已签收"

  - id: pod_document
    name: POD 资料（POD Document）
    type: event
    description: "物流签收单、POD 文件或客户自提邮件，是收入确认所需的签收凭据"
    attributes:
      - name: delivery_no
        type: string
        description: 交货单号
      - name: document_type
        type: enum
        values: [sign_sheet, pod_file, self_pickup_mail]
        description: 资料类型
      - name: sign_status
        type: enum
        values: [not_signed, pending, signed, self_pickup_confirmed, exception]
        description: 签收状态
      - name: sign_time
        type: datetime
        description: 签收时间
      - name: confidence
        type: number
        description: 识别置信度
    key_distinctions:
      - "识别成功 ≠ 签收有效，低置信度需人工复核"
      - "客户自提邮件确认视同物流签收，须归档邮件作为审计依据"

  - id: reconciliation_statement
    name: 对账单（Reconciliation Statement）
    type: reference
    description: "按客户与周期汇总交货单、交客户确认的核对单据"
    attributes:
      - name: statement_no
        type: string
        description: 对账单号
      - name: period_from
        type: datetime
        description: 对账周期开始
      - name: feedback_status
        type: enum
        values: [not_sent, sent, feedback_received]
        description: 客户反馈状态
      - name: difference_status
        type: enum
        values: [none, pending, resolved]
        description: 差异状态
    key_distinctions:
      - "对账单已下载 ≠ 客户已确认"
      - "存在差异未清时不得标记对账完成"

  - id: reconciliation_line
    name: 对账单明细（Reconciliation Line）
    type: reference
    description: "对账单内逐交货单的数量与金额明细，是差异比对的载体"
    attributes:
      - name: delivery_no
        type: string
        description: 交货单号
      - name: sap_quantity
        type: number
        description: SAP 数量
      - name: customer_quantity
        type: number
        description: 客户确认数量
      - name: difference_type
        type: string
        description: 差异类型
      - name: line_status
        type: enum
        values: [matched, difference, resolved]
        description: 明细状态
    key_distinctions:
      - "数量一致 ≠ 金额一致，需分别比对"
      - "差异归因结论必须逐条对应交货单"

  - id: credit_debit_item
    name: 借贷项（Credit/Debit Item）
    type: event
    description: "对账差异处理后生成的借项或贷项调整"
    attributes:
      - name: item_type
        type: enum
        values: [credit, debit]
        description: 借项或贷项
      - name: amount
        type: number
        description: 调整金额
      - name: posting_status
        type: enum
        values: [not_applicable, to_create, processing, posted, failed]
        description: 借贷项过账状态
    key_distinctions:
      - "借贷项未完成过账前不得开放 POD 确认"
      - "借贷项可由系统创建或仅记录状态，取决于确认口径"

  - id: pod_confirmation
    name: POD 确认（POD Confirmation）
    type: core
    description: "以交货单/DN 为颗粒度的收入确认放行记录，是收入确认的关键闸门"
    attributes:
      - name: delivery_no
        type: string
        description: 交货单号
      - name: confirmation_status
        type: enum
        values: [not_confirmed, pod_confirmed, confirm_failed]
        description: POD 确认状态
      - name: confirmation_time
        type: datetime
        description: 确认时间
      - name: confirmed_by
        type: string
        description: 确认人
      - name: prebill_no
        type: string
        description: 预制发票号
    key_distinctions:
      - "POD 确认是对外确认收入的强制人工闸门，不得全自动放行"
      - "条件不齐备时系统必须阻断确认"

  - id: pre_invoice
    name: 预制发票（Pre-Invoice）
    type: event
    description: "POD 确认后由 SAP 自动生成的待过账发票"
    attributes:
      - name: prebill_no
        type: string
        description: 预制发票号
      - name: prebill_status
        type: enum
        values: [not_created, created, failed]
        description: 预制发票状态
    key_distinctions:
      - "预制发票由 POD 确认自动触发，财务页面不提供预制按钮"

  - id: accounting_voucher
    name: 过账凭证（Accounting Voucher）
    type: event
    description: "财务过账后 SAP 返回的会计凭证信息"
    attributes:
      - name: voucher_no
        type: string
        description: 会计凭证号
      - name: posting_status
        type: enum
        values: [not_posted, posted, failed]
        description: 过账状态
      - name: fiscal_period
        type: string
        description: 会计期间
    key_distinctions:
      - "过账失败不得自动无限重试，须财务确认后手工重试"

  - id: attachment
    name: 文件资料（Attachment）
    type: reference
    description: "原始资料、识别结果、补充附件、归档文件与预览地址"
    attributes:
      - name: file_id
        type: string
        description: 文件 ID
      - name: biz_object_type
        type: string
        description: 业务对象类型
      - name: preview_url
        type: string
        description: 预览地址
      - name: source_type
        type: string
        description: 来源
    key_distinctions:
      - "原始资料（邮件/签收单）与系统生成资料（POD日志/凭证）打印与归档规则不同"

relationships:
  - from: delivery_order
    to: shipment_relation
    label: 关联
    cardinality: "1:N"
    description: "一张交货单可关联物流发运单（含异常补录）"
  - from: delivery_order
    to: pod_document
    label: 拥有
    cardinality: "1:N"
    description: "一张交货单可有多个签收/POD 资料"
  - from: delivery_order
    to: reconciliation_line
    label: 汇总
    cardinality: "1:N"
    description: "交货单明细汇总进对账单明细"
  - from: reconciliation_statement
    to: reconciliation_line
    label: 包含
    cardinality: "1:N"
    description: "一张对账单含多条交货单明细"
  - from: reconciliation_line
    to: credit_debit_item
    label: 触发
    cardinality: "1:N"
    description: "差异明细触发借贷项生成或关联"
  - from: delivery_order
    to: pod_confirmation
    label: 确认
    cardinality: "1:1"
    description: "以交货单/DN 为颗粒度产生唯一 POD 确认"
  - from: pod_confirmation
    to: pre_invoice
    label: 触发
    cardinality: "1:1"
    description: "POD 确认后自动生成预制发票"
  - from: pre_invoice
    to: accounting_voucher
    label: 过账
    cardinality: "1:1"
    description: "预制发票过账后生成会计凭证"
  - from: attachment
    to: pod_document
    label: 归档
    cardinality: "N:1"
    description: "文件资料挂载到 POD 资料等业务对象"

action_boundaries:
  - id: ab_pod_confirm
    situation: 交货单具备 POD 确认条件核验
    situation_description: "CS 在 POD 匹配页面准备对一张交货单执行 POD 确认，需先确认五要素是否齐备"
    required_evidence:
      - source: "交货单表"
        checks: "交货单已同步且未取消"
      - source: "物流发运关联表"
        checks: "已建立交货单-发运单关联"
      - source: "POD资料表"
        checks: "存在有效签收资料或客户自提邮件确认，且非低置信度待复核"
      - source: "对账单表"
        checks: "对账状态为对账完成"
      - source: "借贷项表"
        checks: "差异借贷项已过账或不适用"
    valid_actions:
      - "汇总并展示五要素状态与匹配结论"
      - "校验 POD 确认条件并列出缺口"
      - "条件齐备时由 CS 一键 POD 确认并生成 POD 日志"
      - "条件不足时生成待办并引导补件/补对账"
    invalid_actions:
      - action: "在签收资料缺失或低置信度未复核时执行 POD 确认"
        reason: "签收凭据是收入确认的审计依据，缺失即确认会造成审计风险"
      - action: "在对账差异或借贷项未完成时放行 POD 确认"
        reason: "差异未清会导致收入金额不准确"
      - action: "绕过人工闸门由系统自动确认收入"
        reason: "对外确认收入必须保留人工放行与责任留痕"
    exception_triggers:
      - condition: "五要素存在缺口"
        action: "阻断确认，生成缺口待办并提示补件路径"
      - condition: "特殊或异常场景需放行"
        action: "升级 CS 经理终审"

  - id: ab_email_relation
    situation: 物流发运关联的修正与留痕
    situation_description: "邮件识别的发运单号与交货单不匹配或存在歧义时，物流人员需要处理关联异常"
    required_evidence:
      - source: "公共邮箱邮件原文"
        checks: "邮件中的交货单号、承运商、发运单号"
      - source: "识别结果与置信度"
        checks: "识别字段与置信度"
    valid_actions:
      - "通过补邮件或补充说明修正关联并留痕"
      - "对冲突邮件取最新有效邮件并记录依据"
    invalid_actions:
      - action: "直接手工改写物流发运单号"
        reason: "破坏邮件原文审计链，异常应通过补邮件/补充说明处理"
    exception_triggers:
      - condition: "识别冲突或低置信度无法自动关联"
        action: "拉人复核并要求补邮件留痕"

  - id: ab_reconciliation_diff
    situation: 对账差异处理
    situation_description: "客户反馈上传后差异分析产生差异，需 CS 确认差异原因并处理借贷项"
    required_evidence:
      - source: "客户反馈对账文件"
        checks: "客户确认的数量与金额"
      - source: "对账差异分析结果"
        checks: "差异类型、金额与归因"
    valid_actions:
      - "确认差异原因并生成/关联借贷项"
      - "跟踪借贷项过账状态直至完成"
      - "差异无法收敛时升级 CS 经理/财务"
    invalid_actions:
      - action: "差异未说明原因即标记对账完成"
        reason: "未清差异会阻塞 POD 确认并造成收入金额错误"
      - action: "借贷项未过账即开放 POD 确认"
        reason: "借贷项状态是 POD 确认的硬前置条件"
    exception_triggers:
      - condition: "差异超出容差或口径冲突"
        action: "拉人裁决；无法收敛升级经理/财务"

  - id: ab_posting
    situation: 财务发票过账
    situation_description: "财务在发票过账页面选择已预制发票执行过账并回写凭证"
    required_evidence:
      - source: "POD确认表"
        checks: "POD 已确认"
      - source: "预制发票表"
        checks: "预制发票已生成"
      - source: "权限服务"
        checks: "用户具备财务过账权限"
    valid_actions:
      - "执行过账并回写凭证号、会计期间与过账状态"
      - "过账失败记录 SAP 返回信息，财务确认后手工重试"
    invalid_actions:
      - action: "在 POD 未确认或预制发票未生成时执行过账"
        reason: "前置条件不满足会导致过账失败或数据不一致"
      - action: "对过账失败进行无限制自动重试"
        reason: "高风险财务动作需人工确认，避免重复过账"
    exception_triggers:
      - condition: "SAP 过账失败"
        action: "记录返回信息，转财务人工确认后重试"

workstreams:
  - id: ws_collection
    name: 资料采集与物流关联
    description: "从 SAP 交货单同步到公共邮箱/文件夹采集、物流发运关联与签收资料识别的完整执行流"
    anchor_objects:
      - delivery_order
      - shipment_relation
      - pod_document
    states:
      - id: c_delivery_synced
        name: 交货单已同步
        description: "SAP 交货单已进入工作台，等待物流关联与签收资料"
        transitions:
          - to_state: c_relation_built
            trigger_action: 识别邮件并建立物流发运关联
            required_evidence: "邮件识别出发运单号并成功关联交货单"
            type: normal
          - to_state: c_relation_exception
            trigger_action: 关联异常处理
            required_evidence: "识别冲突、低置信度或邮件缺失"
            type: exception
      - id: c_relation_built
        name: 物流已关联
        description: "已建立交货单-发运单关联，等待签收/POD 资料"
        transitions:
          - to_state: c_signed
            trigger_action: 识别签收/POD 资料或客户自提确认
            required_evidence: "存在有效签收资料或客户自提邮件确认"
            type: normal
      - id: c_relation_exception
        name: 关联异常
        description: "关联存在冲突或缺失，需物流补邮件/补充说明"
        transitions:
          - to_state: c_relation_built
            trigger_action: 补邮件或补充说明后重新关联
            required_evidence: "补充邮件/说明留痕且关联成功"
            type: recovery
      - id: c_signed
        name: 签收有效
        description: "已取得有效签收凭据，资料采集完成，可进入对账"
        transitions: []
    guardrails:
      - "物流发运单号以邮件原文为依据，不开放手工直接改写"
      - "低置信度识别结果未人工复核前，不得视为有效签收"
      - "客户自提必须保留邮件作为审计依据"
    dependency_mapping:
      - workstream: ws_reconciliation
        condition: "交货单达到 c_signed 状态"
        impact: "对账流程可继续推进"

  - id: ws_reconciliation
    name: 对账与差异处理
    description: "从创建对账单、客户确认到差异分析与借贷项处理的执行流"
    anchor_objects:
      - reconciliation_statement
      - reconciliation_line
      - credit_debit_item
    states:
      - id: r_created
        name: 对账单已创建
        description: "已按客户与周期创建对账单，等待下载交客户确认"
        transitions:
          - to_state: r_feedback
            trigger_action: 下载对账单并上传客户反馈
            required_evidence: "客户反馈对账文件已上传"
            type: normal
      - id: r_feedback
        name: 客户反馈已上传
        description: "客户反馈已上传，系统执行差异分析"
        transitions:
          - to_state: r_reconciled
            trigger_action: 差异分析
            required_evidence: "差异为零或在容差内"
            type: normal
          - to_state: r_difference
            trigger_action: 差异分析发现差异
            required_evidence: "存在超出容差的差异"
            type: exception
      - id: r_difference
        name: 对账差异
        description: "存在差异，需生成/关联借贷项并跟踪过账"
        transitions:
          - to_state: r_reconciled
            trigger_action: 处理借贷项并完成过账
            required_evidence: "借贷项状态为已过账或不适用"
            type: recovery
      - id: r_reconciled
        name: 对账完成
        description: "对账已完成，开放 POD 确认条件"
        transitions: []
    guardrails:
      - "差异未清或借贷项未完成前不得标记对账完成"
      - "对账单下载 ≠ 客户已确认，须有反馈文件"
    dependency_mapping:
      - workstream: ws_pod_confirm
        condition: "交货单达到 r_reconciled 状态"
        impact: "POD 确认的对账前置条件满足"

  - id: ws_pod_confirm
    name: POD 确认与预制发票
    description: "从横向匹配、条件校验到人工 POD 确认、自动生成预制发票的执行流"
    anchor_objects:
      - pod_confirmation
      - pre_invoice
      - delivery_order
    states:
      - id: p_ready
        name: 待 POD 处理
        description: "交货单已具备部分条件，等待横向匹配与条件校验"
        transitions:
          - to_state: p_conditions_met
            trigger_action: 校验 POD 确认条件
            required_evidence: "五要素全部满足"
            type: normal
          - to_state: p_blocked
            trigger_action: 校验发现缺口
            required_evidence: "存在条件缺口"
            type: exception
      - id: p_conditions_met
        name: 具备确认条件
        description: "五要素齐备，等待 CS 一键 POD 确认"
        transitions:
          - to_state: p_confirmed
            trigger_action: CS 一键 POD 确认
            required_evidence: "CS 点击确认且具备权限"
            type: normal
      - id: p_blocked
        name: 条件缺口
        description: "存在缺口，需补件/补对账/处理借贷项"
        transitions:
          - to_state: p_ready
            trigger_action: 缺口补齐后重新校验
            required_evidence: "缺口已补齐"
            type: recovery
      - id: p_confirmed
        name: POD 已确认
        description: "POD 已确认并生成 POD 日志，自动触发预制发票"
        transitions:
          - to_state: p_prebill_created
            trigger_action: 自动生成 SAP 预制发票
            required_evidence: "SAP 返回预制发票号"
            type: normal
      - id: p_prebill_created
        name: 预制发票已生成
        description: "预制发票已生成，等待财务过账"
        transitions: []
    guardrails:
      - "POD 确认是对外确认收入的强制人工闸门"
      - "五要素任一不满足必须阻断确认"
      - "预制发票由 POD 确认自动触发，财务不提供预制按钮"
    dependency_mapping:
      - workstream: ws_posting
        condition: "交货单达到 p_prebill_created 状态"
        impact: "财务过账流程可开始"

  - id: ws_posting
    name: 过账与归档
    description: "从财务过账、凭证回写到打印归档与综合查询的执行流"
    anchor_objects:
      - pre_invoice
      - accounting_voucher
      - attachment
    states:
      - id: v_to_post
        name: 待过账
        description: "预制发票已生成，等待财务过账"
        transitions:
          - to_state: v_posted
            trigger_action: 执行发票过账
            required_evidence: "SAP 返回凭证号与过账状态"
            type: normal
          - to_state: v_post_failed
            trigger_action: 过账失败
            required_evidence: "SAP 返回失败信息"
            type: exception
      - id: v_post_failed
        name: 过账失败
        description: "过账失败，需财务确认后手工重试"
        transitions:
          - to_state: v_posted
            trigger_action: 人工确认后重试
            required_evidence: "财务确认并重试成功"
            type: recovery
      - id: v_posted
        name: 已过账
        description: "已过账并回写凭证，进入打印归档"
        transitions:
          - to_state: v_archived
            trigger_action: 打印并归档
            required_evidence: "资料齐全并记录归档人/时间/清单"
            type: normal
      - id: v_archived
        name: 已归档
        description: "资料已归档，综合查询可见全链路状态"
        transitions: []
    guardrails:
      - "过账失败不得无限制自动重试，须财务确认后手工重试"
      - "缺件不得标记归档完成"
    dependency_mapping:
      - workstream: ws_pod_confirm
        condition: "过账完成并回写凭证"
        impact: "综合查询与驾驶舱状态更新，收入确认闭环"
