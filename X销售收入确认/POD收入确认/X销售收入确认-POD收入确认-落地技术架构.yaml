meta:
  title: "销售POD收入确认 · 落地技术架构方案"
  scenario: "销售POD收入确认"
  company: "X销售收入确认"
  route: "Autonomous Planner"
  routeReason: "用户入口开放（驾驶舱 / 采集 / 对账 / POD / 过账多入口），路径需按交货单状态运行时规划；5 个 Skill 职责稳定但调用路径由上下文与单据状态决定。"
  patternSummary: "1 编排 Agent + 5 Skill + 1 本体"
  date: "2026-09-10"

agent:
  name: "编排 Agent · Autonomous Planner"
  role: "意图识别 · 规划 · 调度 Skill · 发起 HITL · 异常兜底"
  loop: "Plan → Act → Observe"
  memory: ["任务级上下文", "交货单全链路状态", "角色 / 数据范围"]
  note: "不直接算数，只做规划与调度"

routing:
  - { intent: "采集 / 物流关联", skill: "skill_collect" }
  - { intent: "对账 / 差异", skill: "skill_reconcile" }
  - { intent: "POD 确认", skill: "skill_pod" }
  - { intent: "过账 / 归档", skill: "skill_posting" }
  - { intent: "看板 / 预警", skill: "skill_monitor" }

skills:
  - id: "skill_collect"
    name: "Skill ① 资料采集与物流关联"
    type: "skill"
    trigger: "定时 / 手工刷新采集（交货单批次驱动）"
    pattern: "pipeline + human-in-the-loop"
    whyNotSubagent: "步骤固定、共享上下文、无独立规划，I/O 清晰可独立测试 → 判 Skill"
    handoff: "→ 采集完成（签收有效）进入 Skill ② 对账链"
    nodes:
      - { id: "c0", label: "交货单 / 邮件 / 文件夹输入", type: "op" }
      - { id: "c1", label: "同步 SAP 交货单", note: "MCP · SAP · 读本体 W", type: "mcp" }
      - { id: "c2", label: "邮件关键字段抽取", note: "小模型", type: "small" }
      - { id: "c3", label: "建立交货单-发运单关联", note: "写本体 W", type: "onto" }
      - { id: "c4", label: "签收 / POD 识别", note: "小模型 · OCR", type: "small" }
      - { id: "c5", label: "置信度判定", note: "Evaluator", type: "eval" }
      - { id: "c6", label: "低置信度人工复核", note: "HITL", type: "hitl" }
      - { id: "c7", label: "签收有效性确认", note: "读本体 R", type: "onto" }
      - { id: "c8", label: "采集完成", type: "out" }
    edges:
      - { from: "c0", to: "c1", style: "solid" }
      - { from: "c1", to: "c2", style: "solid" }
      - { from: "c2", to: "c3", style: "solid" }
      - { from: "c0", to: "c4", style: "solid" }
      - { from: "c4", to: "c5", style: "solid" }
      - { from: "c5", to: "c7", label: "高", style: "solid" }
      - { from: "c5", to: "c6", label: "低", style: "dashed" }
      - { from: "c6", to: "c7", label: "复核通过", style: "solid" }
      - { from: "c3", to: "c8", style: "solid" }
      - { from: "c7", to: "c8", style: "solid" }
      - { from: "c4", to: "c4", label: "识别重试 ×1", style: "dashed" }
      - { from: "c6", to: "c4", label: "补件重跑", style: "dashed" }

  - id: "skill_reconcile"
    name: "Skill ② 对账与差异分析"
    type: "skill"
    trigger: "客户反馈上传 / 创建对账单"
    pattern: "pipeline + human-in-the-loop"
    whyNotSubagent: "固定管道 + 差异裁决门禁，I/O 清晰可独立验收 → 判 Skill"
    handoff: "→ 对账完成（借贷项已过账）进入 Skill ③ POD 确认"
    nodes:
      - { id: "d0", label: "客户反馈对账文件上传", type: "op" }
      - { id: "d1", label: "创建 / 生成对账单", note: "规则引擎 · 模板", type: "det" }
      - { id: "d2", label: "下载对账单交客户", note: "对外动作", type: "op" }
      - { id: "d3", label: "客户反馈 vs SAP 差异比对", note: "规则引擎", type: "det" }
      - { id: "d4", label: "差异归因", note: "LLM", type: "llm" }
      - { id: "d5", label: "超容差判定", note: "Evaluator", type: "eval" }
      - { id: "d6", label: "生成 / 关联借贷项", note: "规则引擎 · 写本体 W", type: "det" }
      - { id: "d7", label: "超容差差异裁决", note: "HITL", type: "hitl" }
      - { id: "d8", label: "对账完成", type: "out" }
      - { id: "d9", label: "异常池", note: "口径冲突", type: "exception" }
    edges:
      - { from: "d0", to: "d1", style: "solid" }
      - { from: "d1", to: "d2", style: "solid" }
      - { from: "d2", to: "d3", style: "solid" }
      - { from: "d3", to: "d4", style: "solid" }
      - { from: "d4", to: "d5", style: "solid" }
      - { from: "d5", to: "d6", label: "容差内", style: "solid" }
      - { from: "d5", to: "d7", label: "超容差", style: "dashed" }
      - { from: "d7", to: "d6", label: "裁决后", style: "solid" }
      - { from: "d6", to: "d8", style: "solid" }
      - { from: "d4", to: "d9", label: "口径冲突", style: "dashed" }
      - { from: "d3", to: "d3", label: "反馈重解析 ×1", style: "dashed" }

  - id: "skill_pod"
    name: "Skill ③ POD 匹配与确认"
    type: "skill"
    trigger: "选择交货单 / 具备条件待确认"
    pattern: "pipeline + human-in-the-loop"
    whyNotSubagent: "五要素校验为预定义规则、对外确认门禁明确 → 判 Skill"
    handoff: "→ POD 确认后触发 SAP 预制发票，进入 Skill ④ 过账链"
    nodes:
      - { id: "e0", label: "选择交货单 / DN", type: "op" }
      - { id: "e1", label: "汇总五要素状态", note: "读本体 R", type: "onto" }
      - { id: "e2", label: "校验 POD 确认条件", note: "规则引擎", type: "det" }
      - { id: "e3", label: "条件齐备判定", note: "Evaluator", type: "eval" }
      - { id: "e4", label: "缺口提示 + 生成待办", note: "LLM", type: "llm" }
      - { id: "e5", label: "一键 POD 确认", note: "HITL · 对外必停", type: "hitl" }
      - { id: "e6", label: "生成 POD 日志", note: "写本体 W", type: "det" }
      - { id: "e7", label: "触发 SAP 预制发票", note: "MCP · SAP", type: "mcp" }
      - { id: "e8", label: "特殊确认审批", note: "HITL · CS 经理", type: "hitl" }
      - { id: "e9", label: "POD 确认完成", type: "out" }
      - { id: "e10", label: "异常池", note: "升级人工", type: "exception" }
    edges:
      - { from: "e0", to: "e1", style: "solid" }
      - { from: "e1", to: "e2", style: "solid" }
      - { from: "e2", to: "e3", style: "solid" }
      - { from: "e3", to: "e5", label: "齐备", style: "solid" }
      - { from: "e3", to: "e4", label: "缺口", style: "dashed" }
      - { from: "e4", to: "e1", label: "补齐后重校验", style: "dashed" }
      - { from: "e5", to: "e6", label: "人工放行", style: "solid" }
      - { from: "e6", to: "e7", style: "solid" }
      - { from: "e7", to: "e9", style: "solid" }
      - { from: "e5", to: "e8", label: "特殊场景", style: "dashed" }
      - { from: "e8", to: "e9", label: "审批放行", style: "solid" }
      - { from: "e3", to: "e10", label: "异常", style: "dashed" }

  - id: "skill_posting"
    name: "Skill ④ 发票过账与归档"
    type: "skill"
    trigger: "预制发票已生成 / 财务待过账"
    pattern: "pipeline + human-in-the-loop"
    whyNotSubagent: "涉钱高风险但路径固定、需人工确认，非独立规划 → 判 Skill"
    handoff: "→ 过账完成回写凭证，进入 Skill ⑤ 监控/查询"
    nodes:
      - { id: "f0", label: "待过账清单", type: "op" }
      - { id: "f1", label: "财务过账权限校验", note: "确定性", type: "det" }
      - { id: "f2", label: "执行 SAP 过账", note: "MCP · SAP · 写本体 W", type: "mcp" }
      - { id: "f3", label: "过账结果判定", note: "Evaluator", type: "eval" }
      - { id: "f4", label: "凭证回写", note: "写本体 W", type: "onto" }
      - { id: "f5", label: "失败记录 + 人工重试", note: "HITL · 高风险", type: "hitl" }
      - { id: "f6", label: "打印与归档", type: "op" }
      - { id: "f7", label: "过账完成", type: "out" }
      - { id: "f8", label: "异常池", note: "接口异常 / IT", type: "exception" }
    edges:
      - { from: "f0", to: "f1", style: "solid" }
      - { from: "f1", to: "f2", style: "solid" }
      - { from: "f2", to: "f3", style: "solid" }
      - { from: "f3", to: "f4", label: "成功", style: "solid" }
      - { from: "f3", to: "f5", label: "失败", style: "dashed" }
      - { from: "f5", to: "f2", label: "人工确认后重试", style: "dashed" }
      - { from: "f4", to: "f6", style: "solid" }
      - { from: "f6", to: "f7", style: "solid" }
      - { from: "f2", to: "f8", label: "接口异常", style: "dashed" }

  - id: "skill_monitor"
    name: "Skill ⑤ 驾驶舱与超期预警"
    type: "skill"
    trigger: "定时刷新 / 状态变更事件"
    pattern: "event-driven"
    whyNotSubagent: "分支为预定义（超阈值→推送、正常→展示），无独立规划 → 判 Skill"
    nodes:
      - { id: "g0", label: "各节点状态 / 阈值输入", type: "op" }
      - { id: "g1", label: "四类超期计算", note: "规则引擎", type: "det" }
      - { id: "g2", label: "驾驶舱刷新", note: "读本体 R", type: "onto" }
      - { id: "g3", label: "超阈值判定", note: "Evaluator", type: "eval" }
      - { id: "g4", label: "待办 / 预警推送", note: "MCP · IM", type: "mcp" }
      - { id: "g5", label: "看板完成", type: "out" }
    edges:
      - { from: "g0", to: "g1", style: "solid" }
      - { from: "g1", to: "g2", style: "solid" }
      - { from: "g2", to: "g3", style: "solid" }
      - { from: "g3", to: "g4", label: "超阈值", style: "solid" }
      - { from: "g3", to: "g5", label: "正常", style: "solid" }
      - { from: "g4", to: "g5", style: "solid" }

sharedBase:
  ontology:
    title: "本体（确定性底座）"
    read: ["交货单 / DN 全链路状态（POD 匹配）", "签收有效性 / 对账状态（条件校验）", "过账凭证 / 借贷项状态（查询）"]
    write: ["物流发运关联（邮件识别回写）", "POD 确认 / POD 日志（确认写）", "过账凭证 / 借贷项状态（过账回写）"]
    note: "对象 / 关系 / 状态迁移 + 业务事实；五要素状态与规则校验走本体，不靠 LLM 猜事实。"
  mcp:
    title: "MCP / 外部系统"
    calls: ["SAP SD（交货单 / 预制发票 / 过账 / 凭证）", "公共邮箱（邮件读取）", "公共文件夹 / 文件服务（签收 / POD / 对账文件）", "OCR / AI 识别服务", "IM（待办与预警推送）"]
    note: "仅需要外部读写的步骤才走 MCP。"
  kb:
    title: "知识库 / RAG"
    calls: ["对账差异规则库", "POD 确认条件规则", "承运商字典 / 发运单号规则", "历史签收 / 自提样本"]
    note: "规则校验走规则引擎而非向量检索；历史签收样本 / 非结构化知识走 RAG。"

exceptionPool: "识别低置信度 / 关联冲突 / 对账口径冲突 / 超容差差异 / POD 条件缺口 / 过账失败 / Loop 超限 → 升级人工，附上下文摘要。"

failureTable:
  - { trigger: "SAP 交货单接口失败 / 超时", action: "重试 1 次 → 标记同步异常并通知 IT", type: "retry / escalate" }
  - { trigger: "邮件关键字段低置信度 / 冲突", action: "标黄转人工复核，补邮件留痕，不手工改写发运单号", type: "fallback / escalate" }
  - { trigger: "签收 / POD 识别置信度低", action: "标黄待人工复核字段，不阻塞其余字段", type: "fallback" }
  - { trigger: "对账差异口径冲突 / 无法归因", action: "转人工裁决 → 无法收敛升级 CS 经理 / 财务", type: "escalate" }
  - { trigger: "借贷项未过账", action: "阻断 POD 确认并生成待办，提示先完成借贷项", type: "fallback" }
  - { trigger: "POD 条件缺口", action: "阻断确认，列出缺口并引导补件 / 补对账", type: "fallback" }
  - { trigger: "SAP 过账失败", action: "记录返回信息 → 财务确认后手工重试，禁止无限制自动重试", type: "retry / escalate" }
  - { trigger: "超期阈值口径存疑", action: "拉人确认后回填配置", type: "escalate" }

kpi:
  - { name: "收入确认时效", link: "③ POD 确认 + ④ 过账　准实时 / 由人工 T+N 收敛" }
  - { name: "采集自动化率", link: "① 资料采集　自动拉取识别，人工工作量下降 70%+" }
  - { name: "对账差异处理效率", link: "② 对账差异　处理周期缩短 50%+" }
  - { name: "POD 确认合规率", link: "③ POD 确认　五要素硬校验 + 人工闸门" }
  - { name: "超期异常积压", link: "⑤ 驾驶舱预警　四类超期量下降 60%+" }

guardrails:
  - { rule: "物流发运单号以邮件原文为唯一依据", detail: "不开放手工直接改写；异常走补邮件 / 补充说明留痕" }
  - { rule: "POD 确认是对外确认收入的强制人工闸门", detail: "五要素任一不满足必须阻断，禁止系统自动确认" }
  - { rule: "借贷项未完成不得放行 POD 确认", detail: "借贷项状态为硬前置条件" }
  - { rule: "过账失败不得无限制自动重试", detail: "高风险财务动作，须财务确认后手工重试" }
  - { rule: "确定性能力不交给 LLM", detail: "五要素状态 / 规则校验 / 差异比对走本体与规则引擎" }

notes:
  - { title: "⚠️ 口径待确认：", text: "对账差异容差口径、POD 五条件判定口径、四类超期天数阈值需与业务确认后回填。" }
  - { title: "⚠️ MCP 边界：", text: "本方案把 SAP / 邮箱 / 文件服务 / OCR / IM 画成 MCP 外部调用；若确认「MCP=0，数据全部来自绑定本体」，则归入本体 / 内部服务并标 N/A。" }
