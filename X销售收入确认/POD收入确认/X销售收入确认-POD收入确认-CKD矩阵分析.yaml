title: "X销售收入确认 · 销售POD收入确认 CKD 映射报告"
product: "销售POD收入确认工作台"
description: "围绕销售POD收入确认全链路（交货单同步 → 邮件/物流关联 → 签收资料识别 → 对账差异 → 借贷项 → POD 确认 → 预制发票/过账 → 打印归档 → 驾驶舱），梳理每一步 AI 执行所需的上下文、知识与数据资产，为 RAG、规则引擎与接口集成提供资产清单。"
steps:
  - step_name: "1. SAP 交货单同步"
    ckd_items:
      - context_name: "交货单同步参数（客户/组织/周期）"
        description: "本次同步的范围上下文，决定拉取哪些客户、销售组织与时间窗口的交货单。"
        type: "请求上下文"
        storage: "任务配置表 / MySQL"
        volume: "按客户×周期动态生成"
        ai_init: false
        frequency: "实时（每次任务）"
        retrieval: "任务参数直取"
        status: "已支持"
      - context_name: "SAP 交货单与明细"
        description: "收入确认的业务主线数据，提供交货单号、客户、金额、出库日期与状态。"
        type: "API 数据"
        storage: "SAP SD / 接口网关 + 本地交货单表"
        volume: "按周期万级单据"
        ai_init: false
        frequency: "定时（如每小时/每日）"
        retrieval: "接口按条件查询 + 主键更新"
        status: "已支持"
      - context_name: "客户主数据与销售组织"
        description: "校验客户归属、销售组织与 CS 负责人，支撑数据范围与权限过滤。"
        type: "关系型数据"
        storage: "主数据系统 / MySQL"
        volume: "客户主数据千级"
        ai_init: false
        frequency: "低频（主数据变更）"
        retrieval: "客户编码精确查询"
        status: "已支持"

  - step_name: "2. 邮件识别与物流发运关联"
    ckd_items:
      - context_name: "公共邮箱邮件原文"
        description: "仓库/物流/客户自提邮件，是物流发运单号的原始审计依据，供 AI 提取交货单号、承运商、发运单号。"
        type: "非结构化文档 / 邮件"
        storage: "邮件系统 API + 对象存储归档"
        volume: "按日千级邮件"
        ai_init: false
        frequency: "定时拉取"
        retrieval: "规则解析 + 语义识别"
        status: "已支持"
      - context_name: "邮件识别提示词与字段规范"
        description: "约束 AI 从邮件主题/正文提取交货单号、物流公司、发运单号、自提确认的字段口径与置信度输出。"
        type: "Prompt Template"
        storage: "配置中心 / 版本库"
        volume: "少量模板（<20）"
        ai_init: true
        frequency: "随发版"
        retrieval: "模板直接注入"
        status: "建设中"
      - context_name: "承运商清单与发运单号命名规则"
        description: "承运商字典与单号格式规则，用于校验识别结果的合法性与歧义消解。"
        type: "静态字典"
        storage: "Redis / 配置表"
        volume: "<500 承运商"
        ai_init: false
        frequency: "低频"
        retrieval: "Key-Value + 正则规则"
        status: "建设中"

  - step_name: "3. 签收/POD资料识别"
    ckd_items:
      - context_name: "公共文件夹签收单/POD文件"
        description: "物流签收单、POD 文件与客户反馈对账文件，供 OCR 提取签收人、时间、结果、单号。"
        type: "非结构化文档"
        storage: "公共文件夹/网盘 + 对象存储"
        volume: "按日千级文件"
        ai_init: false
        frequency: "定时拉取"
        retrieval: "目录扫描 + OCR"
        status: "已支持"
      - context_name: "单证识别模型与版面模板"
        description: "多模态视觉模型与签收单/POD 版面模板，提升字段抽取准确率与置信度评估。"
        type: "模型 / 版面模板"
        storage: "AI 服务 + 模板库"
        volume: "多种单证版式"
        ai_init: true
        frequency: "随单证版式变化"
        retrieval: "版面匹配 + 字段抽取"
        status: "待规划"
      - context_name: "历史签收/自提样本"
        description: "历史签收单与客户自提邮件样本，用于少样本提示与识别效果评估。"
        type: "向量嵌入"
        storage: "向量库 / Milvus"
        volume: "万级样本"
        ai_init: true
        frequency: "月度沉淀"
        retrieval: "语义相似度检索"
        status: "待规划"

  - step_name: "4. 对账单差异分析"
    ckd_items:
      - context_name: "客户反馈对账文件"
        description: "客户回传的确认或带差异对账数据，是差异比对的动态输入。"
        type: "结构化/半结构化文档"
        storage: "对象存储 + 对账单明细表"
        volume: "按对账单批次"
        ai_init: false
        frequency: "上传触发"
        retrieval: "文件解析 + 明细行匹配"
        status: "已支持"
      - context_name: "对账差异规则集"
        description: "客户一致性、交货单存在性、数量/金额一致性、重复/缺失反馈、容差等规则。"
        type: "规则引擎配置"
        storage: "规则中心 / JSON 配置"
        volume: "<100 条规则"
        ai_init: true
        frequency: "季度更新"
        retrieval: "规则引擎匹配"
        status: "建设中"
      - context_name: "SAP 交货单明细（对账基准）"
        description: "作为对账比对的基准数量与金额，来自交货单同步结果。"
        type: "API 数据"
        storage: "本地交货单明细表 / MySQL"
        volume: "按周期万级行"
        ai_init: false
        frequency: "随同步更新"
        retrieval: "交货单号/客户关联查询"
        status: "已支持"

  - step_name: "5. 借贷项处理"
    ckd_items:
      - context_name: "借贷项生成规则"
        description: "依据差异类型生成借项或贷项的判定规则与金额口径。"
        type: "规则引擎配置"
        storage: "规则中心 / JSON"
        volume: "<50 条规则"
        ai_init: true
        frequency: "季度更新"
        retrieval: "规则匹配"
        status: "待规划"
      - context_name: "借贷项过账状态"
        description: "SAP/财务系统返回的借贷项单号与过账状态，决定是否开放 POD 确认。"
        type: "API 数据"
        storage: "借贷项表 + SAP 接口"
        volume: "按差异批次"
        ai_init: false
        frequency: "实时回写"
        retrieval: "借贷项号查询"
        status: "建设中"

  - step_name: "6. POD 匹配与确认"
    ckd_items:
      - context_name: "POD 确认条件规则"
        description: "交货单已同步、物流关联、签收有效、对账完成、借贷项完成的五条件校验规则。"
        type: "规则引擎配置"
        storage: "规则中心 / JSON"
        volume: "<30 条规则"
        ai_init: true
        frequency: "季度更新"
        retrieval: "规则引擎校验"
        status: "建设中"
      - context_name: "横向匹配数据（五要素状态）"
        description: "交货单、物流发运关联、签收/POD、对账单、借贷项的状态聚合，用于生成匹配结论与缺口提示。"
        type: "关系型数据"
        storage: "工作台业务库 / MySQL"
        volume: "按交货单实时"
        ai_init: false
        frequency: "实时"
        retrieval: "交货单号聚合查询"
        status: "已支持"
      - context_name: "POD 确认解释话术模板"
        description: "将匹配结论与缺口转成可解释提示的模板，供 CS 理解与放行。"
        type: "Prompt Template"
        storage: "配置中心"
        volume: "<20 模板"
        ai_init: true
        frequency: "随发版"
        retrieval: "模板注入"
        status: "待规划"

  - step_name: "7. 预制发票与过账"
    ckd_items:
      - context_name: "POD 确认记录与 POD 日志"
        description: "POD 确认结果与操作日志，作为自动生成预制发票的触发依据与审计记录。"
        type: "关系型数据"
        storage: "POD 确认表 / POD 日志表"
        volume: "按确认批次"
        ai_init: false
        frequency: "实时"
        retrieval: "交货单号查询"
        status: "已支持"
      - context_name: "SAP 预制发票与过账接口"
        description: "生成预制发票、执行过账、查询凭证的接口能力与字段契约。"
        type: "API 数据"
        storage: "SAP SD / 接口网关"
        volume: "按确认批次"
        ai_init: false
        frequency: "实时调用"
        retrieval: "接口调用"
        status: "待规划"
      - context_name: "过账凭证与会计期间"
        description: "SAP 返回的凭证号、会计期间、过账状态与返回信息，回写综合查询。"
        type: "API 数据"
        storage: "过账凭证表"
        volume: "按过账批次"
        ai_init: false
        frequency: "实时回写"
        retrieval: "凭证号/交货单查询"
        status: "建设中"

  - step_name: "8. 资料预览与打印归档"
    ckd_items:
      - context_name: "资料清单与预览地址"
        description: "交货单、物流邮件、签收/POD、对账单、POD 日志、预制发票、凭证的预览与打印入口。"
        type: "关系型数据 + 文件"
        storage: "文件资料表 + 对象存储"
        volume: "按业务对象"
        ai_init: false
        frequency: "实时"
        retrieval: "业务对象关联查询"
        status: "已支持"
      - context_name: "打印模板与归档规则"
        description: "系统生成资料（POD 日志/凭证）的打印样式与归档清单规则。"
        type: "模版范例"
        storage: "模板库 / 配置表"
        volume: "<30 模板"
        ai_init: false
        frequency: "随发版"
        retrieval: "模板匹配"
        status: "待规划"

  - step_name: "9. 驾驶舱与超期预警"
    ckd_items:
      - context_name: "超期异常阈值配置"
        description: "已发货未取发运单、已取得未签收、已发货未创建对账单、具备条件未 POD 确认的超期天数阈值。"
        type: "规则引擎配置"
        storage: "配置表 / JSON"
        volume: "<20 阈值项"
        ai_init: false
        frequency: "可配置（月度校准）"
        retrieval: "阈值比较"
        status: "建设中"
      - context_name: "各节点单据与待办数据"
        description: "物流分支、对账分支与 POD/过账各节点的单据数量与待办，用于看板与预警。"
        type: "关系型数据"
        storage: "工作台业务库 / MySQL"
        volume: "实时聚合"
        ai_init: false
        frequency: "实时"
        retrieval: "聚合统计查询"
        status: "已支持"
      - context_name: "角色与数据范围权限"
        description: "按 CS/CS 经理/物流/财务/财务主管控制待处理清单、字段与按钮可见性。"
        type: "权限数据"
        storage: "组织权限/AD + 权限服务"
        volume: "用户×角色×数据范围"
        ai_init: false
        frequency: "低频"
        retrieval: "权限规则校验"
        status: "已支持"
