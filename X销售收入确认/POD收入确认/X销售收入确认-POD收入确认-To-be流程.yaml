meta:
  title: "X销售收入确认 · 销售POD收入确认 To-be 流程"
  version: "v1.0"
  date: "2026-09-10"
  scenarioName: "销售POD收入确认"
  businessStage: "挖知识 阶段1 任务流程挖掘 · 步骤1.1"
  methodology: "挖知识 阶段1方法（业务环节 L3 → 主要活动 L4 → 深度任务 L5）"
  inputs:
    - "定场景《X销售收入确认-POD收入确认-AI画布》（用户痛点 / 输入输出 / 人机流程 / 业务收益）"
    - "定场景《X销售收入确认-POD收入确认-机会点定义》（4 个机会点 + 价值收益拆解）"
    - "客户素材《销售收入确认_开发方案设计文档》（业务流程图 / 功能点 / 集成 / 状态规则）"
  sourceRef: "X销售收入确认开发方案设计文档"
  kpi:
    - "收入确认时效"
    - "采集自动化率"
    - "对账差异处理效率"
    - "POD确认合规率"
    - "超期异常积压"

legend:
  execution:
    - { type: "agent",  label: "Agent=AI 自动执行", icon: "🤖" }
    - { type: "human",  label: "人工=人工执行",     icon: "👤" }
    - { type: "hybrid", label: "混合=人机协同",     icon: "🤝" }
  hitlFocus:
    - { level: "low",    label: "低 · 人机介入",      desc: "全自动，无人工介入" }
    - { level: "medium", label: "中 · 人机交错/审核", desc: "AI 产出，人工抽检/确认" }
    - { level: "high",   label: "高 · 人机终审",      desc: "人类担任最终裁决" }
    - { level: "gate",   label: "必停确认",           desc: "对外动作，强制人工放行" }
  flowConventions:
    - "角色泳道 任务泳道内转"
    - "流程走向 任务正常后回填 AI"
  valueAnchors:
    - "收入确认时效"
    - "采集自动化率"
    - "对账差异处理效率"
    - "POD确认合规率"
    - "超期异常积压"

phases:
  - { id: "P1", order: 1, name: "数据采集", fullName: "交货单与资料采集", description: "定时拉取 SAP 交货单、公共邮箱邮件与公共文件夹签收资料" }
  - { id: "P2", order: 2, name: "物流关联", fullName: "物流发运关联与签收确认", description: "建立交货单与物流发运单关联，识别签收/POD 有效性" }
  - { id: "P3", order: 3, name: "对账", fullName: "对账单处理与差异分析", description: "创建/下载/上传对账单，自动差异分析与借贷项处理" }
  - { id: "P4", order: 4, name: "POD确认", fullName: "POD 匹配与收入确认", description: "横向匹配校验确认条件，人工确认并自动生成预制发票" }
  - { id: "P5", order: 5, name: "过账归档", fullName: "发票过账与打印归档", description: "财务过账、凭证回写、打印归档与全链路查询" }

lanes:
  - { id: "system",     order: 1, name: "平台/定时任务", group: "平台自动",   description: "定时拉取、识别、校验、生成" }
  - { id: "logistics",  order: 2, name: "物流人员",       group: "物流",       description: "物流关联与签收资料补充" }
  - { id: "cs",         order: 3, name: "CS",             group: "销售/对账",  description: "对账、差异处理、POD 确认" }
  - { id: "cs_manager", order: 4, name: "CS 经理",        group: "销售管理",   description: "全局看板、异常与特殊审批" }
  - { id: "finance",    order: 5, name: "财务",           group: "财务",       description: "过账、打印、归档" }
  - { id: "customer",   order: 6, name: "客户/外部",      group: "客户/外部",  description: "对账确认与自提确认" }

tasks:
  - { id: "t01", order: 1, phaseId: "P1", laneId: "system",
      name: "同步 SAP 待处理交货单", actor: "agent",
      inputs: ["客户", "销售组织", "时间范围", "交货状态"], outputs: ["SAP交货单与明细"],
      ruleType: "关键信息提取要点·交货单关键字段",
      valueAnchors: ["采集自动化率"], hitlFocus: "low",
      exception: "接口失败/数据缺失 → 重试，连续失败 → 拉人",
      description: "系统按客户与周期定时同步已发货交货单" }
  - { id: "t02", order: 2, phaseId: "P1", laneId: "system",
      name: "读取公共邮箱仓库/物流邮件", actor: "agent",
      inputs: ["邮箱", "文件夹", "时间范围"], outputs: ["邮件原文与附件"],
      ruleType: "关联关系类·交货单-发运单关联线索",
      valueAnchors: ["采集自动化率"], hitlFocus: "low",
      exception: "邮件格式异常 → 降级人工",
      description: "定时读取指定邮箱，留存邮件原文作为审计依据" }
  - { id: "t03", order: 3, phaseId: "P1", laneId: "system",
      name: "读取公共文件夹签收/POD资料", actor: "agent",
      inputs: ["目录", "文件类型", "时间范围"], outputs: ["签收单/POD原始文件"],
      ruleType: "关键信息提取要点·单证关键字段",
      valueAnchors: ["采集自动化率"], hitlFocus: "low",
      exception: "目录不可达 → 重试/降级人工",
      description: "定时从公共文件夹拉取物流签收单与 POD 文件" }
  - { id: "t04", order: 4, phaseId: "P1", laneId: "system",
      name: "OCR 识别签收单/POD字段", actor: "agent",
      inputs: ["签收单/POD原始文件"], outputs: ["结构化签收信息+置信度"],
      ruleType: "关键信息提取要点·签收人/时间/结果/单号",
      valueAnchors: ["采集自动化率"], hitlFocus: "medium",
      exception: "识别失败/低置信度 → 人工复核",
      description: "AI 识别签收人、签收时间、签收结果与物流单号" }
  - { id: "t05", order: 5, phaseId: "P1", laneId: "logistics",
      name: "复核并补充签收资料", actor: "hybrid",
      inputs: ["低置信度识别结果", "原始文件"], outputs: ["人工确认的签收信息"],
      ruleType: "决策模型类·签收有效性判断",
      valueAnchors: ["采集自动化率", "POD确认合规率"], hitlFocus: "medium",
      exception: "资料缺失 → 补件/补邮件",
      description: "物流人员复核低置信度识别结果并补充缺失资料" }

  - { id: "t06", order: 6, phaseId: "P2", laneId: "system",
      name: "建立交货单-发运单关联", actor: "agent",
      inputs: ["邮件原文", "交货单"], outputs: ["交货单与物流发运单关联"],
      ruleType: "关联关系类·交货单号↔物流发运单号",
      valueAnchors: ["采集自动化率", "超期异常积压"], hitlFocus: "low",
      exception: "多义/冲突 → 拉人复核",
      description: "AI 从邮件识别交货单号、物流公司与发运单号并建立关联" }
  - { id: "t07", order: 7, phaseId: "P2", laneId: "system",
      name: "识别客户自提邮件并视同签收", actor: "agent",
      inputs: ["客户自提邮件"], outputs: ["自提确认+归档邮件"],
      ruleType: "关联关系类·自提确认与签收等价",
      valueAnchors: ["POD确认合规率"], hitlFocus: "medium",
      exception: "表述不明确 → 人工确认",
      description: "识别客户自提邮件，视同物流签收已确认并归档" }
  - { id: "t08", order: 8, phaseId: "P2", laneId: "logistics",
      name: "处理物流关联异常", actor: "human",
      inputs: ["关联异常清单"], outputs: ["补邮件/补充说明记录"],
      ruleType: "模版范例类·补邮件/补充说明模板",
      valueAnchors: ["超期异常积压"], hitlFocus: "medium",
      exception: "无法补全 → 升级 CS/经理",
      description: "物流人员通过补邮件或补充说明修正关联异常并留痕" }
  - { id: "t09", order: 9, phaseId: "P2", laneId: "cs",
      name: "确认物流签收有效性", actor: "hybrid",
      inputs: ["物流发运关联", "签收/POD资料"], outputs: ["签收有效性结论"],
      ruleType: "决策模型类·签收有效性规则",
      valueAnchors: ["POD确认合规率"], hitlFocus: "medium",
      exception: "签收存疑 → 拉人/退回物流",
      description: "CS 依据关联与签收资料确认签收是否有效" }

  - { id: "t10", order: 10, phaseId: "P3", laneId: "cs",
      name: "创建对账单", actor: "human",
      inputs: ["待处理交货单", "客户", "周期"], outputs: ["对账单主表/明细"],
      ruleType: "模版范例类·对账单生成模板",
      valueAnchors: ["对账差异处理效率"], hitlFocus: "medium",
      exception: "无可对账交货单 → 提示/终止",
      description: "CS 按客户与周期勾选交货单批量创建对账单" }
  - { id: "t11", order: 11, phaseId: "P3", laneId: "cs",
      name: "下载对账单交客户确认", actor: "human",
      inputs: ["对账单文件"], outputs: ["对账单已下载状态"],
      ruleType: "模版范例类·对账单下载模板",
      valueAnchors: ["对账差异处理效率"], hitlFocus: "gate",
      exception: "发送失败 → 重试/人工通知",
      description: "CS 下载对账单并发送客户确认（对外动作）" }
  - { id: "t12", order: 12, phaseId: "P3", laneId: "customer",
      name: "客户反馈对账结果", actor: "human",
      inputs: ["对账单文件"], outputs: ["客户反馈对账文件"],
      ruleType: "模版范例类·客户反馈模板",
      valueAnchors: ["对账差异处理效率"], hitlFocus: "low",
      exception: "逾期未反馈 → 提醒",
      description: "客户回传确认或带差异的对账反馈文件" }
  - { id: "t13", order: 13, phaseId: "P3", laneId: "system",
      name: "自动比对客户反馈与SAP差异", actor: "agent",
      inputs: ["客户反馈文件", "SAP交货单/明细"], outputs: ["差异清单+归因"],
      ruleType: "决策模型类·对账差异规则（客户一致性/数量金额/重复缺失/容差）",
      valueAnchors: ["对账差异处理效率"], hitlFocus: "medium",
      exception: "格式不识别/口径冲突 → 拉人",
      description: "系统按差异规则自动比对并归因" }
  - { id: "t14", order: 14, phaseId: "P3", laneId: "system",
      name: "生成/关联借贷项建议", actor: "agent",
      inputs: ["差异清单"], outputs: ["借贷项建议"],
      ruleType: "决策模型类·借贷项生成规则",
      valueAnchors: ["对账差异处理效率"], hitlFocus: "medium",
      exception: "无法自动生成 → 人工处理",
      description: "依据差异自动生成或关联借贷项并跟踪过账状态" }
  - { id: "t15", order: 15, phaseId: "P3", laneId: "cs",
      name: "确认差异并处理借贷项", actor: "human",
      inputs: ["差异清单", "借贷项建议"], outputs: ["借贷项完成状态"],
      ruleType: "决策模型类·差异处理决策",
      valueAnchors: ["对账差异处理效率", "POD确认合规率"], hitlFocus: "high",
      exception: "差异无法收敛 → 升级经理/财务",
      description: "CS 确认差异原因并完成借贷项处理（未完成不开放 POD 确认）" }

  - { id: "t16", order: 16, phaseId: "P4", laneId: "system",
      name: "汇总横向匹配表并校验POD条件", actor: "agent",
      inputs: ["交货单", "物流关联", "签收资料", "对账单", "借贷项状态"], outputs: ["POD匹配结论+缺口提示"],
      ruleType: "决策模型类·POD确认条件规则",
      valueAnchors: ["POD确认合规率", "收入确认时效"], hitlFocus: "medium",
      exception: "条件缺口 → 生成待办/拉人",
      description: "系统拉齐五要素状态，给出可解释的匹配结论与缺口" }
  - { id: "t17", order: 17, phaseId: "P4", laneId: "cs",
      name: "一键 POD 确认", actor: "human",
      inputs: ["POD匹配结论"], outputs: ["POD确认记录+POD日志"],
      ruleType: "决策模型类·POD确认放行",
      valueAnchors: ["收入确认时效", "POD确认合规率"], hitlFocus: "gate",
      exception: "条件不足 → 阻断并提示缺口",
      description: "CS 点击 POD 确认（对外确认收入的强制人工闸门）" }
  - { id: "t18", order: 18, phaseId: "P4", laneId: "system",
      name: "自动生成 SAP 预制发票", actor: "agent",
      inputs: ["POD确认", "交货单", "客户", "金额"], outputs: ["预制发票号+状态"],
      ruleType: "关联关系类·POD确认→预制发票",
      valueAnchors: ["收入确认时效"], hitlFocus: "low",
      exception: "SAP 返回失败 → 记录并重试/拉人",
      description: "POD 确认后系统自动触发 SAP 生成预制发票" }
  - { id: "t19", order: 19, phaseId: "P4", laneId: "cs_manager",
      name: "特殊 POD 确认审批", actor: "human",
      inputs: ["异常/特殊确认申请"], outputs: ["审批结论"],
      ruleType: "决策模型类·特殊确认审批",
      valueAnchors: ["POD确认合规率"], hitlFocus: "high",
      exception: "驳回 → 退回 CS",
      description: "CS 经理审批特殊或异常场景的 POD 确认" }

  - { id: "t20", order: 20, phaseId: "P5", laneId: "finance",
      name: "执行发票过账", actor: "human",
      inputs: ["预制发票", "交货单"], outputs: ["会计凭证号+过账状态"],
      ruleType: "决策模型类·过账校验规则",
      valueAnchors: ["收入确认时效"], hitlFocus: "high",
      exception: "过账失败 → 记录 SAP 返回，人工确认后重试",
      description: "财务在发票过账页面执行过账（不提供预制按钮）" }
  - { id: "t21", order: 21, phaseId: "P5", laneId: "system",
      name: "回写凭证号与过账状态", actor: "agent",
      inputs: ["SAP 返回凭证信息"], outputs: ["过账凭证记录"],
      ruleType: "关联关系类·凭证回写",
      valueAnchors: ["收入确认时效"], hitlFocus: "low",
      exception: "回写失败 → 重试",
      description: "系统回写凭证号、会计期间与过账状态到综合查询" }
  - { id: "t22", order: 22, phaseId: "P5", laneId: "finance",
      name: "打印与归档", actor: "human",
      inputs: ["POD资料", "对账单", "POD日志", "预制发票", "凭证"], outputs: ["打印件+归档记录"],
      ruleType: "模版范例类·打印与归档清单",
      valueAnchors: ["POD确认合规率"], hitlFocus: "medium",
      exception: "缺件 → 补件后归档",
      description: "财务按打印样式打印并归档，记录归档人/时间/清单" }
  - { id: "t23", order: 23, phaseId: "P5", laneId: "system",
      name: "更新驾驶舱与超期预警", actor: "agent",
      inputs: ["各节点状态", "异常阈值配置"], outputs: ["驾驶舱看板+超期预警"],
      ruleType: "决策模型类·超期异常阈值规则",
      valueAnchors: ["超期异常积压"], hitlFocus: "low",
      exception: "阈值口径存疑 → 拉人确认",
      description: "系统刷新全局看板并按阈值生成超期异常预警与待办推送" }

flowNotes:
  - "主链路 P1→P2→P3→P4→P5；P4 的「一键 POD 确认」为全场景 P0（对外确认收入，HITL 强制闸门）"
  - "对账差异/借贷项未完成前不开放 POD 确认（P3 未收敛则 P4 阻断）"
  - "物流发运单号以邮件原文为依据，不开放手工改写，异常走补邮件/补充说明留痕"
returnNodes:
  - "关联异常/签收存疑/差异无法收敛/过账失败 → 分别回物流、CS、CS 经理、财务处理"
