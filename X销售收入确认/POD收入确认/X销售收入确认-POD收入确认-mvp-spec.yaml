    system: "sap"
    latency: 200
    response:
      items:
        - { deliveryNo: "8000123456", customer: "比亚迪电池", amount: 128600, deliveryDate: "2026-08-28", reconStatus: "对账完成", podStatus: "待确认", owner: "王静" }
        - { deliveryNo: "8000123457", customer: "福耀玻璃", amount: 86500, deliveryDate: "2026-08-29", reconStatus: "对账差异", podStatus: "待确认", owner: "王静" }
        - { deliveryNo: "8000123458", customer: "宁德时代", amount: 205000, deliveryDate: "2026-08-30", reconStatus: "未创建", podStatus: "未确认", owner: "王静" }
  - name: "getReconciliations"
    system: "sap"
    latency: 200
    response:
      items:
        - { statementNo: "RC-2026-08-001", customer: "比亚迪电池", period: "2026-08", difference: 0, creditDebit: "不适用", status: "对账完成" }
        - { statementNo: "RC-2026-08-002", customer: "福耀玻璃", period: "2026-08", difference: 1200, creditDebit: "待生成", status: "对账差异" }
