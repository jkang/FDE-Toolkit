title: "销售POD收入确认 · MVP 指标设计与上线门禁"
product_name: "销售POD收入确认工作台"
go_no_go_statement: "当 采集自动化率 ≥85%、字段识别准确率 ≥95%、差异归因准确率 ≥90%、POD 确认合规率 100%、SAP 接口成功率 ≥99% 且 过账失败率 ≤1% 时，允许灰度上线。"
target_metrics:
  - name: "收入确认时效"
    dimension: "业务"
    logic: "交货单从 POD 条件齐备到过账完成的平均时长"
    threshold: "≤ 1 个工作日"
    source: "工作台流程日志 + SAP 凭证时间"
  - name: "采集自动化率"
    dimension: "业务"
    logic: "物流关联与签收识别无需人工干预即完成的交货单占比"
    threshold: "≥ 85%"
    source: "数据采集中心日志"
  - name: "对账差异处理效率"
    dimension: "业务"
    logic: "对账差异从产生到借贷项完成的平均周期"
    threshold: "≤ 2 个工作日"
    source: "对账单 / 借贷项状态表"
  - name: "邮件/签收字段识别准确率"
    dimension: "模型"
    logic: "识别正确的关键字段数 / 应识别字段总数"
    threshold: "≥ 95%"
    source: "离线测试集（AI 测试数据集）"
  - name: "差异归因准确率"
    dimension: "模型"
    logic: "差异归因结论与人工复核一致的样本占比"
    threshold: "≥ 90%"
    source: "差异复核抽样"
  - name: "无依据推断率（幻觉率）"
    dimension: "模型"
    logic: "在证据不足时仍给出确定性结论的回答占比"
    threshold: "≤ 3%"
    source: "自研评估脚本 + 人工抽检"
  - name: "SAP 接口成功率"
    dimension: "系统"
    logic: "交货单同步 / 预制发票 / 过账 / 凭证回写成功调用占比"
    threshold: "≥ 99%"
    source: "接口网关监控"
  - name: "P95 响应延迟"
    dimension: "系统"
    logic: "95% 请求的端到端响应时间"
    threshold: "≤ 2s"
    source: "APM 监控"
  - name: "过账失败率"
    dimension: "系统"
    logic: "过账失败次数 / 过账总次数"
    threshold: "≤ 1%"
    source: "过账日志"
  - name: "识别结果人工复核率"
    dimension: "体验"
    logic: "低置信度转入人工复核的条目占比"
    threshold: "≤ 15%"
    source: "采集复核记录"
  - name: "用户操作步骤减少"
    dimension: "体验"
    logic: "（改造前人工步骤 - 改造后人工步骤）/ 改造前人工步骤"
    threshold: "≥ 50%"
    source: "流程埋点对比"
  - name: "待办与预警触达率"
    dimension: "体验"
    logic: "成功触达责任人的待办 / 预警数 / 应触达总数"
    threshold: "≥ 95%"
    source: "IM 推送回执"
monitoring_plan:
  - name: "平均 Token 消耗"
    layer: "模型"
    logic: "单次邮件/单证理解与归因消耗的 Input+Output Token"
    range: "800-1500"
    alert: ">2500"
    meaning: "上下文注入过多或 Prompt 泄露风险"
  - name: "识别置信度分布"
    layer: "模型"
    logic: "各置信度区间的条目占比"
    range: "高置信度 ≥80%"
    alert: "低置信度 >25%"
    meaning: "单证版式变化或 OCR 质量下降"
  - name: "规则命中率"
    layer: "检索"
    logic: "对账差异 / POD 条件规则成功命中的比例"
    range: "≥ 92%"
    alert: "< 85%"
    meaning: "规则库缺失或口径变更"
  - name: "SAP 接口错误率"
    layer: "系统"
    logic: "接口 5xx / 业务错误请求占比"
    range: "< 1%"
    alert: "> 3%"
    meaning: "SAP 侧限流或字段契约变更"
  - name: "过账失败率"
    layer: "系统"
    logic: "过账失败次数 / 过账总次数"
    range: "≤ 1%"
    alert: "> 3%"
    meaning: "会计期间关闭 / 数据不一致"
  - name: "人工转接分布"
    layer: "业务"
    logic: "各环节转人工的比例分布"
    range: "均衡分布"
    alert: "单一环节 >50%"
    meaning: "特定环节知识缺失或模型盲区"
  - name: "四类超期积压"
    layer: "业务"
    logic: "已发货未取发运单 / 已取得未签收 / 已发货未创建对账单 / 具备条件未 POD 确认的单量"
    range: "随阈值以内"
    alert: "任一超严重阈值"
    meaning: "流程阻塞或阈值口径需校准"
test_set_strategy:
  golden_path: 50
  hard_cases: 29
  edge_cases: 21
