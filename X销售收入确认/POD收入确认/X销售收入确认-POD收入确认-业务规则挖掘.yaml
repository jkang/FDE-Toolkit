categories:
  decision:
    - id: "rd_01"
      name: "物流发运关联匹配规则"
      usagePoints: ["识别邮件关键字段", "建立交货单-发运单关联"]
      factors:
        - { name: "交货单号 / DN", def: "邮件中出现的 SAP 交货单号", source: "公共邮箱邮件正文/主题", deterministic: true }
        - { name: "物流公司 / 承运商", def: "邮件中的承运商名称", source: "公共邮箱邮件 + 承运商字典", deterministic: true }
        - { name: "物流发运单号", def: "承运商开具的发运单号", source: "公共邮箱邮件正文/附件", deterministic: false }
        - { name: "邮件发件人与时间", def: "判断邮件来源与时效", source: "公共邮箱邮件头", deterministic: true }
      branches:
        - { cond: "交货单号 + 发运单号唯一且承运商可识别", action: "→ 自动建立交货单-发运单关联", priority: 1 }
        - { cond: "一封邮件含多个交货单号 / 发运单号", action: "→ 逐单拆分关联并标注一对多", priority: 2 }
        - { cond: "发运单号缺失或格式异常", action: "→ 转人工复核/补邮件", priority: 3 }
      arbitration: "以邮件原文为唯一依据；同一交货单出现多条冲突发运单号时，取最新有效邮件并留痕。"
      exception: "识别置信度低或存在冲突 → 拉人复核，物流补邮件/补充说明留痕，不开放手工直接改写。"
      summary: "从公共邮箱邮件识别交货单号、承运商、发运单号并建立交货单-发运单关联。"
    - id: "rd_02"
      name: "对账差异规则"
      usagePoints: ["自动比对差异并归因"]
      factors:
        - { name: "客户一致性", def: "客户反馈中的客户与对账单客户是否一致", source: "客户主数据", deterministic: true }
        - { name: "交货单存在性", def: "反馈中的交货单是否在 SAP 交货单范围内", source: "SAP 交货单/明细", deterministic: true }
        - { name: "数量一致性", def: "SAP 数量 vs 客户确认数量", source: "对账单明细", deterministic: true }
        - { name: "金额一致性", def: "SAP 金额 vs 客户确认金额", source: "对账单明细", deterministic: true }
        - { name: "反馈完整性", def: "是否存在重复反馈或缺失反馈", source: "客户反馈文件", deterministic: true }
      branches:
        - { cond: "数量与金额均一致", action: "→ 标记对账完成，进入 POD 确认", priority: 1 }
        - { cond: "数量或金额不一致（在容差内）", action: "→ 标记差异并建议调整借贷项", priority: 2 }
        - { cond: "交货单不存在 / 客户不一致", action: "→ 标记异常并转人工核实", priority: 3 }
        - { cond: "重复或缺失反馈", action: "→ 提示去重/补全后重跑", priority: 4 }
      arbitration: "金额差异以 SAP 为准、数量差异以签收/对账确认为准；超容差差异必须人工裁决。"
      exception: "文件格式不识别或口径冲突 → 拉人处理；差异无法收敛 → 升级 CS 经理/财务。"
      summary: "按客户一致性、交货单存在性、数量/金额一致性、重复缺失与容差规则自动比对并归因。"
    - id: "rd_03"
      name: "POD 确认条件规则"
      usagePoints: ["校验POD确认条件", "一键POD确认"]
      factors:
        - { name: "交货单已同步", def: "SAP 交货单已进入工作台", source: "交货单表", deterministic: true }
        - { name: "物流发运关联已建立", def: "存在交货单-发运单关联", source: "物流发运关联表", deterministic: true }
        - { name: "签收/POD 有效", def: "存在有效签收资料或客户自提确认", source: "POD资料表", deterministic: true }
        - { name: "对账已完成", def: "对账单状态为对账完成", source: "对账单表", deterministic: true }
        - { name: "借贷项已完成或不适用", def: "差异借贷项已过账或无差异", source: "借贷项表", deterministic: true }
        - { name: "用户具备 POD 确认权限", def: "当前用户角色与数据范围", source: "权限服务", deterministic: true }
      branches:
        - { cond: "五要素全部满足", action: "→ 允许 POD 确认（人工闸门放行）", priority: 1 }
        - { cond: "存在条件缺口", action: "→ 阻断并提示缺口，生成待办", priority: 2 }
        - { cond: "特殊/异常场景", action: "→ 转 CS 经理审批", priority: 3 }
      arbitration: "任一硬条件不满足一律阻断；借贷项未完成优先于其它条件阻断。"
      exception: "条件缺口 → 引导补件/补对账；特殊场景 → CS 经理终审。"
      summary: "五要素硬校验，全部满足才允许人工一键 POD 确认。"
    - id: "rd_04"
      name: "超期异常阈值规则"
      usagePoints: ["更新驾驶舱与超期预警"]
      factors:
        - { name: "已发货未取发运单天数", def: "交货单出库后未关联发运单的持续天数", source: "交货单表 + 物流关联表", deterministic: true }
        - { name: "已取得未签收天数", def: "已关联发运单但未取得有效签收的持续天数", source: "物流关联表 + POD资料表", deterministic: true }
        - { name: "已发货未创建对账单天数", def: "交货单出库后未创建对账单的持续天数", source: "交货单表 + 对账单表", deterministic: true }
        - { name: "具备条件未 POD 确认天数", def: "条件齐备但未 POD 确认的持续天数", source: "POD匹配表", deterministic: true }
      branches:
        - { cond: "未超配置阈值", action: "→ 正常展示待办", priority: 1 }
        - { cond: "超过预警阈值", action: "→ 黄色预警并推送待办", priority: 2 }
        - { cond: "超过严重阈值", action: "→ 红色预警并升级责任人/经理", priority: 3 }
      arbitration: "阈值按业务配置，口径存疑时以业务确认值为准；四类异常独立计算不合并。"
      exception: "阈值口径存疑 → 拉人确认后回填配置。"
      summary: "按可配置阈值计算四类超期异常并驱动驾驶舱预警与待办推送。"

  template:
    - id: "rt_01"
      name: "对账单生成模板"
      usagePoints: ["创建对账单", "下载对账单交客户确认"]
      skeleton:
        - { part: "① 对账单头", fixed: "固定栏（对账单号/客户编码/客户名称/对账周期/币种/生成人/生成时间）", variable: "随创建参数动态填充" }
        - { part: "② 交货单明细", fixed: "固定栏（交货单号/出库日期/数量/金额/对账状态）", variable: "随勾选交货单动态填充" }
        - { part: "③ 汇总与差异", fixed: "固定栏（合计数量/合计金额/差异金额/借贷项状态）", variable: "随差异分析结果动态填充" }
      dynamicFields:
        - { field: "对账单号", source: "系统按规则生成（如 RC-2026-09-001）" }
        - { field: "对账周期", source: "来自 CS 选择的起止日期" }
        - { field: "客户名称", source: "来自客户主数据" }
      generationRules: "存在 SAP 交货单才可创建；按客户与周期批量创建，一张对账单对应多张交货单。"
      complianceRules: "下载给客户的对账单必须含客户、周期、交货单明细与合计金额；缺一不可。"
      samples:
        - { label: "典型 · 单客户单周期对账", note: "交货单齐全，差异为零，客户一次确认通过" }
        - { label: "反面 · 含未同步交货单", note: "未同步交货单不得入对账单，否则差异无法归因" }
      fieldSource: "依据《销售收入确认_开发方案设计文档》11.4/11.5 数据对象定义拆出固定栏与动态字段。"
    - id: "rt_02"
      name: "客户反馈与差异说明模板"
      usagePoints: ["下载对账单交客户确认", "确认差异并处理借贷项"]
      skeleton:
        - { part: "① 反馈头", fixed: "固定栏（对账单号/客户/反馈日期/反馈人）", variable: "随客户反馈文件动态填充" }
        - { part: "② 明细差异", fixed: "固定栏（交货单号/SAP数量金额/客户确认数量金额/差异）", variable: "随客户反馈数据动态填充" }
        - { part: "③ 差异说明与处理", fixed: "固定栏（差异类型/原因/借贷项处理结论）", variable: "随 CS 处理结果动态填充" }
      dynamicFields:
        - { field: "差异类型", source: "来自对账差异规则归因结果" }
        - { field: "借贷项处理结论", source: "来自借贷项处理状态" }
      generationRules: "客户反馈上传后自动解析生成差异说明；人工确认差异原因后回写结论。"
      complianceRules: "差异说明必须逐条对应交货单并给出处理结论，未清差异不得标记对账完成。"
      samples:
        - { label: "典型 · 数量差异", note: "客户少计一箱，生成借项并完成过账后对账完成" }
        - { label: "反面 · 差异未说明", note: "存在差异但无原因与处理结论，禁止进入 POD 确认" }
      fieldSource: "依据开发方案文档 8.4/8.5 时序与 11.5/11.6 数据对象定义整理。"
    - id: "rt_03"
      name: "POD日志与过账凭证打印模板"
      usagePoints: ["打印与归档"]
      skeleton:
        - { part: "① POD 日志", fixed: "固定栏（交货单号/确认时间/确认人/POD日志号/预制发票号）", variable: "随 POD 确认记录动态填充" }
        - { part: "② 过账凭证", fixed: "固定栏（凭证号/会计期间/过账状态/过账人/过账时间）", variable: "随 SAP 回写凭证信息动态填充" }
      dynamicFields:
        - { field: "凭证号", source: "来自 SAP 过账返回" }
        - { field: "归档清单", source: "来自资料清单与归档规则" }
      generationRules: "系统生成资料按确认样式打印；原始资料（签收单/客户反馈）直接打印。"
      complianceRules: "归档需记录归档人、归档时间与资料清单；缺件不得归档。"
      samples:
        - { label: "典型 · 全链路归档", note: "交货单/签收/POD/对账单/POD日志/预制发票/凭证齐全归档" }
        - { label: "反面 · 缺过账凭证", note: "未过账或凭证缺失不得标记归档完成" }
      fieldSource: "依据开发方案文档 9.6 资料预览与打印归档方案整理。"

  dictionary:
    - id: "rdict_01"
      name: "销售POD收入确认业务口径词典"
      aliases: ["DN", "POD", "PID", "借贷项", "预制发票", "过账", "对账单", "客户自提"]
      definition: "销售POD收入确认全链路统一业务口径词表，供采集、对账、POD 确认、过账、查询共同引用。"
      entries:
        - { term: "DN / 交货单", def: "SAP 交货单（Delivery Note），收入确认的业务主线与确认颗粒度", context: "交货单同步" }
        - { term: "POD", def: "Proof of Delivery，签收凭据（物流签收单 / 客户自提确认）", context: "签收/POD资料识别" }
        - { term: "PID", def: "价格审批单，其审批结果生成价格条件作为 SO 基准", context: "POD确认与开票口径" }
        - { term: "借贷项", def: "对账差异处理后生成的借项或贷项调整", context: "差异与借贷项处理" }
        - { term: "预制发票", def: "POD 确认后由 SAP 自动生成的待过账发票", context: "预制发票与过账" }
        - { term: "过账", def: "财务执行发票入账，产生会计凭证号与会计期间", context: "发票过账" }
        - { term: "对账单", def: "按客户与周期汇总交货单、交客户确认的核对单据", context: "对账单处理" }
        - { term: "客户自提", def: "客户自提货并邮件确认，视同物流签收已确认", context: "签收确认" }
      maintainer: "销售/CS 与财务团队，随口径与政策更新"
      referenced: ["物流关联", "对账", "POD确认", "过账", "综合查询"]
      usagePoints: ["识别邮件关键字段", "自动比对差异并归因", "校验POD确认条件", "执行发票过账"]

  extraction:
    - id: "rext_01"
      name: "物流邮件字段抽取要点"
      usagePoints: ["识别邮件关键字段"]
      fields:
        - { fieldName: "交货单号", definition: "SAP 交货单号 / DN", typicalLocations: ["邮件主题", "邮件正文", "附件文件名"], variants: ["多单号", "带前缀"], pitfalls: ["一封邮件多单号需拆分"] }
        - { fieldName: "物流公司", definition: "承运商名称", typicalLocations: ["邮件正文", "发件人域名"], variants: ["简称/全称"], pitfalls: ["需映射承运商字典"] }
        - { fieldName: "物流发运单号", definition: "承运商发运单号", typicalLocations: ["邮件正文", "附件"], variants: ["多格式"], pitfalls: ["格式校验避免误提"] }
        - { fieldName: "客户自提确认", definition: "自提完成的明确表述", typicalLocations: ["邮件正文"], variants: ["不同措辞"], pitfalls: ["表述不明确需人工确认"] }
      acceptance: "交货单号/发运单号抽取准确率 ≥98%；无法唯一对应或低置信度 → 标黄转人工复核。"
      samples: ["主题含『DN 交货单号』→ 优先取主题；正文多单号 → 逐单拆分并标注一对多"]
    - id: "rext_02"
      name: "签收单/POD 字段抽取要点"
      usagePoints: ["OCR识别签收/POD字段"]
      fields:
        - { fieldName: "签收人", definition: "收货方签收人姓名", typicalLocations: ["签收栏"], variants: ["手写/打印"], pitfalls: ["手写潦草需复核"] }
        - { fieldName: "签收时间", definition: "签收日期时间", typicalLocations: ["签收栏", "日期戳"], variants: ["多种日期格式"], pitfalls: ["格式归一化"] }
        - { fieldName: "签收结果", definition: "正常签收/异常签收", typicalLocations: ["签收栏", "备注"], variants: ["图章/文字"], pitfalls: ["异常标记需人工确认"] }
        - { fieldName: "物流发运单号", definition: "单据上的发运单号", typicalLocations: ["单头", "条码"], variants: ["多格式"], pitfalls: ["与邮件发运单号交叉核对"] }
      acceptance: "签收人/时间/结果识别准确率 ≥95%；低置信度 → 标黄转人工复核。"
      samples: ["签收时间多格式统一为 YYYY-MM-DD HH:mm；异常签收需附说明并转人工"]

  relation:
    - id: "rrel_01"
      name: "交货单—物流—签收—对账—借贷项—POD确认—预制发票—凭证关联"
      fromObject: "SAP 交货单"
      toObject: "物流发运关联 / POD资料 / 对账单明细 / 借贷项 / POD确认 / 预制发票 / 过账凭证"
      objectType: "交货单号(DN) ↔ 发运单号 ↔ 签收资料 ↔ 对账单 ↔ 借贷项 ↔ POD确认 ↔ 预制发票 ↔ 凭证"
      meaning: "用交货单号(DN) 贯穿全链路：关联物流发运单、签收/POD、对账单明细、借贷项、POD 确认、预制发票与过账凭证，作为综合查询与审计的主键锚点。"
      rules:
        establish: "交货单号关联物流发运单与签收资料；对账单明细按交货单号汇总；差异借贷项挂对账单并关联交货单；POD 确认以交货单/DN 为颗粒度；POD 确认触发预制发票；过账凭证回写交货单"
        special: "一张对账单含多张交货单；一张交货单可有多个 POD 资料；客户自提以邮件确认视同签收；同交货单可拆分多箱需按箱级追踪（后续扩展）"
      scenarios: ["物流关联", "对账", "POD确认", "过账", "综合查询"]
      usagePoints: ["建立交货单-发运单关联", "创建对账单", "校验POD确认条件", "自动生成SAP预制发票", "回写凭证号与过账状态"]
      extra: "交货单号(DN) 是全链路主键锚点；物流发运单号以邮件原文为依据不开放手工改写。"

