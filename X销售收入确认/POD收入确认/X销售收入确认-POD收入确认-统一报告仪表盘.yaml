title: "X销售收入确认 · 销售POD收入确认统一报告"
subtitle: "单场景端到端：机会点定义 → AI画布 → To-be流程/CKD/任务拆解(P1)/规则挖掘(P2) → Agent本体 → Agent产品方案 → To-be旅程 → MVP原型 → UX优化 → 落地技术架构 → MVP成效指标 → 测试数据集"
executive_summary:
  - "一句话结论：把「人工在公共邮箱 / 公共文件夹 / 对账单之间收集核对签收凭据」升级为「<b>AI 自动采集识别 + 规则校验 + 人工放行确认</b>」，收入确认由人工 T+N 走向准实时。"
  - "本报告沿 <b>理需求 → 挖知识 → 建本体 → 生智能 → 评测</b> 给出可施工证据链：4 个机会点 · 25 个 L5 深度任务 · 11 条业务规则 · 10 个本体实体 · 5 个编排 Skill · 5 个原型页面 · 24 条测试用例。"
  - "技术路线：<b>Autonomous Planner</b>（1 编排 Agent + 5 Skill + 1 本体）；POD 确认为对外确认收入的强制人工闸门。"
