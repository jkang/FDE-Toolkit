meta:
  title: "X销售收入确认 · 机会点定义"
  sectionNo: "3.1"
  version: "v1.0"
  date: "2026-09-10"
  business: "X（销售 / 收入确认业务）"
  domain: "销售POD收入确认（SAP 交货单 → 物流签收 → 对账 → POD 确认 → 预制发票 → 过账）"
  scenario: "销售POD收入确认"
  problemRef: "承接问题①：销售POD收入确认依赖人工在公共邮箱 / 公共文件夹 / 对账单之间收集与核对签收凭据，流程断点多、时效差、审计链不完整，无法及时确认收入并过账"
  opportunitySource: "AI 机会场景地图 · 销售POD收入确认全链路（数据采集 → 对账 → POD 确认 → 过账）"

opportunities:
  - id: "OP1"
    order: 1
    name: "POD 资料智能采集 Agent（邮件识别 + 签收单识别）"
    type: "repetitive"
    rootCauseType: "操作量大靠人工 + 资料分散在公共邮箱 / 公共文件夹，靠人找邮件、下载、登记"
    capabilityMatch: "Agent / 邮件语义识别 / OCR 单证识别 / 文件归档"
    e1: "为物流人员与 CS 构建「POD 资料智能采集 Agent」，把「人工在公共邮箱与公共文件夹里找邮件、下载签收单、手工登记发运单号与签收信息」升级为「系统定时拉取 + AI 自动识别 + 结构化落库」，让每张 SAP 交货单自动关联物流发运单号并挂载有效签收 / POD 凭据。"
    e2: "角色：物流人员（补充 / 异常处理）、CS（对账与 POD 确认）、财务（审计取证）。\n场景：每批交货单出库后，系统从公共邮箱识别「交货单号 ↔ 物流公司 ↔ 物流发运单号」，从公共文件夹 / 客户自提邮件识别「签收人 / 签收时间 / 签收结果」，自动建立交货单与物流发运、签收凭据的关联。"
    e3: "物流发运单号主要来源于仓库与物流之间的邮件沟通，签收资料散落在公共文件夹与客户自提邮件中；人工逐单查找、下载、登记耗时且易漏，已发货未取发运单、已取得未签收长期挂在异常里，审计链不完整。"
    e4: "用 Agent 编排：公共邮箱 / 文件夹适配器定时拉取 → LLM 与规则识别邮件关键字段（交货单号、物流公司、发运单号、客户自提确认），OCR 识别签收单 / POD（签收人、时间、结果、单号）→ 文件服务归档原始件并回写结构化结果；低置信度或识别失败进入人工复核；物流发运单号以邮件原文为依据、不开放手工改写（补邮件 / 补充说明留痕）→ 把「已发货未关联 / 未签收」超期量向下降收敛。"
    e5: "物流发运关联与签收资料采集从人工逐单走向自动拉取识别；待关联、待签收超期量下降；审计链（邮件原文 + 原始签收件 + 识别结果）完整可追溯。"
    valueBreakdown:
      - dimension: "覆盖范围"
        aligns: "⑥ 影响范围"
        metric: "全部有 POD 的交货单采集链路；受益角色：物流人员 + CS + 财务（审计取证）"
      - dimension: "发生频度"
        aligns: "⑤ 发生频度"
        metric: "每张交货单一次采集与识别，按客户 / 周期高频批处理"
      - dimension: "单次收益"
        aligns: "⑦ 每次发生对业务的影响"
        metric: "单张交货单查邮件 / 下资料 / 登记由人工数分钟 → 自动拉取识别秒级；漏登与错登下降"
      - dimension: "累计影响"
        aligns: "⑧ 累计对业务影响"
        metric: "已发货未取发运单、已取得未签收超期积压下降；POD 确认前置资料齐备率提升"

  - id: "OP2"
    order: 2
    name: "对账差异智能分析（客户反馈 vs SAP 自动比对）"
    type: "cognitive"
    rootCauseType: "复杂度高靠人工比对 + 差异口径不统一，差异与借贷项 / POD 确认脱节"
    capabilityMatch: "结构化比对 / 差异归因 / 规则引擎"
    e1: "为 CS 构建「对账差异智能分析」，把「人工逐行比对客户反馈与 SAP 交货单、手工判断差异原因」升级为「系统自动比对 + 差异归因 + 借贷项建议」，让差异在 POD 确认前一次清干净。"
    e2: "角色：CS（创建对账单、上传客户反馈、处理差异）、财务（借贷项过账）。\n场景：CS 下载对账单给客户确认后，客户反馈文件上传，系统按客户一致性、交货单存在性、数量 / 金额一致性、重复 / 缺失反馈等规则自动做差异分析并归因。"
    e3: "对账差异靠人工逐单核对，口径不统一、易错漏；差异与借贷项、POD 确认脱节，导致 POD 确认前反复来回、等待借贷项过账。"
    e4: "用确定性规则引擎做字段级比对与差异分类，LLM 辅助非标差异归因与说明生成，差异结果自动生成 / 关联借贷项并跟踪过账状态；借贷项未完成不开放 POD 确认（人工闸门）→ 把对账差异处理时长与 POD 确认前置等待收敛。"
    e5: "对账差异从人工逐行比对走向自动比对归因；差异处理周期缩短；因差异未清导致的 POD 确认阻塞下降。"
    valueBreakdown:
      - dimension: "覆盖范围"
        aligns: "⑥ 影响范围"
        metric: "全部需对账客户；受益角色：CS + 财务（借贷项处理）"
      - dimension: "发生频度"
        aligns: "⑤ 发生频度"
        metric: "每张对账单一次差异分析，按客户 / 周期批量执行"
      - dimension: "单次收益"
        aligns: "⑦ 每次发生对业务的影响"
        metric: "逐行人工比对 → 自动比对归因；差异定位时长与错漏下降"
      - dimension: "累计影响"
        aligns: "⑧ 累计对业务影响"
        metric: "对账差异处理周期缩短；因差异 / 借贷项未清造成的 POD 确认阻塞下降"

  - id: "OP3"
    order: 3
    name: "POD 智能匹配与收入确认 Agent"
    type: "innovation"
    rootCauseType: "多条件人工判断 + 跨系统串联（交货单 / 物流 / 对账 / 借贷项）"
    capabilityMatch: "Agent / 规则校验 / 跨系统编排"
    e1: "为 CS 构建「POD 智能匹配与收入确认 Agent」，把「人工在多个系统间核对交货单、物流签收、对账完成、借贷项状态后判断能否确认收入」升级为「横向匹配表自动拉齐状态 + 规则校验确认条件 + 一键 POD 确认并自动生成预制发票」。"
    e2: "角色：CS（POD 匹配与确认）、CS 经理（特殊确认审批）、财务（过账）。\n场景：以交货单 / DN 为颗粒度，系统横向展示 SAP 交货单、物流发运单、签收 / POD、对账单、借贷项状态与匹配结论，条件满足后 CS 点击 POD 确认。"
    e3: "POD 确认条件（交货单已同步、物流关联、签收有效、对账完成、借贷项完成）分散在多处、靠人工判断，标准不一致；确认后又需人工触发预制发票，收入确认时效差。"
    e4: "用规则服务自动校验 POD 确认前置条件并给出可解释的匹配结论，Agent 汇总横向匹配表与缺口提示；「对外确认收入」保留人工点击闸门；POD 确认后自动触发 SAP 预制发票 → 把「已具备条件未 POD 确认」超期量与收入确认时效收敛。"
    e5: "POD 确认从多系统人工核对走向一屏匹配 + 一键确认；具备条件未确认超期下降；预制发票自动生成、收入确认时效提升。"
    valueBreakdown:
      - dimension: "覆盖范围"
        aligns: "⑥ 影响范围"
        metric: "全部有 POD 的交货单确认链路；受益角色：CS + CS 经理 + 财务"
      - dimension: "发生频度"
        aligns: "⑤ 发生频度"
        metric: "每张交货单一次 POD 匹配与确认，按批次高频处理"
      - dimension: "单次收益"
        aligns: "⑦ 每次发生对业务的影响"
        metric: "多系统人工核对 → 一屏匹配 + 一键确认；单张确认耗时与漏判下降"
      - dimension: "累计影响"
        aligns: "⑧ 累计对业务影响"
        metric: "「已具备条件未 POD 确认」超期量下降；收入确认时效与预制发票自动化率提升"

  - id: "OP4"
    order: 4
    name: "收入确认超期异常预警与驾驶舱"
    type: "cognitive"
    rootCauseType: "异常无统一口径与看板，靠人工发现，进度不透明"
    capabilityMatch: "规则引擎 / 预警推送 / 可视化"
    e1: "为 CS 经理与财务主管构建「收入确认超期异常预警与驾驶舱」，把「异常靠人工发现、进度不透明」升级为「驾驶舱实时展示待办与超期异常、按角色过滤并推送」。"
    e2: "角色：CS 经理（全局与异常）、财务主管（财务异常）。\n场景：首页驾驶舱按流程节点展示待办与单据数量，并单独列示已发货未取发运单、已取得未签收、已发货未创建对账单、具备条件未 POD 确认四类超期。"
    e3: "超期异常无统一口径，靠人工汇总，管理层无法实时掌握收入确认进度与阻塞点。"
    e4: "用规则引擎按可配置阈值计算超期异常，驾驶舱主看板全局公开、待处理清单按角色与数据范围过滤，IM 推送待办提醒；异常天数阈值可配置（人工确认口径）→ 把收入确认周期与异常积压收敛。"
    e5: "异常从被动发现走向主动预警；管理层实时可见进度与阻塞；超期积压下降。"
    valueBreakdown:
      - dimension: "覆盖范围"
        aligns: "⑥ 影响范围"
        metric: "全部销售POD收入确认链路；受益角色：CS 经理 + 财务主管 + 各岗位待办"
      - dimension: "发生频度"
        aligns: "⑤ 发生频度"
        metric: "看板实时刷新；超期异常按日 / 按配置阈值触发"
      - dimension: "单次收益"
        aligns: "⑦ 每次发生对业务的影响"
        metric: "人工汇总异常 → 自动预警推送；异常发现时效与遗漏下降"
      - dimension: "累计影响"
        aligns: "⑧ 累计对业务影响"
        metric: "收入确认周期与异常积压收敛；管理层对进度与阻塞点实时可见"
