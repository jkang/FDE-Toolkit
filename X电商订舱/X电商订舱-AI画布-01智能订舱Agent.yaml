title: 智能订舱 Agent（Ask Fin 升级为可执行订舱 Agent）
description: 将 X 电商订舱的 AI 智能客服（Ask Fin/小飞 Fin）从"问答机器人"升级为可执行订舱、单证查询与异常处置的 Agent，直接作用于北极星指标"电商订舱渗透率"（25%[推断]→40%）与 KPI 4（AI 分流率 30%+），覆盖 2025 年 150 万+ 次 AI 互动场景。
userRoles:
  - SME 货主（直客，非货代）
  - 货代 / NVOCC 操作员
  - 人工客服 / CSR
  - 订舱运营专员
userPains:
  - AI 问答对复杂多单、多单证场景处理有限，需频繁转人工（来源：B-L2 售后处理与 AI 客服 medium 痛点）
  - 复杂问题转人工时需重复提供上下文，一次性解决率低
  - SME 客户对"询价→订舱→跟单"全流程信息不对称、依赖人工（来源：phase3 应解决的核心痛点）
  - 新客首单无历史数据，Smart Push 预填不可用，首单仍偏慢（来源：B-L2 3步订舱表单 low 痛点）
aiInput:
  - 客户在聊天窗口/微信小程序输入的自然语言咨询或订舱意图
  - 客户历史对话记录与意图标签（脱敏）
  - 当前会话上下文（正在浏览的报价单 / 订单 / 船期页面）
  - 客户授权后的企业认证信息与账号画像
dataKnowledge:
  - 产品知识库：E-Spot / E-Quote / Secured E-Quote / 舱位保证 / 增值服务说明（FAQ 语料）
  - 订舱规则库：3 步表单字段、校验规则、必填项与合规要求
  - 实时业务数据：订单状态、船期计划、箱动态、单证进度（OMS / 控制塔 / 智慧单证）
  - 历史交易与报价记录（费率参考号、港口对、货方信息，Smart Push 语料）
  - 会员等级与权益规则（PlumSmart 体系）
workflow:
  - 意图识别与路由：识别咨询/订舱/查询/投诉意图并分类
  - 上下文融合：结合订单与单证实时状态理解多轮对话
  - 知识检索：从 FAQ / 规则库 / 知识库检索答案（RAG）
  - 订舱执行：对标准 SME 订单自动完成字段预填、校验并提交订舱请求
  - 状态查询与异常处置：查询跟踪状态、生成改配建议或赔付预判
  - 智能升级：复杂问题转人工时附完整对话摘要与客户画像
  - 闭环反馈：订舱结果与工单自动回写 CRM / OMS
modelUsage:
  - 核心对话与编排：Claude 3.5 Sonnet / GPT-4o 级别大语言模型（多轮任务执行 + 工具调用）
  - 意图识别与实体抽取：轻量分类模型 / Function Calling
  - 知识检索：Embedding 模型 + 向量数据库（RAG 架构）
  - 情感与风险识别：专用 NLP 模型（情绪分级、敏感词检测）
aiOutput:
  - 可执行的订舱确认 / 报价单 / 单证查询结果（不再是纯文本回答）
  - 订舱请求提交后的状态跟踪与通知推送
  - 复杂问题转人工时的上下文摘要报告
  - 客户意图标签、意向评分与 CRM 工单自动创建
tools:
  - 订舱系统 API（OMS：提交订舱 / 查询状态）
  - 报价引擎 API（E-Spot / E-Quote 实时报价）
  - 智慧单证系统 API（SI 状态 / eBL 进度）
  - 控制塔 / Cargo Tracking+ 数据接口
  - 微信小程序客服消息接口 / 邮件通知网关
  - CRM 工单系统 API（自动建单与回写）
productType:
  - 独立电商平台内嵌 AI 助手（网页端 + 微信小程序）
  - X Mobile App 全天候聊天机器人（已上线基础版，升级为 Agent 能力）
  - 面向货代客户的 API 集成式 Agent 服务（[推断]扩展方向）
userGains:
  - AI 分流率从现状提升至 30%+（KPI 4），人工客服成本显著下降
  - 平均订舱确认时效向 ≤2 小时（KPI 3）收敛，对标行业头部分钟级体验
  - SME 全流程自助率提升 → 电商订舱渗透率（北极星）加速向 40% 演进
  - 复杂问题一次性解决率与 CSAT 提升，直客（非货代）订单占比向 40%（KPI 7）靠拢
