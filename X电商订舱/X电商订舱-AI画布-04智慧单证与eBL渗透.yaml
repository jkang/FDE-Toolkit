title: 智慧单证增强与 eBL 生态渗透
description: 在 2025 年智慧单证自动处理约 35 万份装运指示（SI）的基础上，扩展多语言品名识别与合规校验，并将 IQAX eBL / GSBN 区块链电子提单从"签发端"推向"收货人/银行全链路"，加速 eBL 渗透率向 30%+（KPI 6）演进，兑现无纸化红利。
userRoles:
  - 单证团队（SI 审核与提单签发）
  - SME 货主 / 货代操作员（SI 提交方）
  - 收货人 / 目的港代理（放货方）
  - 银行 / 金融机构（贸易融资环节）
userPains:
  - 多语言品名 / 长尾字段仍需人工复核，退单返工偶尔发生（来源：C-体验旅程图-智慧单证增强；B-L2 medium 痛点）
  - 收货人 / 银行未接入 eBL 时退回纸质流程，正本流转慢产生额外 D&D（来源：B-L2 high 痛点）
  - 纸质提单打印、快递与回收管理耗时且易出错
  - 跨平台互操作标准不统一，eBL 渗透仍处拐点期（来源：B-L2 high 痛点）
aiInput:
  - 货主提交的 SI / VGM 数据（装箱数据、唛头、品名、重量）
  - 贸易单据扫描件（PI、装箱单、商业发票）
  - 提单签发请求与贸易条款
  - 收货人 / 银行 eBL 接入状态与互操作信息
dataKnowledge:
  - 多语言品名词典与 HS 编码库（海关监管对照）
  - 历史 SI 样本库（已校验通过案例，35 万份/年沉淀）
  - 单证校验规则库（必填项、格式、VGM 合规、舱单要求）
  - IQAX eBL / GSBN 区块链互操作规则（IG P&I 批准标准）
  - 各目的港放货与免箱期政策（D&D 计费规则）
workflow:
  - 单据解析：OCR + 文档智能解析提取 PI / 装箱单字段
  - 多语言识别：品名 / 唛头多语言规范化（中英西日等）
  - 合规校验：字段完整性、HS 编码、VGM、监管申报规则校验
  - 自动纠错回填：对标准件自动纠错并回填系统，长尾件转人工复核
  - eBL 签发与推送：经 IQAX eBL 签发并推送收货人 / 银行
  - 接入引导：对未接入方推送轻量 eBL 门户引导与互操作状态预判
  - 放货闭环：目的港 eBL 放货状态回写与异常预警
modelUsage:
  - OCR + 文档智能解析：LayoutLM / PaddleOCR 类模型（单据字段抽取）
  - 多语言 NER：品名 / 地名 / 组织的跨语言实体识别
  - 大语言模型：品名合规释义与长尾字段人工复核辅助建议
  - 图算法 / 规则引擎：贸易链节点 eBL 接入度分析（互操作预判）
aiOutput:
  - 校验通过的 SI / VGM（一次提交通过率提升）
  - 多语言品名标准化结果与合规风险提示
  - eBL 电子提单（经 IQAX / GSBN 签发）
  - 收货人 / 银行接入引导与放货状态看板
tools:
  - 智慧单证系统（订舱门户 / 独立电商平台内嵌）
  - IQAX eBL / IQAX One 平台接口（2026.06 预发布）
  - GSBN 区块链网络（跨平台互操作）
  - 文档扫描 / OCR 服务（移动 App AI 文件撷取复用）
  - D&D 计费系统（放货费用联动）
productType:
  - 智慧单证系统增强模块（后台能力升级）
  - 收货人 / 银行轻量 eBL 门户（面向贸易链节点）
  - LCL eBL 试点产品（2026.06 已启动，AI 引导扩面）
userGains:
  - eBL 渗透率向 30%+（KPI 6）演进，退回纸质比例下降
  - 单证人工复核比例下降，35 万份/年效率红利释放
  - 放货周期缩短，目的港 D&D 争议与成本下降
  - 融资 / 放货环节无纸化闭环，支撑"订舱-单证-放货"全流程电商化
