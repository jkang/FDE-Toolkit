title: AI 动态定价与锁价风控（运价预测 + 舱位保证）
description: 基于历史成交、市场运价指数（SCFI/CCFI）与舱位余量构建动态定价与锁价风险对冲能力，支撑 E-Spot 即期报价、Secured E-Quote 锁价产品与舱位保证（Space Protection）承诺，解决"锁价后运价下行客户弃约"与"旺季 SME 甩柜"两大信任缺口（对应 KPI 5 舱位兑现率 95%+）。
userRoles:
  - 收益管理分析师
  - 舱位管理 / 航线运力管理者
  - SME 货主（锁价与即期报价使用者）
  - 财务 / 风险控制团队
userPains:
  - Secured E-Quote 锁价后若市场运价大幅下行，客户相对成本劣势与弃约风险（来源：C-体验旅程图-动态锁价风控；B-L2 high 痛点）
  - 即期报价仅覆盖特定 X 航次，部分港口无透明报价 [推断]（来源：B-L2 medium 痛点）
  - 旺季/运力波动期舱位向高价值客户倾斜，SME 甩柜或改船风险上升（来源：B-L2 high 痛点）
  - 运价波动（2025 年关税 / 红海扰动）传导至锁价成本，缺乏对冲模型
aiInput:
  - 客户询价请求（起运港 / 目的港 / 货量 / 箱型 / 船期偏好）
  - 当前市场运价指数（SCFI / CCFI）与航线即期报价行情
  - 目标航次舱位余量与装载率快照
  - 锁价产品参数（期限、条款、Secured E-Quote 规格）
dataKnowledge:
  - 历史成交价库：电商渠道历次 E-Spot / E-Quote 成交记录（200 万+ TEU 电商货量沉淀 [推断]）
  - 市场运价指数时序（SCFI / CCFI / 附加费 BAF/THC 规则）
  - 航线网络与船期计划（海洋联盟 DAY9/DAY10 运力配置）
  - 客户价值分级与会员等级数据（PlumSmart 权益规则）
  - 历史运价波动事件库（关税政策 / 红海绕航 / 运力过剩周期）
workflow:
  - 特征工程：聚合历史成交价、市场指数、舱位余量与事件特征
  - 需求预测：预测航线未来 4-12 周装载率与运价走势
  - 风险定价：对锁价产品计算波动风险敞口与对冲成本
  - 报价生成：生成全航线即期报价与个性化锁价区间建议
  - 承诺校验：以电商舱位保证兑现率为硬约束做舱位分配预演
  - 监控反馈：实际成交与兑现数据回流，持续校准模型
modelUsage:
  - 时序预测：Prophet / LightGBM / XGBoost 或深度时序模型（运价与装载率预测）
  - 风险建模：蒙特卡洛模拟（锁价风险敞口与 VaR 测算）
  - 推荐排序：运价推荐模型（Smart Push 升级，个性化报价排序）
  - 大语言模型：生成客户可解释的报价说明与锁价条款解释
aiOutput:
  - 全航线即期报价（填补透明报价盲区）
  - 锁价区间建议与弃约补偿条款（Secured E-Quote 升级）
  - 舱位分配预演报告（SME 舱位保证兑现率测算）
  - 运价走势与风险预警简报（面向收益管理团队）
tools:
  - 收益管理系统（舱位分配 / 运价配置）
  - 市场运价指数数据源（SCFI / CCFI API）
  - 电商报价引擎（E-Spot / E-Quote / All-in-One 询价接口）
  - 船舶动态与船期系统（海洋联盟运力数据）
  - BI / 数据仓库（历史成交与财务数据）
productType:
  - 报价引擎内置 AI 定价模块（后端能力，前端无感）
  - 收益管理团队决策辅助看板（运价预测 + 风险预警）
  - 面向客户的"锁价风险可视化"页面（[推断]扩展方向）
userGains:
  - 舱位保证兑现率向 95%+（KPI 5）收敛，SME 复购与信任提升
  - 锁价弃约率下降，收益风险敞口受控（对冲 2025 年溢利 -41.3% 的运价波动冲击）
  - 全航线透明报价覆盖扩大，减少 SME 跨平台比价流失
  - 电商单箱服务成本向 -20%（KPI 8）目标贡献定价自动化红利
