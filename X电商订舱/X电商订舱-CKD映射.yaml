title: "X电商订舱 AI 场景 CKD 映射报告"
product: "X电商订舱 AI 能力集（5 大重点场景）"
description: "基于 A 阶段 AI 机会地图与 B 阶段 5 个代表性 AI Canvas（智能订舱 Agent、动态定价与锁价风控、控制塔预测性预警、智慧单证与 eBL 渗透、会员智能运营与复购预测），逐场景梳理每步 AI 执行所需的上下文（Context）、知识（Knowledge）与数据（Data）资产，为 RAG 与提示词工程提供资产清单。数据规模基于 X 2025 年报公开口径（电商 200 万+ TEU、AI 互动 150 万+ 次、智慧单证 35 万份/年）与业务常识推算 [推断]。"
steps:
  - step_name: "S1-智能订舱 Agent · 意图识别与路由"
    ckd_items:
      - context_name: "意图分类 Prompt 模板"
        description: "将货主咨询分类为询价/订舱/查询/投诉/单证等意图，含 Few-shot 示例与行业术语表，驱动 LLM 意图路由。"
        type: "Prompt Template"
        storage: "Prompt 版本库 / 配置中心"
        volume: "~50 组意图模板"
        ai_init: true
        frequency: "随发版"
        retrieval: "规则引擎 + 语义分类"
        status: "已支持（基础版）"
      - context_name: "历史对话记录（脱敏）"
        description: "货主近 N 轮对话与历史意图标签，用于多轮上下文继承与个性化。"
        type: "会话时序数据"
        storage: "Redis / 对话存储"
        volume: "150 万+ 互动/年（2025）"
        ai_init: true
        frequency: "实时"
        retrieval: "会话 ID 精确查询"
        status: "已支持"
  - step_name: "S1-智能订舱 Agent · 知识检索与业务状态查询"
    ckd_items:
      - context_name: "产品 FAQ 与报价知识库"
        description: "E-Spot/E-Quote/Secured E-Quote/舱位保证/增值服务说明，RAG 检索用于回答运价与产品咨询。"
        type: "向量嵌入"
        storage: "Milvus / 向量数据库"
        volume: ">5,000 条问答对"
        ai_init: true
        frequency: "随发版"
        retrieval: "语义相似度检索"
        status: "已支持"
      - context_name: "实时订单 / 船期 / 箱动态 API"
        description: "OMS、船期系统与控制塔的实时状态数据，Agent 工具调用获取订单进度与跟踪里程碑。"
        type: "API 数据"
        storage: "OMS / 控制塔 / Cargo Tracking+"
        volume: "动态查询（QPS 级）"
        ai_init: false
        frequency: "实时"
        retrieval: "API 精确查询"
        status: "已支持（部分接口）"
  - step_name: "S1-智能订舱 Agent · 订舱执行与确认"
    ckd_items:
      - context_name: "订舱校验规则引擎"
        description: "3 步表单必填项、费率/信用/航线校验规则，Agent 执行订舱前的自动校验逻辑。"
        type: "规则库"
        storage: "规则引擎 / OMS"
        volume: ">200 条校验规则"
        ai_init: false
        frequency: "季度更新"
        retrieval: "规则链匹配"
        status: "已支持（覆盖不全）"
      - context_name: "货主信用与认证数据"
        description: "企业认证状态、信用等级、会员等级，决定订舱放行与权益应用。"
        type: "关系型数据"
        storage: "CRM / 风控系统"
        volume: "~数十万企业账户"
        ai_init: false
        frequency: "低频（变更触发）"
        retrieval: "货主 ID 查询"
        status: "已支持"
  - step_name: "S1-智能订舱 Agent · 转人工与工单闭环"
    ckd_items:
      - context_name: "客服知识库与 SOP"
        description: "疑难场景处理标准作业流程（改船/退款/投诉），用于生成转人工摘要与处理建议。"
        type: "结构化文档"
        storage: "MongoDB / 文档库"
        volume: "<500 篇 SOP"
        ai_init: true
        frequency: "月度沉淀"
        retrieval: "标签 + 关键词检索"
        status: "建设中"
      - context_name: "工单系统数据"
        description: "货主咨询、工单状态与处理结果，Agent 自动建单与回写形成闭环。"
        type: "关系型数据"
        storage: "工单系统 / CRM"
        volume: "动态增长"
        ai_init: false
        frequency: "实时"
        retrieval: "工单号查询"
        status: "已支持"

  - step_name: "S2-动态定价与锁价风控 · 特征工程与运价建模"
    ckd_items:
      - context_name: "历史成交价库"
        description: "电商渠道历次 E-Spot/E-Quote 成交记录（含货量、航线、附加费），定价模型训练主数据。"
        type: "时序 / 关系型数据"
        storage: "数据仓库 / 时序库"
        volume: "200 万+ TEU 电商货量对应成交记录 [推断]"
        ai_init: true
        frequency: "每日增量"
        retrieval: "航线 + 时间窗口查询"
        status: "已支持"
      - context_name: "市场运价指数（SCFI/CCFI）"
        description: "外部市场行情指数与附加费规则（BAF/THC），外部信号用于运价走势预测。"
        type: "API 数据"
        storage: "指数数据源 API"
        volume: "每周/每日指数点"
        ai_init: false
        frequency: "每周"
        retrieval: "API 拉取"
        status: "建设中"
  - step_name: "S2-动态定价与锁价风控 · 风险测算与报价生成"
    ckd_items:
      - context_name: "锁价产品参数库"
        description: "Secured E-Quote 期限、条款与履约记录，风险对冲模型的关键输入。"
        type: "结构化数据"
        storage: "报价系统 / 收益系统"
        volume: ">10 万锁价单 [推断]"
        ai_init: true
        frequency: "实时"
        retrieval: "产品 ID 查询"
        status: "已支持（2025.01 上线）"
      - context_name: "历史运价波动事件库"
        description: "关税政策、红海绕航、运力过剩等事件对运价的影响样本，用于情景模拟与 VaR 测算。"
        type: "事件标注库"
        storage: "标签数据 / 向量库"
        volume: "<500 个事件样本"
        ai_init: true
        frequency: "事件驱动"
        retrieval: "语义检索 + 时间过滤"
        status: "待规划"
      - context_name: "货主价值与会员数据"
        description: "货主价值分级与 PlumSmart 等级，支持差异化报价与舱位权益。"
        type: "关系型数据"
        storage: "CRM / 会员系统"
        volume: "~数十万货主"
        ai_init: false
        frequency: "日更新"
        retrieval: "货主 ID 查询"
        status: "已支持"
  - step_name: "S2-动态定价与锁价风控 · 舱位承诺校验"
    ckd_items:
      - context_name: "航线装载率与舱位余量"
        description: "目标航次实时装载率与舱位余量，舱位分配预演与承诺兑现约束输入。"
        type: "实时业务数据"
        storage: "舱位分配引擎 / 收益系统"
        volume: "180+ 周班次动态数据"
        ai_init: false
        frequency: "实时"
        retrieval: "航次号查询"
        status: "已支持"
      - context_name: "电商承诺兑现率指标（KPI 5）"
        description: "Space Protection 产品历史兑现率，作为分配模型的硬约束与效果度量。"
        type: "指标数据"
        storage: "BI / 指标平台"
        volume: "月度指标"
        ai_init: false
        frequency: "月度"
        retrieval: "指标查询"
        status: "已支持"

  - step_name: "S3-控制塔预测性预警 · 多源数据接入"
    ckd_items:
      - context_name: "AIS 船舶动态"
        description: "船舶位置、航速与历史航迹，ETA 预测与异常识别的核心信号源。"
        type: "时空时序数据"
        storage: "AIS 数据服务 / 时序库"
        volume: "全球船队分钟级点位"
        ai_init: false
        frequency: "秒级"
        retrieval: "MMSI + 时间窗口"
        status: "建设中（外部依赖）"
      - context_name: "码头作业与拥堵数据"
        description: "靠泊/装卸状态与港口拥堵指数，影响到港节点预测精度。"
        type: "API 数据"
        storage: "码头接口 / 港口数据源"
        volume: "多港动态"
        ai_init: false
        frequency: "小时级"
        retrieval: "API 拉取"
        status: "建设中"
      - context_name: "船期计划与联盟运力调整"
        description: "海洋联盟 DAY9/DAY10 船期与运力变更，基线数据。"
        type: "结构化数据"
        storage: "船期系统"
        volume: "周班次计划"
        ai_init: false
        frequency: "随发版"
        retrieval: "航线查询"
        status: "已支持"
  - step_name: "S3-控制塔预测性预警 · ETA 预测与延误判定"
    ckd_items:
      - context_name: "历史延误案例库"
        description: "延误原因、时长分布与港口/航线特征，训练 ETA 延误概率模型。"
        type: "向量嵌入 + 结构化"
        storage: "特征存储 / 向量库"
        volume: ">10,000 个延误案例 [推断]"
        ai_init: true
        frequency: "月度沉淀"
        retrieval: "语义相似度 + 特征过滤"
        status: "待规划"
      - context_name: "港口拥堵特征库"
        description: "码头作业效率、季节性拥堵模式，预测模型外部特征。"
        type: "时序特征数据"
        storage: "特征平台"
        volume: "多港多年特征"
        ai_init: true
        frequency: "日更新"
        retrieval: "港口 + 时间检索"
        status: "待规划"
  - step_name: "S3-控制塔预测性预警 · 预警推送与处置建议"
    ckd_items:
      - context_name: "Delay in Transit 条款与赔付规则"
        description: "2025.12 上线的迟延转运保障条款，自动生成赔付预判。"
        type: "结构化文档"
        storage: "文档库 / 规则引擎"
        volume: "<100 条条款"
        ai_init: true
        frequency: "低频"
        retrieval: "条款关键词匹配"
        status: "已支持"
      - context_name: "货主订阅偏好与通知渠道"
        description: "货主对预警的订阅偏好与通知渠道（邮件/小程序/App），主动推送个性化。"
        type: "关系型数据"
        storage: "CRM / 消息中心"
        volume: "~数十万货主"
        ai_init: false
        frequency: "实时"
        retrieval: "货主 ID 查询"
        status: "已支持"
      - context_name: "改配与补偿 SOP"
        description: "改船方案模板、免箱期政策与补偿标准，生成处置建议的知识基座。"
        type: "结构化文档"
        storage: "知识库 / SOP 库"
        volume: "<300 篇"
        ai_init: true
        frequency: "季度更新"
        retrieval: "标签 + 关键词检索"
        status: "建设中"

  - step_name: "S4-智慧单证与 eBL · 单据解析与多语言识别"
    ckd_items:
      - context_name: "贸易单据扫描件（PI/装箱单/发票）"
        description: "OCR 与文档智能解析的原始输入，抽取品名、唛头、数量、重量字段。"
        type: "非结构化文档"
        storage: "对象存储 / 文档库"
        volume: "日级单据流"
        ai_init: true
        frequency: "实时"
        retrieval: "OCR + 字段抽取"
        status: "已支持（AI 文件撷取）"
      - context_name: "多语言品名词典与 HS 编码库"
        description: "中英西日等多语言品名规范化对照与海关 HS 编码映射，合规校验知识基座。"
        type: "静态字典"
        storage: "Redis / 字典库"
        volume: ">50 万词条 [推断]"
        ai_init: true
        frequency: "季度更新"
        retrieval: "Key-Value / 模糊匹配"
        status: "建设中"
  - step_name: "S4-智慧单证与 eBL · 合规校验与自动纠错"
    ckd_items:
      - context_name: "历史 SI 样本库（校验通过）"
        description: "35 万份/年自动处理沉淀的历史样本，训练校验与纠错模型。"
        type: "向量嵌入 + 结构化"
        storage: "数据仓库 / 向量库"
        volume: "35 万份/年（2025）"
        ai_init: true
        frequency: "每日增量"
        retrieval: "语义相似度检索"
        status: "已支持"
      - context_name: "单证校验规则库"
        description: "必填项、格式、VGM、舱单与监管申报规则，自动校验逻辑来源。"
        type: "规则库"
        storage: "规则引擎"
        volume: ">300 条规则"
        ai_init: false
        frequency: "随监管更新"
        retrieval: "规则链匹配"
        status: "已支持（覆盖不全）"
  - step_name: "S4-智慧单证与 eBL · eBL 签发与生态渗透"
    ckd_items:
      - context_name: "IQAX eBL / GSBN 互操作规则"
        description: "IG P&I 互操作批准标准与跨平台规则，判断 eBL 可签发与流通范围。"
        type: "结构化文档"
        storage: "IQAX 平台 / 文档库"
        volume: "<500 条规则"
        ai_init: true
        frequency: "随标准更新"
        retrieval: "条款检索"
        status: "已支持（2024.12 批准）"
      - context_name: "收货人 / 银行 eBL 接入状态"
        description: "贸易链各节点的 eBL 接入度与活跃度，用于渗透引导与互操作预判。"
        type: "关系型数据"
        storage: "IQAX One / 货主数据"
        volume: "贸易链节点数级"
        ai_init: false
        frequency: "日更新"
        retrieval: "节点 ID 查询"
        status: "建设中（LCL eBL 试点 2026.06）"

  - step_name: "S5-会员智能运营 · 货主行为画像"
    ckd_items:
      - context_name: "订舱交易序列"
        description: "订单时间、航线、货量、箱型与金额的时序序列，复购与流失预测主数据。"
        type: "时序数据"
        storage: "数据仓库 / 特征平台"
        volume: "200 万+ TEU 交易事件"
        ai_init: true
        frequency: "每日增量"
        retrieval: "货主 ID + 时间窗口"
        status: "已支持"
      - context_name: "货主行为事件流"
        description: "浏览报价、询价、客服互动、App 使用等行为事件，行为特征补充。"
        type: "事件流数据"
        storage: "数据湖 / 事件总线"
        volume: "日级事件流"
        ai_init: true
        frequency: "实时"
        retrieval: "货主 ID + 事件类型"
        status: "建设中"
  - step_name: "S5-会员智能运营 · 复购与流失预测"
    ckd_items:
      - context_name: "历史流失货主样本"
        description: "流失货主流失前的行为模式，训练流失预警与复购概率模型。"
        type: "标注数据集"
        storage: "特征存储 / ML 平台"
        volume: ">5,000 个流失样本 [推断]"
        ai_init: true
        frequency: "季度更新"
        retrieval: "特征过滤 + 模型推理"
        status: "待规划"
      - context_name: "会员等级与权益规则库"
        description: "PlumSmart 等级规则与权益定义，生成升级路径建议与权益组合。"
        type: "结构化文档"
        storage: "会员系统 / 规则库"
        volume: "<200 条规则"
        ai_init: false
        frequency: "随发版"
        retrieval: "规则链匹配"
        status: "已支持"
  - step_name: "S5-会员智能运营 · 个性化运营与挽留动作"
    ckd_items:
      - context_name: "权益 / 促销效果数据"
        description: "E-Spot Flash Sale、Promo Code、Smart Combo 历史转化与复购拉动效果，推荐模型训练数据。"
        type: "关系型数据"
        storage: "营销自动化 / BI"
        volume: "年度活动记录"
        ai_init: true
        frequency: "活动后更新"
        retrieval: "活动 ID 查询"
        status: "已支持"
      - context_name: "舱位余量与闪购放量计划"
        description: "促销与舱位保证强耦合的放量计划，避免权益承诺落空。"
        type: "实时业务数据"
        storage: "促销引擎 / 舱位系统"
        volume: "活动级"
        ai_init: false
        frequency: "实时"
        retrieval: "航次 + 活动查询"
        status: "已支持"
      - context_name: "CRM 货主标签体系"
        description: "货主画像标签与分层，个性化触达与挽留动作的目标圈选。"
        type: "关系型数据"
        storage: "CRM / CDP"
        volume: "~数十万货主"
        ai_init: false
        frequency: "日更新"
        retrieval: "标签组合查询"
        status: "建设中"
