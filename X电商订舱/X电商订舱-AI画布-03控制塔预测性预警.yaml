title: 控制塔 AI 预测性预警（ETA 预测与异常管理）
description: 将控制塔（Control Tower，2022.09）从"可视化"升级为"可预测"，基于多源船箱数据（AIS / 码头接口 / 船期计划）预测 ETA 延误概率并提前 24-72 小时推送预警与自动处置建议，解决"异常预警事后通知、下游备货计划被打乱"的 critical 级痛点（来源：B-L2 异常预警与处置）。
userRoles:
  - 控制塔运营团队
  - SME 货主 / 收货人（下游备货决策者）
  - 人工客服（问询与异常处置）
  - 目的港代理
userPains:
  - ETA 延误多为事后通知，缺乏预测性预警，下游备货 / 生产计划被打乱（来源：C-体验旅程图-AI 预测性预警；B-L2 critical 痛点）
  - 跟踪粒度受码头 / 船司数据源限制，部分节点更新延迟（来源：B-L2 high 痛点）
  - 直客 SME 高频咨询"货到哪了"，客服查询量高企
  - 旺季甩柜 / 改船后补偿与改配方案被动，SME 货期被打乱（来源：C-体验旅程图）
aiInput:
  - 实时船舶动态（AIS 位置 / 航速 / 历史航迹）
  - 码头作业状态（靠泊 / 装卸 / 拥堵指数）
  - 船期计划与联盟运力调整信息（DAY9/DAY10）
  - 订舱 / 箱动态（箱号、状态里程碑、转船记录）
  - 客户订阅偏好与通知渠道（邮件 / 小程序 / App）
dataKnowledge:
  - 历史延误案例库（延误原因、时长分布、港口/航线特征）
  - 港口拥堵特征库（码头作业效率、季节性拥堵模式）
  - 航线基础数据（航程、挂靠港顺序、联盟船期）
  - Delay in Transit（2025.12）保障条款与赔付规则
  - 改配与补偿 SOP（改船方案模板、免箱期政策）
workflow:
  - 多源数据接入：聚合 AIS / 码头 / 船司 / 内部 OMS 数据
  - ETA 预测：对每个里程碑（离港 / 中转 / 到港）预测概率分布
  - 延误判定：超过阈值触发预警并评估影响窗口
  - 处置建议生成：自动匹配改配方案 / 延保 / 赔付预案
  - 主动推送：按客户订阅偏好多渠道提前通知
  - 闭环学习：实际到港时间回流校正预测模型
modelUsage:
  - ETA 预测：图神经网络 / 时序模型（泊位-港口-航线多维预测）或 GBDT 集成
  - 异常检测：聚类 + 阈值规则（识别异常停留、绕航、超时节点）
  - 大语言模型：生成面向客户的可解释预警文案与处置建议摘要
  - 强化学习（远期）：改配方案的多目标优化（[推断]扩展）
aiOutput:
  - ETA 延误概率预测（里程碑级，提前 24-72 小时）
  - 主动预警通知（含延误原因、影响分析与建议动作）
  - 自动改配方案与赔付预判（Delay in Transit 联动）
  - 控制塔"可预测"看板（风险订单红黄绿分级）
tools:
  - AIS 数据服务（船舶位置与航迹）
  - 码头作业接口 / 港口拥堵数据源
  - 控制塔平台与 Cargo Tracking+（2026.07 新版）
  - 消息推送网关（邮件 / 微信小程序 / App 推送）
  - OMS 与改配系统（自动改配执行）
productType:
  - 控制塔 AI 预警模块（平台内置，客户零安装）
  - 面向 SME 的"风险订阅"通知服务（可配置预警规则）
  - 移动 App 预测性通知（推送 ETA 变更）
userGains:
  - 关键异常从"事后通知"转为"提前 24-72 小时预测"，下游备货计划保护
  - 客服查询量下降（AI 分流率 KPI 4 间接拉动）
  - 改配成本与赔付金额下降（Delay in Transit 联动）
  - 直客与 SME 对 X 端到端确定性的信任增强 → 渗透率长期提升
