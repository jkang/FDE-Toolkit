title: 会员智能运营与复购预测（PlumSmart 升级）
description: 基于订舱交易序列与行为数据，为 PlumSmart 会员体系（2021.07 上线）构建复购概率预测、流失预警与个性化权益推荐，解决"会员权益感知弱、等级晋升复杂、复购依赖价格敏感"痛点，将 SME 长尾货主转化为高黏性直客资产（对应 KPI 2 FreightSmart 活跃货主 5 万+ 与 KPI 7 直客占比 40%）。
userRoles:
  - 电商运营（会员运营团队）
  - SME 货主（会员与复购主体）
  - 数字营销团队（促销与触达）
  - 销售团队（大货主协同）
userPains:
  - 会员等级晋升复杂，专属权益感知弱，复购激励不足（来源：C-体验旅程图-会员智能运营；B-L2 medium 痛点）
  - 权益设计偏向运价折扣，缺对 SME 刚需（舱位优先、专属客服通道）的强绑定（来源：B-L2 medium 痛点）
  - 复购主要依赖价格敏感驱动，货主生命周期价值提升慢（来源：B-L2 high 痛点）
  - 促销依赖舱位余量放量，SME 对能否抢到舱位存在信任疑虑（来源：B-L2 medium 痛点）
aiInput:
  - 货主订舱交易序列（订单时间、航线、货量、箱型、金额）
  - 会员等级与积分 / 权益消费记录
  - 货主行为事件（浏览报价、询价、客服互动、App 使用）
  - 促销活动参与记录（E-Spot Flash Sale / Promo Code / Smart Combo）
dataKnowledge:
  - PlumSmart 会员等级与权益规则库
  - 历史流失货主样本（流失前行为模式特征）
  - 权益 / 促销效果历史数据（转化、复购拉动）
  - 货主画像与标签体系（CRM 分层）
  - 舱位余量与闪购放量计划（营销与舱位耦合）
workflow:
  - 行为特征工程：构建交易序列、频次、航线集中度、互动活跃度特征
  - 复购预测：预测货主未来 30/90 天复购概率与流失风险
  - 权益推荐：基于货主刚需（舱位优先 / 专属客服 / 免箱期）生成个性化权益组合
  - 升级路径建议：为 SME 设计可感知、可达成的等级跃迁路径
  - 挽留动作：对流失预警货主自动触发优惠 / 关怀动作
  - 效果闭环：权益与促销结果回流，持续校准推荐模型
modelUsage:
  - 复购 / 流失预测：生存分析（Cox）或 GBDT / 深度学习序列模型
  - 货主分群：聚类分析（按价值 / 航线 / 行为模式分层）
  - 推荐系统：多臂老虎机 / 协同过滤（权益与促销个性化推荐）
  - 大语言模型：生成会员权益解读文案与关怀消息
aiOutput:
  - 复购概率与流失风险评分（货主 360 视图）
  - 个性化权益组合与升级路径建议
  - 挽留 / 关怀动作自动触发（优惠券、专属舱位预约）
  - 会员运营看板（等级分布、权益领取率、复购率）
tools:
  - PlumSmart 会员系统与 CRM
  - 营销自动化平台（邮件 / 微信小程序推送）
  - 促销引擎（E-Spot Flash Sale / Promo Code / Smart Combo）
  - 舱位余量接口（权益与舱位耦合）
  - BI / 数据仓库（交易与行为数据）
productType:
  - 会员运营后台 AI 模块（运营团队决策辅助）
  - 货主侧"我的成长路径"页面（权益可视化与升级引导）
  - 智能挽留工作流（自动化营销）
userGains:
  - FreightSmart 活跃货主数向 5 万+（KPI 2）演进，SME 会员活跃度提升
  - 复购率与货主生命周期价值提升，摊薄获客成本
  - 直客（非货代）订单占比向 40%（KPI 7）靠拢
  - 促销与舱位保证强耦合，SME 对闪购的信任疑虑下降
