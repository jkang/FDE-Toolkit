title: "X电商订舱 · 智能订舱 Agent 统一报告"
subtitle: "单场景端到端：机会点定义 → AI画布 → To-be流程/CKD/任务拆解(P1)/规则挖掘(P2) → Agent本体 → Agent产品方案 → To-be旅程 → MVP原型 → UX优化 → 落地技术架构 → MVP成效指标 → 测试数据集"
executive_summary:
  - "一句话结论：把 AI 智能客服（Ask Fin）从「问答机器人」升级为「<b>可执行订舱 Agent</b>」——报价逐项解读、舱位综合排序推荐、订舱表单自动预填与规则校验、单证 OCR 预填与 SI 校验、出运跟踪与延误改配，直接作用于北极星「电商订舱渗透率 25%[推断]→40%」与「AI 分流率 30%+」。"
  - "本报告沿 <b>理需求 → 挖知识 → 建本体 → 生智能 → 评测</b> 给出可施工证据链：5 个机会点 · 21 个 L5 深度任务 · 9 条业务规则 · 10 个本体实体 · 3 个编排 Skill · 6 个原型页面 · 30 条测试用例。"
  - "技术路线：<b>Autonomous Planner</b>（1 编排 Agent + 3 Skill + 1 本体）；护栏：报价/评分/校验/ETA 一律来自确定性服务，LLM 不直接产出；订舱与 SI 推送为对外动作，强制人工放行。"
