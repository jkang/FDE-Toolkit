meta:
  title: "智能订舱 Agent · 落地技术架构方案"
  scenario: "智能订舱 Agent"
  company: "X电商订舱"
  route: "Autonomous Planner"
  routeReason: "用户入口开放（可能只问报价、直接订舱或跨多环节），路径需运行时规划；3 个 Skill 职责稳定但调用路径由上下文决定。"
  patternSummary: "1 编排 Agent + 3 Skill + 1 本体"
  date: "2026-09-10"

agent:
  name: "编排 Agent · Autonomous Planner"
  role: "意图识别 · 规划 · 调度 Skill · 发起 HITL · 异常兜底"
  loop: "Plan → Act → Observe"
  memory: ["任务级上下文", "场景级会员画像"]
  note: "不直接算数，只做规划与调度"

routing:
  - { intent: "询价 / 推荐", skill: "skill_quote" }
  - { intent: "订舱 / 单证", skill: "skill_booking" }
  - { intent: "跟踪 / 售后", skill: "skill_tracking" }

skills:
  - id: "skill_quote"
    name: "Skill ① 报价解读与舱位推荐"
    type: "skill"
    trigger: "询价 / 推荐（开放入口）"
    pattern: "orchestrator-worker"
    whyNotSubagent: "步骤固定、记忆共享、无需独立规划 → 判 Skill"
    handoff: "→ 货主确认后进入 Skill ② 订舱链"
    nodes:
      - { id: "a0", label: "询价输入", type: "op" }
      - { id: "a1", label: "实体抽取", note: "小模型", type: "small" }
      - { id: "a2", label: "E-Spot 报价检索", note: "MCP · 报价引擎", type: "mcp" }
      - { id: "a3", label: "舱位评分", note: "确定性", type: "det" }
      - { id: "a4", label: "会员画像", note: "读本体 R", type: "onto" }
      - { id: "a5", label: "组装 Top3 + 推荐理由", note: "LLM", type: "llm" }
      - { id: "a6", label: "货主确认推荐", note: "HITL", type: "hitl" }
      - { id: "a7", label: "进入 Skill ② 订舱链", type: "out" }
    edges:
      - { from: "a0", to: "a1", style: "solid" }
      - { from: "a1", to: "a2", style: "solid" }
      - { from: "a1", to: "a3", style: "solid" }
      - { from: "a1", to: "a4", style: "solid" }
      - { from: "a2", to: "a5", style: "solid" }
      - { from: "a3", to: "a5", style: "solid" }
      - { from: "a4", to: "a5", style: "solid" }
      - { from: "a5", to: "a6", style: "solid" }
      - { from: "a6", to: "a7", label: "确认", style: "solid" }
      - { from: "a6", to: "a1", label: "改需求 / 追问", style: "dashed" }
      - { from: "a2", to: "a2", label: "超时重试 ×1", style: "dashed" }

  - id: "skill_booking"
    name: "Skill ② 订舱校验与单证预填"
    type: "skill"
    trigger: "订舱 / 单证（写操作密集）"
    pattern: "pipeline + human-in-the-loop"
    whyNotSubagent: "固定管道 + 审批门禁，I/O 清晰可独立测试 → 判 Skill"
    handoff: "→ 签发后触发 Skill ③ 跟踪链（事件订阅）"
    nodes:
      - { id: "b0", label: "一键订舱 / 上传单据", type: "op" }
      - { id: "b1", label: "3 步表单预填", note: "LLM · 读本体 R", type: "llm" }
      - { id: "b2", label: "订舱规则校验 &gt;200", note: "规则引擎", type: "det" }
      - { id: "b3", label: "校验通过？", note: "Evaluator", type: "eval" }
      - { id: "b4", label: "下单门禁", note: "HITL · 写操作前必停", type: "hitl" }
      - { id: "b5", label: "提交 + 签发确认书", note: "MCP · OMS · 写本体 W", type: "mcp" }
      - { id: "b6", label: "Booking Confirmation", type: "out" }
      - { id: "b7", label: "OCR 抽取 SI", note: "小模型", type: "small" }
      - { id: "b8", label: "品名 + HS 映射", note: "RAG · HS 库", type: "rag" }
      - { id: "b9", label: "单证校验 &gt;300", note: "规则引擎", type: "det" }
      - { id: "b10", label: "校验通过？", note: "VGM / 毛重 / HS", type: "eval" }
      - { id: "b11", label: "推送 SI 入库", note: "MCP · 智慧单证 · 写本体 W", type: "mcp" }
      - { id: "b12", label: "SI 已入库", type: "out" }
      - { id: "b13", label: "异常池", note: "人工终审", type: "exception" }
    edges:
      - { from: "b0", to: "b1", style: "solid" }
      - { from: "b1", to: "b2", style: "solid" }
      - { from: "b2", to: "b3", style: "solid" }
      - { from: "b3", to: "b4", label: "通过", style: "solid" }
      - { from: "b3", to: "b1", label: "不通过 ×2", style: "dashed" }
      - { from: "b3", to: "b13", label: "信用受限 / 费率冲突", style: "dashed" }
      - { from: "b4", to: "b5", label: "人工放行", style: "solid" }
      - { from: "b5", to: "b6", style: "solid" }
      - { from: "b6", to: "b7", style: "solid" }
      - { from: "b7", to: "b8", style: "solid" }
      - { from: "b8", to: "b9", style: "solid" }
      - { from: "b9", to: "b10", style: "solid" }
      - { from: "b10", to: "b11", label: "通过", style: "solid" }
      - { from: "b10", to: "b7", label: "异常项 ×2", style: "dashed" }
      - { from: "b10", to: "b13", label: "HS 无法映射", style: "dashed" }
      - { from: "b11", to: "b12", style: "solid" }

  - id: "skill_tracking"
    name: "Skill ③ 出运跟踪与售后"
    type: "skill"
    trigger: "出运状态变更（事件驱动）"
    pattern: "event-driven + human-in-the-loop"
    whyNotSubagent: "分支为预定义（风险高→改配、复杂投诉→转人工），非运行时自由规划 → 判 Skill"
    nodes:
      - { id: "c0", label: "出运状态变更 / 售后咨询", type: "op" }
      - { id: "c1", label: "里程碑查询", note: "MCP · 控制塔", type: "mcp" }
      - { id: "c2", label: "ETA 延误预测", note: "专用模型", type: "small" }
      - { id: "c3", label: "延误预警生成", note: "LLM", type: "llm" }
      - { id: "c4", label: "延误风险高？", note: "Evaluator", type: "eval" }
      - { id: "c5", label: "改配 / 赔付门禁", note: "HITL · 对外必停", type: "hitl" }
      - { id: "c6", label: "改配方案 / 赔付预判", type: "out" }
      - { id: "c7", label: "订阅通知 / 降级事后通知", type: "out" }
      - { id: "c8", label: "D&amp;D 免箱期解读", note: "RAG · D&amp;D 库", type: "rag" }
      - { id: "c9", label: "在线支付 + 发票核销", note: "MCP · 支付网关", type: "mcp" }
      - { id: "c10", label: "复杂投诉 / 情绪激动？", note: "专用 NLP", type: "eval" }
      - { id: "c11", label: "异常池", note: "转人工附摘要", type: "exception" }
      - { id: "c12", label: "复购权益推荐", type: "out" }
    edges:
      - { from: "c0", to: "c1", style: "solid" }
      - { from: "c1", to: "c2", style: "solid" }
      - { from: "c2", to: "c3", style: "solid" }
      - { from: "c3", to: "c4", style: "solid" }
      - { from: "c4", to: "c5", label: "高", style: "solid" }
      - { from: "c5", to: "c6", style: "solid" }
      - { from: "c4", to: "c7", label: "低 / 置信度低", style: "dashed" }
      - { from: "c0", to: "c8", style: "solid" }
      - { from: "c8", to: "c12", style: "solid" }
      - { from: "c0", to: "c9", style: "solid" }
      - { from: "c0", to: "c10", style: "solid" }
      - { from: "c10", to: "c11", label: "是", style: "dashed" }
      - { from: "c10", to: "c12", label: "否", style: "solid" }

sharedBase:
  ontology:
    title: "本体（确定性底座）"
    read: ["会员画像（报价推荐）", "订舱单 / 规则（表单预填）"]
    write: ["订舱请求 / 确认书（提交签发）", "SI（推送入库）"]
    note: "对象 / 关系 / 状态迁移 + 业务事实；Skill 读写本体，不靠 LLM 猜事实。"
  mcp:
    title: "MCP / 外部系统"
    calls: ["报价引擎（报价检索）", "OMS（提交订舱）", "智慧单证系统（推送 SI）", "控制塔 / CRM（里程碑 / 画像）", "支付网关（支付核销）"]
    note: "仅需要外部读写的步骤才走 MCP。"
  kb:
    title: "知识库 / RAG"
    calls: ["品名词典 / HS 库", "D&D 规则库"]
    note: "规则校验走规则引擎而非向量检索；法规 / SOP 等非结构化知识走 RAG。"

exceptionPool: "校验不通过 / 信用受限 / HS 无法映射 / 复杂投诉 / Loop 超限 → 升级人工，附上下文摘要。"

failureTable:
  - { trigger: "报价引擎超时 / 无可用航次", action: "重试 1 次 → 降级提示 + 邻近航线建议", type: "retry / fallback" }
  - { trigger: "意图识别歧义（多航次 / 多箱型）", action: "对话追问澄清要素后再检索", type: "fallback" }
  - { trigger: "表单校验不通过（信用受限 / 费率冲突）", action: "标注原因提示补正 → 复杂单升级人工终审", type: "escalate" }
  - { trigger: "OCR 抽取置信度低（模糊 / 破损）", action: "标黄待人工复核字段，不阻塞其余字段", type: "fallback" }
  - { trigger: "OMS / 单证系统接口失败", action: "重试 2 次 → 标记同步异常并通知 IT", type: "retry / escalate" }
  - { trigger: "支付失败（汇率 / 通道异常）", action: "自动切换本地支付通道 → 仍失败转人工", type: "retry / fallback" }
  - { trigger: "ETA 预测置信度低", action: "降级为事后通知，不作为改配依据", type: "fallback" }
  - { trigger: "复杂问题 AI 无法解决", action: "附完整上下文摘要升级人工", type: "escalate" }

kpi:
  - { name: "在线订舱确认时效", link: "① 报价推荐 + ② 订舱执行　≤2h / 头部分钟级" }
  - { name: "AI 分流率", link: "① 报价推荐 + ③ 跟踪售后　30%+" }
  - { name: "SME 全流程自助率", link: "① + ②　向渗透率 40% 演进" }
  - { name: "单证一次提交通过率", link: "② 单证预填　往返补件 2~3 轮 → 1 轮" }
  - { name: "舱位保证兑现率", link: "③ 跟踪预警　95%+" }
  - { name: "复杂问题一次性解决率", link: "③ 售后　附摘要转人工" }

guardrails:
  - { rule: "事实性计算（报价 / 评分 / 校验）", detail: "走确定性服务 / 本体 / 规则引擎，LLM 不产出" }
  - { rule: "写操作（订舱 / 支付 / SI 推送）", detail: "必须人工放行，禁止静默通过" }
  - { rule: "新客无历史数据", detail: "会话 + OCR 兜底并标置信度，不准空预填" }

notes:
  - { title: "⚠️ 口径待确认（MCP）：", text: "本方案把「报价引擎 / OMS / 智慧单证 / 控制塔 / 支付网关」画成 MCP 外部调用；若场景确认「MCP=0，业务数据全部来自绑定本体」，则把这些归入本体 / 内部服务，并在底座标 N/A。二者需二选一后再定稿。" }
