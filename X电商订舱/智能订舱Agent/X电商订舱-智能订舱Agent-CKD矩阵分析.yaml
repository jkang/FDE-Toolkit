title: "智能订舱 Agent · CKD 上下文/知识/数据映射"
product: "智能订舱 Agent（Ask Fin 升级为可执行订舱 Agent）"
description: "以智能订舱 Agent 的三项 AI 能力（智能报价与舱位推荐、订舱执行与单证预填、结算·跟踪与售后智服）为骨架，梳理每一步 AI 推理所需的上下文(Context)、知识(Knowledge)与数据(Data)资产，为 RAG 与提示词工程提供落地清单。"
steps:
  - step_name: "1. 智能报价与舱位推荐"
    ckd_items:
      - context_name: "会话上下文（多轮对话意图）"
        description: "当前会话的即时意图与实体槽位（港口对/箱型/ETD/货量），是报价检索的动态输入。"
        type: "会话状态"
        storage: "Redis / 会话内存"
        volume: "单会话 KB 级，日峰值 10k+ 并发会话"
        ai_init: false
        frequency: "实时（每轮对话更新）"
        retrieval: "会话 ID 精确读取"
        status: "已支持"
      - context_name: "会员画像（PlumSmart 等级/历史）"
        description: "货主会员等级、历史订舱量与偏好航线，用于个性化报价推荐与复购导流。"
        type: "关系型数据"
        storage: "CRM / MySQL"
        volume: "百万级货主记录"
        ai_init: false
        frequency: "低频（交易后更新）"
        retrieval: "货主 ID 精确查询"
        status: "已支持"
      - context_name: "FAQ 产品知识库（E-Spot/E-Quote/舱位保证）"
        description: "各报价产品与增值服务的条款说明，用于解读全包价构成与舱位保证条款。"
        type: "向量嵌入"
        storage: "Milvus / 向量库"
        volume: "< 5,000 条款片段"
        ai_init: true
        frequency: "随发版（产品更新）"
        retrieval: "语义相似度检索"
        status: "部分支持"
      - context_name: "运价术语字典（THC/D&D/BAF）"
        description: "运费构成术语的标准释义，用于消除 SME 信息不对称的报价逐项解读。"
        type: "静态字典"
        storage: "Redis / 内存缓存"
        volume: "< 500 术语"
        ai_init: false
        frequency: "低频（费率规则更新）"
        retrieval: "Key-Value 精确查询"
        status: "已支持"
      - context_name: "E-Spot/E-Quote 实时报价数据"
        description: "报价引擎返回的即期/长时效运价（含全包价与有效期），是报价卡的确定性数据源。"
        type: "API 数据"
        storage: "报价引擎 API / All-in-One"
        volume: "日百万级报价查询"
        ai_init: false
        frequency: "实时（秒级）"
        retrieval: "端口对+箱型 API 调用"
        status: "已支持"
      - context_name: "舱位余量与船期计划"
        description: "各航次装载率/ETA 置信度/舱位保证状态，用于综合排序推荐 Top3。"
        type: "API 数据"
        storage: "舱位收益系统 / 船期系统"
        volume: "日万级航次状态"
        ai_init: false
        frequency: "实时（船期同步）"
        retrieval: "航线+船期 API 查询"
        status: "部分支持"
      - context_name: "市场运价基准（SCFI）"
        description: "市场运价指数用于报价解读时给出市场基准，供货主比价参考。"
        type: "时序数据"
        storage: "Blob / BI 系统"
        volume: "周级指数序列"
        ai_init: false
        frequency: "周度更新"
        retrieval: "时间窗口查询"
        status: "建设中"

  - step_name: "2. 订舱执行与单证预填"
    ckd_items:
      - context_name: "选定方案（报价/航线/箱型）"
        description: "货主选定并确认的报价方案，是 3 步表单自动预填的锚定输入。"
        type: "会话状态"
        storage: "会话内存 / 订单草稿"
        volume: "单任务 KB 级"
        ai_init: false
        frequency: "实时"
        retrieval: "会话/订单 ID 读取"
        status: "已支持"
      - context_name: "订舱表单模板与必填字段"
        description: "3 步订舱表单的字段结构与必填项，用于映射预填字段。"
        type: "结构化文档"
        storage: "配置库 / 文档库"
        volume: "< 200 字段定义"
        ai_init: false
        frequency: "低频（表单改版）"
        retrieval: "模板 ID 精确读取"
        status: "已支持"
      - context_name: "订舱校验规则引擎（>200 条）"
        description: "费率/信用/航线可用性校验规则，用于订舱请求提交前的确定性校验。"
        type: "图谱 / 规则链"
        storage: "规则引擎 / JSON 配置"
        volume: "> 200 条核心规则"
        ai_init: true
        frequency: "随发版更新"
        retrieval: "规则路径匹配"
        status: "部分支持"
      - context_name: "订单/单证实时状态（OMS/控制塔）"
        description: "订单状态、箱动态、单证进度等实时数据，用于校验与状态同步回写。"
        type: "API 数据"
        storage: "OMS / 控制塔"
        volume: "日万级订单状态"
        ai_init: false
        frequency: "实时"
        retrieval: "订舱号/提单号 API"
        status: "已支持"
      - context_name: "订单历史与交易记录"
        description: "历史成交记录、费率参考号与港口对，用于标准 SME 订单的预填复用。"
        type: "关系型数据"
        storage: "OMS / CRM / MySQL"
        volume: "百万级订单记录"
        ai_init: false
        frequency: "低频（交易后归档）"
        retrieval: "货主 ID + 历史查询"
        status: "已支持"
      - context_name: "贸易单据（PI/装箱单/发票）"
        description: "货主上传的贸易单据文件，是 SI 字段 OCR 抽取的输入源。"
        type: "非结构化文档"
        storage: "对象存储 / 文件库"
        volume: "单票 MB 级，日万份"
        ai_init: false
        frequency: "实时（上传触发）"
        retrieval: "文档 ID 读取"
        status: "已支持"
      - context_name: "智慧单证规则库（>300 条）"
        description: "单证校验、纠错与回填规则，含 VGM/毛重差异等异常判断逻辑。"
        type: "图谱 / 规则链"
        storage: "智慧单证系统 / 配置库"
        volume: "> 300 条单证规则"
        ai_init: true
        frequency: "随发版更新"
        retrieval: "规则路径匹配"
        status: "已支持"
      - context_name: "多语言品名/HS 编码映射字典"
        description: "品名翻译规范与 HS 编码映射，用于品名标准化与合规申报。"
        type: "静态字典"
        storage: "Redis / MyBatis 内存库"
        volume: "< 50,000 条目"
        ai_init: true
        frequency: "季度更新（海关编码）"
        retrieval: "关键词 + 相似匹配"
        status: "建设中"

  - step_name: "3. 结算·跟踪与售后智服"
    ckd_items:
      - context_name: "运费与结算币种"
        description: "运费金额、币种与付款方式，用于多币种费用试算与支付链接生成。"
        type: "会话状态"
        storage: "会话内存 / 订单结算"
        volume: "单票 KB 级"
        ai_init: false
        frequency: "实时"
        retrieval: "订单 ID 读取"
        status: "已支持"
      - context_name: "汇率与多币种通道"
        description: "实时汇率与本地支付通道手续费，用于降低 SME 小额高频支付成本。"
        type: "API 数据"
        storage: "支付网关 / 汇率服务"
        volume: "分钟级汇率"
        ai_init: false
        frequency: "实时/每日更新"
        retrieval: "币种 API 调用"
        status: "部分支持"
      - context_name: "里程碑数据（控制塔/Cargo Tracking+）"
        description: "开船/中转/ETA 等实时里程碑，用于对话式播报与异常节点高亮。"
        type: "时序/事件数据"
        storage: "控制塔 / AIS / 码头接口"
        volume: "日万级箱动态"
        ai_init: false
        frequency: "高频（分钟级）"
        retrieval: "订舱号/箱号 API"
        status: "部分支持"
      - context_name: "港口拥堵/ETA 预测模型"
        description: "码头拥堵指数与到港时间预测概率，用于事前延误预警。"
        type: "模型/特征数据"
        storage: "特征平台 / 模型服务"
        volume: "模型特征序列"
        ai_init: true
        frequency: "随发版更新模型"
        retrieval: "特征 API + 推理"
        status: "待规划"
      - context_name: "D&D 规则库（各港免箱期/滞箱费）"
        description: "各目的港免箱期与滞箱费规则，用于 D&D 前置解读与超期预警。"
        type: "结构化文档"
        storage: "D&D 计费系统 / 规则库"
        volume: "> 1,000 口岸规则"
        ai_init: false
        frequency: "低频（口岸政策更新）"
        retrieval: "口岸 + 费用类型查询"
        status: "部分支持"
      - context_name: "会员复购与流失预测数据"
        description: "货主订舱量/频次/流失风险，用于复购推荐与舱位预留额度。"
        type: "关系型数据"
        storage: "CRM / BI / 营销自动化"
        volume: "百万级货主画像"
        ai_init: true
        frequency: "日度更新"
        retrieval: "货主 ID + 行为查询"
        status: "建设中"
      - context_name: "客服话术/转人工摘要模板"
        description: "复杂问题转人工时的上下文摘要模板与客服话术，用于避免重复收集信息。"
        type: "Prompt/结构化文档"
        storage: "Prompt 模板库"
        volume: "< 200 模板"
        ai_init: true
        frequency: "随发版更新"
        retrieval: "场景标签匹配"
        status: "部分支持"
      - context_name: "CRM 工单/回写接口"
        description: "自动建单与对话摘要回写，用于复杂工单闭环与意图标签沉淀。"
        type: "API 数据"
        storage: "CRM / 工单系统"
        volume: "日万级工单"
        ai_init: false
        frequency: "实时"
        retrieval: "工单 API 写入"
        status: "已支持"
