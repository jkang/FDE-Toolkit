title: "智能订舱 Agent · MVP 指标设计与上线门禁"
product_name: "智能订舱 Agent"
go_no_go_statement: "当 AI 服务分流率 ≥30%、在线订舱确认时效 ≤2h、报价/舱位解读准确率 ≥98%、单证一次提交通过率 ≥ 目标值、订舱提交失败率 ≤1% 且 LLM 不产出价格/评分（无依据推断率 ≤3%）时，允许灰度上线。"
target_metrics:
  - name: "在线订舱确认时效"
    dimension: "业务"
    logic: "从货主发起订舱到签发 Booking Confirmation 的平均时长"
    threshold: "≤ 2h（头部分钟级）"
    source: "OMS 订舱日志"
  - name: "AI 服务分流率"
    dimension: "业务"
    logic: "由 Agent 独立完成的咨询/订舱/查询会话数 / 总会话数"
    threshold: "≥ 30%"
    source: "会话日志 + 人工转接记录"
  - name: "电商订舱渗透率"
    dimension: "业务"
    logic: "电商订舱订单数 / 总订舱订单数（北极星指标）"
    threshold: "25%[推断] → 40%"
    source: "平台订单数据"
  - name: "单证一次提交通过率"
    dimension: "业务"
    logic: "SI 一次校验通过并推送成功的比例"
    threshold: "往返补件 2~3 轮 → 1 轮"
    source: "智慧单证系统 + 补件记录"
  - name: "舱位保证兑现率"
    dimension: "业务"
    logic: "Space Protection 承诺兑现的订单数 / 承诺总数"
    threshold: "≥ 95%"
    source: "OMS + 控制塔"
  - name: "报价/舱位解读准确率"
    dimension: "模型"
    logic: "报价解读与舱位排序结果与确定性服务一致的样本占比"
    threshold: "≥ 98%"
    source: "离线测试集（AI 测试数据集）"
  - name: "意图识别准确率"
    dimension: "模型"
    logic: "正确识别询价/订舱/查询/投诉意图的会话占比"
    threshold: "≥ 95%"
    source: "离线测试集"
  - name: "无依据推断率（幻觉率）"
    dimension: "模型"
    logic: "LLM 在无确定性服务结果时仍产出价格/评分/舱位保证的占比"
    threshold: "≤ 3%"
    source: "自研评估脚本 + 人工抽检"
  - name: "接口成功率"
    dimension: "系统"
    logic: "报价引擎 / OMS / 智慧单证 / 控制塔 / 支付 成功调用占比"
    threshold: "≥ 99%"
    source: "接口网关监控"
  - name: "P95 响应延迟"
    dimension: "系统"
    logic: "95% 请求的端到端响应时间"
    threshold: "≤ 3s"
    source: "APM 监控"
  - name: "订舱提交失败率"
    dimension: "系统"
    logic: "订舱提交 OMS 失败次数 / 提交总次数"
    threshold: "≤ 1%"
    source: "OMS 接口日志"
  - name: "用户操作步骤减少"
    dimension: "体验"
    logic: "（改造前人工步骤 - 改造后人工步骤）/ 改造前人工步骤"
    threshold: "≥ 50%"
    source: "流程埋点对比"
  - name: "复杂问题一次性解决率"
    dimension: "体验"
    logic: "转人工后一次性解决的会话占比（附上下文摘要）"
    threshold: "提升（基线待回填）"
    source: "客服工单 + 会话记录"
  - name: "待办与预警触达率"
    dimension: "体验"
    logic: "成功触达的待办/补件/延误预警数 / 应触达总数"
    threshold: "≥ 95%"
    source: "Push / IM 推送回执"
monitoring_plan:
  - name: "平均 Token 消耗"
    layer: "模型"
    logic: "单次报价解读 + 舱位推荐 + 单证预填消耗的 Input+Output Token"
    range: "1000-2000"
    alert: ">3500"
    meaning: "上下文注入过多或 Prompt 泄露风险"
  - name: "解读一致性偏差"
    layer: "模型"
    logic: "报价/评分解读与确定性服务结果不一致的样本占比"
    range: "= 0"
    alert: "> 0.5%"
    meaning: "LLM 越权算价/评分或口径漂移"
  - name: "规则命中率"
    layer: "检索"
    logic: "订舱校验规则（>200）/ 单证规则（>300）成功命中的比例"
    range: "≥ 95%"
    alert: "< 88%"
    meaning: "规则库缺失或口径变更"
  - name: "接口错误率"
    layer: "系统"
    logic: "报价引擎/OMS/单证/控制塔 5xx 与业务错误占比"
    range: "< 1%"
    alert: "> 3%"
    meaning: "上游限流或字段契约变更"
  - name: "订舱提交失败率"
    layer: "系统"
    logic: "订舱提交失败次数 / 提交总次数"
    range: "≤ 1%"
    alert: "> 3%"
    meaning: "信用受限 / 费率冲突 / 航线不可用"
  - name: "人工转接分布"
    layer: "业务"
    logic: "各环节（询价/推荐/订舱/单证/跟踪）转人工的比例分布"
    range: "均衡分布"
    alert: "单一环节 >50%"
    meaning: "特定环节知识缺失或模型盲区"
  - name: "异常类型分布"
    layer: "业务"
    logic: "各异常类型（信用受限/费率冲突/缺件/HS 无法映射/ETA 低置信）占比"
    range: "随业务分布"
    alert: "单一类型 >40%"
    meaning: "上游数据质量问题或规则口径偏差"
test_set_strategy:
  golden_path: 50
  hard_cases: 30
  edge_cases: 20
