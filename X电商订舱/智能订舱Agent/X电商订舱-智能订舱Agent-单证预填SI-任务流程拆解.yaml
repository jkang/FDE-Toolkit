stages:
  - id: "S1"
    num: "01"
    name: "单据准备"
    l5Count: 2
    isFocus: false
    groups:
      - id: "G1_1"
        name: "贸易单据上传与预检"
        isP0: false
        tasks:
          - { id: "t01", name: "上传贸易单据（PI/装箱单/发票）", actor: "human" }
          - { id: "t02", name: "预检单据完整性（缺件/清晰度）", actor: "agent" }

  - id: "S2"
    num: "02"
    name: "SI 字段生成"
    l5Count: 3
    isFocus: false
    groups:
      - id: "G2_1"
        name: "OCR 抽取与字段标准化"
        isP0: false
        tasks:
          - { id: "t03", name: "OCR 抽取（品名/唛头/件数/毛重/体积）", actor: "agent" }
          - { id: "t04", name: "抽取置信度标注（低置信度标黄）", actor: "agent" }
          - { id: "t05", name: "品名规范与 HS 编码映射", actor: "agent" }

  - id: "S3"
    num: "03"
    name: "单证校验"
    l5Count: 3
    isFocus: true
    groups:
      - id: "G3_1"
        name: "SI 字段生成与单证校验"
        isP0: true
        tasks:
          - { id: "t06", name: "单证校验（VGM/毛重差异/HS）", actor: "agent" }
          - { id: "t07", name: "生成异常补全项与示例", actor: "agent" }
          - { id: "t08", name: "HS 无法映射时提示人工复核", actor: "agent" }

  - id: "S4"
    num: "04"
    name: "确认提交"
    l5Count: 3
    isFocus: false
    groups:
      - id: "G4_1"
        name: "SI 提交与推送"
        isP0: false
        tasks:
          - { id: "t09", name: "确认并提交 SI（一次补全）", actor: "mixed" }
          - { id: "t10", name: "推送 SI 至单证系统", actor: "agent" }
          - { id: "t11", name: "异常单证升级人工处理", actor: "human" }

readingFlow:
  - "<b>先看全链路</b>：从贸易单据上传到 SI 推送单证系统，形成完整单证闭环"
  - "<b>再找高价值活动</b>：「SI 字段生成与单证校验」承载最密集的规则校验与补件，是返工率关键"
  - "<b>最后下钻到动作</b>：拆成「抽取 / 校验 / 补件」三个可独立挂规则的动作"

focusDrill:
  before:
    l4Name: "SI 字段生成与单证校验"
    whyTooCoarse: "它包含 OCR 抽取、品名规范、HS 映射、单证校验、补件等不同动作，输入输出和异常各不相同，不能直接作为最小执行单元。"
  approach: "访谈走查＋材料还原 →"
  evidence:
    - "根据贸易单据 OCR 抽取品名/唛头/件数/毛重/体积，并标注置信度"
    - "规范多语言品名、映射 HS 编码，运行 300+ 条单证校验规则"
    - "VGM 缺失/毛重差异生成补全项，HS 无法映射则人工复核（禁猜）"
  after: "下钻为 3 个能独立挂规则的动作，各自回答『抽取什么 / 依据什么放行 / 缺件怎么办』。"

focusSequence:
  - { id: "L5-1", name: "OCR 抽取 SI 字段", question: "抽取什么" }
  - { id: "L5-2", name: "品名规范与 HS 映射", question: "依据什么标准化" }
  - { id: "L5-3", name: "单证校验与补件", question: "依据什么放行 · 缺件怎么办" }

taskTable:
  - l5: "OCR 抽取 SI 字段"
    inputs: "贸易单据（PI/装箱单/发票 PDF/图片/Excel）"
    outputs: "抽取的 SI 字段（品名/唛头/件数/毛重/体积）+ 置信度标注"
    ruleType: "关键信息提取要点·SI 字段抽取与置信度判定"
    exception: "OCR 置信度低（模糊/破损）→ 标黄待人工复核，不阻塞其余字段"
    actor: "agent"
  - l5: "品名规范与 HS 映射"
    inputs: "抽取的品名/唛头/件数 + HS 映射字典"
    outputs: "标准化品名 + 合规 HS 编码"
    ruleType: "术语字典类·多语言品名/HS 编码映射"
    exception: "HS 编码无法映射 → 提示人工复核（禁止擅自猜测）"
    actor: "agent"
  - l5: "单证校验与补件"
    inputs: "SI 字段 + 单证规则库（>300 条）"
    outputs: "校验结果（含 VGM/毛重差异告警）+ 补全项示例"
    ruleType: "决策模型类·单证校验规则（VGM/毛重/HS）"
    exception: "VGM 缺失/毛重超限 → 生成补全项；异常未修正 → 阻止提交"
    actor: "agent"

ioChain:
  - "订舱确认书（已签发）"
  - "上传贸易单据"
  - "OCR 抽取 SI 字段"
  - "品名规范 + HS 映射"
  - "单证校验（VGM/毛重/HS）"
  - "确认提交 SI"
  - "下游：推送单证系统 → 进入提单流程"

learning:
  why: "三个动作各自只有一个核心动词，产出可观察，并可独立挂接规则（提取要点 / HS 字典 / 单证校验规则）。"
  key: "挖掘的关键不是改写名称，而是把单证预填这一真实执行的动作顺序、输入输出、判断依据（VGM/毛重/HS）和异常链路（标黄/补件/人工复核）结构化，供 P2 规则绑定与下游本体/测试消费。"
