    - "SRP《智能订舱Agent-CKD矩阵分析》（智慧单证规则库 >300 条 / HS 映射字典 / 贸易单据资产）"
  sourceRef: "智能订舱Agent-本体设计 + Agentic工作流 cap_02 + To-be流程 P4"
  kpi:
    - "单证一次提交通过率"
    - "AI 分流率"
    - "SME 全流程自助率"

overview:
  focusL3: "单证预填（SI 生成）"
  focusL4: "SI 字段生成与单证校验"

legend:
  focusType: "p0"
  focusLabel: "P0 本节重点"
  execution:
    - { type: "agent",  label: "Agent",   icon: "🤖" }
    - { type: "mixed",  label: "混合执行", icon: "🤝" }
    - { type: "human",  label: "人工",     icon: "👤" }
  convention:
    - "业务环节"
    - "活动分组"
