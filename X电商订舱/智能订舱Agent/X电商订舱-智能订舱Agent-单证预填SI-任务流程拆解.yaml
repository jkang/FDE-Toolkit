  version: "v1.0"
  date: "2026-08-25"
  scenarioName: "智能订舱 Agent · 单证预填（SI 生成）"
  businessStage: "SKP 阶段1 任务流程挖掘 · P1（环节级深钻）"
  methodology: "SKP 阶段1方法（业务环节 → 活动 → 动作级；聚焦 SI 生成环节纵切）"
  inputs:
    - "SRP《智能订舱Agent-本体设计》（si_document/trade_document 状态迁移 + ab_si_document 行动边界）"
    - "SRP《智能订舱Agent-Agentic工作流》cap_02（OCR 抽取/HS 映射/单证校验的护栏与异常）"
