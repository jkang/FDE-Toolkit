meta:
  projectName: "invoice-verification-agent"
  productName: "X · 采购发票校验助手"
  businessDomain: "财务应付 · 采购发票校验"
  frontend: "react"
  designSystem: "antd"
  theme:
    source: "user"
    primary: "#1E3A8A"
    accent: "#E08A00"
    layout: "side"
  ports:
    dev: 5173
    api: 8080

personas:
  - id: "ap_accountant_wang"
    name: "王敏"
    role: "应付会计"
    department: "财务部 · 应付组"
    goals:
      - "把每天多渠道进来的采购发票尽快完成三单匹配并安全入账"
      - "不再逐票逐行人工比对，只处理真正拿不准的异常"
      - "把资深经验沉淀成可复核的标准动作，换人不断档"
  - id: "buyer_li"
    name: "李强"
    role: "采购业务员"
    department: "采购部 · 生产物料组"
    goals:
      - "异常发票按类型快速分流，一眼看清处理建议与沟通对象"
      - "与供应商沟通有据可依，减少多轮邮件往返"
  - id: "fin_manager_chen"
    name: "陈静"
    role: "财务负责人"
    department: "财务部 · 核算与共享中心"
    goals:
      - "预制/过账前置条件全绿才放行，过账留痕可追溯"
      - "发票到过账周期缩短，台账与乐企状态一次到位"

scenarios:
  - id: "s1"
    name: "月初批量校验"
    personaId: "ap_accountant_wang"
    trigger: "月初发票集中到票，需对本月采购发票批量完成归集、识别与三单匹配"
    goal: "批量完成 46 张发票的归集、识别与三单匹配，自动放行匹配通过票、按类型分流异常票"
  - id: "s2"
    name: "异常票返工"
    personaId: "buyer_li"
    trigger: "三单匹配出现数量超差/抬头税号不符等异常，需采购业务员按 PO 权限复核并与供应商沟通"
    goal: "异常票按类型分流并给出处理建议与升级路径，沟通结果登记后自动挂起重跑三单匹配"
  - id: "s3"
    name: "批量预制过账"
    personaId: "fin_manager_chen"
    trigger: "匹配通过票批量预制后，财务负责人对待过账发票审核放行并更新乐企入账标识"
    goal: "预制/过账硬门禁全绿后批量放行，台账、乐企入账标识、归档索引一次更新到位"

dataModels:
  - name: "PurchaseInvoice"
    description: "采购发票（多源归集）"
    fields:
      - { key: "invoiceNo", title: "发票号", type: "string" }
      - { key: "supplier", title: "供应商", type: "string" }
      - { key: "channel", title: "渠道来源", type: "string" }
      - { key: "amountExTax", title: "不含税金额", type: "number" }
      - { key: "taxAmount", title: "税额", type: "number" }
      - { key: "total", title: "价税合计", type: "number" }
      - { key: "invoiceDate", title: "开票日期", type: "string" }
      - { key: "matchStatus", title: "匹配状态", type: "string" }
      - { key: "confidence", title: "识别置信度", type: "number" }
    mockData:
      - { invoiceNo: "25312000000012345678", supplier: "XX环保科技（脱敏）", channel: "乐企同步", amountExTax: 77700.00, taxAmount: 10101.00, total: 87801.00, invoiceDate: "2026-06-18", matchStatus: "匹配通过", confidence: 99 }
      - { invoiceNo: "25312000000012345679", supplier: "XX环保科技（脱敏）", channel: "乐企同步", amountExTax: 12800.00, taxAmount: 1664.00, total: 14464.00, invoiceDate: "2026-06-18", matchStatus: "匹配通过", confidence: 98 }
      - { invoiceNo: "INV-2026-0618-002", supplier: "精密轴承供应商（脱敏）", channel: "供应商上传", amountExTax: 52500.00, taxAmount: 6825.00, total: 59325.00, invoiceDate: "2026-06-18", matchStatus: "数量超差", confidence: 97 }
      - { invoiceNo: "INV-2026-0618-003", supplier: "XX环保科技（脱敏）", channel: "乐企同步", amountExTax: 77700.80, taxAmount: 10101.10, total: 87801.90, invoiceDate: "2026-06-18", matchStatus: "金额超尾差", confidence: 96 }
      - { invoiceNo: "INV-2026-0618-004", supplier: "华东仪器（脱敏）", channel: "供应商上传", amountExTax: 36000.00, taxAmount: 4680.00, total: 40680.00, invoiceDate: "2026-06-18", matchStatus: "单价不符", confidence: 95 }
      - { invoiceNo: "25312000000012345680", supplier: "苏州包材（脱敏）", channel: "采购补录", amountExTax: 5600.00, taxAmount: 728.00, total: 6328.00, invoiceDate: "2026-06-18", matchStatus: "抬头税号不符", confidence: 93 }
      - { invoiceNo: "25312000000012345681", supplier: "无锡电子（脱敏）", channel: "乐企同步", amountExTax: 24600.00, taxAmount: 3198.00, total: 27798.00, invoiceDate: "2026-06-18", matchStatus: "跨期发票", confidence: 97 }
      - { invoiceNo: "25312000000012345677", supplier: "常州泵业（脱敏）", channel: "乐企同步", amountExTax: 18600.00, taxAmount: 2418.00, total: 21018.00, invoiceDate: "2026-06-17", matchStatus: "匹配通过", confidence: 98 }
  - name: "ThreeWayMatchRow"
    description: "三单匹配行（发票行 ↔ PO/送货/入库行）"
    fields:
      - { key: "material", title: "物料", type: "string" }
      - { key: "poQty", title: "PO 数量", type: "number" }
      - { key: "deliveryQty", title: "送货数量", type: "number" }
      - { key: "receiptQty", title: "入库数量", type: "number" }
      - { key: "invoiceQty", title: "发票数量", type: "number" }
      - { key: "diffQty", title: "差异数量", type: "number" }
      - { key: "status", title: "匹配结论", type: "string" }
    mockData:
      - { material: "二级RO膜 东丽 TM720D 400", poQty: 42, deliveryQty: 42, receiptQty: 42, invoiceQty: 42, diffQty: 0, status: "通过" }
      - { material: "精密轴承 NSK 6205", poQty: 500, deliveryQty: 480, receiptQty: 480, invoiceQty: 500, diffQty: 20, status: "数量超差" }
      - { material: "反渗透膜壳 8040", poQty: 120, deliveryQty: 120, receiptQty: 120, invoiceQty: 120, diffQty: 0, status: "通过" }
      - { material: "计量泵密封件 PTFE", poQty: 60, deliveryQty: 60, receiptQty: 60, invoiceQty: 60, diffQty: 0, status: "通过" }
      - { material: "压力表 Y-100", poQty: 30, deliveryQty: 30, receiptQty: 30, invoiceQty: 30, diffQty: 0, status: "通过" }
      - { material: "电磁阀 DN25", poQty: 18, deliveryQty: 18, receiptQty: 18, invoiceQty: 18, diffQty: 0, status: "通过" }
  - name: "ExceptionTicket"
    description: "异常凭证（按类型分组）"
    fields:
      - { key: "invoiceNo", title: "发票号", type: "string" }
      - { key: "type", title: "异常类型", type: "string" }
      - { key: "detail", title: "差异明细", type: "string" }
      - { key: "suggestion", title: "处理建议", type: "string" }
      - { key: "owner", title: "沟通对象", type: "string" }
      - { key: "escalate", title: "升级路径", type: "string" }
      - { key: "status", title: "处理状态", type: "string" }
    mockData:
      - { invoiceNo: "INV-2026-0618-002", type: "数量超差", detail: "精密轴承 NSK 6205：发票 500 > 入库 480，差异 20 件", suggestion: "与供应商确认少送 20 件 → 走补单流程", owner: "采购员李强", escalate: "2 个工作日未响应升级财务负责人", status: "待确认" }
      - { invoiceNo: "INV-2026-0618-003", type: "金额超尾差", detail: "不含税 77,700.80 vs PO 77,700.00，尾差 0.80（≤1 元且 ≤0.5% 自动容忍）", suggestion: "容忍区间内自动放行，仅留痕备查", owner: "应付会计王敏", escalate: "超容忍升级财务负责人", status: "已放行" }
      - { invoiceNo: "25312000000012345680", type: "抬头/税号不符", detail: "购方抬头税号与主数据不一致", suggestion: "生成换票说明，联系供应商换票", owner: "采购员李强", escalate: "3 个工作日未换票升级财务负责人", status: "换票中" }
      - { invoiceNo: "INV-2026-0618-004", type: "单价不符", detail: "发票单价高于 PO 约定单价", suggestion: "与采购确认单价差异，必要时走合同变更", owner: "采购员李强", escalate: "2 个工作日未响应升级财务负责人", status: "待确认" }
      - { invoiceNo: "25312000000012345681", type: "跨期发票", detail: "开票日期早于本会计期间，属跨期发票", suggestion: "确认归属期间，必要时冲红重开", owner: "应付会计王敏", escalate: "跨期超 1 个期间升级财务负责人", status: "待确认" }
  - name: "PostingLedger"
    description: "入账与归档台账"
    fields:
      - { key: "invoiceNo", title: "发票号", type: "string" }
      - { key: "gateCheck", title: "预制门禁", type: "string" }
      - { key: "prebookStatus", title: "预制状态", type: "string" }
      - { key: "voucherNo", title: "ERP 凭证号", type: "string" }
      - { key: "postStatus", title: "过账状态", type: "string" }
      - { key: "leqiStatus", title: "乐企状态", type: "string" }
      - { key: "archiveIndex", title: "归档索引", type: "string" }
    mockData:
      - { invoiceNo: "25312000000012345678", gateCheck: "全绿", prebookStatus: "预制成功", voucherNo: "5100002695", postStatus: "已过账", leqiStatus: "已更新", archiveIndex: "ARCH-202606-0001" }
      - { invoiceNo: "25312000000012345679", gateCheck: "全绿", prebookStatus: "预制成功", voucherNo: "5100002696", postStatus: "已过账", leqiStatus: "已更新", archiveIndex: "ARCH-202606-0002" }
      - { invoiceNo: "INV-2026-0618-004", gateCheck: "成本中心缺失", prebookStatus: "预制失败", voucherNo: "—", postStatus: "待补", leqiStatus: "待更新", archiveIndex: "—" }
      - { invoiceNo: "25312000000012345677", gateCheck: "全绿", prebookStatus: "预制成功", voucherNo: "5100002697", postStatus: "待过账", leqiStatus: "待更新", archiveIndex: "ARCH-202606-0003" }

pages:
  - id: "dashboard"
    title: "校验工作台总览"
    route: "/dashboard"
    icon: "DashboardOutlined"
    description: "五阶段全链路概览、量化指标与待办；AI 校验搭档对话入口"
    actions:
      - { name: "chatAssistant", button: "发送" }
    sections:
      - type: "steps"
        current: 0
        items: ["发票归集", "识别校验", "三单匹配", "异常确认", "入账归档"]
      - type: "statRow"
        stats:
          - { label: "识别准确率", value: 95, suffix: "%+" }
          - { label: "采集归集覆盖率", value: 100, suffix: "%" }
          - { label: "入账自动化覆盖率", value: 100, suffix: "%" }
          - { label: "本批待校验发票", value: 46, suffix: " 张" }
      - type: "alert"
        level: "info"
        message: "场景定位：采购发票校验助手（A1 · 速赢）"
        description: "价值段 3.4 发票校验与应付；五阶段主流程：P1 归集 → P2 识别校验 → P3 三单匹配 → P4 异常确认 → P5 入账归档"
      - type: "chatPanel"
        title: "AI 校验搭档"
        action: "chatAssistant"
        placeholder: "例如：本批 46 张现在到哪一步了？还有哪些异常没处理？"
        suggestions:
          - "本批 46 张校验进度"
          - "今天有哪些异常待处理"
          - "三单匹配口径是什么"
      - type: "buttonRow"
        buttons:
          - { text: "开始今日归集 →", type: "primary", action: "navigate:/collection" }
  - id: "collection"
    title: "发票归集看板"
    route: "/collection"
    icon: "InboxOutlined"
    description: "P1 发票多渠道采集归集：乐企 / 供应商上传 / 采购补录三渠道分栏，自动查重查漏"
    actions:
      - { name: "collectInvoices", button: "开始今日归集" }
    sections:
      - type: "steps"
        current: 0
        items: ["发票归集", "识别校验", "三单匹配", "异常确认", "入账归档"]
      - type: "buttonRow"
        buttons:
          - { text: "开始今日归集（三渠道）", type: "primary", action: "collectInvoices" }
      - type: "aiResultCard"
        title: "归集结果"
        bind: "collectInvoices"
        render: "kv"
      - type: "buttonRow"
        buttons:
          - { text: "进入识别校验 →", type: "primary", action: "navigate:/recognition" }
  - id: "recognition"
    title: "用途确认与识别校验"
    route: "/recognition"
    icon: "ScanOutlined"
    description: "P2 票面识别与真伪/抬头校验；低置信字段标红转人工复核"
    actions:
      - { name: "recognizeInvoices", button: "识别并校验票面关键字段" }
    sections:
      - type: "steps"
        current: 1
        items: ["发票归集", "识别校验", "三单匹配", "异常确认", "入账归档"]
      - type: "buttonRow"
        buttons:
          - { text: "识别并校验票面关键字段", type: "primary", action: "recognizeInvoices" }
      - type: "aiResultCard"
        title: "识别与校验结果"
        bind: "recognizeInvoices"
        render: "kv"
      - type: "buttonRow"
        buttons:
          - { text: "进入三单匹配 →", type: "primary", action: "navigate:/matching" }
  - id: "matching"
    title: "三单匹配工作台"
    route: "/matching"
    icon: "ApartmentOutlined"
    description: "P3 以发票行为主线做行级三单匹配与四数量对照，差异高亮、超容忍必拉人"
    actions:
      - { name: "runThreeWayMatch", button: "开始三单匹配" }
    sections:
      - type: "steps"
        current: 2
        items: ["发票归集", "识别校验", "三单匹配", "异常确认", "入账归档"]
      - type: "buttonRow"
        buttons:
          - { text: "开始三单匹配（本批 46 张）", type: "primary", action: "runThreeWayMatch" }
      - type: "aiResultCard"
        title: "匹配结果"
        bind: "runThreeWayMatch"
        render: "kv"
      - type: "table"
        title: "四数量对照报表（PO / 送货 / 入库 / 发票）"
        data: "mock:ThreeWayMatchRow"
        columns:
          - { key: "material", title: "物料" }
          - { key: "poQty", title: "PO 数量" }
          - { key: "deliveryQty", title: "送货数量" }
          - { key: "receiptQty", title: "入库数量" }
          - { key: "invoiceQty", title: "发票数量" }
          - { key: "diffQty", title: "差异数量" }
          - { key: "status", title: "匹配结论", tag: { "通过": "success", "数量超差": "error" } }
      - type: "buttonRow"
        buttons:
          - { text: "查看异常队列 →", type: "primary", action: "navigate:/exceptions" }
  - id: "exceptions"
    title: "异常凭证队列"
    route: "/exceptions"
    icon: "WarningOutlined"
    description: "P4 异常按类型分组，每张带差异明细、处理建议、沟通对象与升级路径"
    actions:
      - { name: "judgeException", button: "生成异常类型与处理建议" }
    sections:
      - type: "steps"
        current: 3
        items: ["发票归集", "识别校验", "三单匹配", "异常确认", "入账归档"]
      - type: "buttonRow"
        buttons:
          - { text: "生成异常类型与处理建议", type: "primary", action: "judgeException" }
      - type: "aiResultCard"
        title: "异常判定结果"
        bind: "judgeException"
        render: "kv"
      - type: "table"
        title: "异常凭证队列"
        data: "mock:ExceptionTicket"
        columns:
          - { key: "invoiceNo", title: "发票号" }
          - { key: "type", title: "异常类型" }
          - { key: "detail", title: "差异明细" }
          - { key: "suggestion", title: "处理建议" }
          - { key: "owner", title: "沟通对象" }
          - { key: "status", title: "处理状态", tag: { "待确认": "warning", "换票中": "processing", "已放行": "success" } }
      - type: "buttonRow"
        buttons:
          - { text: "进入入账与归档 →", type: "primary", action: "navigate:/ledger" }
  - id: "ledger"
    title: "入账与归档台账"
    route: "/ledger"
    icon: "AuditOutlined"
    description: "P5 批量预制与过账：硬门禁前置条件检查列、凭证号、乐企状态与归档索引"
    actions:
      - { name: "batchPrebook", button: "批量预制（检查硬门禁）" }
      - { name: "batchPost", button: "批量过账（财务负责人确认）" }
      - { name: "syncLeqi", button: "同步乐企并更新台账" }
    sections:
      - type: "steps"
        current: 4
        items: ["发票归集", "识别校验", "三单匹配", "异常确认", "入账归档"]
      - type: "buttonRow"
        buttons:
          - { text: "批量预制（检查硬门禁）", type: "primary", action: "batchPrebook" }
          - { text: "批量过账（财务负责人确认）", type: "default", action: "batchPost" }
          - { text: "同步乐企并更新台账", type: "default", action: "syncLeqi" }
      - type: "aiResultCard"
        title: "预制结果"
        bind: "batchPrebook"
        render: "kv"
      - type: "aiResultCard"
        title: "过账结果"
        bind: "batchPost"
        render: "kv"
      - type: "table"
        title: "入账与归档台账"
        data: "mock:PostingLedger"
        columns:
          - { key: "invoiceNo", title: "发票号" }
          - { key: "gateCheck", title: "预制门禁" }
          - { key: "prebookStatus", title: "预制状态" }
          - { key: "voucherNo", title: "ERP 凭证号" }
          - { key: "postStatus", title: "过账状态" }
          - { key: "leqiStatus", title: "乐企状态" }
          - { key: "archiveIndex", title: "归档索引" }

aiMocks:
  - name: "collectInvoices"
    latency: 1100
    response:
      summary: "正在同步乐企发票池（IF001）…已拉取 38 张；归集供应商上传区…新增 6 张；检测到采购补录 2 张纸质票。共 46 张，无重复；1 张发票号与昨日批次重复，已标记。"
      total: 46
      duplicate: 1
      missing: 0
      channels:
        - { key: "leqi", label: "乐企同步", count: 38 }
        - { key: "supplier", label: "供应商上传", count: 6 }
        - { key: "manual", label: "采购补录", count: 2 }
  - name: "recognizeInvoices"
    latency: 1300
    response:
      summary: "已识别 46 张票面关键字段；45 张字段置信度 ≥95%，1 张金额字段置信度 82%（低于 95% 阈值），已转识别复核。真伪校验通过，抬头校验 45 张通过、1 张不符。"
      lowConfidence: 1
      authentic: true
      titlePass: 45
      titleFail: 1
  - name: "runThreeWayMatch"
    latency: 1500
    response:
      summary: "41 张三单匹配通过，5 张按差异类型自动分流：数量超差 ×1、金额超尾差 ×1、抬头/税号不符 ×1、单价不符 ×1、跨期发票 ×1。"
      passed: 41
      exception: 5
      hitl: "发票 INV-2026-0618-002 行 2 数量超差：发票 500 件 > 入库 480 件，超容忍（数量无容忍区间·领域专家假设值），按规则必拉人。"
  - name: "judgeException"
    latency: 900
    response:
      summary: "5 张异常票已按类型分组，均附差异明细、处理建议、沟通对象与升级路径。"
      groups: 5
  - name: "batchPrebook"
    latency: 1200
    response:
