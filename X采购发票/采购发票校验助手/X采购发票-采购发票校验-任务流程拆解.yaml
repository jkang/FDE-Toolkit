# ---- 统计与焦点 ----
overview:
  l3Count: 5
  l4Count: 11
  l5Count: 24
  focusL3: "三单匹配"
  focusL4: "匹配与核对"

# ---- 图例区 ----
legend:
  focusType: "p0"
  execution:
    - { type: "agent",  label: "Agent",   icon: "🤖" }
    - { type: "mixed",  label: "混合执行", icon: "🤝" }
    - { type: "human",  label: "人工",     icon: "👤" }
  convention: "L3 业务阶段 → L4 活动分组 → L5 可执行动作"

# ---- 端到端流程全景（横向阶段卡）----
stages:
  - id: "S1"
    num: "01"
    name: "发票多源采集归集"
    l5Count: 4
    isFocus: false
    groups:
      - id: "G1_1"
        name: "多源发票归集"
        isP0: false
        tasks:
          - { id: "t01", name: "同步乐企发票数据",   actor: "agent" }
          - { id: "t02", name: "归集供应商上传发票", actor: "agent" }
          - { id: "t03", name: "归集采购补录发票",   actor: "mixed" }
      - id: "G1_2"
        name: "归集完整性校验"
        isP0: false
        tasks:
          - { id: "t04", name: "核验发票归集完整性", actor: "agent" }

  - id: "S2"
    num: "02"
    name: "用途确认与识别校验"
    l5Count: 3
    isFocus: false
    groups:
      - id: "G2_1"
        name: "票面识别"
        isP0: false
        tasks:
          - { id: "t05", name: "识别发票票面关键字段与行项目", actor: "agent" }
      - id: "G2_2"
        name: "真伪与抬头校验"
        isP0: false
        tasks:
          - { id: "t06", name: "校验发票真伪与购方抬头", actor: "agent" }
      - id: "G2_3"
        name: "用途确认"
        isP0: false
        tasks:
          - { id: "t07", name: "确认发票用途", actor: "mixed" }

  - id: "S3"
    num: "03"
    name: "三单匹配"
    l5Count: 7
    isFocus: true
    groups:
      - id: "G3_1"
        name: "三单信息获取"
        isP0: false
        tasks:
          - { id: "t08", name: "获取采购订单信息", actor: "agent" }
          - { id: "t09", name: "获取入库单信息",   actor: "agent" }
          - { id: "t10", name: "获取送货单信息",   actor: "agent" }
      - id: "G3_2"
        name: "匹配与核对"
        isP0: true
        tasks:
          - { id: "t11", name: "以发票行为主线汇入三单行信息",   actor: "agent" }
          - { id: "t12", name: "行级核对数量并扣减",             actor: "agent" }
          - { id: "t13", name: "行级核对金额与差异",             actor: "agent" }
          - { id: "t14", name: "判定行级匹配结果并记录匹配关系", actor: "agent" }

  - id: "S4"
    num: "04"
    name: "异常凭证确认"
    l5Count: 5
    isFocus: false
    groups:
      - id: "G4_1"
        name: "异常判定与建议"
        isP0: false
        tasks:
          - { id: "t15", name: "判定异常类型并生成处理建议", actor: "agent" }
          - { id: "t16", name: "生成沟通对象与升级路径建议", actor: "agent" }
      - id: "G4_2"
        name: "人工确认与返工"
        isP0: false
        tasks:
          - { id: "t17", name: "人工确认异常凭证",     actor: "human" }
          - { id: "t18", name: "与供应商沟通处理异常", actor: "human" }
          - { id: "t19", name: "返回三单匹配重跑",     actor: "mixed" }

  - id: "S5"
    num: "05"
    name: "自动入账与归档"
    l5Count: 5
    isFocus: false
    groups:
      - id: "G5_1"
        name: "记账与过账"
        isP0: false
        tasks:
          - { id: "t20", name: "预制发票凭证",     actor: "agent" }
          - { id: "t21", name: "过账生成会计凭证", actor: "mixed" }
      - id: "G5_2"
        name: "状态更新与归档"
        isP0: false
        tasks:
          - { id: "t22", name: "更新电子税务局发票状态", actor: "agent" }
          - { id: "t23", name: "更新发票台账",           actor: "agent" }
          - { id: "t24", name: "归档发票文件",           actor: "agent" }

# ---- 阅读指引 ----
readingFlow:
  - "先看全链路：从发票多源采集归集到自动入账与归档，5 个 L3 阶段串成闭环"
  - "再找高价值 L4：『匹配与核对』承载最密集的规则判断（数量扣减 / 金额比对 / 差异容忍判定）"
  - "最后下钻 L5：拆成『汇入三单 / 核对数量 / 核对金额 / 判定并记录』四个可独立挂规则的动作"

# ---- 聚焦下钻（before / evidence / after）----
focusDrill:
  before:
    l4Name: "匹配与核对"
    whyTooCoarse: "它同时包含『以发票行为主线汇入三单行』『行级数量扣减』『行级金额比对』『差异容忍判定并记录匹配关系』四类动作，各自的输入输出、规则依据与异常兜底都不相同，不能直接作为最小执行单元或单独挂规则。"
  approach: "访谈走查＋材料还原 →"
  evidence:
    - "专家以发票行为主线（非整张发票粒度）把 PO 行、入库行、送货单行拉齐，支持一对一/一对多/多对多"
    - "数量以『发票数量扣减入库/送货数量』逐行核对，四数量对照（PO/送货/入库/发票）定位差异来源，不校验入库单与送货单一致性"
    - "金额以不含税金额为基准经 ERP 模拟校验接口比对，本平台仅感知通过/差异结果，不落规则"
    - "差异按容忍规则判定：数量无容忍区间、金额尾差 ≤1 元且 ≤0.5% 自动容忍、任一超容忍必拉人；差异记入匹配关系表不覆盖原始单据"
  after: "下钻为 4 个能独立挂规则的动作，各自回答『汇什么 / 数量怎么对 / 金额怎么判 / 结论怎么落』。"

# ---- L5 深度任务序列（焦点 L4 下钻）----
focusSequence:
  - { id: "L5-1", name: "以发票行为主线汇入三单行信息",   question: "汇什么 / 以什么为主线" }
  - { id: "L5-2", name: "行级核对数量并扣减",             question: "数量怎么对 / 依据什么扣减" }
  - { id: "L5-3", name: "行级核对金额与差异",             question: "金额怎么判 / 由谁承载规则" }
  - { id: "L5-4", name: "判定行级匹配结果并记录匹配关系", question: "差异是否可容忍 / 结论怎么落" }

# ---- L5 深度任务结构化表（焦点 L4 的 4 个 L5）----
taskTable:
  - l5: "以发票行为主线汇入三单行信息"
    inputs: "发票行、PO 行、入库行、送货单行（含 PO 号/PO 行号/物料/数量）"
    outputs: "三单行级匹配工作集（一对一/一对多/多对多关系可见）"
    ruleType: "决策模型类·三单匹配口径与数量扣减规则（三层匹配结构 + 6 条匹配规则）"
    exception: "多对多关系冲突/单据缺失 → 记入匹配关系表待人工调整"
    actor: "agent"
  - l5: "行级核对数量并扣减"
    inputs: "三单行级匹配工作集（行数量）"
    outputs: "行级数量核对结果、四数量对照报表（PO/送货/入库/发票）"
    ruleType: "决策模型类·三单匹配口径与数量扣减规则（发票数量扣减入库/送货）"
    exception: "数量超差（发票数量 > 入库/送货）→ 匹配差异确认点必拉人"
    actor: "agent"
  - l5: "行级核对金额与差异"
    inputs: "发票不含税金额、合同/PO 金额、ERP 模拟校验接口返回"
    outputs: "行级金额核对结果（差异金额/差异率/接口判定）"
    ruleType: "决策模型类·金额比对规则（由 ERP 模拟校验接口承载，本平台仅感知结果）"
    exception: "金额超尾差/单价不符 → 匹配差异确认点必拉人"
    actor: "agent"
  - l5: "判定行级匹配结果并记录匹配关系"
    inputs: "行级数量/金额/物料/供应商核对结果"
    outputs: "匹配结论（通过/差异）、匹配关系记录（差异类型/差异金额/差异数量）"
    ruleType: "决策模型类·差异容忍与异常判定经验（假设值，待访谈回填）"
    exception: "容忍内自动放行；任一超容忍 100% 拉人 → 异常确认点"
    actor: "agent"

# ---- 输入输出如何闭环 ----
ioChain:
  - "发票行 + PO 行 + 入库行 + 送货单行"
  - "三单行级匹配工作集"
  - "行级数量扣减结果 + 四数量对照报表"
  - "行级金额核对结果（ERP 模拟校验接口）"
  - "匹配结论（通过/差异）+ 匹配关系记录"
  - "下游：批量预制发票 / 异常凭证队列（补单换票后重跑）→ 会计凭证 / 台账归档"

# ---- 学习要点 ----
learning:
  why: "每个 L5 各自只有一个核心动词（汇入 / 核对 / 判定），输入输出可列、结果可观察，并可独立挂接一类规则依据（三单匹配口径 / 数量扣减 / 金额比对 / 差异容忍）。"
  key: "挖掘的关键不是改写任务名称，而是把专家真实执行的动作顺序（汇入→数量→金额→判定）、输入输出、判断依据（匹配口径/容忍阈值）和异常链路（超容忍必拉人、匹配关系表不覆盖原始单据）结构化。"

