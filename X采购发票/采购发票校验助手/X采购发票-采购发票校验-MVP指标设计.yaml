title: "采购发票校验助手 · MVP 指标设计与上线门禁"
product_name: "采购发票校验助手"
go_no_go_statement: "当 票面识别准确率 ≥95%、采集归集覆盖率 100%、入账自动化覆盖率 100%、三单匹配错误率 ≤ 目标值、超容忍差异 100% 拉人复核 且 过账失败率 ≤1% 时，允许灰度上线。"
target_metrics:
  - name: "采集归集覆盖率"
    dimension: "业务"
    logic: "全渠道（乐企/供应商上传/采购补录）已归集发票数 / 应归集发票数"
    threshold: "100%"
    source: "归集看板日志 + 乐企 IF001"
  - name: "入账自动化覆盖率"
    dimension: "业务"
    logic: "自动完成预制/过账/台账/乐企回写的发票数 / 匹配通过发票数"
    threshold: "100%"
    source: "台账 + ERP IF005/IF006 + 乐企 IF002"
  - name: "三单匹配错误率"
    dimension: "业务"
    logic: "匹配错误发票数 / 匹配总发票数（错误率基线待客户回填）"
    threshold: "≤ 目标值（待回填）"
    source: "匹配关系表 + 人工抽检"
  - name: "单票校验耗时"
    dimension: "业务"
    logic: "单张发票从识别到匹配完成的平均耗时"
    threshold: "自动匹配秒级（基线待回填）"
    source: "工作台流程日志"
  - name: "异常处理周期"
    dimension: "业务"
    logic: "异常票从进入队列到处理完成的平均时长"
    threshold: "缩短（基线待回填）"
    source: "异常队列 + 沟通登记"
  - name: "票面识别准确率"
    dimension: "模型"
    logic: "识别正确的关键字段数 / 应识别字段总数（发票号/金额/税额/税号/开票日期）"
    threshold: "≥ 95%"
    source: "离线测试集（AI 测试数据集）"
  - name: "异常召回率"
    dimension: "模型"
    logic: "被正确识别为异常的差异数 / 实际异常数（目标待回填）"
    threshold: "≥ 目标值（待回填）"
    source: "差异复核抽样"
  - name: "无依据推断率（幻觉率）"
    dimension: "模型"
    logic: "在证据不足时仍给出确定性匹配/入账结论的占比"
    threshold: "≤ 3%"
    source: "自研评估脚本 + 人工抽检"
  - name: "接口成功率"
    dimension: "系统"
    logic: "乐企 IF001/IF002、ERP IF003–IF007、OCR IF010 成功调用占比"
    threshold: "≥ 99%"
    source: "接口网关监控"
  - name: "P95 响应延迟"
    dimension: "系统"
    logic: "95% 请求的端到端响应时间"
    threshold: "≤ 3s"
    source: "APM 监控"
  - name: "过账失败率"
    dimension: "系统"
    logic: "过账失败次数 / 过账总次数"
    threshold: "≤ 1%"
    source: "过账日志"
  - name: "识别结果人工复核率"
    dimension: "体验"
    logic: "低置信度（<95%）转入人工复核的字段/票占比"
    threshold: "≤ 15%"
    source: "识别复核记录"
  - name: "用户操作步骤减少"
    dimension: "体验"
    logic: "（改造前人工步骤 - 改造后人工步骤）/ 改造前人工步骤"
    threshold: "≥ 50%"
    source: "流程埋点对比"
  - name: "待办与预警触达率"
    dimension: "体验"
    logic: "成功触达责任人的待办 / 提醒数 / 应触达总数"
    threshold: "≥ 95%"
    source: "IM 推送回执"
monitoring_plan:
  - name: "平均 Token 消耗"
    layer: "模型"
    logic: "单次票面识别 + 差异归因消耗的 Input+Output Token"
    range: "800-1500"
    alert: ">2500"
    meaning: "上下文注入过多或 Prompt 泄露风险"
  - name: "识别置信度分布"
    layer: "模型"
    logic: "各置信度区间的发票/字段占比"
    range: "高置信度 ≥85%"
    alert: "低置信度 >20%"
    meaning: "票面版式变化或 OCR 质量下降"
  - name: "匹配规则命中率"
    layer: "检索"
    logic: "三层匹配 / 6 条匹配规则 / 差异容忍规则成功命中的比例"
    range: "≥ 92%"
    alert: "< 85%"
    meaning: "规则库缺失或口径变更"
  - name: "乐企/ERP 接口错误率"
    layer: "系统"
    logic: "接口 5xx / 业务错误请求占比"
    range: "< 1%"
    alert: "> 3%"
    meaning: "乐企/SAP 侧限流或字段契约变更"
  - name: "过账失败率"
    layer: "系统"
    logic: "过账失败次数 / 过账总次数"
    range: "≤ 1%"
    alert: "> 3%"
    meaning: "会计期间关闭 / 成本中心缺失"
  - name: "人工转接分布"
    layer: "业务"
    logic: "各环节（识别/匹配/异常/过账）转人工的比例分布"
    range: "均衡分布"
    alert: "单一环节 >50%"
    meaning: "特定环节知识缺失或模型盲区"
  - name: "异常类型分布"
    layer: "业务"
    logic: "各异常类型（补单/换票/冲红/抬头税号不符/单价不符/数量超差/金额超尾差/跨期）占比"
    range: "随业务分布"
    alert: "单一类型 >40%"
    meaning: "上游数据质量问题或规则口径偏差"
test_set_strategy:
  golden_path: 50
  hard_cases: 30
  edge_cases: 20
