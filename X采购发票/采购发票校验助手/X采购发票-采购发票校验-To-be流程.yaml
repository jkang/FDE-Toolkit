meta:
  title: "X采购发票 · 采购发票校验助手 To-be 流程"
  version: "v1.0"
  date: "2026-09-10"
  scenarioName: "采购发票校验助手（A1 · 🟢 速赢）"
  businessStage: "挖知识 阶段1 任务流程挖掘 · 步骤1.1"
  methodology: "挖知识 阶段1方法（业务环节 L3 → 主要活动 L4 → 深度任务 L5）"
  inputs:
    - "定场景《X采购发票-采购发票校验-AI画布》（userPains / dataKnowledge / workflow / businessGains / systemIntegration）"
    - "定场景《X采购发票-采购发票校验-To-be旅程》（P1–P5 阶段 / 角色 / 动作 / 设计要点）"
    - "定场景《X采购发票-采购发票校验-现状流程图》（现状 L3 五阶段 / 五类痛点基线）"
    - "客户素材《采购发票处理开发方案设计文档 V1.0》（三单匹配口径 / 状态机 / 硬门禁）"
  sourceRef: "X采购发票-采购发票校验-任务流程拆解.yaml 深度任务序列 + 采购发票校验助手-任务流程挖掘清单.md"
  kpi:
    - "采集归集覆盖率"
    - "识别准确率"
    - "自动匹配通过率"
    - "三单匹配错误率"
    - "单票校验耗时"
    - "发票到过账周期"
    - "异常处理周期"
    - "入账自动化覆盖率"

# ---- 图例区（页眉下方一行）----
legend:
  execution:
    - { type: "agent",  label: "Agent=AI 自动执行", icon: "🤖" }
    - { type: "human",  label: "人工=人工执行",     icon: "👤" }
    - { type: "hybrid", label: "混合=人机协同",     icon: "🤝" }
  hitlFocus:
    - { level: "low",    label: "低 · 人机介入",      desc: "全自动，无人工介入" }
    - { level: "medium", label: "中 · 人机交错/审核", desc: "AI 产出，人工抽检/确认" }
    - { level: "high",   label: "高 · 人机终审",      desc: "人类担任最终裁决" }
    - { level: "gate",   label: "必停确认",           desc: "对外/记账动作，强制人工放行" }
  flowConventions:
    - "角色泳道 任务泳道内转；发票校验助手 Agent 主驱动，人工只在价值判断/风险兜底介入"
    - "流程走向 任务正常后回填 AI；Agent 串联归集→识别→匹配→异常→入账→归档全链"
  valueAnchors:
    - "采集归集覆盖率"
    - "识别准确率"
    - "自动匹配通过率"
    - "三单匹配错误率"
    - "单票校验耗时"
    - "发票到过账周期"
    - "异常处理周期"
    - "入账自动化覆盖率"

# ---- 业务阶段（列 = L3，承接 To-Be 旅程 P1–P5）----
phases:
  - { id: "P1", order: 1, name: "发票多源采集归集", fullName: "发票多渠道采集与归集", description: "乐企/供应商上传/采购补录三渠道一键归集，自动查重查漏" }
  - { id: "P2", order: 2, name: "用途确认与识别校验", fullName: "用途确认与票面识别校验", description: "OCR 抽取票面关键字段并返回置信度，校验真伪与购方抬头，确认用途" }
  - { id: "P3", order: 3, name: "三单匹配", fullName: "以发票行为主线的三单匹配", description: "汇入 PO/入库/送货单行，行级数量扣减与金额比对，判定匹配结果" }
  - { id: "P4", order: 4, name: "异常凭证确认", fullName: "异常凭证确认与返工", description: "判定异常类型、生成处理建议与升级路径，人工沟通登记后重跑匹配" }
  - { id: "P5", order: 5, name: "自动入账与归档", fullName: "预制过账与台账归档", description: "硬门禁校验后批量预制过账，更新台账、乐企入账标识并归档" }

# ---- 角色泳道（行）----
lanes:
  - { id: "sup",   order: 1, name: "供应商 · 外部",          group: "客户/外部", description: "提交数电发票/纸质发票与送货单的外部供货方" }
  - { id: "buyer", order: 2, name: "采购业务员",             group: "采购部",    description: "采购补录、按 PO 权限复核异常、与供应商沟通与升级" }
  - { id: "ap",    order: 3, name: "应付会计（执行层）",      group: "财务部",    description: "归集发起、识别复核、匹配复核、异常确认、预制与归档主责" }
  - { id: "agent", order: 4, name: "采购发票校验助手 Agent", group: "AI 主驱动", description: "归集/识别/匹配/异常判定/预制/台账/归档的 AI 主驱动" }
  - { id: "fin",   order: 5, name: "财务负责人（审核层）",    group: "财务部",    description: "过账审核与放行，凭证合规与入账留痕" }
  - { id: "sys",   order: 6, name: "系统与平台",             group: "后台系统",  description: "电子税务局/乐企 · ERP(SAP) · 公共网盘/文件服务 · OCR · 打印 · 消息/IM" }

# ---- 深度任务（L5）----
tasks:
  # ============ P1 发票多源采集归集 ============
  - { id: "t01", order: 1, phaseId: "P1", laneId: "sup",
      name: "多渠道提交数电发票与送货单", actor: "human",
      inputs: ["数电发票（XML/PDF/OFD）", "纸质发票", "送货单/物流邮件"],
      outputs: ["待归集的发票与送货单文件"],
      ruleType: "",
      valueAnchors: ["采集归集覆盖率"], hitlFocus: "low",
      exception: "渠道/命名不规范 → 系统按供应商+发票号自动命名归档",
      description: "供应商经乐企/邮件/网盘提交发票与送货单，无统一入口" }
  - { id: "t02", order: 2, phaseId: "P1", laneId: "ap",
      name: "发起今日归集并确认批次范围", actor: "human",
      inputs: ["归集渠道范围", "开票日期区间", "已入账发票清单"],
      outputs: ["本批待校验发票批次与范围"],
      ruleType: "",
      valueAnchors: ["采集归集覆盖率"], hitlFocus: "medium",
      exception: "范围混入已入账发票 → 拦截并提示剔除",
      description: "应付会计确认本批范围并一键触发三渠道归集" }
  - { id: "t03", order: 3, phaseId: "P1", laneId: "agent",
      name: "同步乐企发票池（IF001）", actor: "agent",
      inputs: ["批次范围", "乐企发票池（IF001）"],
      outputs: ["乐企发票文件与结构化清单"],
      ruleType: "",
      valueAnchors: ["采集归集覆盖率"], hitlFocus: "low",
      exception: "接口超时/失败 → 重试 2 次 → 拉人",
      description: "Agent 按范围调用乐企发票池拉取数电发票" }
  - { id: "t04", order: 4, phaseId: "P1", laneId: "agent",
      name: "归集供应商上传发票", actor: "agent",
      inputs: ["供应商上传区文件"],
      outputs: ["供应商上传发票归集清单"],
      ruleType: "",
      valueAnchors: ["采集归集覆盖率"], hitlFocus: "low",
      exception: "文件损坏/加密 → 标红待人工补传",
      description: "Agent 归集供应商上传区发票并登记来源" }
  - { id: "t05", order: 5, phaseId: "P1", laneId: "agent",
      name: "归集采购补录纸质票影像", actor: "hybrid",
      inputs: ["纸质票影像（PDF/JPG）", "采购补录记录"],
      outputs: ["采购补录发票记录"],
      ruleType: "",
      valueAnchors: ["采集归集覆盖率"], hitlFocus: "medium",
      exception: "抬头/税号不清 → 转识别复核点",
      description: "AI 归集 + 采购补录纸质票影像，形成补录记录" }
  - { id: "t06", order: 6, phaseId: "P1", laneId: "agent",
      name: "核验归集完整性并查重", actor: "agent",
      inputs: ["本批发票清单", "历史批次发票号"],
      outputs: ["归集核对结果（漏票/重票标记）"],
      ruleType: "关键信息提取要点·发票票面关键字段提取要点",
      valueAnchors: ["采集归集覆盖率"], hitlFocus: "low",
      exception: "漏票/重票 → 黄色标记转人工确认",
      description: "Agent 做发票号去重、必填字段校验与历史批次比对" }
  - { id: "t07", order: 7, phaseId: "P1", laneId: "sys",
      name: "发票与单据文件归集存储（IF009）", actor: "agent",
      inputs: ["发票文件", "送货单文件"],
      outputs: ["文件服务归集索引"],
      ruleType: "",
      valueAnchors: ["采集归集覆盖率"], hitlFocus: "low",
      exception: "存储失败 → 重试/降级本地暂存",
      description: "文件服务承载发票与单据的归集存取" }

  # ============ P2 用途确认与识别校验 ============
  - { id: "t08", order: 8, phaseId: "P2", laneId: "agent",
      name: "识别发票票面关键字段与行项目（IF010）", actor: "agent",
      inputs: ["发票影像（XML/PDF/OFD）"],
      outputs: ["结构化识别字段（含置信度）", "发票行项目"],
      ruleType: "关键信息提取要点·发票票面关键字段提取要点",
      valueAnchors: ["识别准确率"], hitlFocus: "low",
      exception: "置信度 <95%/字段缺失/新版式 → 标红转识别复核点",
      description: "OCR/多模态模型抽取票面关键字段并返回置信度" }
  - { id: "t09", order: 9, phaseId: "P2", laneId: "ap",
      name: "复核低置信字段并补录", actor: "hybrid",
      inputs: ["标红字段", "票面截图对照"],
      outputs: ["补录后的结构化字段"],
      ruleType: "关键信息提取要点·发票票面关键字段提取要点",
      valueAnchors: ["识别准确率"], hitlFocus: "high",
      exception: "补录后仍不可读 → 转人工线下核验",
      description: "应付会计对照票面补录低置信/缺失字段" }
  - { id: "t10", order: 10, phaseId: "P2", laneId: "agent",
      name: "校验发票真伪与购方抬头", actor: "agent",
      inputs: ["结构化识别字段", "供应商/税号/科目字典"],
      outputs: ["真伪校验结果", "抬头校验结果"],
      ruleType: "术语字典类·供应商/税号/科目映射字典",
      valueAnchors: ["识别准确率"], hitlFocus: "low",
      exception: "真伪/抬头/税号不符 → 标记进入异常队列",
      description: "Agent 以术语字典校验发票真伪与购方抬头一致性" }
  - { id: "t11", order: 11, phaseId: "P2", laneId: "sys",
      name: "返回供应商/税号/科目主数据（IF011）", actor: "agent",
      inputs: ["供应商/物料/科目查询请求"],
      outputs: ["供应商标准名/代码/税号/SAP 科目/成本中心/付款条件"],
      ruleType: "术语字典类·供应商/税号/科目映射字典",
      valueAnchors: ["识别准确率"], hitlFocus: "low",
      exception: "主数据缺失 → 提示人工确认并登记缺口",
      description: "物料主数据服务返回校验与预制所需的字典口径" }
  - { id: "t12", order: 12, phaseId: "P2", laneId: "buyer",
      name: "确认自有权限 PO 用途", actor: "hybrid",
      inputs: ["结构化识别字段", "PO 权限范围（IF012）"],
      outputs: ["确认后的发票用途"],
      ruleType: "",
      valueAnchors: ["识别准确率"], hitlFocus: "medium",
      exception: "跨权限 PO 行项不可见 → 提示权限边界",
      description: "AI 预判 + 采购复核，采购员仅可操作自有权限 PO" }

  # ============ P3 三单匹配 ============
  - { id: "t13", order: 13, phaseId: "P3", laneId: "agent",
      name: "获取采购订单信息（IF003）", actor: "agent",
      inputs: ["发票行/物料/供应商", "ERP/SAP PO（IF003）"],
      outputs: ["采购订单主信息与 PO 行"],
      ruleType: "",
      valueAnchors: ["自动匹配通过率"], hitlFocus: "low",
      exception: "PO 缺失/权限外 → 标记差异并拉人",
      description: "Agent 按发票行反查并汇入 PO 主信息与 PO 行" }
  - { id: "t14", order: 14, phaseId: "P3", laneId: "agent",
      name: "获取入库单信息（IF004）", actor: "agent",
      inputs: ["PO 行/物料", "ERP/SAP 入库单（IF004）"],
      outputs: ["入库单与入库行数量"],
      ruleType: "",
      valueAnchors: ["自动匹配通过率"], hitlFocus: "low",
      exception: "入库单缺失 → 标记差异并拉人",
      description: "Agent 汇入入库单与入库行数量" }
  - { id: "t15", order: 15, phaseId: "P3", laneId: "agent",
      name: "获取送货单行信息（IF008）", actor: "agent",
      inputs: ["PO 行/物料", "送货单接口（IF008）"],
      outputs: ["送货单行（含 PO 号/PO 行号/物料/数量）"],
      ruleType: "",
      valueAnchors: ["自动匹配通过率"], hitlFocus: "low",
      exception: "送货单缺失 → 标记差异并拉人",
      description: "Agent 经接口读取送货单行（系统孤岛解除）" }
  - { id: "t16", order: 16, phaseId: "P3", laneId: "agent",
      name: "以发票行为主线汇入三单行信息", actor: "agent",
      inputs: ["发票行", "PO 行", "入库行", "送货单行"],
      outputs: ["三单行级匹配工作集"],
      ruleType: "决策模型类·三单匹配口径与数量扣减规则",
      valueAnchors: ["自动匹配通过率", "单票校验耗时"], hitlFocus: "low",
      exception: "多对多关系冲突 → 记入匹配关系表待人工调整",
      description: "以发票行为主线执行三层匹配并汇入三单行" }
  - { id: "t17", order: 17, phaseId: "P3", laneId: "agent",
      name: "行级核对数量并扣减（四数量对照）", actor: "agent",
      inputs: ["三单行级匹配工作集（数量）"],
      outputs: ["行级数量核对结果", "四数量对照报表"],
      ruleType: "决策模型类·三单匹配口径与数量扣减规则",
      valueAnchors: ["三单匹配错误率", "单票校验耗时"], hitlFocus: "low",
      exception: "数量超差 → 转异常确认（匹配差异确认点）",
      description: "以发票数量扣减入库/送货数量，行级标注超差" }
  - { id: "t18", order: 18, phaseId: "P3", laneId: "agent",
      name: "行级核对金额与差异（ERP 模拟校验接口）", actor: "agent",
      inputs: ["发票不含税金额", "合同/PO 金额", "ERP 模拟校验结果"],
      outputs: ["行级金额核对结果与差异金额/差异率"],
      ruleType: "决策模型类·金额比对规则",
      valueAnchors: ["三单匹配错误率", "单票校验耗时"], hitlFocus: "low",
      exception: "金额超容忍 → 转异常确认",
      description: "经 ERP 模拟校验接口比对金额，本平台仅感知结果" }
  - { id: "t19", order: 19, phaseId: "P3", laneId: "agent",
      name: "判定行级匹配结果并记录匹配关系", actor: "agent",
      inputs: ["行级数量/金额/物料/供应商核对结果"],
      outputs: ["匹配结论（通过/差异）", "匹配关系记录"],
      ruleType: "决策模型类·差异容忍与异常判定经验",
      valueAnchors: ["自动匹配通过率"], hitlFocus: "low",
      exception: "超容忍 100% 拉人；容忍内自动放行",
      description: "Agent 按容忍规则判定并写入匹配关系表（不覆盖原始单据）" }
  - { id: "t20", order: 20, phaseId: "P3", laneId: "ap",
      name: "复核匹配结果与差异", actor: "hybrid",
      inputs: ["匹配工作集", "差异清单", "四数量对照报表"],
      outputs: ["匹配复核结论"],
      ruleType: "决策模型类·差异容忍与异常判定经验",
      valueAnchors: ["三单匹配错误率"], hitlFocus: "high",
      exception: "拿不准的差异 → 人工裁决/转异常队列",
      description: "应付会计复核行级匹配与差异，超容忍必停" }

  # ============ P4 异常凭证确认 ============
  - { id: "t21", order: 21, phaseId: "P4", laneId: "agent",
      name: "判定异常类型并生成处理建议", actor: "agent",
      inputs: ["匹配差异清单"],
      outputs: ["异常类型标注", "处理建议"],
      ruleType: "决策模型类·差异容忍与异常判定经验",
      valueAnchors: ["异常处理周期"], hitlFocus: "low",
      exception: "类型无法判定 → 默认转人工确认",
      description: "Agent 按异常判定经验判定类型并给处理建议" }
  - { id: "t22", order: 22, phaseId: "P4", laneId: "agent",
      name: "生成沟通对象与升级路径建议", actor: "agent",
      inputs: ["异常类型", "PO 权限/责任人映射"],
      outputs: ["沟通对象", "升级路径建议"],
      ruleType: "操作流程类·异常沟通与升级路径",
      valueAnchors: ["异常处理周期"], hitlFocus: "low",
      exception: "无匹配升级路径 → 升级财务负责人",
      description: "Agent 将隐性「异常沟通与升级路径」结构化输出" }
  - { id: "t23", order: 23, phaseId: "P4", laneId: "buyer",
      name: "人工确认异常凭证", actor: "human",
      inputs: ["异常凭证清单", "处理建议"],
      outputs: ["异常确认结论"],
      ruleType: "",
      valueAnchors: ["异常处理周期"], hitlFocus: "high",
      exception: "异议 → 退回重判/人工线下处理",
      description: "采购业务员按 PO 权限确认异常凭证" }
  - { id: "t24", order: 24, phaseId: "P4", laneId: "buyer",
      name: "与供应商沟通处理异常", actor: "human",
      inputs: ["沟通对象", "升级路径", "异常明细"],
      outputs: ["沟通结果（补单/换票/冲红）"],
      ruleType: "",
      valueAnchors: ["异常处理周期"], hitlFocus: "high",
      exception: "2 个工作日未响应 → 升级财务负责人",
      description: "采购业务员与供应商沟通补单/换票/冲红" }
  - { id: "t25", order: 25, phaseId: "P4", laneId: "buyer",
      name: "登记沟通结果并挂起该票", actor: "hybrid",
      inputs: ["沟通结果", "预计完成时间"],
      outputs: ["异常票状态（补单中/换票中）", "重跑提醒"],
      ruleType: "",
      valueAnchors: ["异常处理周期"], hitlFocus: "medium",
      exception: "登记有误 → 窗口期内一键撤销",
      description: "登记沟通结果并挂起该票、设置补单到货提醒" }
  - { id: "t26", order: 26, phaseId: "P4", laneId: "agent",
      name: "补单到货后重跑三单匹配", actor: "hybrid",
      inputs: ["修正后的发票/PO/入库/送货数据"],
      outputs: ["重新进入三单匹配"],
      ruleType: "决策模型类·三单匹配口径与数量扣减规则",
      valueAnchors: ["三单匹配错误率"], hitlFocus: "low",
      exception: "重跑仍超差 → 再次拉人",
