title: "X采购发票 · 采购发票校验助手 CKD 映射报告"
product: "采购发票校验助手"
description: "围绕采购发票校验全链路（多源归集 → 票面识别校验 → 三单匹配 → 金额比对与差异判定 → 异常确认返工 → 预制过账 → 台账归档与乐企回写），梳理每一步 AI 执行所需的上下文、知识与数据资产，为 RAG、规则引擎与接口集成提供资产清单。"
steps:
  - step_name: "1. 多源发票归集"
    ckd_items:
      - context_name: "归集批次参数（渠道/时间范围/供应商）"
        description: "本次归集的渠道范围与时间窗口，决定从乐企、供应商上传区、采购补录拉取哪些发票。"
        type: "请求上下文"
        storage: "任务配置表 / MySQL"
        volume: "按批次动态生成"
        ai_init: false
        frequency: "实时（每次归集）"
        retrieval: "任务参数直取"
        status: "已支持"
      - context_name: "采购发票（数电票 XML + PDF/OFD 影像）"
        description: "发票主数据，含发票号、金额、税额、供应商税号、开票日期等必填字段。"
        type: "API 数据 / 半结构化"
        storage: "乐企平台（IF001）+ 文件服务（IF009）"
        volume: "月度量级待回填"
        ai_init: false
        frequency: "定时/批量拉取"
        retrieval: "接口按条件拉取 + 发票号去重"
        status: "已支持"
      - context_name: "发票去重与完整性规则"
        description: "按发票号/关键字段查重、核验归集完整性的规则。"
        type: "规则引擎配置"
        storage: "规则中心 / JSON"
        volume: "<20 条规则"
        ai_init: true
        frequency: "季度更新"
        retrieval: "规则匹配"
        status: "建设中"

  - step_name: "2. 票面识别与真伪/抬头校验"
    ckd_items:
      - context_name: "发票影像与版式样本"
        description: "数电票/纸质扫描件影像，供多模态模型识别票面关键字段与行项目。"
        type: "非结构化文档"
        storage: "文件服务（IF009）+ OCR 服务（IF010）"
        volume: "按发票张数"
        ai_init: false
        frequency: "文件入库后触发"
        retrieval: "OCR + 版面理解"
        status: "已支持"
      - context_name: "发票票面关键字段提取要点"
        description: "5 个目标字段（发票号/金额/税额/供应商税号/开票日期）的典型位置、易错变体与置信度阈值 95%。"
        type: "关键信息提取要点"
        storage: "配置中心 / 版本库"
        volume: "少量模板"
        ai_init: true
        frequency: "实时跟随新票样"
        retrieval: "模板注入 + 版面定位"
        status: "建设中"
      - context_name: "供应商/税号/科目映射字典"
        description: "供应商标准名/代码/统一社会信用代码、SAP 科目/成本中心/付款条件，用于真伪与购方抬头校验。"
        type: "静态字典"
        storage: "主数据服务（IF014）/ Redis"
        volume: "供应商千级"
        ai_init: false
        frequency: "月度更新"
        retrieval: "Key-Value + 精确查询"
        status: "已支持"

  - step_name: "3. 三单匹配（行级）"
    ckd_items:
      - context_name: "采购订单 PO（主信息 + 行）"
        description: "三单匹配的基准之一，含 PO 号、行项、数量、单价、金额。"
        type: "API 数据 / 结构化"
        storage: "ERP/SAP MM（IF003）"
        volume: "按批次"
        ai_init: false
        frequency: "实时/缓存"
        retrieval: "PO 号关联查询"
        status: "已支持"
      - context_name: "入库单（+ 入库行）"
        description: "三单匹配的基准之一，含入库数量、批次。"
        type: "API 数据 / 结构化"
        storage: "ERP/SAP MM（IF004）"
        volume: "按批次"
        ai_init: false
        frequency: "实时/缓存"
        retrieval: "PO/物料关联查询"
        status: "已支持"
      - context_name: "送货单（扫描件/文件）"
        description: "三单匹配的基准之一（数量扣减用），无 API，依赖公共网盘人工读取。"
        type: "非结构化/半结构化文档"
        storage: "公共文件夹/网盘（IF008）⚠️系统孤岛"
        volume: "按批次"
        ai_init: false
        frequency: "人工读取"
        retrieval: "目录扫描 + OCR"
        status: "待规划"
      - context_name: "三单匹配口径与数量扣减规则"
        description: "以发票行为主线、三层匹配结构、6 条匹配规则、数量以发票数量扣减入库/送货数量、匹配关系表不覆盖原始单据。"
        type: "规则引擎配置"
        storage: "规则中心 / JSON"
        volume: "<50 条规则"
        ai_init: true
        frequency: "季度更新"
        retrieval: "规则引擎匹配"
        status: "建设中"

  - step_name: "4. 金额比对与差异判定"
    ckd_items:
      - context_name: "ERP 模拟校验接口返回"
        description: "发票金额 ≤ 合同/PO 金额等金额比对规则的承载方，本平台仅感知通过/差异结果。"
        type: "API 数据"
        storage: "ERP/SAP（IF005 前置校验）"
        volume: "按发票行"
        ai_init: false
        frequency: "实时调用"
        retrieval: "接口调用"
        status: "待规划"
      - context_name: "差异容忍与异常判定经验"
        description: "数量无容忍区间、金额尾差 ≤1 元且 ≤0.5% 自动容忍（领域专家假设值，待访谈回填）；异常类型清单。"
        type: "决策模型类知识"
        storage: "规则中心 / 知识库"
        volume: "<30 条规则"
        ai_init: true
        frequency: "季度更新"
        retrieval: "规则引擎判定 + LLM 归因"
        status: "待规划"

  - step_name: "5. 异常确认与返工"
    ckd_items:
      - context_name: "异常沟通与升级路径"
        description: "异常需补单/换票/冲红时，判断沟通对象与升级路径的操作流程类经验。"
        type: "操作流程类知识"
        storage: "知识库 / SOP"
        volume: "覆盖典型异常 ≥80%"
        ai_init: true
        frequency: "季度更新"
        retrieval: "语义检索 + 建议生成"
        status: "待规划"
      - context_name: "消息通知"
        description: "异常待办/提醒的接收人、任务链接与模板。"
        type: "API 数据"
        storage: "消息/IM（IF017）"
        volume: "按异常票数"
        ai_init: false
        frequency: "状态/异常触发"
        retrieval: "消息推送"
        status: "已支持"

  - step_name: "6. 预制与过账"
    ckd_items:
      - context_name: "预制/过账/乐企前置硬门禁规则"
        description: "预制（已识别/匹配关系/差异说明/信息完整/校验通过/权限）、过账（已预制/预制有效/财务权限）、乐企（已过账/有凭证号/权限）三类硬门禁。"
        type: "规则引擎配置"
        storage: "规则中心 / JSON"
        volume: "<30 条规则"
        ai_init: true
        frequency: "季度更新"
        retrieval: "规则引擎校验"
        status: "建设中"
      - context_name: "预制发票与会计凭证"
        description: "ERP 生成的预制凭证与过账凭证（凭证号、借贷项）。"
        type: "API 数据 / 结构化"
        storage: "ERP/SAP FI（IF005/IF006）"
        volume: "按批次"
        ai_init: false
        frequency: "实时"
        retrieval: "接口调用 + 凭证号回写"
        status: "待规划"

  - step_name: "7. 台账归档与乐企状态回写"
    ckd_items:
      - context_name: "乐企入账状态"
        description: "发票号、凭证号、入账状态，过账后回写电子税务局/乐企。"
        type: "API 数据"
        storage: "乐企平台（IF002）"
        volume: "按过账批次"
        ai_init: false
        frequency: "过账后触发"
        retrieval: "接口回写"
        status: "待规划"
      - context_name: "归档文件与打印任务"
        description: "按发票编号索引的归档文件（PDF/影像）与打印任务。"
        type: "文件 / API 数据"
        storage: "文件服务（IF012）+ 打印服务（IF016）"
        volume: "按发票张数"
        ai_init: false
        frequency: "批量"
        retrieval: "发票编号索引"
        status: "已支持"
      - context_name: "权限/数据范围"
        description: "用户、角色、数据范围（采购员仅可见/操作自有权限 PO）。"
        type: "权限数据"
        storage: "AD/权限系统（IF015）"
        volume: "用户×角色×数据范围"
        ai_init: false
        frequency: "低频"
        retrieval: "权限规则校验"
        status: "已支持"
