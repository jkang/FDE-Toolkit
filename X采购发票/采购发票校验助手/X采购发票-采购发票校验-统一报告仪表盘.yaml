title: "X采购发票 · 采购发票校验助手统一报告"
subtitle: "单场景端到端（含 As-Is 现状）：机会点定义 → AI画布 → To-be流程/CKD/任务拆解(P1)/规则挖掘(P2) → Agent本体 → Agent产品方案 → To-be旅程 → MVP原型 → UX优化 → 落地技术架构 → MVP成效指标 → 测试数据集"
executive_summary:
  - "一句话结论：把「人工多系统归集发票 + 逐票逐行三单匹配 + 凭经验判异常 + 手工预制过账归档」升级为「<b>多源自动归集 + AI 票面识别 + 规则化三单匹配 + 差异容忍判定 + 硬门禁批量预制过账 + 台账归档状态自动回写</b>」。"
  - "本报告沿 <b>理需求 → 挖知识 → 建本体 → 生智能 → 评测</b> 给出可施工证据链：5 个机会点 · 24 个 L5 深度任务 · 6 条业务规则 · 16 个本体实体 · 5 个编排 Skill · 6 个原型页面 · 24 条测试用例。"
  - "技术路线：<b>Autonomous Planner</b>（1 编排 Agent + 5 Skill + 1 本体）；过账为对外财务动作的强制人工闸门，预制/过账/乐企三类硬门禁前置。"
