title: "采购发票校验助手 · To-be 旅程设计"
meta:
  mode: "to-be"
  source: "AI画布: X采购发票/采购发票校验助手/X采购发票-采购发票校验-AI画布.yaml"
  scenarioName: "采购发票校验助手"
  productType: "嵌入 ERP/应付工作台的发票校验助手（三单匹配工作台 + 异常确认台）+ 财务共享应付岗批量校验任务台"
personas:
  - id: "ap_accountant_wang"
    name: "王敏"
    role: "应付会计"
    department: "财务部 · 应付组"
    background: "负责采购发票校验与应付入账 6 年，日均处理多渠道采购发票，月度量级与单票校验耗时基线待客户回填；日常使用 ERP（SAP）、乐企平台、公共网盘与邮件/微信。"
    goals:
      - "把每天多渠道进来的采购发票尽快完成三单匹配并安全入账"
      - "不再逐票逐行人工比对，只处理真正拿不准的异常"
      - "把资深经验沉淀成可复核的标准动作，换人不断档"
    painPoints:
      - "三单匹配需逐票逐行人工比对发票/入库送货/PO，高耗时且易错（现状痛点：高耗时 + 高频错误）"
      - "差异容忍与异常判定依赖资深经验，无书面标准，换人即断档（高认知负荷）"
      - "发票在乐企、入库单在 ERP、送货单在公共网盘，多系统割裂、人工归集易漏票重票（系统瓶颈）"
    dataProfile:
      typicalValues:
        - "本批待校验采购发票 46 张（乐企同步 38 张 + 供应商上传 6 张 + 采购补录 2 张）"
        - "数电发票号 25312000000012345678，不含税金额 77,700.00 元，税额 10,101.00 元，价税合计 87,801.00 元，开票日期 2026-06-18"
        - "采购订单号 6300002695，物料 二级RO膜，规格 东丽 TM720D 400，数量 42 支"
      frequency: "高频（月度批量 + 每日增量）"
      commonErrors:
        - "多来源人工读取抄录错漏、发票号重复归集"
        - "多对多匹配关系易错，数量/金额对不上需冲销重做"
  - id: "buyer_li"
    name: "李强"
    role: "采购业务员"
    department: "采购部 · 生产物料组"
    background: "负责生产物料采购与到货跟进，按 PO 权限复核异常发票并与供应商沟通补单/换票；日均处理多张采购订单与到货异常。"
    goals:
      - "异常发票按类型快速分流，一眼看清处理建议与沟通对象"
      - "与供应商沟通有据可依，减少多轮邮件往返"
    painPoints:
      - "异常票（补单/换票/冲红）需与供应商多轮邮件往返，一次异常动辄数日（来回往复）"
      - "沟通对象与升级路径靠隐性经验，新人无从下手"
      - "只能看/操作自有权限 PO 行项，跨权限数据需人工隔离"
    dataProfile:
      typicalValues:
        - "待复核异常发票 5 张（数量超差 ×1、金额超尾差 ×1、抬头税号不符 ×1、单价不符 ×1、跨期发票 ×1）"
        - "数量超差样例：发票 INV-2026-0618-002，物料 精密轴承 NSK 6205，发票 500 件 > 入库 480 件"
        - "供应商 XX环保科技（脱敏），采购订单号 6300002695"
      frequency: "中频（异常触发）"
      commonErrors:
        - "漏看升级路径导致异常票长期挂起"
        - "跨权限查看非自有 PO 行项"
  - id: "fin_manager_chen"
    name: "陈静"
    role: "财务负责人"
    department: "财务部 · 核算与共享中心"
    background: "负责应付过账审核与放行，关注凭证合规与入账留痕；过渡期还需确认乐企入账标识更新。"
    goals:
      - "预制/过账前置条件全绿才放行，过账留痕可追溯"
      - "发票到过账周期缩短，台账与乐企状态一次到位"
    painPoints:
      - "过账审核需逐票/抽查核对，等待与重复确认耗时（高耗时）"
      - "入账标识需财务到乐企/电子税务局手工确认，过渡期重复劳动（系统瓶颈）"
    dataProfile:
      typicalValues:
        - "待过账预制发票 39 张（含 2 张预制失败待补）"
        - "ERP 过账凭证号、会计期间、过账状态回写"
        - "乐企入账标识状态：待更新 / 已更新 / 人工已更新"
      frequency: "中频（批量过账）"
      commonErrors:
        - "漏审预制失败票导致台账缺口"
        - "过账后忘记更新乐企入账标识"
scenarios:
  - id: "s1"
    name: "月初批量校验"
    personaId: "ap_accountant_wang"
    trigger: "月初发票集中到票，应付会计需要对本月采购发票批量完成归集、识别与三单匹配"
    businessData:
      - "本批采购发票 46 张（乐企同步 38 张 + 供应商上传 6 张 + 采购补录 2 张）"
      - "三单单据：ERP PO（6300002695）、ERP 入库单（NJ-2026061801）、公共网盘送货单（20260618170457663.pdf）"
      - "数电发票 25312000000012345678：二级RO膜 东丽 TM720D 400 × 42 支，不含税 77,700.00 元"
    goal: "批量完成 46 张发票的归集、识别与三单匹配，自动放行匹配通过票、按类型分流异常票"
  - id: "s2"
    name: "异常票返工"
    personaId: "buyer_li"
    trigger: "三单匹配出现数量超差/抬头税号不符等异常，需采购业务员按 PO 权限复核并与供应商沟通"
    businessData:
      - "异常发票 INV-2026-0618-002：精密轴承 NSK 6205，发票 500 件 > 入库 480 件（数量超差）"
      - "四数量对照：PO 500 / 送货 480 / 入库 480 / 发票 500，差异数量 20 件"
      - "供应商沟通对象：采购员李强；升级路径：2 个工作日未响应升级财务负责人"
    goal: "异常票按类型分流并给出处理建议与升级路径，沟通结果登记后自动挂起重跑三单匹配"
  - id: "s3"
    name: "批量预制过账"
    personaId: "fin_manager_chen"
    trigger: "匹配通过票批量预制后，财务负责人对待过账发票审核放行并更新乐企入账标识"
    businessData:
      - "匹配通过发票 41 张，其中预制成功 39 张、预制失败 2 张（成本中心缺失）"
      - "ERP 过账返回：凭证号、会计期间、过账状态"
      - "乐企入账状态（IF002）与台账、归档索引（按发票编号）"
    goal: "预制/过账硬门禁全绿后批量放行，台账、乐企入账标识、归档索引一次更新到位"
stages:
  - name: "发票多渠道采集归集"
    actions:
      - name: "发起今日归集并确认范围"
        owner: "应付会计"
        touchpoints: "发票校验工作台 · 归集看板"
        thoughts:
          - "希望系统自动把乐企、供应商上传、采购补录的票一次收齐，别再让我逐个渠道下载"
          - "先确认本批范围，避免混入已入账发票"
        userInputs:
          - type: "系统自动带入"
            name: "归集渠道范围与批次"
            format: "页面内选择（乐企 / 供应商上传 / 采购补录）"
            example: "本批 46 张：乐企 38 张 + 供应商上传 6 张 + 采购补录 2 张"
            content: "待校验发票批次、渠道来源、开票日期区间"
          - type: "文件上传"
            name: "采购补录纸质票影像"
            format: "PDF / JPG"
            example: "纸质票补录-20260618-02.jpg"
            content: "发票号、开票日期、供应商、不含税金额、税额、价税合计"
        aiInteraction:
          aiAction: "按渠道范围调用乐企发票池（IF001）、供应商上传区、采购补录记录，归集发票文件并保存至文件服务（IF009）"
          suggestions:
            - "开始今日归集（三渠道）"
            - "仅同步乐企发票池"
            - "查看本批渠道分布"
        visibleData:
          - "归集进度：乐企已拉取 38 张、供应商上传新增 6 张、采购补录 2 张，共 46 张"
          - "渠道分栏看板：发票号、供应商、不含税金额、税额、开票日期、渠道来源"
          - "识别准确率口径：票面关键字段置信度阈值 95%"
        designNotes:
          - "采集归集覆盖率目标 100%（AI 画布 businessGains）"
          - "多系统孤岛在界面上消失，人工归集耗时下降（现状痛点：系统瓶颈）"
      - name: "核验归集完整性并查重"
        owner: "应付会计"
        touchpoints: "发票校验工作台 · 归集看板 · 重复标记"
        thoughts:
          - "最怕漏票和重票，希望系统主动告诉我哪张重复了"
        userInputs:
          - type: "系统自动带入"
            name: "本批发票清单与历史批次"
            format: "结构化比对"
            example: "46 张发票号去重比对历史批次"
            content: "发票号、供应商税号、开票日期、金额"
        aiInteraction:
          aiAction: "对归集结果做完整性校验：发票号去重、必填字段校验、与历史批次比对"
          suggestions:
            - "核验归集完整性"
            - "查看重复票比对详情"
            - "标记为已确认无遗漏"
        visibleData:
          - "归集核对结果：共 46 张，无重复；1 张发票号与昨日批次重复，已黄色标记"
          - "漏票提示：无缺失渠道；纸质补录 2 张待人工确认抬头"
        designNotes:
          - "漏票/重复转人工确认（SKP 深度任务·采集渠道确认点）"
          - "为后续三单匹配提供干净的发票池，降低高频错误"
  - name: "用途确认与识别校验"
    actions:
      - name: "确认用途并复核识别结果"
        owner: "应付会计 / 采购业务员"
        touchpoints: "发票校验工作台 · 识别复核卡片"
        thoughts:
          - "模糊票的金额字段我要能直接对照票面截图补录"
          - "采购员只能看到自己权限 PO 相关的发票"
        userInputs:
          - type: "文件上传 / 系统带入"
            name: "采购发票文件与用途确认信息"
            format: "数电票 XML/PDF/OFD + 用途确认信息"
            example: "25312000000012345678.xml（含税 87,801.00 元）"
            content: "发票号、开票日期、供应商税号、不含税金额、税额、价税合计、用途"
          - type: "页面内编辑"
            name: "低置信字段人工补录"
            format: "表单补录"
            example: "金额字段置信度 82%，人工补录为 77,700.00"
            content: "金额、税额、供应商税号等低置信或缺失字段"
        aiInteraction:
          aiAction: "调用 OCR/AI 识别（IF010）抽取票面关键字段并返回置信度；低于 95% 的字段标红转人工复核；按权限过滤 PO 范围"
          suggestions:
            - "识别并校验票面关键字段"
            - "查看标红字段票面位置"
            - "补录后继续校验"
        visibleData:
          - "识别结果：发票号 25312000000012345678、不含税金额 77,700.00、税额 10,101.00、供应商税号 91310000MA1KXXXXXX（脱敏）"
          - "低置信提示：1 张发票金额字段置信度 82%（<95% 阈值），已标红转人工复核"
          - "用途确认状态：本批 46 张用途已确认"
        designNotes:
          - "识别准确率目标 >95%（AI 画布 businessGains）；字段缺失/模糊票/新版式转人工（SKP 关键信息提取要点）"
          - "采购员仅可见/操作自有权限 PO 行项（SRP 用户功能需求）"
      - name: "校验发票真伪与购方抬头"
        owner: "应付会计"
        touchpoints: "发票校验工作台 · 识别复核卡片 · 术语 hover 卡"
        thoughts:
          - "抬头和税号要对得上，供应商别名我能悬停看标准口径"
        userInputs:
          - type: "系统自动带入"
            name: "结构化识别字段与主数据"
            format: "结构化字段 + 供应商/税号/科目字典"
            example: "供应商 XX环保科技（脱敏），统一社会信用代码 91310000MA1KXXXXXX"
            content: "供应商标准名、供应商代码、统一社会信用代码、SAP 会计科目、成本中心、付款条件"
        aiInteraction:
          aiAction: "以术语字典（供应商/税号/科目映射字典）校验发票真伪与购方抬头，比对供应商一致性"
          suggestions:
            - "校验真伪与购方抬头"
            - "查看供应商标准口径"
            - "标记抬头/税号不符转换票"
        visibleData:
          - "真伪校验：通过（发票号有效、非重复）"
          - "抬头校验：45 张通过；1 张抬头/税号不符，已标记进入异常队列"
          - "供应商对照：XX环保科技（脱敏）= 供应商代码 100XXX（SAP）"
        designNotes:
          - "校验覆盖率目标 100%；抬头/税号不符进入异常换票流程（现状痛点：高认知负荷）"
          - "隐性经验知识化，术语口径不再依赖个人记忆"
  - name: "三单匹配与差异识别"
    actions:
      - name: "以发票行为主线汇入三单并匹配"
        owner: "应付会计"
        touchpoints: "三单匹配工作台 · 横向匹配大表"
        thoughts:
          - "一张发票可能对多个 PO 行、多张送货单，希望系统按发票行自动拉齐"
          - "匹配关系要能人工调整，但不能覆盖原始单据"
        userInputs:
          - type: "系统自动带入"
            name: "发票行 + PO 行 + 入库行 + 送货单行"
            format: "ERP 接口（IF003/IF004）+ 网盘送货单（IF008）+ 匹配关系表"
            example: "发票行：二级RO膜 东丽 TM720D 400 × 42 支；PO 行 6300002695；入库单 NJ-2026061801"
            content: "发票行、PO 行、入库行、送货单行（含 PO 号、PO 行号、物料、数量）"
        aiInteraction:
          aiAction: "以发票行为主线汇入三单行信息，执行三层匹配（发票行↔送货/入库行、入库单↔PO 行、发票行↔PO 行）与 6 条匹配规则（供应商/行金额/总金额/数量/物料/PO 完整性）"
          suggestions:
            - "以发票行为主线汇入三单"
            - "查看三层匹配结构"
            - "人工调整匹配关系"
            - "保存匹配结果（不覆盖原始单据）"
        visibleData:
          - "匹配工作集：发票行 46 行 ↔ PO 行 / 入库行 / 送货单行，一对一/一对多/多对多关系可见"
          - "匹配规则结果：供应商一致性、物料一致性、PO 完整性逐行标记通过/差异"
          - "匹配关系表：记录发票行、送货单行、入库单行、PO 行对应关系与备注"
        designNotes:
          - "以发票行为主线、非整张发票粒度（客户开发方案确认）；匹配关系表不覆盖原始单据"
          - "压缩人工逐票逐行比对耗时（现状痛点：高耗时）"
      - name: "行级数量扣减与四数量对照"
        owner: "应付会计"
        touchpoints: "三单匹配工作台 · 四数量对照报表"
        thoughts:
          - "数量对不对，我要同时看到 PO/送货/入库/发票四个数"
          - "入库单和送货单不用互相校验，但数量超差必须拉人"
        userInputs:
          - type: "系统自动带入"
            name: "三单行级数量"
            format: "结构化数量比对"
            example: "PO 42 / 送货 42 / 入库 42 / 发票 42（差异 0）；异常样例 INV-2026-0618-002：PO 500 / 送货 480 / 入库 480 / 发票 500（差异 20）"
            content: "采购订单数量、送货单数量、入库数量、发票校验数量、差异数量"
        aiInteraction:
          aiAction: "以发票数量扣减入库/送货数量（不校验入库单与送货单一致性），行级核对差异并标注超差"
          suggestions:
            - "行级核对数量并扣减"
            - "查看四数量对照报表"
            - "转异常确认（数量超差）"
        visibleData:
          - "四数量对照报表：PO 数 / 送货数 / 入库数 / 发票数四列并列 + 差异数量"
          - "数量核对：44 行差异为 0；1 行数量超差（发票 500 件 > 入库 480 件），超容忍必拉人"
          - "规则提示：数量无容忍区间（领域专家假设值，待访谈回填）"
        designNotes:
          - "不校验入库单与送货单一致性（客户研讨确认）；四数量并列供人工定位差异来源"
          - "数量超差 100% 拉人复核，杜绝静默错配（AI 画布 businessGains）"
      - name: "金额比对与差异判定"
        owner: "应付会计"
        touchpoints: "三单匹配工作台 · 匹配判定卡 · 出处引用悬浮卡"
        thoughts:
          - "金额比对走 ERP 接口，我只需要看接口返回的通过/差异结果"
          - "尾差很小能自动容忍，但超阈值一定要提醒我"
        userInputs:
          - type: "系统自动带入"
            name: "发票金额与合同/PO 金额"
            format: "ERP 模拟校验接口（IF003–IF007）返回"
            example: "发票不含税 77,700.80 vs PO 77,700.00，尾差 0.80（差异率 0.0010%）；超差样例单价不符"
            content: "发票不含税金额、合同/PO 金额、差异金额、差异率、ERP 校验结果"
        aiInteraction:
          aiAction: "调用 ERP 模拟校验接口做金额比对（本平台仅感知结果，以不含税金额为基准），按差异容忍规则判定可容忍/必拉人"
          suggestions:
            - "核对金额与差异（ERP 接口）"
            - "查看尾差容忍依据"
            - "展开匹配推理链"
            - "转异常确认（金额超尾差/单价不符）"
        visibleData:
          - "金额判定：发票 77,700.80 vs PO 77,700.00，尾差 0.80（≤1 元且 ≤0.5%）→ 自动容忍放行"
          - "差异提示：1 张单价不符判为超容忍，标记决策因子确定性为「中」"
          - "出处引用：规则依据=差异容忍与异常判定经验（假设值）；票面位置=金额右下角（大小写以大写为准）；ERP 接口返回=模拟校验通过"
        designNotes:
          - "金额比对由 ERP 模拟校验接口承载、本平台不落规则（SKP 冲突仲裁）"
          - "尾差容忍阈值为领域专家假设值，待二轮访谈回填；超容忍 100% 拉人"
  - name: "异常凭证确认与返工"
    actions:
      - name: "判定异常类型并采纳处理建议"
        owner: "采购业务员 / 应付会计"
        touchpoints: "异常凭证队列 · 处理建议内联卡"
        thoughts:
          - "每张异常票都告诉我是什么类型、该找谁、怎么处理就好了"
        userInputs:
          - type: "系统自动带入"
            name: "匹配差异清单"
            format: "异常队列（按类型分组）"
            example: "5 张异常：数量超差、金额超尾差、抬头/税号不符、单价不符、跨期发票"
            content: "异常类型、差异明细、处理建议、沟通对象、升级路径"
        aiInteraction:
          aiAction: "按差异容忍与异常判定经验判定异常类型，生成处理建议与沟通对象、升级路径"
          suggestions:
            - "判定异常类型并生成处理建议"
            - "生成沟通对象与升级路径"
            - "采纳建议并登记沟通"
            - "转人工线下处理"
        visibleData:
          - "异常队列：5 张按类型分组，每票带差异明细与处理建议"
          - "建议样例：与供应商 XX环保科技（脱敏）确认少送 20 件 → 走补单流程；沟通对象：采购员李强；2 个工作日未响应升级财务负责人"
          - "异常类型清单为领域专家假设值，待访谈回填"
        designNotes:
          - "异常处理周期缩短（AI 画布 businessGains）；隐性经验「异常沟通与升级路径」知识化"
          - "超差无法裁决逐级升级（应付会计 → 财务负责人）"
      - name: "登记沟通结果并挂起重跑"
        owner: "采购业务员"
        touchpoints: "异常凭证队列 · 沟通登记 · 待办通知"
        thoughts:
          - "沟通结果记下来后，补单到货能自动重跑就好了"
        userInputs:
          - type: "页面内编辑"
            name: "沟通结果登记"
            format: "表单登记"
            example: "供应商确认补单，预计 2026-06-25 重开送货单"
            content: "沟通对象、沟通结果（补单/换票/冲红）、预计完成时间"
        aiInteraction:
          aiAction: "登记沟通结果并挂起该票、设置提醒；补单到货后自动重跑三单匹配（混合：人工修正 + AI 重跑）"
          suggestions:
            - "登记沟通结果"
            - "挂起并设置提醒"
            - "撤销沟通登记"
            - "补单到货后重跑匹配"
        visibleData:
          - "发票状态：数量超差票置为「补单中」，抬头税号不符票置为「换票中」"
          - "重跑提醒：预计 2026-06-25 补单到货后自动重跑三单匹配"
          - "撤销窗口：登记后窗口期内可一键撤销（Toast）"
        designNotes:
          - "减少与采购/供应商往返轮次（现状痛点：来回往复）"
          - "修正后重跑形成闭环，差异记录不覆盖原始单据"
  - name: "自动入账与归档"
    actions:
      - name: "批量预制并检查硬门禁"
        owner: "应付会计"
        touchpoints: "入账与归档台账 · 预制门禁检查列"
        thoughts:
          - "前置条件不满足的票别硬放行，失败原因要清楚"
        userInputs:
          - type: "系统自动带入"
            name: "匹配通过的发票与三单单据"
            format: "ERP 预制接口（IF005）"
            example: "匹配通过 41 张，预制成功 39 张、失败 2 张（成本中心缺失）"
            content: "发票主信息、发票行、PO 行、入库行、税率、金额、预制权限"
        aiInteraction:
          aiAction: "逐票检查预制硬门禁（已识别/匹配关系/差异说明/信息完整/校验通过/权限），满足则提交 ERP 预制发票（IF005）"
          suggestions:
            - "批量预制（检查硬门禁）"
            - "查看预制失败原因"
            - "补齐成本中心后重试"
        visibleData:
          - "门禁检查：发票已识别 ✓ 匹配关系已建立 ✓ 差异已说明 ✓ 供应商/PO/入库完整 ✓ 校验通过 ✓ 预制权限 ✓"
          - "预制结果：39 张成功取得 ERP 预制凭证号；2 张失败（成本中心缺失）进入待补队列"
        designNotes:
          - "预制硬门禁（客户开发方案确认）；失败给降级建议（错误态）"
          - "入账自动化覆盖率目标 100%（AI 画布 businessGains）"
      - name: "过账审核并更新台账归档"
        owner: "财务负责人"
        touchpoints: "入账与归档台账 · 过账确认对话框 · 资料预览"
        thoughts:
          - "过账前必须我确认，凭证号、乐企状态、台账要一次到位"
        userInputs:
          - type: "页面内确认"
            name: "预制发票过账确认"
            format: "ERP 过账接口（IF006）+ 乐企状态更新（IF002）"
            example: "39 张预制发票全选过账，返回凭证号与会计期间"
            content: "预制发票、过账权限、凭证号、会计期间、过账状态、乐企入账标识"
        aiInteraction:
          aiAction: "校验过账硬门禁（已预制/ERP 预制状态有效/具备过账权限）后调用 ERP 过账，回写凭证号并更新台账、归档索引与乐企入账状态"
          suggestions:
            - "批量过账（财务负责人确认）"
            - "抽查 2 张后全选放行"
            - "确认同步乐企并更新台账"
            - "预览/打印归档资料"
        visibleData:
          - "过账结果：39 张凭证号逐票返回，会计期间 2026-06，过账状态「已过账」"
          - "台账刷新：凭证号、入账状态「已更新」、归档索引按发票编号生成"
          - "乐企状态：入账标识已更新（过渡期提示财务人工确认并记录）"
        designNotes:
          - "过账/乐企硬门禁（客户开发方案确认）；过账前必停确认（HITL）"
          - "发票到过账周期缩短、台账与归档一次到位（现状痛点：高耗时 + 系统瓶颈）"
handoff:
  paths:
    - "主路径：发起归集 → 核验完整性 → 用途确认与识别复核 → 三单匹配与差异判定 → 异常分流/自动入账 → 台账归档与乐企状态更新"
    - "分支：匹配差异在容忍内自动放行（金额尾差 ≤1 元且 ≤0.5%）→ 直接进入批量预制；超容忍必拉人转异常确认"
    - "异常：识别置信度 <95% 转识别复核；数量超差/单价不符/抬头税号不符转异常队列，沟通登记后补单到货自动重跑匹配"
    - "边界：金额比对规则由 ERP 模拟校验接口承载、本平台仅感知结果；不校验入库单与送货单一致性；跨权限 PO 行项对采购业务员不可见"
