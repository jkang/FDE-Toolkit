const SRC = "# X · Agent 产品方案：采购发票校验助手\n\n> **版本：** v1.1（更新版，承接背景版 v1.0） | **更新日期：** 2026-09-10\n>\n> **对应业务阶段：** 设计方案（SDP-Product）· 阶段1 Agent产品方案设计 · 步骤1.1~1.6\n>\n> **方法论依据：** SDP-Product 阶段1方法（产品定位 → 形态架构 → 故事线 → 功能清单 → Agent行为 → 规则消费门禁）\n>\n> **输入依据：** 理需求《X-AI需求场景全景图》、场景定义《采购发票校验助手-场景定义画布》《采购发票校验助手-数据与知识资产盘点》《X采购发票-采购发票校验-AI画布》、挖知识《采购发票校验助手-任务流程挖掘清单》《采购发票校验助手-任务处理规则挖掘清单》、现状《X采购发票-采购发票校验-现状流程图》、客户《采购发票处理_开发方案设计文档_增强版》\n>\n> **本版更新摘要（相对 v1.0）：** ① 全文主体统一匿名化为「X」；② 纳入本轮新增上游——现状流程图（5 阶段 × 20 项 L4 任务与五类痛点）、AI 画布（10 维，含 workflow 人机分工与 businessGains 量化口径）；③ 与 SKP 任务处理规则挖掘清单口径对齐（三层匹配结构 + 6 条匹配规则、匹配关系表、金额比对 ERP 承载、三类硬门禁、假设值显式标注）。\n\n## 1 总览\n\n**这份方案做了什么：** 在 v1.0 概念级方案基础上，用本轮已完成的「现状流程图（5 阶段 × 20 项 L4 任务 × 五类痛点）」与「AI 画布（10 维）」回填精化，并与「SKP 任务处理规则挖掘清单（三层匹配 + 6 条匹配规则 + 三类硬门禁 + 领域专家假设值）」口径对齐，把「采购发票校验助手（A1 · 🟢 速赢）」翻译成一份原型作者可照单施工的产品方案：产品定位、形态架构图、5 条演示故事线、10 项功能与 UI 组件、Agent 行为设计、五类规则消费门禁。\n\n**重点看什么：** 核心交付载体是「三单匹配工作台」（Artifact）——它是本 Agent 多能力编排的主战场，对应现状流程 5 阶段中耗时/错误最集中的「用途确认与三单匹配」环节（ST7–ST10）。本版关键升级在三点：① 故事线 mock 数据从画布口径对齐到 SKP 决策因子矩阵（三层匹配结构、6 条匹配规则、四数量对照、金额尾差阈值）；② HITL 拦截条件精确化为「识别置信度 &lt;95%」「数量超差（无容忍区间）」「金额尾差 >1 元或 >0.5%」「预制/过账/乐企前置未满足」四类；③ 全文对「差异容忍阈值与异常类型清单」统一标注为「领域专家假设值 · 待访谈回填」，不写成确定值。\n\n**为什么关注：** A1 是采购到付款价值流「发票校验与应付」（价值段 3.4）的 🟢 速赢落点，其价值主张是「释放应付会计三单匹配工时、降低匹配错误率、缩短发票到过账周期」——这三项能否兑现，取决于规则承接是否「挖到位」：6 条匹配规则与三层匹配结构决定匹配是否可解释、可复核，三类硬门禁决定入账是否可验收，差异容忍假设值决定 HITL 是否可信。\n\n**当前洞察：** 规则结构高度统一——决策链集中在「三单匹配口径 → 数量扣减 → 金额比对 → 差异容忍判定」四环，其中：**硬口径（客户开发方案确认）**＝发票行为主线、一对一/一对多/多对多、三层匹配、6 条匹配规则、匹配关系表不覆盖原始单据、数量以发票数量扣减入库/送货数量（不校验入库单与送货单一致性）、以不含税金额为基准；**外部依赖**＝金额比对（发票金额不能大于合同金额等）由 ERP 模拟校验接口承载、本平台仅感知结果；**软约束/待回填**＝差异容忍阈值（数量无容忍区间、金额尾差 ≤1 元且 ≤0.5% 自动容忍、任一超容忍必拉人）与异常类型清单（均为领域专家假设值）。硬门禁集中在「预制 / 过账 / 乐企更新」三处。因此 HITL 设计只需覆盖四类闸门，不必事无巨细拦截。\n\n**需要 FDE 做什么：** ① 核对本版故事线 mock 数据与 SKP 决策因子/阈值的一致性（尤其 6 条匹配规则的口径、四数量报表字段、金额尾差假设值）；② 确认三项基线（采购发票月度量级、单票校验耗时、三单匹配错误率 X/Y/Z）与差异容忍/异常类型假设值的二轮访谈回填计划；③ 视觉基底与相邻系统边界（乐企 IF001/IF002、SAP IF003–IF007、网盘 IF008 等）仍待确认，属阶段 2 原型的前置项。\n\n## 2 产品定位\n\n### 2.1 迭代范围\n\n**功能迭代优化（上游精化）**：在 v1.0 概念级方案基础上，纳入现状流程图（5 阶段 × 20 项 L4 任务 × 五类痛点：高耗时/高认知负荷/高频错误/来回往复/系统瓶颈）与 AI 画布（10 维，含 workflow 人机分工与 businessGains 量化口径），并与 SKP 规则挖掘清单对齐。首版 PoC / MVP 范围不变：从 0 到 1 验证「乐企批量采集 + AI 三单匹配 + 异常分流人工复核」核心价值闭环，选定部分供应商与发票单据做试点。\n\n### 2.2 产品形态\n\n**B2B 自用型**：客户即用户组织（X 财务部 / 采购部），Agent 交付物（匹配结果、预制凭证、台账、归档）不外流，仅在企业内网使用。入口形态以「嵌入 ERP/应付工作台的独立 Web 校验工作台」为主入口，辅以「异常待办消息唤起」与「定时批量归集」两类自动入口；同步提供「财务共享应付岗批量校验任务台 + 待办提醒」。\n\n### 2.3 四件套\n\n| 子项 | 内容 |\n| --- | --- |\n| **产品定位一句话** | 为 X 的应付会计，在「采购发票校验与应付」（价值段 3.4）场景下，通过多源归集 + AI 三单匹配 + 异常分流，把识别准确率（>95%）、采集归集覆盖率（100%）、入账自动化覆盖率（100%）一起往上拉，同时把单票校验耗时、三单匹配错误率、异常处理周期压到目标值（三项基线 X/Y/Z 待客户回填）。 |\n| **非目标** | ① 不做来料收货与检验、不做付款执行与银行支付（上下游价值段 3.3 / 3.5）；② 不在本平台落地金额比对规则（由 ERP 模拟校验接口承载，本平台仅感知通过/差异结果）；③ 不做供应商主数据维护与对账争议的正式仲裁；④ 不做发票真伪的税务机关直连（沿用乐企 / 电子税务局通道）；⑤ 原型阶段不接真实 ERP / 乐企后端，一律用 Mock 服务；⑥ 不校验入库单与送货单一致性（依客户研讨确认口径）。 |\n| **主要使用者** | **应付会计**——JTBD：把每天多渠道进来的采购发票，在最短时间内完成三单匹配并安全入账，不被异常票和补漏票拖住。协作角色：**采购业务员**（按 PO 权限复核异常、与供应商沟通）、**财务负责人**（过账审核与放行），在「5 业务功能与 UI 组件清单」的「绑定角色」列体现。 |\n| **Agent 人格** | 身份定位：一名懂财务、懂采购的「发票校验搭档」，坐在应付会计旁边先把票收齐、把能对的都对掉，把拿不准的整理好递过来。语气基调：专业、克制、可核查——报数字必带来源与批次，给结论必带依据，不抢财务负责人的审核权。能力边界承诺：我能——归集多渠道发票并查重查漏、识别票面并验真校抬头、以发票行为主线做行级三单匹配并给差异判定、批量预制与台账归档更新；我不能——替你做过账终审（财务负责人确认后才过账）、修改供应商/科目主数据、替你与供应商沟通、容忍区间外的差异自动放行。 |\n\n## 3 产品形态架构图\n\n```mermaid\n%%{init: {\"theme\":\"base\",\"themeVariables\":{\"fontFamily\":\"-apple-system, PingFang SC, Microsoft YaHei, sans-serif\",\"fontSize\":\"13px\",\"primaryColor\":\"#eef2fc\",\"primaryBorderColor\":\"#6b7eef\",\"primaryTextColor\":\"#1e2233\",\"lineColor\":\"#9aa6e8\",\"clusterBkg\":\"#f5f7fd\",\"clusterBorder\":\"#dfe5fa\",\"tertiaryColor\":\"#ffffff\",\"edgeLabelBackground\":\"#ffffff\"}}}%%\nflowchart TB\n    subgraph 相邻产品[\"相邻产品（不属于本产品）\"]\n        EXT1[\"乐企平台 · 发票池 / 入账状态<br/>IF001 / IF002\"]\n        EXT2[\"SAP ERP<br/>IF003–IF007\"]\n        EXT3[\"公共网盘 · 送货单<br/>IF008\"]\n        EXT4[\"文件服务<br/>IF009\"]\n        EXT5[\"OCR / AI 识别<br/>IF010\"]\n        EXT6[\"物料主数据<br/>IF011\"]\n        EXT7[\"组织权限 AD<br/>IF012\"]\n        EXT8[\"打印服务<br/>IF013\"]\n        EXT9[\"消息 / IM\"]\n    end\n    subgraph 产品本体[\"采购发票校验助手 · Agent 产品\"]\n        subgraph 入口区[\"入口区\"]\n            E1[\"主入口：Web 校验工作台\"]\n            E2[\"自动激活：定时批量归集\"]\n            E3[\"唤起入口：异常 / 待办通知\"]\n        end\n        subgraph 主交互区[\"主交互区\"]\n            M1[\"对话流 · 校验助手会话\"]\n            M2[\"发票归集看板 · Artifact\"]\n            M3[\"三单匹配工作台 · Artifact\"]\n            M4[\"异常凭证队列 · Artifact\"]\n            M5[\"入账与归档台账 · Artifact\"]\n            M6[\"综合报表与资料预览 · Artifact\"]\n        end\n        subgraph 周边支撑区[\"周边支撑区\"]\n            S1[\"待办与通知中心\"]\n            S2[\"历史批次与版本查阅\"]\n            S3[\"反馈与权限设置\"]\n        end\n    end\n    E1 --> M1\n    E2 --> M2\n    E3 --> M4\n    M1 <--> M2\n    M1 <--> M3\n    M1 <--> M4\n    M3 --> M5\n    M3 --> M6\n    M4 -. 待办触达 .-> S1\n    M5 -. 调阅历史 .-> S2\n    M2 -- 读发票池 / 写回状态 --> EXT1\n    M3 -- 读 PO / 入库 · 写预制 / 过账 / 凭证 --> EXT2\n    M3 -- 读送货单 --> EXT3\n    M2 -- 存取文件 --> EXT4\n    M2 -- 调票面识别 --> EXT5\n    M3 -- 读物料编码 --> EXT6\n    S3 -- 读角色 / 数据范围 --> EXT7\n    M5 -- 打印归档 --> EXT8\n    S1 -- 推送异常待办 --> EXT9\n    classDef extern fill:#f5f7fd,stroke:#9aa0b8,stroke-width:1px,color:#6c7390,stroke-dasharray:3;\n    class EXT1,EXT2,EXT3,EXT4,EXT5,EXT6,EXT7,EXT8,EXT9 extern\n```\n\n**图注**：三大区齐全。主交互区按 AI 画布 workflow 与 5 个业务阶段（P1 发票多渠道采集归集 → P2 用途确认与识别校验 → P3 三单匹配 → P4 异常凭证确认 → P5 自动入账与归档）布局六类工作台，核心交付载体为「三单匹配工作台」（M3）。相邻产品 9 个，均只标接触面（读 / 写 / 推送）与接口编号，不画协议与字段。\n\n## 4 原型演示故事线\n\n> 共 5 条，1:1 对应阶段2 `moments/*.html`。mock 数据均取自「SKP 任务处理规则挖掘清单」的真实决策因子 / 匹配规则 / 阈值（脱敏），涉及「假设值」处已显式标注。\n\n### 故事线 1 · 多渠道发票一键归集 → 归集看板零漏票\n\n| 字段 | 内容 |\n| --- | --- |\n| **业务价值高光** | 应付会计早上一键触发，乐企同步、供应商上传、采购补录三通道发票全部入池并自动查重查漏，系统孤岛在界面上消失（锚定：AI 画布 · 采集归集覆盖率 100%）。 |\n| **对应阶段** | P1 发票多渠道采集归集（承接现状 ST1–ST5；SKP 深度任务 1–4） |\n| **演示剧本** | 用户（应付会计）打开工作台点「开始今日归集」→ Agent 流式回报：「正在同步乐企发票池（IF001）…已拉取 38 张」「正在归集供应商上传区…新增 6 张」「检测到采购补录 2 张纸质票」→ Agent 调用归集完整性校验：「共 46 张，无重复；发现 1 张发票号与昨日批次重复，已标记」→ 归集看板刷新，按渠道分栏展示（发票号 / 供应商 / 金额 / 开票日期 / 渠道来源），重复票带黄色标记，用户点开看比对详情。 |\n| **UI 组件 + 必备交互** | 发票归集看板（渠道分栏 + 重复/漏票标记）+ 对话流进度回报；演示 #1 流式输出 + #2 工具调用可视化 + #8 状态徽章 + #10 空态。 |\n| **业务内容来源** | SKP 深度任务·同步乐企发票数据 / 归集供应商上传发票 / 归集采购补录发票 / 核验发票归集完整性；SRP 数据实体·采购发票（乐企 IF001、供应商数电文件）；现状流程图 ST1–ST5（高耗时 / 系统瓶颈痛点）。 |\n\n### 故事线 2 · 票面识别 + 三单匹配一气呵成，异常票自动分流（含 2 处 HITL）\n\n| 字段 | 内容 |\n| --- | --- |\n| **业务价值高光** | 46 张票批量跑完「识别 → 真伪/抬头校验 → 行级三单匹配」，41 张直接判通过、5 张按差异类型自动分流——数量超差、金额超尾差、模糊票各归各位，应付会计只看拿不准的（锚定：识别准确率 >95%、采集归集覆盖率 100%；本线穿插 2 处 HITL）。 |\n| **对应阶段** | P2 用途确认与识别校验 → P3 三单匹配（承接现状 ST6–ST10；SKP 深度任务 5–14） |\n| **演示剧本** | 用户在看板勾选本批 46 张点「开始校验」→ Agent 流式推进并展示工具调用：「正在识别票面关键字段（IF010）…」「正在校验供应商/税号…」「正在获取 PO/入库单/送货单（IF003/IF004/IF008）…」「正在以发票行为主线汇入三单行…」「正在行级数量扣减…」→ ⚠️ **HITL ①**：「发票 25312000000012345678 票面金额字段模糊，识别置信度 82%（低于 95% 阈值），已转识别复核」，用户点开看到标红的金额字段与票面截图对照，手工补录后继续 → Agent 继续匹配：「41 张三单匹配通过」「4 张差异已入异常队列」→ ⚠️ **HITL ②**：「发票 INV-2026-0618-002 行 2 数量超差：发票 500 件 > 入库 480 件，超容忍（数量无容忍区间·领域专家假设值），按规则必拉人」，用户点开差异高亮面板，看到四数量报表（PO 500 / 送货 480 / 入库 480 / 发票 500）并列对照 → 用户选择「确认异常并转采购」。 |\n| **UI 组件 + 必备交互** | 三单匹配工作台（行级匹配工作集 + 差异高亮 + 四数量对照报表）+ 识别复核卡片 + HITL 拦截面板；演示 #1 流式输出 + #2 工具调用可视化 + #3 思考过程可折叠 + #5 HITL 拦截 ×2 + #7 出处引用（票面字段位置对照）。 |\n| **业务内容来源** | SKP 关键信息提取要点·发票票面关键字段提取要点（发票号/金额/税额/供应商税号/开票日期，置信度阈值 95%）；SKP 决策模型类·三单匹配口径与数量扣减规则（发票行为主线、三层匹配、6 条匹配规则、行级扣减、数量无容忍区间）· 金额比对规则（ERP 模拟校验接口承载、以不含税金额为基准）· 差异容忍与异常判定经验（金额尾差 ≤1 元且 ≤0.5% 自动容忍——领域专家假设值，待访谈回填）；SRP 数据实体·采购订单/入库单/送货单。 |\n\n### 故事线 3 · 四数量报表差异溯源，异常凭证队列一站看清\n\n| 字段 | 内容 |\n| --- | --- |\n| **业务价值高光** | 5 张异常票进入统一队列，每张都带「异常类型 + 差异明细 + 处理建议 + 沟通对象 + 升级路径」；数量/金额超差时，综合报表并列 PO/送货/入库/发票四数量与差异，差异来源一眼定位，经验不再只存在资深会计脑子里（锚定：异常处理周期缩短；承接隐性经验「异常沟通与升级路径」知识化）。 |\n| **对应阶段** | P4 异常凭证确认与返工（承接现状 ST11–ST13；SKP 深度任务 15–19） |\n| **演示剧本** | 用户（采购业务员）从异常待办通知进入异常队列 → 看到 5 张异常票按类型分组：数量超差 ×1、金额超尾差 ×1、抬头/税号不符 ×1、单价不符 ×1、跨期发票 ×1 → 点开「INV-2026-0618-002 数量超差」：四数量报表显示 PO 500 / 送货 480 / 入库 480 / 发票 500，Agent 给出建议「与供应商 XX 环保科技（脱敏）确认少送 20 件 → 走补单流程；沟通对象：采购员李强；若 2 个工作日未响应升级财务负责人」→ 用户采纳建议，点「已联系供应商」，登记沟通结果「供应商确认补单，预计 2026-06-25 重开送货单」→ Agent 自动挂起该票并设提醒：「补单到货后自动重跑三单匹配」→ 另一张「抬头/税号不符」Agent 建议「换票」，用户确认后系统生成换票说明备注，发票状态置为「换票中」。 |\n| **UI 组件 + 必备交互** | 异常凭证队列（类型分组 + 处理建议卡 + 沟通登记）+ 四数量对照报表 + 处理建议内联卡；演示 #4 内联组件 + #5 HITL 拦截 + #6 撤销回滚（撤销沟通登记）+ #8 状态徽章。 |\n| **业务内容来源** | SKP 深度任务·判定异常类型并生成处理建议 / 生成沟通对象与升级路径建议 / 人工确认异常凭证 / 与供应商沟通处理异常 / 返回三单匹配重跑；SKP 任务流程挖掘·操作流程类经验承接对照表·异常沟通与升级路径；SKP 差异容忍与异常判定经验·异常类型清单（补单/换票/冲红/退票/抬头税号不符/单价不符/数量超差/金额超尾差/跨期发票——领域专家假设值）；客户开发方案·匹配关系表（差异记录不覆盖原始单据）。 |\n\n### 故事线 4 · 通过票批量预制过账 → 台账归档状态全链路更新\n\n| 字段 | 内容 |\n| --- | --- |\n| **业务价值高光** | 41 张匹配通过的票一键批量预制，三类硬门禁前置条件全绿才放行；过账确认后凭证号、乐企入账标识、台账、归档索引一次到位，财务负责人在同屏完成过账审核留痕（锚定：入账自动化覆盖率 100%）。 |\n| **对应阶段** | P5 自动入账与归档（承接现状 ST14–ST20；SKP 深度任务 20–24） |\n| **演示剧本** | 用户回到匹配工作台，「匹配通过」页签下 41 张全选 → 点「批量预制」→ Agent 逐票检查预制硬门禁：「发票已识别 ✓ 发票行已存在匹配关系 ✓ 关键差异已保存说明 ✓ 供应商/PO/入库信息完整 ✓ 金额/数量/物料校验通过 ✓ 预制权限 ✓」→ 39 张预制成功拿到 ERP 预制凭证号；2 张因「成本中心缺失」预制失败进入待补队列 → 用户（财务负责人账号切换演示）在「待过账」页签看到 39 张，逐票抽查 2 张后全选过账 → Agent 调用 ERP 过账（IF006），凭证号逐票返回 → 过账确认点：「确认将 39 张凭证状态同步乐企（IF002）并更新台账？」用户确认 → 台账页签实时刷新：凭证号、入账状态「已更新」、归档索引按发票编号生成，归档文件可预览打印（IF013）。 |\n| **UI 组件 + 必备交互** | 入账与归档台账（硬门禁前置条件检查列 + 凭证号回填 + 乐企状态 + 归档索引）+ 过账确认对话框；演示 #2 工具调用可视化 + #5 HITL 拦截（过账前必停确认）+ #9 错误态（2 张预制失败 + 降级建议）+ #10 空态（台账初始为空）。 |\n| **业务内容来源** | SKP 状态机与预制/过账/乐企前置规则（发票识别/匹配/预制/过账/乐企五类状态；预制、过账、乐企更新三类硬门禁）；SKP 术语字典类·供应商/税号/科目映射字典（预制凭证的税码/成本中心/付款条件来源）；SRP 数据实体·预制发票/会计凭证/入账状态/归档文件。 |\n\n### 故事线 5 · 金额尾差自动容忍与匹配判定依据可追溯\n\n| 字段 | 内容 |\n| --- | --- |\n| **业务价值高光** | 金额尾差在容忍区间内自动放行、超阈值必拉人；每个匹配判定结论都能追到「用了哪条规则、票面字段在哪、ERP 接口返回什么」，把隐性经验变成可复核的标准动作（锚定：匹配错误率下降、杜绝静默错配）。 |\n| **对应阶段** | P3 三单匹配（金额核对与匹配判定，承接现状 ST9–ST10；SKP 深度任务 13–14） |\n| **演示剧本** | 用户点开「INV-2026-0618-003 金额尾差」→ Agent 输出判定：「发票不含税金额 ¥77,700.80 vs PO 金额 ¥77,700.00，尾差 ¥0.80，差异率 0.0010%（≤1 元且 ≤0.5%）→ 自动容忍放行」→ 用户点「查看依据」展开出处引用悬浮卡：① 规则依据＝差异容忍与异常判定经验（金额尾差容忍假设值）；② 票面位置＝金额（右下角总计，大小写并存以大写为准）；③ ERP 接口返回＝模拟校验通过 → 另一张「INV-2026-0618-004 单价不符」判定为超容忍，Agent 标注「决策因子确定性：中（待访谈回填）」，并给出「转异常确认」建议 → 用户可展开折叠的匹配推理链，查看数量扣减过程与差异判定分支。 |\n| **UI 组件 + | --- |\n| Agent 正在做什么（进度） | 实时可见：归集、识别、匹配、预制逐票/逐批进度流式展示 | 落到 #1 流式输出 / #8 状态徽章；来源：SRP To-Be 旅程·进度观测设计（看板 + 进度条） |\n| Agent 使用了哪些数据 / 知识 | 始终标注来源：匹配判定标注规则名（三层匹配/6 条规则/数量扣减/差异容忍经验），字段识别标注票面位置，预制标注字典来源，金额比对标注 ERP 接口返回 | 来源：SKP 决策模型类/术语字典类/关键信息提取要点；落到 #7 出处引用 |\n| Agent 不确定 / 置信度低 | 显式标注：识别置信度 &lt;95% 标红转人工；决策因子确定性「中」的（数量差异/金额尾差/异常类型）在判定卡上标注 | 来源：SKP 决策因子矩阵（确定性列）+ 关键信息提取要点（验收准则 ≥95%）；落到 #5 HITL 拦截 / #7 出处引用 |\n| Agent 触发工具 / 外部行为 | 告知 + 可查看：调乐企（IF001/IF002）、ERP（IF003–IF007）、网盘（IF008）、OCR（IF010）时展示状态卡片，可点开看入出参摘要 | 落到 #2 工具调用可视化；来源：AI 画布 systemIntegration |\n| Agent 的思考过程 | 默认折叠可展开：匹配判定推理折叠为「查看判定依据」 | 落到 #3 思考过程可折叠（⚠️ 推荐性设计：面向财务用户避免信息过载） |\n\n### 6.3 Agent 何时停下等用户\n\n| 触发类别 | 触发条件 | 默认拦截形态 | 理由 / 来源 |\n| --- | --- | --- | --- |\n| 识别置信度不足 | 票面关键字段识别置信度 &lt;95%，或字段缺失/模糊/新版式 | 识别复核卡片标红，补录确认后继续 | SKP 关键信息提取要点·异常情况处理（字段缺失、模糊票、新版式 → 识别复核点转人工） |\n| 匹配差异超容忍 | 数量超差（发票数量 > 入库/送货数量，数量无容忍区间）或金额尾差 > 阈值（≤1 元且 ≤0.5% 自动容忍——**领域专家假设值，待二轮访谈回填**） | 差异高亮面板 + 四数量对照，必拉人确认 | SKP 决策模型类·差异容忍与异常判定经验 · 逻辑分支表（必拉人异常）· HITL 触发：匹配差异确认点 |\n| 预制 / 过账 / 乐企前置未满足 | 预制前置（已识别/匹配关系/差异说明/信息完整/校验通过/权限）任一项不满足；过账前必须财务负责人确认；乐企更新前必须已过账且有凭证号 | 硬门禁检查列标红 + 过账确认对话框 | SKP 状态机与预制/过账/乐企前置规则 · 硬门禁（客户开发方案确认） |\n| 连续失败 / 接口异常 | ERP/乐企/OCR 接口返回失败且重试无果 | 给降级建议（稍后重试 / 转人工线下处理）+ 失败票入待补队列 | SKP 决策模型类·兜底路径（转人工确认）；SRP Agent 功能·故障转移 |\n| 跨权限操作 | 采购业务员试图查看/操作非自有权限 PO 行项 | 不展示该部分数据，提示权限边界 | SRP 用户功能·识别结果补充界面（采购员仅可见/操作自己权限 PO）；SKP 冲突仲裁假设·跨 PO 权限 |\n\n### 6.4 用户怎么撤销与兜底\n\n| 问题 | 内容 | 落到交互 |\n| --- | --- | --- |\n| 撤销范围 | 可撤销当前动作：补录字段、匹配关系调整、沟通登记、匹配结论人工修正，窗口期内一键 Undo；预制后未过账可申请冲销重来；已过账凭证不可在产品内撤销，走 ERP 冲销流程 | #6 撤销回滚 |\n| 追问深度 | 三层：① 一层依据（这条判定用了哪条规则）；② 完整推理链（三层匹配过程、数量扣减、差异判定分支）；③ 源数据（PO/入库/送货/发票原始行与票面影像，匹配关系表不覆盖原始单据） | #7 出处引用 |\n| 完全失败时怎么办 | 默认给 ≥2 个明确选项：① 「转人工处理」——该票转入人工队列并保留全部已识别上下文；② 「稍后重试」——挂起并设提醒；接口级失败时另给「导出待处理清单」线下继续 | #9 错误态 |\n\n## 75 类规则消费门禁\n\n> 即 SKP「五类规则消费门禁」：本场景 SRP 识别 3 类（决策模型类 / 术语字典类 / 关键信息提取要点），未识别 2 类（模版范例类 / 关联关系类），均在下表显式说明。\n\n| 规则类型 | 是否识别 | 产品方案承接点（具体到组件名 / 设计章节） | 承接的业务内容 | 备注 |\n| --- | --- | --- | --- | --- |\n| **决策模型类** | ✅（3 条：三单匹配口径与数量扣减规则 / 金额比对规则 / 差异容忍与异常判定经验） | 第 5 章·三单匹配工作台（行级差异高亮 + 三层匹配 + 6 条匹配规则 + 匹配关系表）；第 5 章·四数量对照报表；第 5 章·出处引用悬浮卡（决策因子确定性）；第 6.2 节·不确定显式标注；第 6.3 节·匹配差异超容忍必拉人 | 发票行为主线行级扣减、三层匹配结构、6 条匹配规则（供应商/行金额/总金额/数量/物料/PO 完整性）、数量无容忍区间、金额尾差 ≤1 元且 ≤0.5% 自动容忍（假设值）、决策因子确定性分级 | 必须承接；金额比对规则本体由 ERP 模拟校验接口承载，产品侧只感知通过/差异结果（SKP 冲突仲裁已确认） |\n| **模版范例类** | ❌ 本场景无此类（来源：SRP 知识资产清单未识别；SKP §3 显式标注） | — | — | 无需承接 |\n| **术语字典类** | ✅（1 条：供应商/税号/科目映射字典） | 第 5 章·术语 hover 卡（供应商标准名/代码/统一社会信用代码、SAP 科目/成本中心/付款条件）；第 6.2 节·使用了哪些数据/知识（预制凭证标注字典来源） | 别名对照 + 上下文标注；被「校验发票真伪与购方抬头」「预制发票凭证」「过账生成会计凭证」引用 | 必须承接；实例条目待 SAP 主数据取回回填 |\n| **关键信息提取要点** | ✅（1 条：发票票面关键字段提取要点） | 第 5 章·识别复核卡片（票面截图与字段对照、低置信标红）；第 5 章·出处引用悬浮卡（字段典型位置：发票号右上角、金额右下角大小写以大写为准）；第 6.3 节·识别置信度 &lt;95% 转人工；第 6.4 节·追问深度（源数据层） | 5 个目标字段（发票号/金额/税额/供应商税号/开票日期）、置信度阈值 95%、模糊票/新版式转人工、字段典型位置与易错变体提示 | 必须强化承接 |\n| **关联关系类** | ❌ 本场景无此类（来源：SRP 知识资产清单未识别；SKP §6 显式标注） | — | — | 无需承接 |\n\n**操作流程类说明**：「异常沟通与升级路径」已由 SKP 阶段 1「深度任务序列」承载（深度任务 16–18），在第 5 章「异常凭证队列」「待办与进度通知」的「上游来源」列通过深度任务业务名引用，本表不重复。\n\n**门禁结论**：SRP 识别的 3 类规则（决策模型类 / 术语字典类 / 关键信息提取要点）均有具体承接点；未识别的 2 类（模版范例类 / 关联关系类）已显式说明。**门禁通过。**\n\n## 8 待确认问题清单\n\n| # | 待确认问题 | 用途与影响 |\n| --- | --- | --- |\n| 1 | 差异容忍阈值（数量无容忍区间、金额尾差 ≤1 元且 ≤0.5%）与异常类型清单为**领域专家假设值** | 影响故事线 2/3/5 演示剧本与「6.3 何时停下等用户」触发条件的最终口径；客户二轮访谈回填后需同步修订本文档 v1.2 |\n| 2 | 三项基线（采购发票月度量级、单票校验耗时、三单匹配错误率 X/Y/Z） | 影响产品定位一句话与故事线价值高光的量化承诺；不确认则 PoC 验收无法标定 |\n| 3 | 6 条匹配规则中「行金额一致性 / 总金额一致性」的边界（等于边界归属、含税/未税口径）与「发票金额 ≤ 合同金额」之外的税额/单价/尾差规则清单 | 影响三单匹配工作台与四数量报表的口径精确化；客户方案标注其余金额类规则待访谈 |\n| 4 | 供应商/税号/科目映射字典实例条目（会计科目、成本中心、付款条件） | 影响术语 hover 卡与预制凭证字段的真实感；待 SAP 主数据取回 |\n| 5 | 发票票面样本（脱敏）与版式变体、非原始凭证（入库单/匹配结果/ERP 凭证）打印样式 | 影响识别复核卡片、出处引用悬浮卡的 mock 数据真实度与归档打印实现；阶段 2 原型施工前建议取回 |\n| 6 | 视觉基底（X 品牌手册 / 参照产品）与相邻系统边界（乐企 IF001/IF002、SAP IF003–IF007、网盘 IF008 的只读/写范围） | 决定阶段 2 原型视觉来源与产品形态架构图接触面是否准确 |";

function renderMermaid() {
  if (!window.mermaid) return;
  document.querySelectorAll('code.language-mermaid').forEach(function(code) {
    const text = code.textContent;
    const wrap = code.parentElement;
    const div = document.createElement('div');
    div.className = 'mermaid'; div.textContent = text;
    wrap.replaceWith(div);
  });
  mermaid.initialize({ startOnLoad:false, theme:'base',
    themeVariables:{ fontFamily:'"Noto Sans SC","Inter",sans-serif', primaryColor:'#eef2fc',
      primaryBorderColor:'#6b7eef', primaryTextColor:'#1e2233', lineColor:'#9aa6e8',
      clusterBkg:'#f5f7fd', clusterBorder:'#dfe5fa', tertiaryColor:'#ffffff' } });
  mermaid.run({ nodes: document.querySelectorAll('.mermaid') });
}
