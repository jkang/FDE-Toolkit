categories:
  # ============ ⚖️ 决策模型类 ============
  decision:
    - id: "rd_01"
      name: "三单匹配口径与数量扣减规则"
      usagePoints: ["以发票行为主线汇入三单行信息", "行级核对数量并扣减", "返回三单匹配重跑"]
      factors:
        - { name: "匹配主线（发票行）", def: "以发票行为主线、非整张发票为唯一粒度，汇入 PO 行/入库行/送货单行", source: "客户开发方案设计文档", deterministic: true }
        - { name: "匹配关系基数", def: "支持一对一/一对多/多对多（一张发票可对多个 PO 行/入库单/送货单）", source: "客户开发方案设计文档", deterministic: true }
        - { name: "三层匹配结构", def: "第一层发票行↔送货/入库行；第二层入库单↔PO 行；第三层发票行↔PO 行", source: "客户开发方案设计文档", deterministic: true }
        - { name: "数量差异", def: "以发票数量扣减入库/送货数量后的差异（不校验入库单与送货单一致性）", source: "采购发票、入库单、送货单", deterministic: true }
        - { name: "匹配关系表", def: "记录发票行↔送货单行↔入库单行↔PO 行对应关系与差异，不覆盖原始单据数据", source: "客户开发方案设计文档", deterministic: true }
      branches:
        - { cond: "发票数量 = 入库/送货数量（扣减后恰为 0）", action: "→ 标记数量一致，进入金额核对", priority: 1 }
        - { cond: "发票数量 < 入库/送货数量（部分入库/多送）", action: "→ 标记为正常（部分入库），不判超差", priority: 2 }
        - { cond: "发票数量 > 入库/送货数量", action: "→ 标记数量超差，必拉人（数量无容忍区间）", priority: 3 }
        - { cond: "6 条匹配规则（供应商/行金额/总金额/数量/物料/PO 完整性）任一不一致", action: "→ 逐行标记差异，记入匹配关系表", priority: 4 }
      arbitration: "以发票行为主线；差异记录到匹配关系表、不覆盖原始单据；四数量对照报表（PO/送货/入库/发票）仅供人工定位差异来源，最终以 ERP 接口返回为准。"
      exception: "数量超差 → 匹配差异确认点拉人；入库单冲销/送货单缺失 → 人工介入。"
      summary: "以发票行为主线执行三层匹配与 6 条匹配规则，按发票数量扣减入库/送货数量，行级差异记入匹配关系表、不覆盖原始单据。"
    - id: "rd_02"
      name: "金额比对规则"
      usagePoints: ["行级核对金额与差异"]
      factors:
        - { name: "发票金额", def: "发票票面不含税金额（比对基准）", source: "采购发票", deterministic: true }
        - { name: "合同/PO 金额", def: "合同或采购订单约定金额", source: "采购订单（PO）", deterministic: true }
        - { name: "差异类型", def: "金额>合同、数量不符、单价不符", source: "采购发票、采购订单（PO）", deterministic: false }
      branches:
        - { cond: "发票金额 ≤ 合同/PO 金额（经 ERP 模拟校验接口判定）", action: "→ 标记金额匹配通过", priority: 1 }
        - { cond: "发票金额 > 合同/PO 金额", action: "→ 标记金额差异，进入异常判定", priority: 2 }
      arbitration: "金额比对规则由 ERP 模拟发票校验接口承载、本平台不落规则，仅感知接口返回的通过/差异结果，保证 ERP 规则调整后本平台无需调整；以不含税金额为基准。"
      exception: "接口返回差异 → 匹配差异确认点拉人；「等于边界」归属待访谈确认后锁定。"
      summary: "以不含税金额为基准、经 ERP 模拟校验接口判定发票金额是否超过合同/PO 金额；本平台仅感知结果、不落规则。"
    - id: "rd_03"
      name: "差异容忍与异常判定经验"
      usagePoints: ["判定行级匹配结果并记录匹配关系", "判定异常类型并生成处理建议"]
      factors:
        - { name: "数量差异", def: "发票与入库/送货的数量差", source: "采购发票、入库单、送货单", deterministic: false }
        - { name: "金额尾差", def: "金额比对的小额差异（差异金额与差异率）", source: "采购发票、采购订单（PO）", deterministic: false }
        - { name: "异常类型", def: "补单/换票/冲红/退票/抬头税号不符/单价不符/数量超差/金额超尾差/跨期发票", source: "采购发票、归档文件", deterministic: false }
      branches:
        - { cond: "数量差异 = 0 且 金额尾差 ≤ 1 元 且 ≤ 0.5%", action: "→ 标记可容忍，自动放行进入预制", priority: 1 }
        - { cond: "数量超差（发票数量 > 入库/送货数量，无容忍区间）", action: "→ 必拉人，标记数量超差", priority: 2 }
        - { cond: "金额尾差 > 1 元 或 > 0.5%", action: "→ 必拉人，标记金额超尾差", priority: 3 }
        - { cond: "任一超容忍（数量 OR 金额）", action: "→ 必拉人（两者为独立风险，任一超容忍即拉人）", priority: 4 }
      arbitration: "因子优先级：先看数量超差 → 再看金额尾差 → 再看供应商历史异常记录；数量超差 OR 金额超尾差 → 必拉人（独立风险，不叠加、不互相抵消）；阈值与异常类型清单为领域专家假设值，待访谈回填。"
      exception: "容忍内自动通过；超容忍 100% 拉人（匹配差异确认点/异常升级确认点）；兜底升级：应付会计 → 仍无法裁决 → 财务负责人。"
      summary: "判定差异是否可容忍：数量无容忍区间、金额尾差 ≤1 元且 ≤0.5% 自动容忍，任一超容忍必拉人；默认路径指向人工确认（安全行为）。"
    - id: "rd_04"
      name: "预制/过账/乐企前置硬门禁规则"
      usagePoints: ["预制发票凭证", "过账生成会计凭证", "更新电子税务局发票状态"]
      factors:
        - { name: "预制前置", def: "发票已识别；发票行已存在匹配关系；关键差异已保存说明；供应商/PO/入库信息完整；金额/数量/物料校验通过或已备注；用户具备预制权限", source: "客户开发方案设计文档", deterministic: true }
        - { name: "过账前置", def: "发票已预制；ERP 预制状态有效；用户具备财务过账权限", source: "客户开发方案设计文档", deterministic: true }
        - { name: "乐企前置", def: "发票已过账；存在 ERP 凭证号；用户具备乐企状态更新权限", source: "客户开发方案设计文档", deterministic: true }
      branches:
        - { cond: "预制前置全部满足", action: "→ 提交 ERP 预制发票（IF005）", priority: 1 }
        - { cond: "预制前置任一不满足（如成本中心缺失）", action: "→ 拦截并给出失败原因与降级建议（补齐后重试）", priority: 2 }
        - { cond: "过账前置满足且财务负责人已确认", action: "→ 调用 ERP 过账（IF006）生成凭证并回写凭证号", priority: 3 }
        - { cond: "乐企前置满足", action: "→ 回写乐企入账标识（IF002）；过渡期提示财务人工勾选并记录", priority: 4 }
      arbitration: "预制/过账/乐企三类硬门禁为强前置，任一不满足即阻断、不得越级执行；过账前必停人工确认（财务负责人），不可自动放行。"
      exception: "前置未满足 → 标红拦截 + 降级建议；接口失败重试无果 → 转人工线下处理并入待补队列。"
      summary: "预制、过账、乐企更新三类动作的硬门禁前置校验：满足才执行，不满足即拦截并给降级建议，过账前必停财务负责人确认。"

  # ============ 📝 模版范例类（本场景未识别）============
  template: []

  # ============ 📖 术语字典类 ============
  dictionary:
    - id: "rdict_01"
      name: "供应商/税号/科目映射字典"
      aliases: ["供应商标准名", "供应商代码", "统一社会信用代码", "SAP 会计科目", "成本中心", "付款条件"]
      definition: "采购发票校验环节的供应商、税号、会计科目口径对照表，供真伪/抬头校验与预制/过账共用；以 SAP 主数据为来源。"
      entries:
        - { term: "供应商标准名", def: "供应商主数据标准名称（如 XX环保科技，脱敏）", context: "校验发票真伪与购方抬头" }
        - { term: "供应商代码", def: "SAP 供应商编号（如 100XXX）", context: "预制发票凭证" }
        - { term: "统一社会信用代码（税号）", def: "供应商纳税人识别号（如 91310000MA1KXXXXXX，脱敏）", context: "校验发票真伪与购方抬头" }
        - { term: "SAP 会计科目", def: "材料/应付账款/进项税等科目映射", context: "预制发票凭证 / 过账生成会计凭证" }
        - { term: "成本中心", def: "费用归集成本中心（缺失会导致预制失败）", context: "预制发票凭证" }
        - { term: "付款条件", def: "账期与付款条件（如 30 天）", context: "预制发票凭证" }
      maintainer: "主数据管理员 / 财务，供应商新增或变更时即时维护（约月度）"
      referenced: ["校验发票真伪与购方抬头", "预制发票凭证", "过账生成会计凭证"]
      usagePoints: ["校验发票真伪与购方抬头", "预制发票凭证", "过账生成会计凭证"]

  # ============ 🔍 关键信息提取要点 ============
  extraction:
    - id: "rext_01"
      name: "发票票面关键字段提取要点"
      usagePoints: ["识别发票票面关键字段与行项目"]
      fields:
        - { fieldName: "发票号", definition: "数电发票号码", typicalLocations: ["票面右上角"], variants: ["数电票 20 位编号"], pitfalls: ["重复归集需按发票号去重"] }
        - { fieldName: "金额（不含税）", definition: "发票不含税金额（比对基准）", typicalLocations: ["票面右下角总计", "大写金额栏"], variants: ["小写/大写并存"], pitfalls: ["以大写为准（待访谈确认）；含税/未税口径待确认"] }
        - { fieldName: "税额", definition: "增值税税额", typicalLocations: ["票面税额栏"], variants: ["多税率分档"], pitfalls: ["需与不含税金额勾稽"] }
        - { fieldName: "供应商税号", definition: "销售方/购买方统一社会信用代码", typicalLocations: ["票面销售方栏", "票面购买方栏"], variants: ["销售方与购买方两处"], pitfalls: ["抬头/税号不符需换票"] }
        - { fieldName: "开票日期", definition: "发票开具日期", typicalLocations: ["票面日期栏"], variants: ["YYYY-MM-DD 等多种日期格式"], pitfalls: ["跨期发票需识别并标记"] }
      acceptance: "关键字段抽取准确率 ≥95%；字段缺失/模糊票/新版式 → 标红进入识别复核点转人工；低置信字段不漏标（置信度 <95% 必标红）。"
      samples: ["数电发票 25312000000012345678：二级RO膜 东丽 TM720D 400 × 42 支，不含税 77,700.00 元，税额 10,101.00 元（脱敏示例）"]

  # ============ 🔗 关联关系类（本场景未识别）============
  relation: []

# ---- P1↔P2 双向可追踪（交叉核对）----
reconciliation:
  - task: "以发票行为主线汇入三单行信息"
    rule: "三单匹配口径与数量扣减规则"
    factor: "匹配主线 / 匹配关系基数 / 三层匹配结构"
    arbitration: "以发票行为主线，差异记入匹配关系表不覆盖原始单据"
    exception: "多对多冲突/单据缺失 → 记入匹配关系表待人工调整"
    checks: { ruleFound: true, usageFound: true, nameMatch: true, exceptionMatch: true }
  - task: "行级核对数量并扣减"
    rule: "三单匹配口径与数量扣减规则"
    factor: "数量差异（发票数量扣减入库/送货数量）"
    arbitration: "发票数量 > 入库/送货即超差，数量无容忍区间"
    exception: "数量超差 → 匹配差异确认点必拉人"
    checks: { ruleFound: true, usageFound: true, nameMatch: true, exceptionMatch: true }
  - task: "行级核对金额与差异"
    rule: "金额比对规则"
    factor: "发票金额 / 合同-PO 金额 / 差异类型"
    arbitration: "金额比对由 ERP 模拟校验接口承载，本平台仅感知结果"
    exception: "接口返回差异 → 匹配差异确认点拉人"
    checks: { ruleFound: true, usageFound: true, nameMatch: true, exceptionMatch: true }
  - task: "判定行级匹配结果并记录匹配关系"
    rule: "差异容忍与异常判定经验"
    factor: "数量差异 / 金额尾差"
    arbitration: "数量超差 OR 金额超尾差 → 必拉人（独立风险）"
    exception: "超容忍 100% 拉人；兜底升级财务负责人"
    checks: { ruleFound: true, usageFound: true, nameMatch: true, exceptionMatch: true }
  - task: "判定异常类型并生成处理建议"
    rule: "差异容忍与异常判定经验"
    factor: "异常类型（补单/换票/冲红/退票/抬头税号不符/单价不符/数量超差/金额超尾差/跨期发票）"
    arbitration: "因子优先级：数量超差 → 金额尾差 → 供应商历史异常"
    exception: "类型无法判定 → 异常升级确认点拉人"
    checks: { ruleFound: true, usageFound: true, nameMatch: true, exceptionMatch: true }
  - task: "预制发票凭证"
    rule: "预制/过账/乐企前置硬门禁规则 + 供应商/税号/科目映射字典"
    factor: "预制前置 6 项 + 科目/成本中心/付款条件"
    arbitration: "硬门禁任一不满足即阻断，不得越级预制"
    exception: "前置未满足 → 拦截 + 降级建议（补齐后重试）"
    checks: { ruleFound: true, usageFound: true, nameMatch: true, exceptionMatch: true }
  - task: "过账生成会计凭证"
    rule: "预制/过账/乐企前置硬门禁规则 + 供应商/税号/科目映射字典"
    factor: "过账前置 3 项 + SAP 科目口径"
    arbitration: "过账前必停财务负责人确认，不可自动放行"
    exception: "接口失败 → 重试/转人工"
    checks: { ruleFound: true, usageFound: true, nameMatch: true, exceptionMatch: true }
  - task: "校验发票真伪与购方抬头"
    rule: "供应商/税号/科目映射字典"
    factor: "供应商标准名/代码 / 统一社会信用代码（税号）"
    arbitration: "以 SAP 主数据为准，别名对照后判定一致性"
    exception: "真伪/抬头/税号不符 → 进入异常队列换票"
    checks: { ruleFound: true, usageFound: true, nameMatch: true, exceptionMatch: true }
  - task: "识别发票票面关键字段与行项目"
