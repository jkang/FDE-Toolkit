meta:
  title: "X采购发票 · 机会点定义"
  sectionNo: "3.1"
  version: "v1.0"
  date: "2026-09-10"
  business: "X（采购到付款财务自动化）"
  domain: "采购发票校验与应付（价值段 3.4）"
  scenario: "采购发票校验助手"
  problemRef: "承接问题：三单匹配人工逐票比对高耗时且易错、异常判定依赖资深应付会计经验无书面标准、发票在电子税务局/乐企/ERP/网盘多系统割裂人工归集易漏重、预制过账与台账归档全靠人工"
  opportunitySource: "AI 机会场景地图 · 采购到付款 · 价值段 3.4 发票校验与应付（A1 · 🟢 速赢）"

opportunities:
  - id: "OP1"
    order: 1
    name: "多源发票智能归集（消除系统孤岛）"
    type: "repetitive"
    rootCauseType: "数据分散在乐企/供应商上传/采购补录多源，靠人工下载归集、易漏票重票"
    capabilityMatch: "Agent / 多源适配器 / 去重查漏"
    e1: "为应付会计构建「多源发票智能归集」，把「人工在乐企、供应商上传区、采购补录之间逐张下载归集」升级为「一键触发 + 多源自动同步 + 查重查漏」，让本批发票全部入池且不漏不重。"
    e2: "角色：应付会计（发起与补录）、采购业务员（补录 PO 关联）。\n场景：应付会计每天/每批发起归集，系统从乐企平台（IF001）、供应商上传区、采购补录多渠道拉取发票，按发票号去重并核验归集完整性。"
    e3: "发票来源分散（电子税务局/乐企、供应商平台、纸质补录），人工逐张下载归集耗时且易漏票重票，系统孤岛在采集端最先暴露。"
    e4: "用多源适配器定时/手工拉取 → 按发票号与关键字段查重 → 完整性校验并标记重复/缺失 → 归集看板按渠道分栏展示；无 API 的渠道（如纸质补录）保留人工登记入口 → 把归集覆盖率推向 100%。"
    e5: "归集从人工逐张走向一键多源同步；漏票/重票下降；归集覆盖率 100%。"
    valueBreakdown:
      - dimension: "覆盖范围"
        aligns: "⑥ 影响范围"
        metric: "全部采购发票采集链路；受益角色：应付会计 + 采购业务员"
      - dimension: "发生频度"
        aligns: "⑤ 发生频度"
        metric: "每日/每批一次归集，按发票月度量级批处理"
      - dimension: "单次收益"
        aligns: "⑦ 每次发生对业务的影响"
        metric: "多源逐张下载归集 → 一键同步；单批归集工时与漏票重票下降"
      - dimension: "累计影响"
        aligns: "⑧ 累计对业务影响"
        metric: "归集覆盖率 100%；因漏票导致的重复校验与返工减少"

  - id: "OP2"
    order: 2
    name: "票面识别与真伪/抬头校验"
    type: "repetitive"
    rootCauseType: "票面字段靠人工读取，版式差异/模糊票易错，真伪与抬头校验靠人工"
    capabilityMatch: "多模态 OCR / 版面理解 / 字典校验"
    e1: "为应付会计构建「票面识别与真伪/抬头校验」，把「人工读取发票号/金额/税额/税号并逐张验真校抬头」升级为「AI 结构化识别 + 置信度门禁 + 自动校验」，低置信自动转人工复核。"
    e2: "角色：应付会计（复核低置信字段）、采购业务员（仅自有权限 PO 复核）。\n场景：发票入池后，AI 识别 5 个关键字段与行项目，按供应商/税号字典校验真伪与购方抬头，置信度 <95% 标红转人工。"
    e3: "票面版式多样、存在模糊票与新版式，人工读取易错；真伪/抬头校验依赖逐张核对，效率低。"
    e4: "多模态模型识别字段 + 版面定位 → 置信度门禁（<95% 转人工复核）→ 调用供应商/税号/科目字典校验真伪与抬头 → 结构化结果回写并标注票面位置供追溯 → 把识别准确率推向 >95%。"
    e5: "票面识别从人工读取走向 AI 结构化；识别准确率 >95%；真伪/抬头校验覆盖率 100%。"
    valueBreakdown:
      - dimension: "覆盖范围"
        aligns: "⑥ 影响范围"
        metric: "全部采购发票；受益角色：应付会计 + 采购业务员"
      - dimension: "发生频度"
        aligns: "⑤ 发生频度"
        metric: "每张发票一次识别校验"
      - dimension: "单次收益"
        aligns: "⑦ 每次发生对业务的影响"
        metric: "人工读取识别 → 秒级结构化；字段读取错误下降"
      - dimension: "累计影响"
        aligns: "⑧ 累计对业务影响"
        metric: "识别准确率 ≥95%；因识别错误导致的匹配/入账返工减少"

  - id: "OP3"
    order: 3
    name: "三单匹配与数量扣减自动化"
    type: "innovation"
    rootCauseType: "人工逐票逐行比对发票/入库送货/PO，高耗时且高频错误"
    capabilityMatch: "规则引擎 / Agent 编排 / 行级匹配"
    e1: "为应付会计构建「三单匹配与数量扣减自动化」，把「人工逐票逐行比对发票、入库/送货、PO」升级为「以发票行为主线行级匹配 + 数量扣减 + 差异标注」，人工只处理差异。"
    e2: "角色：应付会计（确认匹配结果）。\n场景：以发票行为主线汇入 PO 行/入库行/送货行，执行三层匹配（发票行↔送货/入库行、入库单↔PO 行、发票行↔PO 行）与数量扣减（发票数量扣减入库/送货数量），标注差异。"
    e3: "三单匹配人工逐票逐行比对，单票耗时高、错误率不低；口径复杂（三层匹配、一对多/多对多、数量扣减）靠人脑维持。"
    e4: "规则引擎承载三层匹配结构与数量扣减口径 → 行级自动匹配并生成匹配关系表（不覆盖原始单据）→ 差异高亮 + 四数量对照报表 → 差异转异常确认 → 把匹配错误率压到目标值。"
    e5: "三单匹配从人工逐票走向行级自动匹配；单票校验耗时降至秒级；匹配错误率下降、杜绝静默错配。"
    valueBreakdown:
      - dimension: "覆盖范围"
        aligns: "⑥ 影响范围"
        metric: "全部待校验发票；受益角色：应付会计"
      - dimension: "发生频度"
        aligns: "⑤ 发生频度"
        metric: "每张发票一次三单匹配"
      - dimension: "单次收益"
        aligns: "⑦ 每次发生对业务的影响"
        metric: "逐票逐行人工比对 → 行级自动匹配；单票校验耗时大幅下降"
      - dimension: "累计影响"
        aligns: "⑧ 累计对业务影响"
        metric: "匹配错误率下降；因错配导致的冲销/重做减少"

  - id: "OP4"
    order: 4
    name: "差异容忍与异常判定知识化"
    type: "cognitive"
    rootCauseType: "差异容忍与异常判定依赖资深经验、无书面标准，换人即断档"
    capabilityMatch: "知识沉淀 / 规则引擎 / LLM 归因"
    e1: "为应付会计构建「差异容忍与异常判定知识化」，把「资深会计凭经验判断哪些差异可容忍、哪些必拉人」升级为「规则化差异容忍判定 + 异常类型标注 + 处理建议与升级路径」，让经验可复核可传承。"
    e2: "角色：应付会计（复核判定）、采购业务员（异常确认与沟通）、财务负责人（升级裁决）。\n场景：三单匹配出现数量/金额差异时，按差异容忍规则判定可容忍或必拉人，并生成异常类型（补单/换票/冲红/退票/抬头税号不符/单价不符/数量超差/金额超尾差/跨期发票）与处理建议。"
    e3: "差异容忍阈值与异常类型清单无书面标准，集中在少数资深人员；异常沟通与升级路径靠口传，人员流动即断层。"
    e4: "把差异容忍规则（数量无容忍区间、金额尾差 ≤1 元且 ≤0.5% 自动容忍——领域专家假设值待访谈回填）落成规则引擎 → LLM 生成异常类型归因与处理建议 → 输出沟通对象与升级路径 → 容忍内自动放行、超容忍必拉人 → 把隐性经验转为可复核的标准动作。"
    e5: "异常判定从依赖经验走向规则化 + 建议化；异常处理周期缩短；经验可复核可传承。"
    valueBreakdown:
      - dimension: "覆盖范围"
        aligns: "⑥ 影响范围"
        metric: "全部异常发票；受益角色：应付会计 + 采购业务员 + 财务负责人"
      - dimension: "发生频度"
        aligns: "⑤ 发生频度"
        metric: "每张差异发票一次判定"
      - dimension: "单次收益"
        aligns: "⑦ 每次发生对业务的影响"
        metric: "凭经验判断 → 规则判定 + 建议；判定一致性提升、沟通往返减少"
      - dimension: "累计影响"
        aligns: "⑧ 累计对业务影响"
        metric: "异常处理周期缩短；经验断层风险下降"

  - id: "OP5"
    order: 5
    name: "预制过账与台账归档自动化"
    type: "repetitive"
    rootCauseType: "预制/过账/台账/归档全靠人工，耗时且易错，硬门禁靠人工记忆"
    capabilityMatch: "规则引擎 / 跨系统编排 / 硬门禁校验"
    e1: "为应付会计与财务负责人构建「预制过账与台账归档自动化」，把「人工逐票预制、过账审核、更新台账、打印归档、回写乐企状态」升级为「硬门禁前置校验 + 批量预制过账 + 台账归档状态全链路自动更新」。"
    e2: "角色：应付会计（批量预制）、财务负责人（过账审核）、系统（乐企状态回写）。\n场景：匹配通过的票批量预制，预制/过账/乐企三类硬门禁前置条件全绿才放行；过账确认后凭证号、乐企入账标识、台账、归档索引一次到位。"
    e3: "预制、过账、台账更新、打印归档、乐企状态回写全靠人工，耗时且易错；三类硬门禁前置条件靠人工记忆，遗漏导致返工。"
    e4: "用硬门禁规则校验预制（已识别/匹配关系/差异说明/信息完整/校验通过/权限）、过账（已预制/预制有效/财务权限）、乐企（已过账/有凭证号/权限）三类前置 → 批量预制过账 → 自动回写凭证号、乐企状态、台账、归档索引 → 把入账自动化覆盖率推向 100%。"
    e5: "预制过账归档从人工逐票走向批量自动；入账自动化覆盖率 100%；硬门禁遗漏导致的返工下降。"
    valueBreakdown:
      - dimension: "覆盖范围"
        aligns: "⑥ 影响范围"
        metric: "全部匹配通过发票；受益角色：应付会计 + 财务负责人"
      - dimension: "发生频度"
        aligns: "⑤ 发生频度"
        metric: "每批发票一次预制过账"
      - dimension: "单次收益"
        aligns: "⑦ 每次发生对业务的影响"
        metric: "人工逐票预制过账归档 → 批量自动；单批入账工时下降"
      - dimension: "累计影响"
        aligns: "⑧ 累计对业务影响"
        metric: "入账自动化覆盖率 100%；发票到过账周期缩短"
