title: "采购发票校验助手"
description: "以发票为主线，自动归集多源票据、完成三单匹配与差异识别，助应付会计安全快速入账。"
userRoles:
  - "应付会计（主使用者）"
  - "采购业务员（按 PO 权限复核）"
  - "财务负责人（过账审核）"
userPains:
  - "三单匹配需逐票逐行人工比对发票/入库送货/PO，高耗时且易错"
  - "差异容忍与异常判定依赖资深应付会计经验，无书面标准，换人即断档"
  - "发票在电子税务局/乐企、入库单在 ERP、送货单在公共网盘，多系统割裂、人工归集易漏票重票"
  - "异常票（补单/换票/冲红）需与采购、供应商多轮邮件往返，修正后返回匹配重跑"
  - "台账更新、打印归档、入账标识确认全靠人工，耗时且易错"
aiInput:
  - "多渠道归集的采购发票文件（电子税务局/乐企/供应商上传/采购补录）"
  - "ERP 入库单、公共网盘送货单等三单单据"
  - "待校验发票批次与范围（应付会计选择）"
  - "发票用途确认信息与采购补录 PO 关联"
dataKnowledge:
  - "三单匹配口径与数量扣减规则：以发票行为主线，支持一对多/多对多，发票数量扣减入库/送货数量（规则资产）"
  - "金额比对规则：发票金额不得大于合同金额等，由 ERP 模拟校验接口承载，本平台仅感知结果"
  - "差异容忍与异常类型清单：数量无容忍区间、金额尾差 ≤1 元且 ≤0.5% 自动容忍、任一超容忍必拉人【专家假设值·待访谈回填】"
  - "供应商/税号/科目映射字典（术语字典类知识资产）"
  - "发票票面关键字段提取要点：发票号/金额/税额/供应商税号/开票日期，置信度阈值 95%"
  - "物料主数据、PO 与入库单历史数据"
workflow:
  - actor: human
    action: 应付会计发起发票校验任务，确认发票用途与校验范围
  - actor: agent
    action: 从电子税务局/乐企/供应商上传/采购补录多渠道归集发票，OCR 识别票面并做真伪与抬头校验
  - actor: agent
    action: 以发票行为主线拉取 PO/入库单/送货单，执行三单匹配（数量扣减、金额比对）并标注差异
  - actor: hybrid
    action: 系统按差异容忍规则给出异常类型与建议，应付会计复核判定；容忍内自动放行，超容忍必拉人
  - actor: human
    action: 采购业务员按 PO 权限复核异常并与供应商沟通，财务负责人过账审核
  - actor: agent
    action: 差异修复后重跑匹配，生成预制发票并过账、更新台账、归档单据、回写乐企入账标识
modelUsage:
  - "多模态视觉大模型（OCR + 版面理解）：发票/送货单票面关键字段结构化提取"
  - "文本大模型（核心编排）：三单匹配差异归因、异常类型判定与沟通话术生成"
  - "规则引擎：三单匹配/数量扣减/金额比对/差异容忍阈值判定"
  - "置信度门禁：票面字段提取置信度 <95% 自动转人工复核"
aiOutput:
  - "结构化发票数据（票面字段 + 真伪/抬头校验结果）"
  - "三单匹配结果与差异清单（匹配关系、数量扣减、金额差异）"
  - "异常类型标注与复核建议（容忍内自动通过 / 超容忍必拉人）"
  - "预制发票与过账凭证（ERP 生成）"
  - "台账更新、单据归档与乐企入账标识回写结果"
systemIntegration:
  - system: "乐企平台（IF001 发票拉取 / IF002 入账状态更新）"
    direction: bidirectional
    purpose: "拉取数电发票并回写入账标识状态"
  - system: "ERP/SAP（IF003 PO 查询 / IF004 入库单查询 / IF005 预制发票 / IF006 发票过账 / IF007 凭证查询）"
    direction: bidirectional
    purpose: "读取 PO 与入库单，回写预制发票与过账凭证"
  - system: "公共文件夹/网盘（IF008 送货单读取）"
    direction: upstream
    purpose: "读取无 API 的送货单文件"
  - system: "文件服务（IF009）"
    direction: bidirectional
    purpose: "发票与单据文件的归集存取"
  - system: "OCR/AI 识别服务（IF010）"
    direction: bidirectional
    purpose: "票面字段结构化识别与置信度返回"
  - system: "物料主数据（IF011）"
    direction: upstream
    purpose: "物料编码与描述匹配"
  - system: "组织权限 AD（IF012）"
    direction: upstream
    purpose: "按 PO 权限控制复核与审批范围"
  - system: "打印服务（IF013）"
    direction: downstream
    purpose: "归档单据打印输出"
  - system: "消息/IM"
    direction: downstream
    purpose: "异常沟通与待办提醒推送"
productType:
  - "嵌入 ERP/应付工作台的发票校验助手（三单匹配工作台 + 异常确认台）"
  - "财务共享应付岗批量校验任务台 + 待办提醒"
businessGains:
  - "发票票面识别准确率 ≥95%（票面关键字段置信度阈值口径，目标值）"
  - "发票多渠道采集归集覆盖率 100%（电子税务局/乐企/供应商上传/采购补录全渠道）"
  - "三单匹配与入账自动化覆盖率 100%（预制/过账/乐企入账标识回写全链）"
  - "单票校验耗时由人工逐票逐行比对（当前基线待客户回填）降至自动匹配秒级，人工仅处理异常"
  - "三单匹配错误率下降（当前错误率基线待客户回填）；目标：容忍内自动通过、超容忍 100% 拉人复核，杜绝静默错配"
  - "异常票处理周期由多轮邮件往返、动辄数日（当前基线待客户回填）压缩，减少采购/供应商往返轮次"
notes:
  - "本画布基于「采购到付款主价值流 · 价值段 3.4 发票校验与应付」现状分析产出，场景为 A1 采购发票校验助手（🟢 速赢）。"
  - "待客户基线回填：① 采购发票月度量级 ② 单票校验耗时 ③ 三单匹配错误率 ④ 异常票处理周期与往返轮次。"
  - "待访谈确认（假设值）：差异容忍阈值与异常类型清单为领域专家假设值（数量无容忍区间、金额尾差 ≤1 元且 ≤0.5% 自动容忍），须经业务访谈回填。"
  - "边界说明：不包含来料收货与检验、入库单/送货单生成（上游 3.3）、付款执行与银行支付（下游 3.5）；金额比对规则本体由 ERP 模拟校验接口承载，本平台仅感知结果；供应商主数据维护与对账争议仲裁不在范围内。"
  - "量化口径：识别准确率 >95%、采集归集覆盖率 100%、入账自动化覆盖率 100% 为已知目标值；其余收益因基线未知，均显式标注「待客户回填」，未编造确定数字。"
