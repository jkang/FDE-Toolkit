meta:
  title: "X电商订舱 · 智能订舱 Agent 端到端深度任务流程地图"
  subtitle: "来自《任务流程挖掘清单》主表"
  version: "v1.0"
  date: "2026-08-25"
  scenarioName: "智能订舱 Agent"
  businessStage: "SKP 阶段1 任务流程挖掘 · P1"
  methodology: "SKP 阶段1方法（业务环节 L3 → 主要活动 L4 → 深度任务 L5）"
  inputs:
    - "SRP《AI画布-01智能订舱Agent》（场景定义/数据知识/工作流/工具/收益）"
    - "SRP《智能订舱Agent-To-be旅程》（角色/目标/旅程阶段/动作/设计要点）"
    - "SRP《X电商订舱-服务蓝图》（客户/前台/后台三层痛点）"
  sourceRef: "X电商订舱-智能订舱Agent-To-be流程.yaml 任务手账"
  kpi:
    - "在线订舱确认时效"
    - "AI 分流率"
    - "SME 全流程自助率"
    - "单证一次提交通过率"

overview:
  l3Count: 5
  l4Count: 6
  l5Count: 21
  focusL3: "在线订舱"
  focusL4: "一键订舱与确认"

legend:
  focusType: "p0"
  focusLabel: "P0 本节重点"
  execution:
    - { type: "agent",  label: "Agent",   icon: "🤖" }
    - { type: "mixed",  label: "混合执行", icon: "🤝" }
    - { type: "human",  label: "人工",     icon: "👤" }
  convention:
    - "L3 业务阶段"
    - "L4 活动分组"
    - "L5 可执行动作"

stages:
  - id: "S1"
    num: "01"
    name: "询价报价"
    l5Count: 4
    isFocus: false
    groups:
      - id: "G1_1"
        name: "询价与报价服务"
        isP0: false
        tasks:
          - { id: "t01", name: "自然语言发起询价", actor: "human" }
          - { id: "t02", name: "意图识别与路由",   actor: "agent" }
          - { id: "t03", name: "实时报价数据返回", actor: "agent" }
          - { id: "t04", name: "报价逐项解读",     actor: "agent" }

  - id: "S2"
    num: "02"
    name: "舱位推荐"
    l5Count: 4
    isFocus: false
    groups:
      - id: "G2_1"
        name: "舱位推荐与解释"
        isP0: false
        tasks:
          - { id: "t05", name: "舱位余量/船期数据返回", actor: "agent" }
          - { id: "t06", name: "综合排序推荐 Top3",     actor: "agent" }
          - { id: "t07", name: "解释推荐理由",           actor: "agent" }
          - { id: "t08", name: "确认 Agent 推荐舱位",    actor: "mixed" }

  - id: "S3"
    num: "03"
    name: "在线订舱"
    l5Count: 6
    isFocus: true
    groups:
      - id: "G3_1"
        name: "一键订舱与确认"
        isP0: true
        tasks:
          - { id: "t09", name: "3 步表单自动预填",          actor: "agent" }
          - { id: "t10", name: "订舱规则校验",              actor: "agent" }
          - { id: "t11", name: "一键订舱确认",              actor: "mixed" }
          - { id: "t12", name: "订舱受理与状态回写",        actor: "agent" }
          - { id: "t13", name: "签发 Booking Confirmation", actor: "agent" }
          - { id: "t14", name: "异常订舱人工终审",          actor: "human" }

  - id: "S4"
    num: "04"
    name: "单证处理"
    l5Count: 5
    isFocus: false
    groups:
      - id: "G4_1"
        name: "单证预填（SI 生成）"
        isP0: false
        tasks:
          - { id: "t15", name: "上传贸易单据",       actor: "human" }
          - { id: "t16", name: "OCR 抽取 SI 字段",   actor: "agent" }
          - { id: "t17", name: "品名规范与 HS 映射", actor: "agent" }
          - { id: "t18", name: "单证规则校验",       actor: "agent" }
          - { id: "t19", name: "确认并提交 SI",      actor: "mixed" }

  - id: "S5"
    num: "05"
    name: "出运跟踪"
    l5Count: 2
    isFocus: false
    groups:
      - id: "G5_1"
        name: "出运跟踪交互"
        isP0: false
        tasks:
          - { id: "t20", name: "对话查里程碑",       actor: "human" }
          - { id: "t21", name: "ETA 预测与延误预警", actor: "agent" }

readingFlow:
  - "<b>先看全链路</b>：从询价到复购，最终形成闭环"
  - "<b>再找高价值 L4</b>：「一键订舱与确认」承载最密集的规则校验与人工确认"
  - "<b>最后下钻 L5</b>：拆成「预填 / 校验 / 确认」三个可独立挂规则的动作"

focusDrill:
  before:
    l4Name: "一键订舱与确认"
    whyTooCoarse: "它包含表单预填、规则校验、人工确认等不同动作，输入输出和异常各不相同，不能直接作为最小执行单元。"
  approach: "访谈走查＋材料还原 →"
  evidence:
    - "根据会话上下文与会员画像，先把订舱表单字段预填好"
    - "运行 200+ 条订舱校验规则，识别费率/信用/航线异常"
    - "校验通过后由货主一键确认，异常则转人工终审"
  after: "下钻为 3 个不可再分的 L5，各自回答『填什么 / 查什么 / 是否提交』。"

focusSequence:
  - { id: "L5-1", name: "3 步表单自动预填",  question: "填什么" }
  - { id: "L5-2", name: "订舱规则校验",        question: "查什么 · 依据什么放行" }
  - { id: "L5-3", name: "一键订舱确认",        question: "是否提交 · 结果是否可观察" }

taskTable:
  - l5: "3 步表单自动预填"
    inputs: "会话上下文、会员画像、选定方案"
    outputs: "预填订舱表单（12 字段）"
    ruleType: "模版范例类·订舱表单模板/必填字段"
    exception: "新客无历史数据 → 会话+OCR 兜底预填，标注置信度"
    actor: "agent"
  - l5: "订舱规则校验"
    inputs: "预填字段、校验规则（200+ 条）"
    outputs: "校验结果（费率/信用/航线）"
    ruleType: "决策模型类·订舱校验规则引擎"
    exception: "校验不过/信用受限 → 标注原因并提示补正/转人工"
    actor: "agent"
  - l5: "一键订舱确认"
    inputs: "校验通过的表单"
    outputs: "确认提交订舱请求"
    ruleType: "决策模型类·提交放行确认"
    exception: "货主核对异常 → 退回修改预填字段 → 人工终审"
    actor: "mixed"

ioChain:
  - "会话上下文 + 会员画像"
  - "预填订舱表单"
  - "校验结果（通过/异常）"
  - "确认提交订舱请求"
  - "下游：OMS 受理 → Booking Confirmation / 人工终审"

learning:
  why: "三个 L5 各自只有一个核心动词，产出可观察，并可独立挂接规则。"
  key: "挖掘的关键不是改写名称，而是把专家真实执行的动作顺序、输入输出、判断依据和异常链路结构化。"
