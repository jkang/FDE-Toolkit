# To-be 旅程（单 journey）· 数据契约
# 一条 journey（画像 × 场景）一份；由 persona-journey-designer 的《用户画像与典型旅程》细化而来。
# 用法：python3 scripts/build_to_be.py <input.yaml> <output.html>
# 说明：不同 journey 的 stages 各不相同；不要写成跨角色的主流程。

title: "<客户> · <画像> · <场景> · To-be 旅程"

meta:
  mode: "to-be"
  scenarioName: "<场景名>"
  persona: "<画像角色>"
  source: "用户画像与旅程: <路径>；规则: <路径>；本体: <路径>"

journey:                                   # 承接 persona journey 的端到端边界
  jobStory: "当 [情境] ，我想要 [动机] ，以便 [预期结果]"
  start: "<起点：目标触发>"
  end: "<终点：目标完成>"
  participants: "<参与角色：主责 + 参与 / 知会（一条旅程可跨角色）>"
  productTouchpoints: "<产品介入点：AI 在哪几步帮忙>"

persona:                                   # 单一画像（细化）
  id: "persona_01"
  name: "<具名>"
  role: "<角色>"
  department: "<部门>"
  background: "<背景>"
  goals: ["<目标>"]
  painPoints: ["<痛点>"]
  dataProfile:
    typicalValues: ["<典型业务数据>"]
    frequency: "高频 | 中频 | 低频"
    commonErrors: ["<常见失误>"]

scenario:                                  # 单一场景
  id: "s1"
  name: "<场景名>"
  trigger: "<触发条件>"
  businessData: ["<涉及业务数据>"]
  goal: "<本场景目标>"

handoff:                                   # 可选：不填则由脚本从旅程自动汇总
  paths: ["主路径：…", "分支：…", "异常：…"]

stages:                                    # 本 journey 自己的阶段（阶段数与步数随 journey 而定）
  - name: "<阶段名>"
    actions:
      - name: "<行为步骤>"
        owner: "<执行主体：用户 / AI / 人机协同>"
        touchpoints: "<触点：页面 / 模块>"
        thoughts: ["<用户想法>"]
        userInputs:
          - { type: "<类型>", name: "<名称>", format: "<格式>", example: "<示例>", content: "<内容>" }
        aiInteraction:
          aiAction: "<AI 动作>"
          suggestions: ["<对话中推荐的操作指令>"]
        visibleData: ["<用户可见的数据>"]
        designNotes: ["<设计意图与改善>"]
