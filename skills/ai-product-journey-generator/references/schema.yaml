title: "采购订单自动生成 · To-be 旅程设计"
meta:
  mode: "to-be"
  source: "AI画布: dreame_canvas_1_procurement.yaml"
  scenarioName: "采购订单自动生成"
  productType: "嵌入SRM系统的智能下单模块 + 采购专员工作台待办"
personas:
  - id: "buyer_zhang"
    name: "张敏"
    role: "采购专员"
    department: "采购部"
    background: "负责生产物料采购，日均处理 15~30 张采购申请，日常使用 SRM 与 Excel"
    goals:
      - "快速完成需求识别与供应商寻源"
      - "避免物料漏采或交期延误"
    painPoints:
      - "每日数十张采购单需手工录入，耗时超过 2 小时"
      - "多品类共用零部件协调复杂，容易遗漏"
    dataProfile:
      typicalValues:
        - "采购申请单 PR-2024-0812.xlsx：含 3~5 条物料，字段为物料编码/需求数量/期望交期/用途"
        - "历史成交价：每物料 3~5 家供应商报价"
      frequency: "高频"
      commonErrors:
        - "期望交期字段漏填"
        - "物料编码书写不规范"
  - id: "manager_li"
    name: "李强"
    role: "采购经理"
    department: "采购部"
    background: "负责采购订单终审，每周审批 80+ 张订单，关注成本与供应商风险"
    goals:
      - "快速完成订单审批，不阻塞采购时效"
      - "及时发现异常价格与交期风险"
    painPoints:
      - "审批流程长，每张订单需逐张核对价格合理性"
      - "紧急插单频繁，人工调整容易出错"
    dataProfile:
      typicalValues:
        - "审批看板：当日待审 12 张，含 3 张紧急插单"
        - "价格异常阈值：偏离历史均价 ±8%"
      frequency: "中频"
      commonErrors:
        - "漏看价格异常标记"
        - "紧急单被普通队列挤占"
handoff:
  paths:
    - "主路径：上传申请单 → 确认 AI 推荐 → 提交审批 → 下发订单"
    - "分支：AI 推荐价高于历史均价 → 触发询价单发给备选供应商"
    - "异常：交期字段缺失 → AI 追问补录，不阻塞主流程"
    - "边界：供应商无历史成交记录 → 展示行业均价兜底，标注置信度"
scenarios:
  - id: "s1"
    name: "紧急缺料采购"
    personaId: "buyer_zhang"
    trigger: "产线报缺料，需求方要求当天确认供应商并下单"
    businessData:
      - "缺料清单（含紧急等级：P0/P1/P2 标识）"
      - "可用供应商池（近 90 天交付达成率）"
    goal: "10 分钟内完成需求识别 + 供应商初选 + 订单草稿生成"
  - id: "s2"
    name: "批量日常补货"
    personaId: "buyer_zhang"
    trigger: "每周一基于安全库存水位生成补货清单"
    businessData:
      - "库存水位报表（当前库存 / 安全库存 / 在途）"
      - "BOM 物料清单与共用件映射"
    goal: "批量生成 20+ 张订单草稿，异常项单独提示人工确认"
stages:
  - name: "发起采购需求"
    actions:
      - name: "上传缺料申请单"
        owner: "采购专员"
        touchpoints: "Web 采购工作台 · 上传区"
        thoughts:
          - "希望系统能自动识别申请单内容，别再让我手动录入"
        userInputs:
          - type: "文件上传"
            name: "缺料申请单"
            format: "Excel/CSV"
            example: "PR-2024-0812.xlsx"
            content: "物料编码、需求数量、期望交期、紧急等级(P0/P1/P2)、用途"
        aiInteraction:
          aiAction: "表格解析识别申请单字段，与物料主数据比对校验完整性"
          suggestions:
            - "识别并校验物料信息"
            - "查询历史成交价"
        visibleData:
          - "识别结果：3 条物料（电机×500件 / 轴承×200件 / 密封圈×1000件）"
          - "完整性校验：2 项通过，1 项缺失（期望交期未填，已标黄提醒）"
        designNotes:
          - "录入耗时由 30 分钟降至 2 分钟"
          - "交期缺失时 AI 主动追问补录，不阻塞主流程"
  - name: "智能需求计算与选商"
    actions:
      - name: "确认 AI 推荐的最优供应商"
        owner: "采购专员"
        touchpoints: "SRM 智能下单模块 · 推荐卡片"
        thoughts:
          - "AI 推荐的理由是否充分？价格和交期我要能一键对比"
        userInputs:
          - type: "系统自动带入"
            name: "生产计划 + 库存水位"
            format: "ERP API 实时数据"
            example: "电机库存 320 件 < 安全库存 500 件"
            content: "生产计划工单、当前库存水位、安全库存阈值、BOM 共用件映射"
        aiInteraction:
          aiAction: "净需求计算 + 供应商匹配（价格/交期/历史履约率加权打分）"
          suggestions:
            - "对比 Top 3 供应商报价"
            - "生成询价单并发给备选供应商"
            - "查看历史价格趋势"
        visibleData:
          - "净需求：电机 500 件（需采 180 件）、轴承 200 件、密封圈 1000 件"
          - "推荐结果：泰科机电 92 分（¥18.5/件，交期 5 天）；华宇传动 86 分（¥17.9/件，交期 9 天）"
        designNotes:
          - "推荐必须展示打分依据（价格/交期/履约率子分），供人复核"
          - "价格偏离历史均价 ±8% 时置顶异常标记"
  - name: "订单生成与审批"
    actions:
      - name: "提交订单草稿进入审批"
        owner: "采购经理"
        touchpoints: "采购经理工作台 · 待办审批"
        thoughts:
          - "希望能一眼看到异常项，紧急单别被普通队列挤占"
        userInputs:
          - type: "表单确认"
            name: "订单草稿确认"
            format: "页面内编辑"
            example: "PO-2024-0812-003：电机 180 件 × ¥18.5 = ¥3,330"
            content: "数量、交期、单价、付款条款、供应商"
        aiInteraction:
          aiAction: "生成订单 PDF/电子单据，识别异常项并给出审批建议"
          suggestions:
            - "一键审批通过（无异常项）"
            - "标记价格异常并打回修改"
            - "转人工复核交期风险"
        visibleData:
          - "订单摘要卡：PO-2024-0812-003，¥3,330，交期 5 天"
          - "异常预警：1 项（密封圈价格高于历史均价 12%，已标红）"
          - "紧急单置顶标识：P0 紧急，剩余审批 SLA 4 小时"
        designNotes:
          - "审批耗时由平均 1 天压缩至 2 小时"
          - "异常项必须显性提示，禁止静默通过"
  - name: "下单与状态同步"
    actions:
      - name: "确认下发订单至供应商"
        owner: "采购专员"
        touchpoints: "SRM 平台 · 订单下发 / 钉钉通知"
        thoughts:
          - "希望订单状态能自动同步，不用我再去 ERP 里人工维护"
        userInputs:
          - type: "系统自动执行"
            name: "审批通过后的订单数据"
            format: "SRM → ERP API"
            example: "PO-2024-0812-003 状态: 待供应商确认"
            content: "订单号、供应商、数量、交期、金额"
        aiInteraction:
          aiAction: "自动下发电子签章订单并推送供应商，同步更新 ERP 状态"
          suggestions:
            - "查看供应商确认进度"
            - "设置交期提醒（超期自动预警）"
        visibleData:
          - "下发成功：3 张订单已推送（供应商已收到通知）"
          - "ERP 状态已同步：待供应商确认 / 在途 / 已入库"
          - "交期看板：1 单存在交期冲突风险（密封圈 9 天 > 期望 7 天）"
        designNotes:
          - "人工下单工作量减少 70%"
          - "订单处理时效由 2 天缩短至 2 小时"
          - "交期风险在可视化看板中提前暴露，降低缺料率 30%"
