meta:
  product: "渠道运营 AI 伙伴"
  title: "产品概念设计"
  version: "v1.0"
  date: "2026-01-01"
  basis: "依据《渠道运营 To-be 流程》与核心功能清单整理"

hero:
  product: "渠道运营 AI 伙伴"
  tagline: "面向一线渠道运营的 AI 伙伴 —— 把现场碎片信息变成可执行的判断与打法"
  chips:
    - {label: "定位", value: "服务一线运营"}
    - {label: "形态", value: "信息闭环"}
    - {label: "本次切入", value: "现场信息采集与解读"}
    - {label: "试点", value: "2 条业务线 · 6 个区域"}

vision:
  statement: "一个面向一线渠道运营的 AI 伙伴：把组织里顶尖运营的经验蒸馏出来、无感地推到一线面前，让不具备专家经验的人也能做出接近专家的判断。"
  lead: "不是工具拼盘，而是围绕一个业务周期的全流程支持：取数、采集、校验、解读、生成交给 AI，人只在关键节点做判断与决策。"
  principles:
    - {title: "服务一线", desc: "第一对象是一线运营，不是管理者；让做事更轻松有效，而不是「管他们」的工具。"}
    - {title: "主动", desc: "主动提问、主动提醒、主动引导补充信息，而非被动应答。"}
    - {title: "有回路", desc: "收集 → 结论 → 验证 → 行动 → 结果回流，执行与复盘产生的新信息再次进入下一轮。"}

stages:
  - no: "P1"
    name: "业务复盘"
    full: "上期业务复盘与目标设定"
    scope: "partial"
    scopeLabel: "★ 部分本轮"
    ai:
      - {text: "关键指标展示与风险分析（覆盖 / 动销 / 库存 / 执行进度）", kind: "auto", mvp: true}
      - {text: "从现有数据识别重点关注区域及终端", kind: "auto", mvp: true}
      - {text: "业绩取数下钻、目标测算与分解", kind: "auto", mvp: false}
    human: "确认目标与重点对象 · 认领对象并制定走访计划"
  - no: "P2"
    name: "信息采集"
    full: "现场信息采集与非结构化知识处理"
    scope: "mvp"
    scopeLabel: "★ 本轮重点"
    ai:
      - {text: "政策与市场动态监控与解读", kind: "auto", mvp: true}
      - {text: "现场走访采集（拍照 / 语音 / 抄数）", kind: "hybrid", mvp: true}
      - {text: "产品资料与活动日历结构化", kind: "auto", mvp: true}
    human: "现场「拍 / 采」· 客户提供经营与现场信息"
  - no: "P3"
    name: "信息解读"
    full: "信息解读与校验"
    scope: "mvp"
    scopeLabel: "★ 本轮重点"
    ai:
      - {text: "影像与沟通记录解读（货架 / 价签 / 库存 / 客户原话）", kind: "auto", mvp: true}
      - {text: "现场信息 × 业务数据交叉核验", kind: "auto", mvp: true}
      - {text: "置信度与信息差定级", kind: "auto", mvp: true}
    human: "—（AI 全自动；低置信度信息进待验证清单）"
  - no: "P4"
    name: "机会识别"
    full: "原因分析与机会识别"
    scope: "mvp"
    scopeLabel: "★ 本轮重点"
    ai:
      - {text: "推导业绩原因假设（附证据链与待验证点）", kind: "auto", mvp: true}
      - {text: "增长空间推测与机会生成（对象 / 产品 / 方式 / 指标）", kind: "auto", mvp: true}
    human: "验证原因假设并裁定主因 · 确认机会与优先级"
    nonAi: "确认有效后，把机会案例分享给其他运营"
  - no: "P5"
    name: "策略与执行"
    full: "策略方案生成与执行调整"
    scope: "next"
    scopeLabel: "下一步"
    ai:
      - {text: "按对象类型生成策略方案（A / B 方案 + 投入产出预估）", kind: "auto", mvp: false}
      - {text: "执行进度跟踪与偏差预警", kind: "auto", mvp: false}
    human: "核定方案目标与资源 · 执行落地与决策调整"

flowFoot:
  - "一期范围 = 重点关注对象识别 + 信息采集与解读 + 机会识别"
  - "策略与执行紧随其后"
  - "P1 其余能力沿用现有系统"
  - "执行与复盘产生的新信息回流至 P2 / P3，形成闭环"

division:
  - stage: "P1 业务复盘"
    full: "上期业务复盘与目标设定"
    ai: "关键指标展示与风险分析、识别重点关注区域及终端（MVP）；业绩取数下钻、目标测算与分解"
    human: "确认目标与重点对象；认领对象并制定走访计划"
    scope: "now"
  - stage: "P2 信息采集"
    full: "现场信息采集与非结构化知识处理"
    ai: "政策与市场动态监控；现场走访采集（拍照 / 语音 / 抄数）；产品资料与活动日历结构化（MVP）"
    human: "现场「拍 / 采」；客户提供经营与现场信息"
    scope: "now"
  - stage: "P3 信息解读"
    full: "信息解读与校验"
    ai: "影像与沟通记录解读；现场信息 × 业务数据交叉核验；置信度与信息差定级（MVP）"
    human: "—（AI 全自动；低置信度进待验证清单）"
    scope: "now"
  - stage: "P4 机会识别"
    full: "原因分析与机会识别"
    ai: "推导业绩原因假设；增长空间推测与机会生成（MVP）"
    human: "验证原因假设并裁定主因；确认机会与优先级"
    scope: "now"
  - stage: "P5 策略与执行"
    full: "策略方案生成与执行调整"
    ai: "按对象类型生成策略方案；执行进度跟踪与偏差预警"
    human: "核定方案目标与资源；执行落地与决策调整"
    scope: "next"

phase1:
  lead: "本轮重点落在现场信息采集与获取、交叉验证与碎片信息解读、机会识别；策略方案建议为下一步。"
  focus:
    - title: "现场信息采集与获取"
      subtitle: "服务于一线为下个周期做策略计划"
      rows:
        - {k: "解决什么", v: "做策略计划时缺先导性信息——现有数据以结果数据为主（滞后），真正决定机会与风险的现场信息留在一线脑子里，没有采、没有沉淀、没有复用。"}
        - {k: "怎么做", v: "多源无感采集：拍照、语音口述、结构化抄数；按标准问题引导采集，Agent 主动追问「还缺什么」。"}
        - {k: "边界", v: "一线只负责「拍 / 采」，整理与判断由 Agent 承担；采集方式须过合规边界。"}
      output: "结构化信息：〔对象〕〔事实 · 变化〕（证据）→ 意味着〔含义〕〔时效〕"
    - title: "交叉验证与碎片信息解读"
      subtitle: "给出置信度参考，并解读出关键结论"
      rows:
        - {k: "交叉验证", v: "现场信息 × 业务数据交叉比对，给出置信度（A 可交叉验证 / B 来源单一 / C 感知推测）并标注信息差（领先 / 同步 / 滞后）。"}
        - {k: "碎片解读", v: "把照片、原话、现场观察解读成关键结论：风险 / 增长空间 / 增长机会方向。"}
      output: "结论清单（风险 / 增长空间 / 机会方向）+ 待验证点"
    - title: "机会识别"
      subtitle: "由信息与数据推导主因，给出可判断的机会清单"
      rows:
        - {k: "怎么做", v: "由结构化信息 + 业绩异常推导原因假设（附证据链）→ 结合主因推测增长机会 → 生成机会清单（对象 / 产品 / 方式 / 预期指标），一次给 5–6 条。"}
      output: "原因假设（附证据链）+ 机会清单（对象 / 产品 / 方式 / 预期指标）"
  pilot:
    business:
      - "两条业务线，共 6 个典型区域（名单待定）。"
      - "共用同一套采集 / 校验 / 解读能力，不按部门各做一套。"
    rationale:
      - "覆盖不同市场成熟度（成熟与成长兼顾）。"
      - "数据基础与系统条件较好，便于交叉验证。"
      - "团队配合度高，能先跑出可复用样本。"

roadmap:
  - phase: "阶段一"
    tag: "MVP · 本轮"
    title: "信息采集与解读"
    rows:
      - {k: "范围", v: "一期 MVP：重点关注对象识别、现场信息采集与处理、交叉验证与解读、机会识别。"}
      - {k: "能力", v: "指标展示与风险分析、对象识别；政策监控、现场采集、资料结构化；影像与沟通解读、交叉核验、置信度定级；原因假设与机会生成。"}
      - {k: "数据集成", v: "打通业务系统（流向 / 覆盖 / 库存）、采集记录、协议与名单。"}
      - {k: "知识库", v: "把产品资料、活动日历解析入库，形成可被 AI 消费的知识。"}
      - {k: "覆盖", v: "2 条业务线，6 个区域试点。"}
      - {k: "交付", v: "多源无感采集 + 标准问题引导；信息库；解读结论；原因假设与机会清单。"}
      - {k: "衡量", v: "有效信息数量、活跃用户数。", hl: true}
  - phase: "阶段二"
    tag: "扩展 · 推广"
    title: "信息与策略方案更丰富"
    rows:
      - {k: "范围", v: "补齐其余 AI 能力，并把采集、知识处理与解读做丰富。"}
      - {k: "能力", v: "新增策略方案生成、合规校验、执行跟踪与调整建议；历史总结解析形成打法案例库。"}
      - {k: "数据集成", v: "扩展数据源，统一口径与客户关系，完成多源融合。"}
      - {k: "知识库", v: "把周报、活动总结、优秀案例结构化入库，与信息库联动。"}
      - {k: "覆盖", v: "推广到 50–60% 的用户落地使用。"}
      - {k: "交付", v: "全流程 AI 能力齐备；机会清单结构化；策略方案 + 合规校验。"}
      - {k: "衡量", v: "有效信息数量、机会与策略采纳数、活跃用户覆盖。", hl: true}
  - phase: "阶段三"
    tag: "全流程闭环"
    title: "闭环 + 更丰富的 Agent 能力"
    rows:
      - {k: "范围", v: "全流程 AI 能力稳定运行并持续深化，能力延伸至算账与谈判。"}
      - {k: "能力", v: "全流程能力深化；新增算账、谈判装备、谈判模拟。"}
      - {k: "数据集成", v: "全链路数据打通，支撑闭环与实时预警。"}
      - {k: "知识库", v: "知识飞轮运转：案例与规则回流、人工确认后生效、跨线复用。"}
      - {k: "覆盖", v: "多条业务线共用一套能力。"}
      - {k: "交付", v: "复盘与目标、执行动态反馈、调整建议、知识回流。"}
      - {k: "衡量", v: "机会与策略采纳数、活跃用户覆盖。", hl: true}

confirm:
  - item: "一期范围确认"
    impact: "决定本轮开发与试点投入的边界；不确定则无法排期。"
    owner: "客户项目负责人 + 业务线负责人"
  - item: "试点业务线与区域名单"
    impact: "影响试点样本与推广节奏。"
    owner: "客户业务负责人"
  - item: "合规与数据边界"
    impact: "决定哪些信息可采、可记、可用；越界将带来合规风险。"
    owner: "客户合规 / 法务"
  - item: "数据与系统权限"
    impact: "交叉核验依赖业务系统数据打通；权限不到位则解读能力受限。"
    owner: "客户 IT / 数据负责人"
  - item: "一期衡量指标与目标值"
    impact: "决定上线门禁与验收口径。"
    owner: "客户项目负责人"
