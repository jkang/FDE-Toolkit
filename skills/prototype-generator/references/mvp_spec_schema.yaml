      - { code: "SEN-006", name: "接近开关 M18 PNP", category: "传感器", spec: "M18 / 常开", unit: "只", safeStock: 60, standardPrice: 130.00, primarySupplierCode: "SUP-1006" }
      - { code: "FST-007", name: "内六角螺栓 M8×40", category: "标准件", spec: "8.8 级 / 镀锌", unit: "只", safeStock: 8000, standardPrice: 0.46, primarySupplierCode: "SUP-1007" }
