      - { code: "PO-2024-0812-004", supplierCode: "SUP-1004", supplier: "精工铸造（常州）", materialCode: "CST-004", material: "电机端盖 HT250", qty: 60, unit: "件", amountExTax: 28800.00, dueDate: "2024-08-15", buyer: "李强", status: "延期风险", note: "供应商产能不足，预计晚 3 天" }
