      - { key: "supplierCode", title: "供应商编码", type: "string" }
      - { key: "supplier", title: "供应商名称", type: "string" }
      - { key: "materialCode", title: "物料编码", type: "string" }
      - { key: "material", title: "物料名称", type: "string" }
      - { key: "qty", title: "数量", type: "number" }
      - { key: "unit", title: "单位", type: "string" }
      - { key: "amountExTax", title: "不含税金额(¥)", type: "number" }
      - { key: "dueDate", title: "约定交期", type: "string" }
      - { key: "buyer", title: "采购负责人", type: "string" }
      - { key: "status", title: "订单状态", type: "string" }
