# =============================================================
# MVP 设计规格 (mvp_spec) 数据契约 · 标准示例
# 由 LLM 从「AI Canvas YAML + To-be Journey YAML」推导产出
# 编译（按 frontend）：react/vue → scaffold_mvp.py 编译 mvp-prototype/ 工程；html → build_html_prototype.py 渲染单文件 HTML
# =============================================================
meta:
  projectName: "intelligent-procurement"      # 包名/目录名（小写连字符）
  productName: "智能采购助手"                  # 产品中文名
  businessDomain: "供应链采购"                 # 业务域（用于自动主题推导）
  frontend: "react"                           # react | vue | html（用户输入，必填）
  designSystem: "antd"                        # antd(react) | arco(vue) | html(占位)
  theme:
    source: "auto"                            # auto=按业务域推导 | user=用户提供
    primary: "#0958d9"                        # 主色
    accent: "#faad14"                         # 强调色
    layout: "side"                            # side=侧边栏 | top=顶栏
  ports:
    dev: 5173                                 # Vite 开发端口
    api: 8080                                 # Express API 端口（生产单端口同此）

# ---- 角色（承接 To-be Journey personas，前端角色切换器用） ----
personas:
  - id: "buyer_zhang"
    name: "张敏"
    role: "采购专员"
    department: "采购部"
    goals:
      - "快速完成需求识别与供应商寻源"
      - "避免物料漏采或交期延误"

# ---- 典型场景（承接 To-be Journey scenarios，场景导航用） ----
scenarios:
  - id: "s1"
    name: "紧急缺料采购"
    personaId: "buyer_zhang"
    trigger: "产线报缺料，需求方要求当天确认供应商并下单"
    goal: "10 分钟内完成需求识别 + 供应商初选 + 订单草稿生成"

# ---- 核心数据模型 + 真实 Mock 数据（承接 userInputs / visibleData） ----
# 铁律（见 mvp_prompts.md 第二节）：主数据先行、核心对象字段 ≥8、mockData ≥8 条且覆盖异常/边界、跨对象关联键一致
dataModels:
  - name: "Supplier"
    description: "供应商主数据（主数据先行，供采购订单/寻源复用）"
    fields:
      - { key: "code", title: "供应商编码", type: "string" }
      - { key: "name", title: "供应商名称", type: "string" }
      - { key: "category", title: "供应类别", type: "string" }
      - { key: "region", title: "所在地区", type: "string" }
      - { key: "creditTerm", title: "账期", type: "string" }
      - { key: "rating", title: "绩效评级", type: "string" }
      - { key: "contact", title: "对接人", type: "string" }
      - { key: "status", title: "合作状态", type: "string" }
    mockData:
      - { code: "SUP-1001", name: "泰科机电（苏州）", category: "电机 / 传动", region: "江苏苏州", creditTerm: "月结 60 天", rating: "A", contact: "陈立", status: "合作中" }
      - { code: "SUP-1002", name: "华宇传动（宁波）", category: "轴承 / 传动", region: "浙江宁波", creditTerm: "月结 45 天", rating: "B", contact: "周敏", status: "合作中" }
      - { code: "SUP-1003", name: "密封圈科技（东莞）", category: "密封件", region: "广东东莞", creditTerm: "月结 30 天", rating: "A", contact: "刘伟", status: "合作中" }
      - { code: "SUP-1004", name: "精工铸造（常州）", category: "铸件", region: "江苏常州", creditTerm: "月结 60 天", rating: "C", contact: "赵磊", status: "观察期" }
      - { code: "SUP-1005", name: "恒信线缆（无锡）", category: "线缆", region: "江苏无锡", creditTerm: "月结 45 天", rating: "B", contact: "孙浩", status: "合作中" }
      - { code: "SUP-1006", name: "锐驰电子（深圳）", category: "电控 / 传感器", region: "广东深圳", creditTerm: "月结 30 天", rating: "A", contact: "吴迪", status: "合作中" }
      - { code: "SUP-1007", name: "宏达五金（佛山）", category: "标准件", region: "广东佛山", creditTerm: "现结", rating: "C", contact: "黄婷", status: "暂停合作" }
