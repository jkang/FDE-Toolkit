# ---- 页面设计（承接 touchpoints / handoff.pages，元素见 mvp_prompts.md） ----
pages:
  - id: "upload"
    title: "上传采购申请单"
    route: "/upload"
    icon: "UploadOutlined"
    description: "上传缺料申请单，AI 自动识别并校验完整性"
    actions:
      - { name: "parseRequest", button: "识别并校验申请单" }
    sections:
      - type: "steps"
        current: 0
        items: ["上传申请单", "AI 识别校验", "供应商推荐", "订单审批", "下单同步"]
      - type: "uploadCard"
        title: "采购申请单"
        accept: ".xlsx,.csv"
        hint: "支持 Excel/CSV，自动识别物料编码、数量、期望交期（示例：PR-2024-0812.xlsx）"
        action: "parseRequest"
      - type: "formCard"
        title: "申请单头信息（自动带出，可修改）"
        action: "parseRequest"
        fields:
          - { key: "applicant", label: "申请人", type: "text", value: "张敏（生产计划）" }
          - { key: "department", label: "需求部门", type: "text", value: "制造部 · 装配一车间" }
          - { key: "costCenter", label: "成本中心", type: "text", value: "CC-3021（制造费用）" }
          - { key: "needBy", label: "需求日期", type: "date", value: "2024-08-17" }
          - { key: "currency", label: "币种", type: "select", value: "CNY", options: ["CNY", "USD"] }
          - { key: "taxRate", label: "税率", type: "select", value: "13%", options: ["13%", "9%", "6%"] }
      - type: "aiResultCard"
        title: "AI 识别结果"
        bind: "parseRequest"
        render: "table"
        columns:
          - { key: "code", title: "物料编码" }
          - { key: "name", title: "物料名称" }
          - { key: "qty", title: "需求数量" }
          - { key: "dueDate", title: "期望交期" }
          - { key: "status", title: "校验状态", tag: { "通过": "success", "缺失": "warning", "异常": "error" } }
      - type: "buttonRow"
        buttons:
          - { text: "确认并进入供应商推荐", type: "primary", action: "navigate:/recommend" }

# ---- Mock AI 服务接口（server/services/aiService.js 生成依据） ----
# 列表型 response 至少 5 条，字段与页面 columns 对齐，状态取值必须命中 tag 映射
aiMocks:
  - name: "parseRequest"                      # aiService 方法名
    latency: 700                              # 模拟 AI 处理延迟 ms
    response:
      summary: "已识别 6 条物料：4 项通过、1 项数量缺失、1 项交期异常（早于最早可交期）"
      items:
        - { code: "MTR-001", name: "三相异步电机 YE3-132S", qty: 12, dueDate: "2024-08-17", status: "通过" }
        - { code: "BRG-002", name: "深沟球轴承 6205-2RS", qty: 500, dueDate: "2024-08-21", status: "通过" }
        - { code: "SEL-003", name: "O 型密封圈 NBR 70A", qty: 5000, dueDate: "2024-08-24", status: "通过" }
        - { code: "CBL-005", name: "屏蔽电缆 RVVP 4×1.0", qty: 2000, dueDate: "2024-08-19", status: "通过" }
        - { code: "SEN-006", name: "接近开关 M18 PNP", qty: 120, dueDate: "2024-08-22", status: "缺失" }
        - { code: "CST-004", name: "电机端盖 HT250", qty: 60, dueDate: "2024-08-10", status: "异常" }

# ---- Mock 业务系统接口（server/services/businessMock.js 生成依据） ----
businessMocks:
  - name: "getInventory"                      # businessMock 方法名
    system: "erp"
    latency: 200
    response:
      items:
        - { code: "MTR-001", name: "三相异步电机 YE3-132S", warehouse: "原料库 A", stock: 6, safeStock: 20, onOrder: 12, status: "低于安全库存" }
        - { code: "BRG-002", name: "深沟球轴承 6205-2RS", warehouse: "备件库", stock: 820, safeStock: 500, onOrder: 500, status: "正常" }
        - { code: "SEL-003", name: "O 型密封圈 NBR 70A", warehouse: "原料库 B", stock: 3200, safeStock: 3000, onOrder: 5000, status: "正常" }
        - { code: "CST-004", name: "电机端盖 HT250", warehouse: "半成品库", stock: 18, safeStock: 40, onOrder: 60, status: "低于安全库存" }
        - { code: "CBL-005", name: "屏蔽电缆 RVVP 4×1.0", warehouse: "原料库 A", stock: 150, safeStock: 800, onOrder: 2000, status: "低于安全库存" }
        - { code: "SEN-006", name: "接近开关 M18 PNP", warehouse: "备件库", stock: 95, safeStock: 60, onOrder: 120, status: "正常" }

# ---- API 网关路由（server/routes/api.js 与前端 client.js 生成依据） ----
apiRoutes:
  - name: "parseRequest"
    method: "POST"
    path: "/api/purchase/parse"
    target: "ai:parseRequest"
  - name: "getInventory"
    method: "GET"
    path: "/api/inventory"
    target: "business:getInventory"
  - name: "loadDashboard"
    method: "GET"
    path: "/api/dashboard"
    target: "compose"
    compose:
      - { key: "inventory", service: "business", method: "getInventory" }
