    mockData:
      - { code: "PO-2024-0812-001", supplierCode: "SUP-1001", supplier: "泰科机电（苏州）", materialCode: "MTR-001", material: "三相异步电机 YE3-132S", qty: 12, unit: "台", amountExTax: 74400.00, dueDate: "2024-08-17", buyer: "张敏", status: "待供应商确认", note: "产线紧急件" }
