        ai_capability: "多模态时序分析 (Multimodal Time-Series), 联邦学习数据脱敏推理"
        automation_level: "high"
        inputs: ["穿戴设备心率变异性(HRV)", "办公设备屏幕驻留时间", "生活轨迹/外卖标签"]
