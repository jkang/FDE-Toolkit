        human_touchpoint: "全自动静默分析。人类完全无需感知此数据收集过程。"

      - name: "因果图谱驱动的动态检项生成"
        actor: "ai"
        action_description: "废除固定的 A/B/C 套餐。大模型基于个体的亚健康图谱，动态推演出唯一的检查路径。例如：常年熬夜且久坐者，自动砍掉常规肺活量测试，加入高精颈椎 MRI 与皮质醇压力荷尔蒙监测。"
        ai_capability: "因果推断网络 (Causal Inference), 高维特征组合推荐"
        automation_level: "high"
        inputs: ["高危亚健康特征图谱", "企业采购预算额度约束"]
