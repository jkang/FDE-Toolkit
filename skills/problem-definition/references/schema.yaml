# =============================================================================
# problem-definition · YAML 数据契约 (Schema / Source of Truth)
# 用途：把「一个聚焦痛点的根因」用 8 个结构化要素定义成一个「可取证、可量化、可归因」的业务问题。
# 本文件是「LLM 产物」与「HTML 编译器」之间的唯一契约。
# 完整实例见 examples/ 目录；此处展示 X电商订舱·在线订舱 代表行。
# =============================================================================

meta:
  title: "X电商订舱 · 在线订舱 — 业务问题定义"        # 主标题（页眉 H1）
  sectionNo: "3.3"
  version: "v1.0"
  date: "2026-09-03"
  business: "X（全球头部集装箱运输与物流一体化企业）"
  domain: "电商订舱业务（在线订舱门户 / 独立电商平台 / 移动App）"
  segment: "在线订舱（订舱请求受理与校验 · 人工审核兜底 / 订舱确认）"   # ★ 聚焦环节
  upstream:                                            # 上游定位（可选，供上下文）
    valueStream: "电商订舱履约主价值流"
    valueSegment: "在线订舱"
    sourceRef: "在线订舱现状泳道图（L3/L4）+ 客户一手话 + 根因分析（5-Why）"
  kpi: ["订舱确认时效", "SME 自助率", "AI 分流率", "电商订舱渗透率"]
  oneLiner: "在线订舱的受理与确认完全依赖「人工审核兜底 + Smart Push 预填」……”"   # ① 一句话（也作页顶 callout）

# ---- 8 要素 ----
# 每要素 = 一张编号卡；body 为可多行文本，用 \n 分段（HTML 以 pre-line 渲染）。
elements:
  - id: "E1"
    order: 1
    key: "① 一句话问题描述"
    body: "在线订舱的受理与确认完全依赖「人工审核兜底 + Smart Push 预填」和订舱运营人员经验，在「多环节 × 多规则 × 多系统」（费率 / 信用 / 航线可用性 / 船期计划）下无法达到分钟级确认，导致「新客首单慢、大量 SME 走人工审核、确认时效无法对标头部」，是订舱确认时效、SME 自助率、AI 分流率、电商订舱渗透率等关键指标恶化的根因。"
  - id: "E2"
    order: 2
    key: "② 业务角色和场景"
    body: "角色：SME 货主（在线自助订舱直客）、订舱运营 / CSR（受理审核兜底）、收益管理（舱位分配）、订舱系统 OMS。\n场景：每个订舱请求进来，从 3 步表单提交、系统受理校验、收益管理分配舱位，到签发 Booking Confirmation 并多通道告知。"
  - id: "E3"
    order: 3
    key: "③ 遇到的问题"
    body: "新客无历史数据 → Smart Push 预填失效，首单仍偏慢（约 30-60 分钟），资料不齐还需往返补件；\n大量 SME 请求走人工审核（SLA 条款外 / 异常单），确认时效无法对标「最快 1 分钟」；\n规则校验靠「系统 + 人工兜底」，规则边界依赖运营经验，人员流动即能力流失；\n改船 / 取消异常通知滞后，平台状态与船期计划存在时差。"
  - id: "E4"
    order: 4
    key: "④ 问题根因"
    # ★ 必须按根因类别分组列出（类别代码见文末「根因分类」）
    body: "根因不在系统集成（多系统对接已在推进），按类别归为两类：\n【知识与规则缺失】系统自动校验规则覆盖不全——费率 / 信用 / 航线 / 船期的校验口径与边界未沉淀为可执行规则，异常判定无分级标准；\n【高度依赖专家经验】规则边界与异常处置依赖运营经验，人员流动即能力流失，新人上手慢、处置质量随人而异。"
  - id: "E5"
    order: 5
    key: "⑤ 发生频度"
    # ★ 必须量化：频次 × 基数 × 年化量级
    body: "每个订舱请求发生一次，全年持续反复。按 2025 年电商渠道承载约 200 万 TEU、AI 互动 150 万+ 次计，SME 直客占比约 40%[推断] → 约 80 万 TEU/年走在线订舱受理；其中走人工审核约 30%[推断] → 约 24 万单/年。\n[估算口径：200 万 TEU 为访谈值；SME 占比与人工审核占比为领域专家假设值 · 待访谈回填]"
  - id: "E6"
    order: 6
    key: "⑥ 影响范围"
    body: "覆盖独立电商平台 / 官网订舱门户 / 移动App 全渠道的 SME 直客与货代操作员；横跨 SME 货主、订舱运营 / CSR、收益管理、订舱系统等多角色协作链路。"
  - id: "E7"
    order: 7
    key: "⑦ 每次发生对业务的影响"
    # ★ 必须量化：单次工时/成本/损失（带单位）+ 估算口径
    body: "单次 SME 首次订舱约 30-60 分钟（含补件往返）；走人工审核的单均约 1-2 小时人工工时 [推断]；单次超时导致的转化流失按首单货值 3-5 万元 × 流失率 5%-10% ≈ 0.15-0.5 万元/单 [推断]。\n[估算口径：时长为访谈值；首单货值与流失率为领域专家假设值 · 待访谈回填]"
  - id: "E8"
    order: 8
    key: "⑧ 累计对业务影响"
    # ★ 必须量化：年化总量 + 金额区间 + KPI 承压
    body: "人工成本：约 24 万单/年 × 1-2 小时 × 50-80 元/人时 ≈ 1,200-3,840 万元/年 [推断]；转化损失：SME 首单按 0.15-0.5 万元/单 [推断]。对应「电商订舱渗透率、订舱确认时效、AI 分流率、SME 自助率」全部承压——渗透率（25%[推断]→40%）受阻、确认时效无法向 ≤2h 收敛、AI 分流率未达 30%+。作为电商订舱高增长曲线的枢纽环节，问题持续存在将直接侵蚀数字化渗透与客户体验。\n[估算口径：单量与占比同 ⑤；人工单价与流失率为领域专家假设值 · 待访谈回填]"

# ---- 末段小结区（痛点 → 根因 → 问题）----
summary:
  painPoint: "人工审核兜底 + 规则覆盖不全"
  rootCause: "多系统联动下系统自动校验覆盖不全 → 大量请求回退人工"
  problem: "订舱确认时效无法对标分钟级 / 自助率与分流率不达标"

# =============================================================================
# 根因分类（Root Cause Taxonomy · 强制）
# 5 Why 逐层下钻，末层（结构性根因）必须落到以下 5 类之一；
# ④ 问题根因必须「按类别分组列出」，禁止写成一段笼统描述。
# =============================================================================
# RC-PROC   流程机制缺失      缺规范流程、职责分工、执行频次、上报路径、考核与激励机制
# RC-KNOW   知识与规则缺失    判断依据、分类分级标准、规则、阈值、口径未定义或未沉淀
# RC-DATA   数据分散/口径不一  数据分散在多系统、多来源，口径不一，未统一汇聚
# RC-MANUAL 纯人工、高耗时     无工具/自动化支撑，靠人工重复操作
# RC-EXPERT 高度依赖专家经验   判断/决策依赖个人经验，不可复制、不可传承
#
# 铁律：
#   1) 每个根因簇标注一个主类别 category（上表代码），必要时补 categoryNote；
#   2) 5 Why 末层（root: true）必须命中某一类，命中不了说明还没挖到底；
#   3) 禁止把「系统集成/数据打通」直接当根因——集成已在推进时归入 RC-KNOW / RC-PROC 并具化；
#   4) 根因写到可执行粒度：缺什么、谁缺、缺到什么程度。

# ---- （可选）根因挖掘区块：承接 5-Why，供报告展示「痛点 → 根因 → 问题」----
rootCauseMining:
  painSummary: "表面痛点总述：现状泳道里该环节收敛出的痛点是……"
  clusters:
    - category: "RC-KNOW"                     # 主类别（上表代码，必填）
      categoryNote: "兼 RC-EXPERT"            # 副类别（可选）
      title: "根因簇 ① ·【知识与规则缺失】系统校验规则覆盖不全"
      painPoints: ["大量请求走人工审核", "异常处置无分级标准"]
      whyChain:
        - { level: "Why 1", q: "……", a: "……" }
        - { level: "Why 2", q: "……", a: "……" }
        - { level: "Why 3", q: "……", a: "……" }
        - { level: "Why 4", q: "……", a: "……" }
        - { level: "Why 5", q: "……", a: "……", root: true }   # 末层必须命中根因分类
      conclusion: "结构性根因（知识与规则缺失）：校验口径与边界未沉淀为可执行规则，异常判定无分级标准。"
