# =============================================================================
# problem-definition · YAML 数据契约 (Schema / Source of Truth)
# 用途：把「一个聚焦痛点的根因」用 8 个结构化要素定义成一个「可取证、可量化、可归因」的业务问题。
# 本文件是「LLM 产物」与「HTML 编译器」之间的唯一契约。
# 完整实例见 examples/ 目录；此处展示 X电商订舱·在线订舱 代表行。
# =============================================================================

meta:
  title: "X电商订舱 · 在线订舱 — 业务问题定义"        # 主标题（页眉 H1）
  sectionNo: "3.3"
  version: "v1.0"
  date: "2026-09-03"
  business: "X（全球头部集装箱运输与物流一体化企业）"
  domain: "电商订舱业务（在线订舱门户 / 独立电商平台 / 移动App）"
  segment: "在线订舱（订舱请求受理与校验 · 人工审核兜底 / 订舱确认）"   # ★ 聚焦环节
  upstream:                                            # 上游定位（可选，供上下文）
    valueStream: "电商订舱履约主价值流"
    valueSegment: "在线订舱"
    sourceRef: "在线订舱现状泳道图（L3/L4）+ 客户一手话 + 根因分析（5-Why）"
  kpi: ["订舱确认时效", "SME 自助率", "AI 分流率", "电商订舱渗透率"]
  oneLiner: "在线订舱的受理与确认完全依赖「人工审核兜底 + Smart Push 预填」……”"   # ① 一句话（也作页顶 callout）

# ---- 8 要素 ----
# 每要素 = 一张编号卡；body 为可多行文本，用 \n 分段（HTML 以 pre-line 渲染）。
elements:
  - id: "E1"
    order: 1
    key: "① 一句话问题描述"
    body: "在线订舱的受理与确认完全依赖「人工审核兜底 + Smart Push 预填」和订舱运营人员经验，在「多环节 × 多规则 × 多系统」（费率 / 信用 / 航线可用性 / 船期计划）下无法达到分钟级确认，导致「新客首单慢、大量 SME 走人工审核、确认时效无法对标头部」，是订舱确认时效、SME 自助率、AI 分流率、电商订舱渗透率等关键指标恶化的根因。"
  - id: "E2"
    order: 2
    key: "② 业务角色和场景"
    body: "角色：SME 货主（在线自助订舱直客）、订舱运营 / CSR（受理审核兜底）、收益管理（舱位分配）、订舱系统 OMS。\n场景：每个订舱请求进来，从 3 步表单提交、系统受理校验、收益管理分配舱位，到签发 Booking Confirmation 并多通道告知。"
  - id: "E3"
    order: 3
    key: "③ 遇到的问题"
    body: "新客无历史数据 → Smart Push 预填失效，首单仍偏慢（约 30-60 分钟），资料不齐还需往返补件；\n大量 SME 请求走人工审核（SLA 条款外 / 异常单），确认时效无法对标「最快 1 分钟」；\n规则校验靠「系统 + 人工兜底」，规则边界依赖运营经验，人员流动即能力流失；\n改船 / 取消异常通知滞后，平台状态与船期计划存在时差。"
  - id: "E4"
    order: 4
    key: "④ 问题根因"
    body: "根因在于「人工经验 + 系统规则覆盖不全」的模式无法应对「高并发 × 复杂校验 × 多系统联动」的挑战：订舱执行需同时实时校验费率 / 信用 / 航线 / 船期等多重规则，系统自动校验规则覆盖不全，导致大量请求被迫回退人工审核，确认时效与自助率无法提升。"
  - id: "E5"
    order: 5
    key: "⑤ 发生频度"
    body: "每个订舱请求发生一次，高并发高频（2025 年电商渠道承载超 200 万 TEU、AI 互动 150 万+ 次），全年持续反复；按「单次耗时 × 请求量 × SME 占比」累计放大。"
  - id: "E6"
    order: 6
    key: "⑥ 影响范围"
    body: "覆盖独立电商平台 / 官网订舱门户 / 移动App 全渠道的 SME 直客与货代操作员；横跨 SME 货主、订舱运营 / CSR、收益管理、订舱系统等多角色协作链路。"
  - id: "E7"
    order: 7
    key: "⑦ 每次发生对业务的影响"
    body: "单次 SME 首次订舱约 30-60 分钟（含补件往返）；走人工审核的请求单均约 1-2 小时；确认时效无法对标分钟级 → 新客转化流失、客服人工成本高企、AI 分流率（目标 30%+）无法达成。"
  - id: "E8"
    order: 8
    key: "⑧ 累计对业务影响"
    body: "「电商订舱渗透率、订舱确认时效、AI 分流率、SME 自助率」全部承压——渗透率（25%[推断]→40%）受阻、确认时效无法向 ≤2h 收敛、AI 分流率未达 30%+、人工客服成本高。作为电商订舱高增长曲线的枢纽环节，问题持续存在将直接侵蚀数字化渗透与客户体验。"

# ---- 末段小结区（痛点 → 根因 → 问题）----
summary:
  painPoint: "人工审核兜底 + 规则覆盖不全"
  rootCause: "多系统联动下系统自动校验覆盖不全 → 大量请求回退人工"
  problem: "订舱确认时效无法对标分钟级 / 自助率与分流率不达标"
