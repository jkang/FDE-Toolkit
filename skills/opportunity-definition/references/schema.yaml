# =============================================================================
# opportunity-definition · YAML 数据契约 (Schema / Source of Truth)
# 用途：把「AI 机会场景地图」里聚焦的机会点，承接上游 problem-definition 的问题①根因，
#       用 5 要素（一句话/角色场景/痛点/方案假设/价值收益）+ 价值收益拆解表 做结构化定义。
# 本文件是「LLM 产物」与「HTML 编译器」之间的唯一契约。
# 完整实例见 examples/ 目录；此处展示 X电商订舱·在线订舱·一键订舱 代表行。
# =============================================================================

meta:
  title: "X电商订舱 · 机会点定义"
  sectionNo: "3.1"
  version: "v1.0"
  date: "2026-09-03"
  business: "X（全球头部集装箱运输与物流一体化企业）"
  domain: "电商订舱业务（在线订舱门户 / 独立电商平台 / 移动App）"
  scenario: "在线订舱 · 一键订舱"        # ★ 场景名（机会点所在场景）
  problemRef: "承接 3.1 问题①：在线订舱的受理与确认依赖人工审核兜底 + 规则覆盖不全，无法达到分钟级确认"
  opportunitySource: "AI 机会场景地图 · 阶段④ 审批与报价单签发 / 订舱确认"

# ---- 机会点列表 ----
opportunities:
  - id: "OP1"
    order: 1
    name: "智能订舱 Agent · 一键订舱"
    type: "innovation"                 # repetitive / cognitive / longtail / innovation
    rootCauseType: "复杂度高靠专家经验 + 操作量大靠人工"      # 从问题①根因链落下来的根因类型
    capabilityMatch: "Agent / 语言理解 / 知识问答"           # 能力匹配
    e1: "为 SME 货主与订舱运营构建「智能订舱 Agent · 一键订舱」，把 AI 客服从「问答」升级为「可执行订舱」：对话内完成报价解读、舱位推荐、表单自动预填与规则校验，标准单直达人工放行、分钟级签发确认，异常单自动补件指引。"
    e2: "角色：SME 货主（对话式一键订舱）、订舱运营 / CSR（放行兜底）。\n场景：每个订舱请求从对话提交到签发 Booking Confirmation，标准单分钟级、异常单智能补件，覆盖新客首单。"
    e3: "人工逐单校验与签发依赖运营经验，SLA 条款外 / 异常单全走人工（单均 1-2 小时）；新客无历史数据，表单手动录入 + 往返补件（首单约 30-60 分钟），确认时效无法对标「最快 1 分钟」。"
    e4: "用 Agent 编排确定性服务（报价 / 舱位 / 校验引擎），把「多规则 × 多系统联动」交给机器按统一口径执行；LLM 负责意图理解、长尾 / 非标判断与补件指引；「对外放行订舱」保留人工闸门、规则护栏兜底 → 把平均确认时效向 ≤2 小时（KPI 3）收敛。"
    e5: "标准单确认从人工 1-2 小时走向分钟级；新客首单往返补件压缩、自助率提升；人工审核量下降。"
    valueBreakdown:
      - dimension: "覆盖范围"
        aligns: "⑥ 影响范围"
        metric: "全渠道 SME 直客；受益角色：SME 货主 + 订舱运营 / CSR"
      - dimension: "发生频度"
        aligns: "⑤ 发生频度"
        metric: "每个订舱请求一次，高并发高频（2025 电商渠道 200 万+ TEU）"
      - dimension: "单次收益"
        aligns: "⑦ 每次发生对业务的影响"
        metric: "人工审核单均 1-2h → 分钟级；新客首单往返补件压缩、自助率提升"
      - dimension: "累计影响"
        aligns: "⑧ 累计对业务影响"
        metric: "确认时效 ≤2h 收敛；AI 分流率 30%+、渗透率 25%[推断]→40% 靠拢；客服人工成本下降"
