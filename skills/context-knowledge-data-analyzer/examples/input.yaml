title: "智能制造故障诊断助手 CKD 映射报告"
product: "Industrial AI Diagnosis Agent"
description: "通过对工业设备故障诊断工作流的梳理，明确从设备建模、异常检测到维修建议生成全链路所需的知识基座与实时数据依赖。"
steps:
  - step_name: "1. 全息画像构建"
    ckd_items:
      - context_name: "设备静态台账 (CMDB)"
        description: "设备的“身份证”，包含型号、固件版本、BOM 结构等基础信息。"
        type: "关系型数据"
        storage: "MySQL / 关系型数据库"
        volume: "50k+ 设备记录"
        ai_init: false
        frequency: "低频 (设备变更)"
        retrieval: "设备 ID 精确查询"
        status: "已支持"
      - context_name: "实时运行日志"
        description: "设备最近的遥测数据（电压、电流、温度）及系统日志，用于判断环境状态。"
        type: "时序数据"
        storage: "InfluxDB / 时序库"
        volume: "单台每日 MB 级"
        ai_init: false
        frequency: "极高频 (秒级)"
        retrieval: "时间窗口查询"
        status: "已支持"
  - step_name: "2. 智能诊断 (定义层)"
    ckd_items:
      - context_name: "故障代码映射表 (DTC)"
        description: "机器语言转自然语言的字典，定义 Hex 码对应的标准故障名称及等级。"
        type: "静态字典"
        storage: "Redis / 内存缓存"
        volume: "< 2,000 个故障码"
        ai_init: false
        frequency: "低频 (协议更新)"
        retrieval: "Key-Value 查询"
        status: "已支持"
      - context_name: "诊断决策树"
        description: "专家定义的排查逻辑流，用于引导 AI 进行逻辑推理而非盲目预测。"
        type: "图谱 / 规则链"
        storage: "JSON / 配置文件"
        volume: "< 200 个核心逻辑"
        ai_init: true
        frequency: "季度更新"
        retrieval: "逻辑路径匹配"
        status: "建设中"
  - step_name: "3. 方案生成 (执行层)"
    ckd_items:
      - context_name: "历史维修案例库"
        description: "非结构化的历史维修记录、专家笔记，用于通过相似度检索解决疑难杂症。"
        type: "向量嵌入"
        storage: "Milvus / 向量数据库"
        volume: "> 10,000 个案例"
        ai_init: true
        frequency: "月度沉淀"
        retrieval: "语义相似度检索"
        status: "建设中"
      - context_name: "标准作业指导书 (SOP)"
        description: "针对具体故障的原子化维修步骤、扭矩要求及安全警示。"
        type: "结构化文档"
        storage: "MongoDB / 文档库"
        volume: "< 500 个标准 SOP"
        ai_init: true
        frequency: "低频 (新机型)"
        retrieval: "标签匹配 + 关键词"
        status: "部分支持"
