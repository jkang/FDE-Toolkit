# 做法要点：
# ① 公司级「场景规划」区块按 价值流 → 现状流程 → 问题定义 → AI机会场景地图 → 优先级分析 → 里程碑计划 编排；
#    各场景的「现状流程」都在公司级区块（每个场景一项）。
# ② 机会点定义 / AI画布（AI 场景定义）不放在公司级区块，而是放到具体场景小节，作为该场景第一/第二项。
# ③ 场景小节内各产出**不要加**「挖知识 / 建本体 / 生智能 / 评测」前缀，直接给产出名。
# ④ AI机会场景地图 / 优先级矩阵是公司级全场景产物，只在公司级出现一次，避免「前后都有」。
