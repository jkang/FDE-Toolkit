title: 智能研发周报生成小助手
description: 解决程序员每周花费大量时间回忆梳理研发进展并撰写排版周报的痛点，一键基于代码库与项目管理工具生成优质周报。
userRoles:
  - 后端研发工程师
  - 前端开发工程师
userPains:
  - 每周写周报需要花1小时回忆做过的事
  - 经常遗漏解决过的小bug或沟通事项
  - 文笔不好，被Leader挑刺表达不够结构化
aiInput:
  - 指定周报的始末时间(默认本周)
  - 人工补充的一段额外高优关注事项(选填)
dataKnowledge:
  - Jira/飞书项目本周被认领并完结的Issue/Task
  - 该员工本周在Gitlab上的核心Commit记录摘要
# workflow = 改造后「完整的新人机流程」：每一步由谁执行（human 人 / agent Agent / hybrid 人机协同）
workflow:
  - actor: human
    action: 研发选择周报时间范围，并补充少量高优关注事项
  - actor: agent
    action: 拉取 Jira/飞书 与 Gitlab 本周数据，自动摘要核心进展与风险
  - actor: agent
    action: 生成「本周核心进展 / 问题与风险 / 下周计划」三段式初稿
  - actor: human
    action: 研发审阅润色，确认无重大遗漏后一键提交
  - actor: agent
    action: 排版渲染 Markdown 并按渠道定时推送
modelUsage:
  - 核心编排：Gpt-4o 或 Claude 3.5 Sonnet
  - 要求优秀的上下文归纳整理能力，防止代码流水账
aiOutput:
  - 按“本周核心进展”、“问题与风险”、“下周计划”三段式输出的Markdown文本
# systemIntegration = 工具调用/系统集成：写明要调用/集成的上下游系统，以及集成方向
systemIntegration:
  - system: Jira / 飞书项目
    direction: upstream
    purpose: 读取本周被认领并完结的 Issue / Task 作为数据输入
  - system: Gitlab / Github
    direction: upstream
    purpose: 拉取该员工本周 Commit 记录摘要作为数据输入
  - system: 飞书文档
    direction: downstream
    purpose: 自动创建周报文档并定时推送提醒卡片
productType:
  - IDE (VSCode/Cursor) 侧边栏小插件，点击直接输出
  - 飞书企业内部自建 Bot，每周五下午4点主动推送填写卡片
# businessGains = 业务收益：对齐「机会点定义」的非常量化业务指标，杜绝"体验更好"这类空泛表述
businessGains:
  - 周报撰写人均耗时由 60 分钟降至 5 分钟（降幅约 92%）
  - 重大产出 / 风险遗漏下降 90%，管理层信息触达更充分
  - 周报结构化达标率提升至 100%，每条均含下一步行动项
