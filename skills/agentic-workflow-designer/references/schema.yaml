title: "采购订单自动生成 · Agentic 工作流设计"

meta:
  mode: "agentic-workflow"
  source: "To-be旅程: X电商订舱-智能订舱Agent-To-be旅程.yaml"
  scenarioName: "采购订单自动生成"
  architecture: "Orchestrator-Worker 并行编排 + 人工审批门禁（HITL）"

scenarioKpis:
  - id: kpi1
    name: "订单处理时效"
    baseline: "2 天"
    target: "2 小时"
    metric: "端到端时长（缺料提出 → 订单下发）"
    linkedCapabilities: ["cap_01", "cap_02", "cap_03"]
  - id: kpi2
    name: "人工录入与审批工作量"
    baseline: "录入 30min/张 + 审批 1 天/张"
    target: "录入 2min/张 + 审批 2h/张"
    metric: "人工耗时"
    linkedCapabilities: ["cap_01", "cap_03"]
  - id: kpi3
    name: "采购异常拦截率"
    baseline: "异常漏检率高（依赖人工核对）"
    target: "价格/交期异常 100% 显性拦截"
    metric: "异常识别覆盖率"
    linkedCapabilities: ["cap_02", "cap_03"]

designPrinciples:
  - "LLM 只做判断与生成，事实性计算一律交给确定性工具/服务（净需求、评分、校验）"
  - "任何写操作（下单/下发/同步 ERP）必须人工审批放行，禁止静默通过"
  - "高亮段只标注 KPI 决定性路径，避免全图铺色失去重点"

capabilities:
  - id: "cap_01"
    name: "智能单据解析"
    journeyRef:
      stages: ["发起采购需求"]
      actions: ["上传缺料申请单"]
    type: "perception"
    trigger:
      userAction: "上传缺料申请单"
      inputData: "PR-2024-0812.xlsx（物料编码/需求数量/期望交期/紧急等级）"
      systemContext: "物料主数据 / 历史订单库"
    goal:
      output: "结构化需求单（3 条物料，含完整性校验状态）"
      kpiImpact: "录入耗时 30min→2min；字段漏填率 -90%"
      kpiRef: "kpi1"
    agenticDesign:
      pattern: "orchestrator-worker"
      agents:
        - name: "解析编排 Agent"
          role: "拆解与调度、结果聚合、校验门禁"
          model: "多模态 LLM（表格理解）"
          tools: ["表格结构解析", "主数据校验 API"]
          memory: "任务级上下文（当前单据）"
      whyPattern: "字段抽取与主数据校验无依赖可并行，编排者聚合子结果并做单点门禁"
      kpiLink: "并行校验把单张处理时延压至 2min；校验走确定性主数据服务，杜绝 LLM 幻觉产生错误物料编码"
    puml: |
      @startuml
      skinparam backgroundColor #FFFFFF
      skinparam shadowing false
      skinparam sequenceMessageAlign center

      skinparam maxMessageSize 220
      skinparam roundCorner 8

      actor "采购专员" as USER #E8F5E9
      participant "解析编排 Agent" as ORCH #DBEAFE
      participant "表格解析工具" as PARSER #F3E8FF
      participant "物料主数据服务" as MDS #F1F5F9

      autonumber

      == 触发：上传缺料申请单 ==
      USER -> ORCH : 上传缺料申请单\nPR-2024-0812.xlsx
      activate ORCH
      note right of ORCH
        plan ｜ ReAct 拆解子任务
        ①字段抽取  ②主数据校验（并行）
      end note

      == 关键路径：并行解析+校验（高亮） ==
      group 并行执行子任务 #DBEAFE
        ORCH -> PARSER : 调用表格解析\n(编码/数量/交期/紧急等级)
        activate PARSER
        PARSER --> ORCH : 返回 3 条物料记录
        deactivate PARSER
        ORCH -> MDS : 批量校验编码/完整性
        activate MDS
        MDS --> ORCH : 2 通过 / 1 缺失交期
        deactivate MDS
      end
      note over ORCH : 护栏 ｜ 未经验证编码禁止进入下游

      == 决策：交期缺失分支 ==
      alt 期望交期缺失 #FEF9C3
        ORCH -> USER : 追问补录（标黄提醒）
        USER --> ORCH : 补录交期
      else 字段完整 #ECFDF5
        ORCH -> USER : 输出结构化需求单\n(3 条物料 + 校验状态)
      end

      deactivate ORCH
      @enduml
    highlightLegend:
      - segment: "并行解析+校验段"
        highlight: "#DBEAFE"
        kpiReason: "时延关键路径——并行化直接支撑 kpi1/kpi2（录入 30min→2min）"
    guardrails:
      - "识别结果未经主数据校验不得进入下游"
      - "物料编码以主数据服务为准，LLM 不直接产出编码"
      - "字段缺失必须追问补录，禁止静默跳过"
    failure:
      - trigger: "表格解析失败（图片模糊/格式异常）"
        action: "自动重试 1 次 → 仍失败转人工上传标准模板"
        type: "retry/fallback"

  - id: "cap_02"
    name: "智能需求计算与选商"
    journeyRef:
      stages: ["智能需求计算与选商"]
      actions: ["确认 AI 推荐的最优供应商"]
    type: "reasoning"
    trigger:
      userAction: "确认 AI 推荐"
      inputData: "结构化需求单 + 生产计划 + 库存水位 + BOM 共用件映射"
      systemContext: "供应商池（近 90 天交付达成率）/ 历史成交价"
    goal:
      output: "Top 供应商推荐（附子分依据）+ 异常询价建议"
      kpiImpact: "选商耗时 2h→10min；价格异常 100% 前置识别"
      kpiRef: "kpi3"
    agenticDesign:
      pattern: "orchestrator-worker + guardrails-gated"
      agents:
        - name: "选商编排 Agent"
          role: "需求解析、调用计算与评分、结果组装"
          model: "LLM（指令理解与推荐解释）"
          tools: ["净需求计算引擎", "供应商评分服务"]
          memory: "场景级上下文（需求单 + 历史成交价）"
      whyPattern: "净需求计算与供应商评分均为确定性服务，编排者负责解释推荐理由；评分结果过价格异常门禁再出推荐"
      kpiLink: "评分结果必须附子分依据供人复核，异常(±8%)置顶拦截，直接支撑 kpi3 异常拦截率 100%"
    puml: |
      @startuml
      skinparam backgroundColor #FFFFFF
      skinparam shadowing false
      skinparam sequenceMessageAlign center

      skinparam maxMessageSize 220
      skinparam roundCorner 8

      actor "采购专员" as USER #E8F5E9
      participant "选商编排 Agent" as ORCH #DBEAFE
      participant "净需求计算引擎" as DEMAND #F3E8FF
      participant "供应商评分服务" as SCORE #F3E8FF
      participant "ERP/库存系统" as ERP #F1F5F9

      autonumber

      == 触发：确认 AI 推荐 ==
      ORCH -> ORCH : 接收结构化需求单
      note right of ORCH : plan ｜ 组装上下文\n(需求+库存+BOM+供应商池)

      == 关键路径：净需求计算 + 选商打分（高亮） ==
      group 智能计算与选商 #DBEAFE
        ORCH -> ERP : 读取库存水位/生产计划
        activate ERP
        ERP --> ORCH : 电机库存 320 < 安全库存 500
        deactivate ERP
        ORCH -> DEMAND : 净需求计算\n(BOM 共用件映射)
        activate DEMAND
        DEMAND --> ORCH : 电机需采 180 件等
        deactivate DEMAND
        ORCH -> SCORE : 供应商加权打分\n(价格/交期/履约率)
        activate SCORE
        SCORE --> ORCH : 泰科 92 分(¥18.5/5天)\n华宇 86 分(¥17.9/9天)
        deactivate SCORE
      end
      note over ORCH : 护栏 ｜ 推荐必须附子分依据\n价格偏离历史均价 ±8% 置顶异常

      == 决策：价格异常门禁 ==
      alt 价格异常(>±8%) #FEF9C3
        ORCH -> USER : 询价单建议\n(发备选供应商)
        USER --> ORCH : 确认生成询价单
      else 正常 #ECFDF5
        ORCH -> USER : 展示 Top3 推荐卡\n(子分可展开)
      end
      @enduml
    highlightLegend:
      - segment: "净需求计算+选商打分段"
        highlight: "#DBEAFE"
        kpiReason: "决策质量关键路径——确定性计算杜绝幻觉报价，支撑 kpi3 异常拦截"
    guardrails:
      - "供应商评分必须来自确定性评分服务，LLM 不得自行算分"
      - "价格偏离历史均价 ±8% 必须置顶异常，禁止隐藏"
    failure:
      - trigger: "供应商无历史成交记录"
        action: "展示行业均价兜底并标注置信度"
        type: "fallback"
      - trigger: "ERP 接口超时"
        action: "重试 2 次 → 失败转人工录入库存水位"
        type: "retry/fallback"

  - id: "cap_03"
    name: "订单生成·审批·下发"
    journeyRef:
      stages: ["订单生成与审批", "下单与状态同步"]
      actions: ["提交订单草稿进入审批", "确认下发订单至供应商"]
    type: "decision"
    trigger:
      userAction: "提交订单草稿"
      inputData: "推荐供应商 + 数量/交期/单价/付款条款"
      systemContext: "审批规则（金额权限/SLA）/ ERP 订单模板"
    goal:
      output: "已审批订单（电子签章）已下发 + ERP 状态同步"
      kpiImpact: "审批 1 天→2h；人工下单工作量 -70%；异常项 0 静默通过"
      kpiRef: "kpi1"
    agenticDesign:
      pattern: "pipeline + human-in-the-loop"
      agents:
        - name: "订单 Agent"
          role: "生成订单草稿、异常标注"
          model: "LLM（单据生成）"
          tools: ["订单模板渲染", "异常识别服务"]
          memory: "任务级上下文（订单草稿）"
        - name: "审批编排 Agent"
          role: "审批流调度、写操作门禁、下发同步"
          model: "规则引擎 + LLM 审批建议"
          tools: ["SRM/ERP 下发 API", "交期看板"]
          memory: "场景级上下文（审批单）"
      whyPattern: "从草稿生成到下发是同一完整输入输出流，中间 HITL 审批是门禁而非拆分点；线性管道 + 审批门禁最简洁可审计"
      kpiLink: "审批全自动预审 + 紧急单置顶，SLA 4h 内完成；写操作强制人工放行保住合规底线，支撑 kpi1/kpi2"
    puml: |
      @startuml
      skinparam backgroundColor #FFFFFF
      skinparam shadowing false
      skinparam sequenceMessageAlign center

      skinparam maxMessageSize 220
      skinparam roundCorner 8

      participant "订单 Agent" as ORDER #DBEAFE
      participant "异常识别服务" as ANOM #F3E8FF
      participant "审批编排 Agent" as APP #DBEAFE
      actor "采购经理" as MGR #E8F5E9
      participant "SRM/ERP 下发服务" as SYS #F1F5F9

      autonumber

      == 阶段一：订单生成与异常识别 ==
      ORDER -> ANOM : 生成订单草稿\n(数量/交期/单价/供应商)
      activate ANOM
      ANOM --> ORDER : 异常预警 1 项\n(密封圈价格超历史 12%)
      deactivate ANOM
      ORDER -> APP : 提交审批建议\n(一键通过/打回/转复核)

      == 关键路径：人工审批门禁（HITL 高亮） ==
      group 人工审批门禁 #FEF3C7
        APP -> MGR : 审批待办\n(紧急单置顶/SLA 4h)
        activate MGR
        MGR -> APP : 审批通过 / 打回
        deactivate MGR
      end
      note over APP : 护栏 ｜ 写操作必须人工放行\n异常项禁止静默通过

      == 决策：审批结果 ==
      alt 通过 #ECFDF5
        APP -> SYS : 下发电子订单+同步 ERP
        activate SYS
        SYS --> APP : 状态:待供应商确认/在途
        deactivate SYS
        APP -> MGR : 交期风险看板提醒
      else 打回 #FEF9C3
        APP -> ORDER : 回退修订并重新校验
        ORDER -> APP : 修订完成再提交审批
      end
      @enduml
    highlightLegend:
      - segment: "人工审批门禁段"
        highlight: "#FEF3C7"
        kpiReason: "合规/风险关键路径——写操作强制人工放行，异常 0 静默通过，支撑 kpi2/kpi3"
    guardrails:
      - "订单生成后必须过异常识别服务，异常项显性标注"
      - "任何下单/下发/同步写操作必须人工审批通过后执行"
      - "紧急单（P0）自动置顶审批队列，不被普通单挤占"
    failure:
      - trigger: "供应商确认超时"
        action: "自动推送催办 + 交期冲突预警看板"
        type: "escalate"
      - trigger: "ERP 同步失败"
        action: "重试 2 次 → 标记同步异常并通知 IT"
        type: "retry/escalate"
