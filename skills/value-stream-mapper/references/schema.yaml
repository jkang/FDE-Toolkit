# =============================================================================
# value-stream-mapper · YAML 数据契约 (Schema / Source of Truth)
# 用途：将「业务描述 + 原始 idea 需求」梳理为端到端价值流图，
#       结构为「价值流(条带) → 价值段(横向列) → 业务环节(列内竖排卡)」，
#       并据原始 idea 标注「聚焦范围」——每个价值段内相邻(连续)的聚焦业务环节
#       整体包成一个「聚焦框」(★ 标签 + 卡级优先级) —— 《03-业务价值流图.jpg》风格。
# 本文件是「LLM 产物」与「HTML 编译器」之间的唯一契约。
# 完整实例见 examples/ 目录；此处展示 X电商订舱·单条主价值流 代表行。
#
# ★★★ 业务纯净性（最高约束）★★★
# 本技能产出是「业务地图」，必须与解决方案解耦。除 meta.originalIdea（客户原话，仅作聚焦依据）外，
# 所有业务内容字段（insight/kpi/valueStreams.*/segments.*/links.*/definition/goal/reason）一律使用
# 纯业务语言，禁止出现：智能×× / 智慧×× / AI / 大模型 / Agent / 机器人 / "自动××"(表系统代劳) /
# 具体系统·产品·工具名（E-Spot、IQAX、PlumSmart、控制塔…）。
#
# ★★★ 命名结构（全图一致）★★★
# 价值段名与业务环节名统一采用「〔部门/岗位 ·〕业务对象(名词) + 业务动作(动词)」：
#   - links[].name 示例：`客服 · 订舱请求受理与校验`、`货主 · 运价查询与比价`、`单证 · 提单审核与签发`
#   - 岗位词典从业务描述抽取（货主/收货人、市场、销售、客服、单证、操作、运营…）并全图统一
# 规则详见 references/value_stream_prompts.md §2。
# =============================================================================

meta:
  title: "X电商订舱 · 价值流图"                # 主标题（页眉 H1）
  sectionNo: "2.1"                             # 章节编号
  version: "v1.0"
  date: "2026-09-03"
  business: "X（全球头部集装箱运输与物流一体化企业）"
  domain: "电商订舱业务（在线订舱门户 / 独立电商平台 / 移动端）"
  methodology: "理需求 · L1 价值流梳理（价值流 → 价值段 → 业务环节 → 聚焦范围）"
  originalIdea: "智能订舱 Agent（Ask Fin 升级为可执行订舱 Agent）"   # 客户原话，仅作聚焦依据
  insight: "电商订舱业务沿客户生命周期构成一条横向端到端主价值流：从客户品牌认知、注册会员申请等获客段，经询价报价、在线订舱与舱位确认、单证支付结算、履约交付，到增值服务与会员运营，横向串联成完整价值创造闭环。价值流相对稳定，与 SME 直客 / 签约货主等产品线正交；本次聚焦范围落在询价报价至增值服务与会员运营中原始 idea 拟改变的业务环节（★ 高亮），为下游 L2/L3 拆解与机会点挖掘提供边界。"
  sourceRef: "客户 Workshop · 一手话 · 深度研究推断"
  kpi: ["电商订舱渗透率", "订舱确认时效", "电子提单渗透率", "客户复购率"]   # 业务口径指标

legend:
  focusNote: "★ 聚焦范围 = 同一价值段内被原始 idea 直接改造的相邻业务环节（连续环节包成一个聚焦框，一组自动编号）"
  priorityNote: "P0 优先级最高（当前为推测，待客户量化确认）"
  clickNote: "🖱 可点开看详情"

# ---- 价值流（条带）----
valueStreams:
  # 关键：一个业务（尤其单客户生命周期的服务型业务）通常只有「一条横向主价值流」，
  # 价值段沿客户旅程横向串联；不要把某个价值段误拆成独立价值流（如「增值服务与会员运营」是价值段）。
  - id: VS1
    order: 1
    name: "电商订舱主价值流"                    # 价值流名（顶部概述条带标题）
    chain: "客户品牌认知与触达 → 客户注册与会员申请 → 询价与报价 → 在线订舱与舱位确认 → 单证与支付结算 → 履约与交付 → 增值服务与会员运营"   # 价值段横向串联小字
    segments:
      # ==== 价值段 = 横向列 ====
      # 非聚焦段示例（links[].name 均为「主体 · 对象+动作」业务语言）
      - id: VS1-S1
        order: 1
        name: "客户品牌认知与触达"               # 列头主标题
        chain: "市场 · 品牌内容与搜索投放 → 市场 · 展会活动策划与执行"   # 列头副标题（业务环节串联）
        links:                                  # ==== 业务环节 = 列内竖排卡 ====
          - id: VS1-S1-L1
            order: 1
            name: "市场 · 品牌内容与搜索投放"
            focus: false
            priority: ""
            detail:
              definition: "通过内容营销与搜索投放等线上渠道触达 SME 货主，传播透明运价与平台服务能力。"
              goal: "提升平台认知度与首访转化。"
              reason: "不聚焦理由：品牌触达属市场获客层，与原始 idea 无直接输入/输出关系。"
          - id: VS1-S1-L2
            order: 2
            name: "市场 · 展会活动策划与执行"
            focus: false
            priority: ""
            detail:
              definition: "通过行业展会、渠道合作等线下 + 线上触点完成品牌与能力曝光。"
              goal: "扩大目标客群覆盖与品牌声量。"
              reason: "不聚焦理由：属品牌市场活动，非本 idea 直接改造面。"

      # 聚焦段（★ 本段内连续聚焦的业务环节会整体包成一个「聚焦框」，一组一个全局递增编号；
      #        价值段本身不设 focus/priority，优先级只放在聚焦环节卡上）
      - id: VS1-S3
        order: 3
        name: "询价与报价"
        chain: "货主 · 运价查询与比价 → 销售 · 报价提供与锁价受理"
        links:
          - id: VS1-S3-L1
            order: 1
            name: "货主 · 运价查询与比价"
            focus: false
            priority: ""
            detail:
              definition: "货主查询即期与长约运价、进行多方案比价。"
              goal: "透明快速获得适用运价。"
              reason: "不聚焦理由：基础查询为既有能力，本次改造核心在其后的报价提供与锁价环节。"
          - id: VS1-S3-L2
            order: 2
            name: "销售 · 报价提供与锁价受理"
            focus: true
            priority: "P0"
            detail:
              definition: "销售基于货主询价提供多方案报价，受理并确认锁价申请与舱位条件。"
              goal: "缩短报价与锁价确认周期，形成稳定订舱依据。"
              reason: "聚焦理由：原始 idea 旨在重塑本段报价提供、比价与锁价等业务环节的处理方式与体验。"
