<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlantUML Premium Preview</title>
    <script src="https://cdn.jsdelivr.net/npm/plantuml-encoder@1.4.0/dist/plantuml-encoder.min.js"></script>
    <!-- Using a lightweight pan-zoom library for better UX -->
    <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
    <style>
        :root {
            --color-primary: #10213E;
            --color-accent: #5DB2E2;
            --color-secondary: #625D9C;
            --color-success: #00524C;
            --color-info: #6FB1C8;
            --color-warning: #F59E0B;
            --color-destructive: #EF4444;
            --color-background: #FFFFFF;
            --color-bg-alt: #F5F5F6;
            --color-foreground: #10213E;
            --color-text-muted: #64748B;
            --color-border: #E2E8F0;
            --shadow-sm: 0 2px 8px rgba(16, 33, 62, 0.08);
            --radius-md: 8px;
            --font-family: "MiSans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", "PingFang SC", Arial, sans-serif;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--color-bg-alt);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            color: var(--color-foreground);
        }
        .container {
            width: 90%;
            max-width: 1400px;
            background: var(--color-background);
            padding: 32px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--color-border);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        h1 { font-size: 24px; margin: 0; font-weight: 600; color: var(--color-primary); }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 4px;
            background: var(--color-bg-alt);
            color: var(--color-text-muted);
            font-size: 12px;
            font-weight: 600;
            border: 1px solid var(--color-border);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .controls {
            display: flex;
            gap: 12px;
        }
        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid var(--color-border);
            background: white;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            color: var(--color-foreground);
        }
        .btn:hover { background: var(--color-bg-alt); border-color: var(--color-primary); color: var(--color-primary); }
        .btn-primary {
            background: var(--color-primary);
            color: white;
            border: none;
        }
        .btn-primary:hover {
            opacity: 0.9;
            color: white;
        }
        .diagram-wrapper {
            margin: 24px 0;
            padding: 16px;
            background: #fff;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            overflow: hidden;
            display: flex;
            justify-content: center;
            height: 600px;
            position: relative;
        }
        #diagram-svg { width: 100%; height: 100%; }
        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 32px;
            margin-bottom: 12px;
        }
        .code-block {
            background: #10213E;
            color: #E2E8F0;
            padding: 24px;
            border-radius: var(--radius-md);
            font-family: "Fira Code", "Menlo", monospace;
            font-size: 14px;
            overflow-x: auto;
            white-space: pre;
            margin: 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .footer {
            margin-top: 32px;
            color: var(--color-text-muted);
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        
        .toast {
          position: fixed; bottom: 24px; right: 24px;
          background: var(--color-success); color: #fff;
          padding: 10px 20px; border-radius: 6px;
          font-size: 13px; font-weight: 600;
          display: none; z-index: 1000;
          box-shadow: var(--shadow-sm);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge" style="margin-bottom: 10px;">PlantUML Flow Generator Pro</div>
        <div class="header">
            <h1>流程图预览</h1>
            <div class="controls">
                <button class="btn" onclick="resetZoom()">重置缩放</button>
                <button class="btn btn-primary" onclick="downloadImage()">下载图片</button>
            </div>
        </div>
        
        <div class="diagram-wrapper" id="diagram-container">
            <div class="loading">正在渲染高级视图...</div>
        </div>

        <div class="code-header">
            <h3>PlantUML 源代码</h3>
            <button class="btn" onclick="copyCode()">复制代码</button>
        </div>
        <pre class="code-block" id="puml-code">{{PUML_CODE}}</pre>
    </div>
    <div class="footer">
        Generated by PlantUML Flow Generator Skill · AIFlow Core Logic
    </div>
    <div class="toast" id="toast">已成功复制 PUML 代码</div>
    
    <script type="application/x-puml" id="raw-puml">
{{ raw_puml }}
    </script>

    <script>
        let panZoomInstance = null;
        let currentUrl = '';

        window.onload = function() {
            const pumlCode = document.getElementById('raw-puml').textContent.trim();
            try {
                const encoded = plantumlEncoder.encode(pumlCode);
                currentUrl = 'https://www.plantuml.com/plantuml/svg/' + encoded;
                
                // Fetch SVG directly to enable pan-zoom
                fetch(currentUrl)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('PlantUML render request failed');
                        }
                        return response.text();
                    })
                    .then(svgData => {
                        const container = document.getElementById('diagram-container');
                        container.innerHTML = svgData;
                        const svgElement = container.querySelector('svg');
                        if (!svgElement) {
                            throw new Error('PlantUML SVG not found in response');
                        }
                        svgElement.id = 'diagram-svg';
                        
                        panZoomInstance = svgPanZoom('#diagram-svg', {
                            zoomEnabled: true,
                            controlIconsEnabled: true,
                            fit: true,
                            center: true
                        });
                    })
                    .catch(error => {
                        document.getElementById('diagram-container').innerHTML = '<div style="color: red;">渲染失败，请检查 PlantUML 示例或网络连接</div>';
                        console.error(error);
                    });
            } catch (e) {
                document.getElementById('diagram-container').innerHTML = '<div style="color: red;">渲染失败，请检查语法</div>';
                console.error(e);
            }
        };

        function resetZoom() {
            if (panZoomInstance) {
                panZoomInstance.reset();
                panZoomInstance.fit();
                panZoomInstance.center();
            }
        }

        function copyCode() {
            const puml = document.getElementById('raw-puml').textContent.trim();
            navigator.clipboard.writeText(puml).then(() => {
                const toast = document.getElementById('toast');
                toast.style.display = 'block';
                setTimeout(() => { toast.style.display = 'none'; }, 2500);
            });
        }

        function downloadImage() {
            // Open PNG version in new tab for easy saving
            const pngUrl = currentUrl.replace('/svg/', '/png/');
            window.open(pngUrl, '_blank');
        }
    </script>
</body>
</html>
