title: 智能研发周报生成小助手
description: 解决程序员每周花费大量时间回忆梳理研发进展并撰写排版周报的痛点，一键基于代码库与项目管理工具生成优质周报。
userRoles:
  - 后端研发工程师
  - 前端开发工程师
userPains:
  - 每周写周报需要花1小时回忆做过的事
  - 经常遗漏解决过的小bug或沟通事项
  - 文笔不好，被Leader挑刺表达不够结构化
aiInput:
  - 指定周报的始末时间(默认本周)
  - 人工补充的一段额外高优关注事项(选填)
dataKnowledge:
  - Jira/飞书项目本周被认领并完结的Issue/Task
  - 该员工本周在Gitlab上的核心Commit记录摘要
workflow:
  - 提取本周关联缺陷：自动按员工邮箱查Jira工单系统
  - 提交数据梳状分析：请求Gitlab接口抽取出对应时间段的Commit总结
  - 大语言模型深度融合：根据项目数据与代码总结结合进行重写润色
  - 周报结构化输出渲染及排版
modelUsage:
  - 核心编排：Gpt-4o 或 Claude 3.5 Sonnet
  - 要求优秀的上下文归纳整理能力，防止代码流水账
aiOutput:
  - 按“本周核心进展”、“问题与风险”、“下周计划”三段式输出的Markdown文本
tools:
  - Jira API 读取
  - Gitlab / Github API 读取
  - 飞书文档自动创建接⼝
productType:
  - IDE (VSCode/Cursor) 侧边栏小插件，点击直接输出
  - 飞书企业内部自建 Bot，每周五下午4点主动推送填写卡片
userGains:
  - 周报撰写耗时由原来约60分钟降至5分钟
  - 本身内容质量提升，遗漏重大产出的事件减少 90%
