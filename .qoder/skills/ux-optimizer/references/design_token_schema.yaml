# 产品级设计 Token 数据契约（Design Token Schema）
# UX-Optimizer 定制设计系统的数据契约与 antd/arco 映射规范。
# 用于生成 tokens.js（前端注入）与 ux-audit.yaml（结构化存档）。

# =========================================================
# 顶层结构（UX-Optimizer 产出 ux-audit.yaml 时的数据契约）
# =========================================================
meta:
  company: "<企业名>"
  scenario: "<场景名>"
  businessDomain: "<供应链|金融|医疗|零售|企服|教育|默认>"
  productName: "<产品名>"
  mode: "<Modern SaaS 工作台|金融数据看板|医疗引导式|消费感大屏>"
  brandSource: "<discovery 提取|用户提供|domain 推断>"

brandProfile:
  primaryTone: "<信任蓝|科技深蓝|奢华金|沉稳灰|活力橙|医疗青绿>"
  primaryColor: "#2563eb"
  userGroup: "<内部员工|客户|经销商|终端消费者>"
  seriousness: "<合规严苛|严谨流程|开放协同>"
  maturity: "<传统巨头|专业细分|新锐>"

designLanguage:
  # 1. 色彩系统
  colors:
    primary: "#2563eb"
    primaryDark: "#1d4ed8"
    primaryLight: "#93c5fd"
    accent: "#f97316"
    success: "#16a34a"
    warning: "#f59e0b"
    danger: "#ef4444"
    info: "#0ea5e9"
    neutral:
      text: "#1e293b"
      textSecondary: "#64748b"
      border: "#e2e8f0"
      bg: "#ffffff"
      bgAlt: "#f8fafc"
    gradient:
      from: "#1e3a5f"
      to: "#4A9FD8"

  # 2. 字体系统
  typography:
    fontFamily: "MiSans, Inter, -apple-system, 'Microsoft YaHei', sans-serif"
    h1: { size: 28, weight: "600", lineHeight: 1.2, spacing: "-0.02em" }
    h2: { size: 22, weight: "500", lineHeight: 1.3, spacing: "0" }
    h3: { size: 18, weight: "500", lineHeight: 1.4, spacing: "0" }
    body: { size: 14, weight: "400", lineHeight: 1.5, spacing: "0" }
    label: { size: 12, weight: "600", lineHeight: 1.2, spacing: "0.05em", uppercase: true }
    caption: { size: 12, weight: "300", lineHeight: 1.4, spacing: "0" }

  # 3. 间距 & 栅格（8pt 节奏）
  spacing:
    scale: [4, 8, 12, 16, 24, 32, 48]
    contentMaxWidth: 1440
    cardPadding: 24
    sectionGap: 24
    elementGap: 16

  # 4. 圆角 / 阴影 / 边框
  radius:
    sm: 6
    md: 8
    lg: 12
    pill: 999
  shadow:
    card: "0 2px 8px rgba(16, 33, 62, 0.08)"
    raised: "0 4px 16px rgba(16, 33, 62, 0.12)"
  border:
    color: "#e2e8f0"
    width: 1

  # 5. 组件设计语言（视觉基调）
  components:
    card: { radius: 8, shadow: "card", background: "#ffffff", border: true }
    button:
      radius: 6
      transition: "0.15s ease-out"
      hoverOpacity: 0.8
    table:
      density: "compact"
      rowHover: true
      headerBg: "#f8fafc"
    input:
      radius: 6
      focusOutline: "#5DB2E2"

  # 6. 状态体系
  states:
    hoverTime: "0.15s ease-out"
    focusOutline: "#5DB2E2"
    loadingType: "skeleton"
    emptyStyle: "icon + hint + cta"

  # 7. 布局模式
  layout:
    mode: "side"        # side | top | hero | guide
    siderWidth: 216
    headerHeight: 56

  # 8. 微交互 & 响应式
  motion:
    transition: "0.15s ease-out"
    enableSpring: false
  responsive:
    breakpoints: [375, 768, 1024, 1440]

componentSpecs:
  - element: "steps"
    v2:
      style: "progress accent"
      height: "compact"
  - element: "uploadCard"
    v2:
      style: "drag zone focus ring"
      hintIcon: true
  - element: "aiResultCard"
    v2:
      style: "AI insight panel"
      badge: "AI"
      loading: skeleton
  - element: "table"
    v2:
      rowsZebra: true
      headerSticky: true
      rowHover: true
  - element: "statRow"
    v2:
      style: "metric hero"
      accentPrefix: true
  - element: "buttonRow"
    v2:
      primaryFullBleed: true
      hoverLift: true
  - element: "alert"
    v2:
      showIcon: true
      bordered: true
  - element: "timeline"
    v2:
      style: "state tracker"
      dotStatus: true
  - element: "chatPanel"
    v2:
      style: "AI copilot"
      suggestionChips: true
      typingIndicator: true
  - element: "formCard"
    v2:
      style: "field group"
      labelAbove: true
  - element: "tagRow"
    v2:
      style: "status chips"
      pill: true

diffChecklist:
  - "自定义主色是否已注入 ConfigProvider + CSS 变量"
  - "字体系统是否覆盖全局 + 标题层级"
  - "间距是否统一为 8pt 体系"
  - "圆角/阴影是否按产品气质定制（非默认 antd）"
  - "11 类元素是否按 componentSpecs 升级"
  - "六态（hover/focus/empty/loading/error/disabled）是否完备"
  - "响应式断点 375/768/1024/1440 是否生效"
  - "cursor-pointer 是否加到所有可交互区"
