# 演示样例：张雪机车海外销售 · 售后理赔
# 示例：面向制造业出海 + 售后理赔场景的定制设计系统
meta:
  company: "张雪机车海外销售"
  scenario: "售后理赔"
  businessDomain: "供应链"
  productName: "张雪机车海外售后理赔助手"
  mode: "Modern SaaS 工作台"
  brandSource: "domain 推断"

brandProfile:
  primaryTone: "科技深蓝"
  primaryColor: "#1e3a5f"
  userGroup: "客户"
  seriousness: "严谨流程"
  maturity: "专业细分"

designLanguage:
  colors:
    primary: "#2563eb"
    primaryDark: "#1d4ed8"
    primaryLight: "#93c5fd"
    accent: "#f97316"
    success: "#16a34a"
    warning: "#f59e0b"
    danger: "#ef4444"
    info: "#0ea5e9"
    neutral:
      text: "#1e293b"
      textSecondary: "#64748b"
      border: "#e2e8f0"
      bg: "#ffffff"
      bgAlt: "#f8fafc"
    gradient:
      from: "#1e3a5f"
      to: "#4A9FD8"
  typography:
    fontFamily: "MiSans, Inter, -apple-system, 'Microsoft YaHei', sans-serif"
    h1: { size: 28, weight: "600", lineHeight: 1.2, spacing: "-0.02em" }
    h2: { size: 22, weight: "500", lineHeight: 1.3, spacing: "0" }
    h3: { size: 18, weight: "500", lineHeight: 1.4, spacing: "0" }
    body: { size: 14, weight: "400", lineHeight: 1.5, spacing: "0" }
    label: { size: 12, weight: "600", lineHeight: 1.2, spacing: "0.05em", uppercase: true }
    caption: { size: 12, weight: "300", lineHeight: 1.4, spacing: "0" }
  spacing:
    scale: [4, 8, 12, 16, 24, 32, 48]
    contentMaxWidth: 1440
    cardPadding: 24
    sectionGap: 24
    elementGap: 16
  radius:
    sm: 6
    md: 8
    lg: 12
    pill: 999
  shadow:
    card: "0 2px 8px rgba(16, 33, 62, 0.08)"
    raised: "0 4px 16px rgba(16, 33, 62, 0.12)"
  border:
    color: "#e2e8f0"
    width: 1
  components:
    card: { radius: 8, shadow: "card", background: "#ffffff", border: true }
    button: { radius: 6, transition: "0.15s ease-out", hoverOpacity: 0.8 }
    table: { density: "compact", rowHover: true, headerBg: "#f8fafc" }
    input: { radius: 6, focusOutline: "#5DB2E2" }
  states:
    hoverTime: "0.15s ease-out"
    focusOutline: "#5DB2E2"
    loadingType: "skeleton"
    emptyStyle: "icon + hint + cta"
  layout:
    mode: "side"
    siderWidth: 216
    headerHeight: 56
  motion:
    transition: "0.15s ease-out"
    enableSpring: false
  responsive:
    breakpoints: [375, 768, 1024, 1440]

componentSpecs:
  - { element: "steps", v2: { style: "progress accent" } }
  - { element: "uploadCard", v2: { style: "drag zone focus ring" } }
  - { element: "aiResultCard", v2: { style: "AI insight panel" } }
  - { element: "table", v2: { style: "rowsZebra headerSticky" } }
  - { element: "statRow", v2: { style: "metric hero" } }
  - { element: "buttonRow", v2: { style: "primaryFullBleed hoverLift" } }
  - { element: "alert", v2: { style: "showIcon bordered" } }
  - { element: "timeline", v2: { style: "state tracker" } }
  - { element: "chatPanel", v2: { style: "AI copilot" } }
  - { element: "formCard", v2: { style: "field group labelAbove" } }
  - { element: "tagRow", v2: { style: "status chips pill" } }

diffChecklist:
  - "自定义主色是否已注入 ConfigProvider + CSS 变量"
  - "字体系统是否覆盖全局 + 标题层级"
  - "间距是否统一为 8pt 体系"
  - "圆角/阴影是否按产品气质定制（非默认 antd）"
  - "11 类元素是否按 componentSpecs 升级"
  - "六态（hover/focus/empty/loading/error/disabled）是否完备"
  - "响应式断点 375/768/1024/1440 是否生效"
  - "cursor-pointer 是否加到所有可交互区"
