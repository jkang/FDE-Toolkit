title: "智能客服机器人 MVP 验证方案"
product_name: "Customer Support AI Agent"
go_no_go_statement: "当 准确率 ≥90%，FCR ≥70%，响应延迟 ≤1.5s，用户点赞率 ≥60% 时，允许灰度上线。"
target_metrics:
  - name: "一次解决率 (FCR)"
    dimension: "业务"
    logic: "无需人工介入即完成结单的会话 / 总会话"
    threshold: "≥70%"
    source: "工单系统"
  - name: "回复准确率"
    dimension: "模型"
    logic: "正确回复样本 / 总评估样本"
    threshold: "≥90%"
    source: "离线测试集"
  - name: "幻觉率"
    dimension: "模型"
    logic: "包含编造事实的回答 / 总回答"
    threshold: "≤5%"
    source: "自研评估脚本 (DeepEval)"
  - name: "P95 响应延迟"
    dimension: "系统"
    logic: "95% 请求的响应时间"
    threshold: "≤1.5s"
    source: "APM 监控"
  - name: "用户点赞率"
    dimension: "体验"
    logic: "点赞 (👍) / 总评价数"
    threshold: "≥60%"
    source: "前端埋点"
monitoring_plan:
  - name: "平均 Token 消耗"
    layer: "模型"
    logic: "单次请求消耗的 Input+Output Token"
    range: "500-800"
    alert: ">1200"
    meaning: "上下文注入过多或 Prompt 泄露风险"
  - name: "Top-3 检索命中率"
    layer: "检索"
    logic: "前 3 个片段包含正确答案的比例"
    range: "≥92%"
    alert: "<85%"
    meaning: "向量索引质量下降或分段策略失效"
  - name: "错误率 (Error Rate)"
    layer: "系统"
    logic: "HTTP 5xx 错误请求占比"
    range: "<0.1%"
    alert: ">1%"
    meaning: "后端服务崩溃或第三方模型 API 限流"
  - name: "人工转接分布"
    layer: "业务"
    logic: "不同意图转人工的比例分布"
    range: "平衡分布"
    alert: "单一意图转接 >50%"
    meaning: "特定领域知识库缺失或模型理解盲区"
test_set_strategy:
  golden_path: 50
  hard_cases: 30
  edge_cases: 20
