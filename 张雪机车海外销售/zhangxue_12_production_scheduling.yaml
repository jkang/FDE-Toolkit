title: AI柔性生产排程
description: AI根据全球订单分布、配件库存、产能约束，自动优化生产顺序和配置组合，最大化产能利用率。
userRoles:
  - 生产计划经理
  - 供应链协调员
  - 工厂厂长
  - 采购经理
userPains:
  - 全球订单需求多样，生产切换频繁，效率低
  - 配件库存不足时，生产线停工待料
  - 多约束条件下人工排程难以全局最优
  - 产能利用率波动大，成本高
aiInput:
  - 全球订单数据（车型/配置/数量/交付时间）
  - 配件库存状态（实时）
  - 产线产能数据（设备/人员/工时）
  - 物流约束（集装箱装载/发货时间）
dataKnowledge:
  - 全球订单数据库
  - 配件库存系统（BOM）
  - 产线产能数据（设备OEE/人员排班）
  - 物流约束与发货窗口
  - 历史排程数据与效果
workflow:
  - 订单需求聚合：按车型、配置、交付时间聚合需求
  - 配件可用性检查：校验BOM配件库存是否满足
  - 产能约束建模：建立产线产能与切换成本模型
  - 多目标优化排程：平衡交付时间、产能利用率、切换成本
  - 配件采购建议：预测短缺配件，生成采购建议
  - 排程动态调整：根据订单变动实时调整排程
modelUsage:
  - 强化学习排程：基于历史数据学习最优排程策略
  - 约束优化算法：多约束条件下的全局最优解
  - 供应链协同预测：配件需求预测与库存优化
  - 时间序列预测：订单波动趋势预测
aiOutput:
  - 最优生产排程（日/周/月）
  - 配件采购建议（紧急/常规）
  - 产能利用率报告（实时）
  - 交付风险预警（延期订单）
  - 排程调整建议（订单变更时）
tools:
  - ERP系统（SAP/Oracle）
  - MES制造执行系统
  - 库存管理系统（WMS）
  - 供应链协同平台
  - 生产排程优化软件
productType:
  - AI智能排程系统（嵌入ERP）
  - 产能利用率仪表盘
  - 交付风险预警模块
userGains:
  - 产能利用率提升15%
  - 生产线切换次数减少30%
  - 配件缺货停工时间减少70%
  - 订单交付准时率提升25%
  - 生产计划制定时间从3天缩短至2小时
