title: "张雪机车 · 赛事内容工厂 CKD 映射报告"
product: "赛事内容工厂（AI 内容生产工作台 / Web 端 + 发布自动化插件）"
description: "梳理 WSBK 赛事内容从素材接入、多模态理解、高光识别、多语言脚本、自动剪辑配音、平台适配到审核发布与效果回流全链路所需的上下文（Context）、知识（Knowledge）与数据（Data）资产，为 RAG、提示词工程与 Agent 编排提供可落地资产清单。"
steps:
  - step_name: "1. 素材接入与多模态理解"
    ckd_items:
      - context_name: "本次赛事任务上下文"
        description: "本次生成的入口参数：目标市场、目标语言（默认 6 语言）、目标平台、品牌调性、内容红线，作为全流程约束。"
        type: "会话上下文"
        storage: "应用会话内存 / 任务队列"
        volume: "单任务 KB 级"
        ai_init: false
        frequency: "随任务创建"
        retrieval: "任务 ID 精确读取"
        status: "待规划"
      - context_name: "WSBK 原始赛事素材"
        description: "赛事运营负责人上传的原始视频/音频/赛事数据，是多模态理解与高光识别的唯一素材来源。"
        type: "非结构化多媒体"
        storage: "对象存储 / CDN 源站"
        volume: "单站数十 GB 级 [待确认]"
        ai_init: false
        frequency: "随分站赛程（高频）"
        retrieval: "对象存储 Key 检索"
        status: "待规划"
      - context_name: "WSBK 赛事数据库"
        description: "车手信息、分站成绩、历史对战等结构化数据，用于把画面事件关联到可叙述的赛事事实。"
        type: "结构化数据"
        storage: "关系型数据库 / 赛事数据 API"
        volume: "车手/成绩记录 [待确认]"
        ai_init: false
        frequency: "随赛程更新（站级/日级）"
        retrieval: "赛事 ID / 车手 ID 精确查询"
        status: "待规划"
  - step_name: "2. 高光识别与多语言脚本生成"
    ckd_items:
      - context_name: "历史高互动内容素材库"
        description: "过往高互动的赛事切片与文案，用于高光偏好学习与策略优化，让 AI 把握真正能引爆的镜头。"
        type: "向量嵌入 / 多媒体索引"
        storage: "向量数据库 + 对象存储"
        volume: "历史内容条数 [待确认]"
        ai_init: true
        frequency: "月度沉淀"
        retrieval: "语义相似度检索 + 标签匹配"
        status: "待规划"
      - context_name: "高光判定规则（决策模型类）"
        description: "专家定义的高光打分逻辑：精彩度、叙事价值、品牌相关度的因子与阈值，引导 AI 打分而非盲目截取。"
        type: "规则 / 决策模型"
        storage: "配置中心 / 规则库"
        volume: "< 100 条核心规则"
        ai_init: true
        frequency: "季度更新"
        retrieval: "规则引擎匹配"
        status: "待规划"
      - context_name: "多语言解说脚本模板"
        description: "固定叙事骨架（钩子/高潮/结果/CTA）+ 动态字段来源，支撑 6 语言脚本稳定生成。"
        type: "结构化文档 / Prompt 模板"
        storage: "模板库 / Git 版本管理"
        volume: "< 50 套模板"
        ai_init: true
        frequency: "随发版"
        retrieval: "模板 ID / 场景标签匹配"
        status: "待规划"
      - context_name: "目标市场文化偏好与禁忌库"
        description: "各目标市场的文化偏好、宗教/政治/习俗禁忌与本地表达习惯，作为多语言本地化改写的红线知识。"
        type: "知识语料 / 词表"
        storage: "文档库 + 向量库"
        volume: "按 6 语言市场维护 [待确认]"
        ai_init: true
        frequency: "季度更新"
        retrieval: "语义检索 + 关键词命中"
        status: "待规划"
  - step_name: "3. 智能剪辑、配音与品牌包装"
    ckd_items:
      - context_name: "品牌 VI 规范与视觉标准手册"
        description: "Logo、配色、字体、角标、片尾等品牌视觉标准，约束剪辑包装与封面生成的一致性。"
        type: "结构化文档 / 设计规范"
        storage: "文档库 / 设计资产库"
        volume: "< 200 条规范条目"
        ai_init: false
        frequency: "随品牌更新（低频）"
        retrieval: "规范标签精确匹配"
        status: "待规划"
      - context_name: "剪辑节奏与镜头选择规则"
        description: "把脚本节奏映射到镜头选择与转场的规则，决定成片节奏与观感。"
        type: "规则 / 决策模型"
        storage: "配置中心 / 规则库"
        volume: "< 100 条规则"
        ai_init: true
        frequency: "季度更新"
        retrieval: "规则引擎匹配"
        status: "待规划"
      - context_name: "多语言配音与字幕合成能力"
        description: "TTS 音色库与字幕合成参数，支撑 6 语言配音与同步字幕生成。"
        type: "API 能力 / 音色配置"
        storage: "TTS 服务 API + 配置"
        volume: "按语言/音色配置"
        ai_init: false
        frequency: "随服务更新"
        retrieval: "API 调用（语言/音色参数）"
        status: "待规划"
  - step_name: "4. 多平台格式适配与内容包"
    ckd_items:
      - context_name: "各平台内容规范"
        description: "YouTube/TikTok/Instagram/Reels 的时长、比例、分辨率、编码、标签与文案规范，是适配与合规的硬约束。"
        type: "结构化字典"
        storage: "配置中心 / 字典表"
        volume: "主流平台 < 20 套规范"
        ai_init: true
        frequency: "随平台政策更新（月级）"
        retrieval: "平台 ID 精确查询"
        status: "待规划"
      - context_name: "SEO 关键词与标签库"
        description: "赛事/品牌相关高价值关键词与标签，用于图文 SEO 与平台标签生成。"
        type: "词表 / 关键词数据"
        storage: "搜索引擎 / 关键词工具导出"
        volume: "关键词条数 [待确认]"
        ai_init: true
        frequency: "月度更新"
        retrieval: "关键词匹配 / 向量检索"
        status: "待规划"
  - step_name: "5. 品牌审核与发布编排"
    ckd_items:
      - context_name: "品牌调性与内容红线"
        description: "品牌内容经理设定的调性要求与不可触碰的内容红线，作为对外发布的强制放行依据。"
        type: "规则 / 审核清单"
        storage: "配置中心 / 审核规则库"
        volume: "< 100 条红线条款"
        ai_init: false
        frequency: "随品牌策略更新（季度）"
        retrieval: "规则命中 + 人工核对"
        status: "待规划"
      - context_name: "历史发布时间与互动数据"
        description: "各市场历史发布时段与对应互动表现，用于最佳发布时间预测与排期。"
        type: "时序数据"
        storage: "分析数仓 / 时序库"
        volume: "按平台×市场累积 [待确认]"
        ai_init: true
        frequency: "日级更新"
        retrieval: "时间窗口 + 市场维度查询"
        status: "待规划"
      - context_name: "社媒平台发布接口"
        description: "社媒管理平台（Hootsuite/Sprinklr）开放接口，用于按排期自动发布并回收发布状态。"
        type: "API 数据"
        storage: "API 网关"
        volume: "按发布任务调用"
        ai_init: false
        frequency: "实时"
        retrieval: "API 调用"
        status: "待规划"
  - step_name: "6. 效果追踪与内容策略反馈"
    ckd_items:
      - context_name: "互动与转化效果数据"
        description: "各平台播放、互动、涨粉与转化数据，是效果归因与策略优化的依据，回流至北极星增长 KPI。"
        type: "时序数据 / API 数据"
        storage: "分析数仓 + Google Analytics"
        volume: "按内容×平台累积 [待确认]"
        ai_init: true
        frequency: "日级 / 近实时"
        retrieval: "内容 ID / 时间窗口查询"
        status: "待规划"
      - context_name: "效果归因与策略优化规则"
        description: "把互动数据归因到高光选择、脚本风格、平台与时段，输出可执行的内容策略优化建议。"
        type: "规则 / 决策模型"
        storage: "配置中心 / 分析脚本"
        volume: "< 50 条策略规则"
        ai_init: true
        frequency: "月度迭代"
        retrieval: "规则引擎匹配"
        status: "待规划"
