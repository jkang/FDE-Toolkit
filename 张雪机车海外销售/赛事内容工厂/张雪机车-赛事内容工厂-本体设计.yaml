title: 张雪机车-赛事内容工厂-Agent本体设计
domain: 赛事营销内容生产
scenario_description: "将 WSBK 赛事原始素材自动转化为多语言短视频与图文内容并排期发布的端到端内容工厂场景，Agent 主驱动理解、识别、生成、适配与发布，人工只在品牌价值判断与风险兜底介入"
target_agent_role: 赛事内容工厂编排 Agent

entities:
  - id: race_footage
    name: 原始赛事素材（Race Footage）
    type: core
    description: "赛事运营负责人上传的 WSBK 原始视频/音频/赛事数据，是内容生产的唯一素材来源，不等于已识别的高光"
    attributes:
      - name: footage_id
        type: string
        description: 素材唯一标识
      - name: source_event
        type: string
        description: 所属赛事/分站
      - name: duration
        type: number
        description: 素材时长（分钟）
      - name: rights_status
        type: enum
        values: [cleared, pending, restricted]
        description: 素材授权状态
    key_distinctions:
      - "原始素材只证明『有画面』，不等于已识别出可成片的高光"
      - "素材授权未 cleared 时不得对外发布"

  - id: race_event
    name: 赛事事件与成绩（Race Event）
    type: reference
    description: "WSBK 赛事的分站成绩、名次、圈速、历史对战等结构化事实，用于为高光补齐叙事上下文"
    attributes:
      - name: event_id
        type: string
        description: 赛事/分站标识
      - name: standings
        type: string
        description: 分站名次与积分
      - name: lap_records
        type: string
        description: 圈速与最快圈
      - name: head_to_head
        type: string
        description: 车手历史对战记录
    key_distinctions:
      - "赛事成绩是权威事实来源，不得由 AI 凭画面臆测名次"
      - "赛事数据存在更新延迟，未同步时需标注而非默认正确"

  - id: driver
    name: 车手（Driver）
    type: reference
    description: "参赛车手及其车队、号码、涂装等信息，是画面事件归属与叙事主角的锚点"
    attributes:
      - name: driver_id
        type: string
        description: 车手标识
      - name: team
        type: string
        description: 所属车队
      - name: bike_number
        type: string
        description: 赛车号码
      - name: is_zxmoto
        type: boolean
        description: 是否为 ZXMOTO 相关车手
    key_distinctions:
      - "车手号码相似时易混淆，必须结合涂装与赛事数据交叉确认"
      - "ZXMOTO 车手 ≠ 画面中所有品牌露出"

  - id: highlight
    name: 高光片段（Highlight）
    type: core
    description: "具备精彩度/叙事价值/品牌相关度、可独立成片的赛事片段，含高光分与事件类型"
    attributes:
      - name: highlight_id
        type: string
        description: 高光片段标识
      - name: event_type
        type: enum
        values: [overtake, battle, crash, win, comeback]
        description: 高光事件类型
      - name: highlight_score
        type: number
        description: 高光综合得分
      - name: brand_visibility
        type: number
        description: 品牌露出程度
    key_distinctions:
      - "高光分低于阈值不得进入成片，须回退候选或拉人"
      - "慢镜回放是同一高光的重复，不得计为多个高光"

  - id: script
    name: 多语言解说脚本（Multilingual Script）
    type: core
    description: "基于叙事要素与品牌调性生成的 6 语言解说脚本，须事实一致且逐语言本地化"
    attributes:
      - name: script_id
        type: string
        description: 脚本标识
      - name: languages
        type: string
        description: 覆盖语言（默认 6 语言）
      - name: hook
        type: string
        description: 开场钩子
      - name: fact_refs
        type: string
        description: 脚本引用的事实要素引用
    key_distinctions:
      - "脚本事实必须与赛事数据一致，不得为效果夸大结果"
      - "多语言是逐语言本地化改写，不是直译"

  - id: content_asset
    name: 内容成品/内容包（Content Asset）
    type: core
    description: "完成剪辑、配音、品牌包装并适配各平台后的成品集合（视频+图文+标签）"
    attributes:
      - name: asset_id
        type: string
        description: 内容成品标识
      - name: platforms
        type: string
        description: 适配平台清单
      - name: version
        type: string
        description: 版本号
      - name: review_status
        type: enum
        values: [draft, pending_review, approved, rejected]
        description: 审核状态
    key_distinctions:
      - "内容包已适配 ≠ 已获品牌放行，未 approved 不得发布"
      - "同一内容跨平台复用须重新适配，不得直接照搬"

  - id: brand_guideline
    name: 品牌调性与内容红线（Brand Guideline）
    type: reference
    description: "ZXMOTO 品牌调性、VI 规范与不可触碰的内容红线，是包装与发布前的强制约束"
    attributes:
      - name: tone
        type: string
        description: 品牌调性关键词
      - name: vi_spec
        type: string
        description: VI 规范（Logo/配色/字体/角标）
      - name: red_lines
        type: string
        description: 内容红线条款
    key_distinctions:
      - "调性偏差可修改后复检，红线命中一票否决"
      - "品牌元素不符 VI 不得对外发布"

  - id: platform_spec
    name: 平台内容规范（Platform Spec）
    type: reference
    description: "YouTube/TikTok/Instagram/Reels 的时长、比例、编码、标签等硬规范，是平台适配的依据"
    attributes:
      - name: platform_id
        type: string
        description: 平台标识
      - name: duration_limit
        type: number
        description: 时长上限
      - name: aspect_ratio
        type: string
        description: 画幅比例要求
      - name: codec
        type: string
        description: 编码与码率要求
    key_distinctions:
      - "平台规范是硬约束，超限必须先裁切/拆条再适配"
      - "不同平台规范不同，不得用同一版本直接发布"

  - id: cultural_guideline
    name: 目标市场文化偏好与禁忌（Cultural Guideline）
    type: reference
    description: "各目标市场的文化偏好、宗教/政治/习俗禁忌与本地表达习惯，是多语言本地化改写的红线知识"
    attributes:
      - name: market
        type: string
        description: 目标市场
      - name: language
        type: string
        description: 对应语言
      - name: taboos
        type: string
        description: 禁忌清单
    key_distinctions:
      - "本地化改写不是翻译，命中禁忌必须改写而非照搬"
      - "某市场合规不代表其他市场合规，须逐市场校验"

  - id: publish_record
    name: 发布记录（Publish Record）
    type: event
    description: "内容按排期在各平台发布的事件记录，含发布时间、平台与发布状态"
    attributes:
      - name: publish_id
        type: string
        description: 发布记录标识
      - name: publish_time
        type: datetime
        description: 实际发布时间
      - name: status
        type: enum
        values: [scheduled, published, failed, retracted]
        description: 发布状态
    key_distinctions:
      - "已排期 ≠ 已发布，未获放行不得进入 published"
      - "发布失败须重试或转人工，不得静默丢失"

  - id: performance_metric
    name: 效果指标（Performance Metric）
    type: event
    description: "内容发布后的播放、互动、涨粉与转化数据，是效果归因与策略优化的依据"
    attributes:
      - name: metric_id
        type: string
        description: 指标记录标识
      - name: engagement_rate
        type: number
        description: 互动率
      - name: sample_size
        type: number
        description: 样本量
      - name: collected_at
        type: datetime
        description: 采集时间
    key_distinctions:
      - "样本不足不得据以大改策略"
      - "互动相关不等于因果，须谨慎归因"

relationships:
  - from: race_event
    to: driver
    label: 记录
    cardinality: "N:N"
    description: "一场赛事记录多名车手的成绩与对战"
  - from: race_footage
    to: race_event
    label: 对应
    cardinality: "N:1"
    description: "一份素材对应一场赛事，赛事数据为画面提供叙事上下文"
  - from: highlight
    to: race_footage
    label: 提取
    cardinality: "N:1"
    description: "高光片段从原始素材中提取而来"
  - from: highlight
    to: race_event
    label: 依赖
    cardinality: "N:1"
    description: "高光叙事价值依赖赛事成绩与对战事实"
  - from: script
    to: highlight
    label: 解说
    cardinality: "N:1"
    description: "脚本围绕高光片段组织叙事"
  - from: script
    to: brand_guideline
    label: 约束
    cardinality: "N:N"
    description: "脚本用语与调性受品牌调性约束"
  - from: script
    to: cultural_guideline
    label: 适配
    cardinality: "N:N"
    description: "脚本逐语言按文化偏好与禁忌本地化改写"
  - from: content_asset
    to: script
    label: 包含
    cardinality: "N:1"
    description: "内容成品包含对应语言的解说脚本与配音"
  - from: content_asset
    to: brand_guideline
    label: 约束
    cardinality: "N:N"
    description: "内容成品的包装须符合品牌 VI 与调性"
  - from: content_asset
    to: platform_spec
    label: 适配
    cardinality: "N:N"
    description: "内容成品按各平台硬规范适配"
  - from: content_asset
    to: publish_record
    label: 触发
    cardinality: "1:N"
    description: "一份内容成品按平台产生多条发布记录"
  - from: publish_record
    to: performance_metric
    label: 证明
    cardinality: "1:N"
    description: "发布记录产生对应的效果指标"
  - from: performance_metric
    to: highlight
    label: 优化
    cardinality: "N:N"
    description: "效果数据回流优化高光判定偏好"

action_boundaries:
  - id: ab_highlight_selection
    situation: 从海量赛事素材中筛选可成片高光
    situation_description: "素材量大且高光转瞬即逝，需要在不遗漏品牌相关镜头的前提下快速筛出可成片的高光片段"
    required_evidence:
      - source: "多模态镜头语义标签 / 事件时间轴"
        checks: "镜头事件类型与精彩度是否已识别，是否排除慢镜重复"
      - source: "WSBK 赛事数据库"
        checks: "名次/圈速/对战事实是否可关联，确认叙事价值"
      - source: "品牌露出标记"
        checks: "是否含 ZXMOTO 车手/涂装/赞助露出"
    valid_actions:
      - "按精彩度/叙事价值/品牌相关度对候选片段打分排序"
      - "标记品牌露出位置与时点"
      - "生成高光片段清单并标注置信度"
    invalid_actions:
      - action: "仅凭画面时长或视觉冲击挑选高光"
        reason: "忽略叙事价值与品牌相关度，会漏掉夺冠/反超等关键镜头"
      - action: "把同一高光的慢镜回放计为多个高光"
        reason: "会造成重复内容并浪费剪辑与发布资源"
      - action: "在品牌露出缺失时默认无影响"
        reason: "品牌相关度是核心价值锚，缺失必须标注而非忽略"
    exception_triggers:
      - condition: "高光候选不足或高分镜头存在争议"
        action: "回退候选池并拉人（内容团队）判定"
      - condition: "赛事数据未同步导致叙事价值无法判断"
        action: "标注待核对，先按精彩度入选并在后续补正"

  - id: ab_multilingual_localization
    situation: 生成多语言脚本涉及文化差异
    situation_description: "同一内容需产出 6 语言版本，各市场文化偏好与禁忌不同，直译可能导致冒犯或传播失败"
    required_evidence:
      - source: "目标市场文化偏好与禁忌库"
        checks: "该语言市场是否存在需规避的敏感/禁忌表达"
      - source: "品牌调性与内容红线"
        checks: "本地化改写后是否仍保持品牌调性"
      - source: "WSBK 赛事数据库"
        checks: "各语言版本事实是否一致"
    valid_actions:
      - "逐语言本地化改写而非直译"
      - "对命中禁忌的表达进行改写或降级处理"
      - "保持各语言事实与品牌用语一致"
    invalid_actions:
      - action: "用源语言脚本直接机器直译"
        reason: "直译无法传递情绪与文化语境，易触发禁忌"
      - action: "使用未经核实的本地表达"
        reason: "可能产生歧义或冒犯，损害品牌形象"
      - action: "把某市场合规版本直接复用到其他市场"
        reason: "各市场禁忌不同，跨市场照搬可能违规"
    exception_triggers:
      - condition: "某语言命中禁忌且无法在不改变事实的前提下改写"
        action: "拉人（品牌内容经理）裁决，必要时降级或放弃该语言版本"
      - condition: "某语种配音合成失败"
        action: "切换备用 TTS，仍失败则标注人工补录"

  - id: ab_brand_compliance
    situation: 对外发布前的品牌与合规校验
    situation_description: "内容已适配各平台，但在对外发布前必须完成品牌调性、内容红线与事实准确性校验"
    required_evidence:
      - source: "品牌调性与内容红线"
        checks: "内容是否触碰政治/宗教/暴力/竞品贬损等红线"
      - source: "品牌 VI 规范"
        checks: "Logo/配色/字体/角标是否符合规范"
      - source: "WSBK 赛事数据库"
        checks: "车手/名次/成绩等事实是否准确一致"
    valid_actions:
      - "逐项校验品牌调性、红线与事实准确性"
      - "标记风险项并给出修改建议"
      - "对通过校验的内容签发放行指令"
    invalid_actions:
      - action: "未经品牌终审即安排对外发布"
        reason: "对外内容须人工放行，AI 无权代替品牌承诺"
      - action: "仅凭 AI 自评结果放行红线内容"
        reason: "红线一票否决必须由人工终审，防止品牌风险"
      - action: "为赶热点跳过事实核对"
        reason: "事实错误会损害品牌公信力并可能引发舆情"
    exception_triggers:
      - condition: "内容触碰品牌红线或存在事实重大错误"
        action: "拦截发布并升级品牌内容经理（对外必停确认）"
      - condition: "调性偏差但未触红线"
        action: "退回修改后重新送审"

  - id: ab_publish_release
    situation: 内容已过审准备对外发布
    situation_description: "内容已获品牌放行，需按排期在多个平台对外发布，并处理账号、档期与发布失败等异常"
    required_evidence:
      - source: "品牌放行指令"
        checks: "内容 review_status 是否为 approved"
      - source: "发布排期表"
        checks: "是否处于目标市场最佳发布窗口，档期是否冲突"
      - source: "社媒平台账号状态"
        checks: "账号授权是否有效、平台是否可用"
    valid_actions:
      - "按排期在多平台自动发布并回收发布状态"
      - "发布失败时按规则重试"
      - "发布后记录发布时间与平台"
    invalid_actions:
      - action: "在未获品牌放行时对外发布"
        reason: "违反对外必停确认，可能发布未审内容"
      - action: "热点已过期仍按原排期发布"
        reason: "错失传播窗口，内容价值大幅下降"
      - action: "发布失败后静默丢弃"
        reason: "会导致内容缺失且无人跟进"
    exception_triggers:
      - condition: "发布失败或账号异常"
        action: "重试 2 次→转人工发布"
      - condition: "档期冲突或热点过期"
        action: "顺延发布或提示人工调整选题"

  - id: ab_performance_feedback
    situation: 采集到互动数据后决定是否调整策略
    situation_description: "内容发布后采集到互动数据，需要判断样本是否充分并决定是否调整高光偏好与内容策略"
    required_evidence:
      - source: "互动与转化效果数据"
        checks: "互动率相对基准的偏离与样本量是否充分"
      - source: "历史高互动内容素材库"
        checks: "表现优异内容对应的特征（高光类型/叙事/平台/时段）"
      - source: "分析数仓"
        checks: "数据是否完整、是否存在延迟"
    valid_actions:
      - "对效果数据做归因分析并输出策略建议"
      - "在样本充分时更新高光偏好权重"
      - "保留策略调整的可回溯记录"
    invalid_actions:
      - action: "样本不足即大幅调整内容策略"
        reason: "易被噪声带偏，导致策略反复震荡"
      - action: "把互动相关直接当作因果"
        reason: "可能存在混杂因素，错误归因会误导后续选题"
      - action: "忽略平台与市场差异统一归因"
        reason: "不同平台/市场受众不同，统一归因会掩盖真实规律"
    exception_triggers:
      - condition: "样本不足或数据波动大"
        action: "不调整策略，继续观察并标注"
      - condition: "策略方向冲突或资源受限"
        action: "拉人（海外市场营销/社媒运营）裁决优先级"

workstreams:
  - id: ws_footage_understanding
    name: 素材理解与高光识别
    description: "从原始赛事素材接入、多模态理解、赛事数据关联到产出高光片段清单的完整执行流"
    anchor_objects:
      - race_footage
      - race_event
      - driver
      - highlight
    states:
      - id: fu_ingested
        name: 素材已接入
        description: "原始素材已上传入库，尚未完成多模态理解"
        transitions:
          - to_state: fu_understood
            trigger_action: 完成多模态镜头与事件识别
            required_evidence: "镜头语义标签与事件时间轴已生成"
            type: normal
          - to_state: fu_low_confidence
            trigger_action: 检查识别置信度
            required_evidence: "存在低置信度镜头或素材质量异常"
            type: exception
      - id: fu_understood
        name: 素材已理解
        description: "镜头与事件已识别并关联赛事数据，可进行高光打分"
        transitions:
          - to_state: fu_highlight_ready
            trigger_action: 完成高光片段识别与打分
            required_evidence: "高光片段清单生成，高分片段品牌露出已标注"
            type: normal
          - to_state: fu_low_confidence
            trigger_action: 高光候选不足或高分镜头存疑
            required_evidence: "候选高光数量低于阈值或品牌相关度缺失"
            type: exception
      - id: fu_low_confidence
        name: 低置信度待复核
        description: "存在低置信度镜头或候选不足，需人工复核后再决定高光"
        transitions:
          - to_state: fu_understood
            trigger_action: 人工复核并修正后重新打分
            required_evidence: "复核结论已回填，置信度达标"
            type: recovery
      - id: fu_highlight_ready
        name: 高光清单就绪
        description: "高光片段清单已生成并标注高光分，可进入内容生产"
        transitions: []
    guardrails:
      - "素材未完成多模态理解不得进入高光识别"
      - "低置信度镜头不得计入高光候选"
      - "品牌露出缺失必须标注，不得默认忽略"
      - "赛事名次/成绩须以赛事数据库为准，不得凭画面臆测"
    dependency_mapping:
      - workstream: ws_content_production
        condition: "高光清单到达 fu_highlight_ready 状态"
        impact: "内容生产流程解除等待，可开始脚本与剪辑"

  - id: ws_content_production
    name: 内容生产（脚本→剪辑→配音→包装）
    description: "从高光清单到生成多语言脚本、完成剪辑配音与品牌包装、产出内容成品的执行流"
    anchor_objects:
      - highlight
      - script
      - brand_guideline
      - cultural_guideline
      - content_asset
    states:
      - id: cp_scripting
        name: 脚本生成中
        description: "正在基于叙事要素生成 6 语言解说脚本"
        transitions:
          - to_state: cp_script_confirmed
            trigger_action: 完成脚本抽检确认
            required_evidence: "脚本事实与赛事数据一致，无禁忌冲突"
            type: normal
          - to_state: cp_script_conflict
            trigger_action: 检测脚本事实或文化禁忌冲突
            required_evidence: "脚本命中文化禁忌或事实与赛事数据不符"
            type: exception
      - id: cp_script_conflict
        name: 脚本冲突
        description: "脚本存在事实偏差或文化禁忌冲突，需改写或人工裁决"
        transitions:
          - to_state: cp_scripting
            trigger_action: 改写脚本后重新生成
            required_evidence: "冲突项已改写且保持事实一致"
            type: recovery
      - id: cp_script_confirmed
        name: 脚本已确认
        description: "多语言脚本经抽检确认，可进入剪辑配音与包装"
        transitions:
          - to_state: cp_assembling
            trigger_action: 执行自动剪辑、配音字幕与品牌包装
            required_evidence: "脚本已确认，剪辑与 TTS 服务可用"
            type: normal
          - to_state: cp_render_failed
            trigger_action: 检测合成失败
            required_evidence: "剪辑或 TTS 合成返回失败"
            type: exception
      - id: cp_assembling
        name: 剪辑配音包装中
        description: "正在自动剪辑、合成多语言配音字幕并叠加品牌元素与封面"
        transitions:
          - to_state: cp_asset_ready
            trigger_action: 完成品牌包装并生成内容成品
            required_evidence: "成片符合品牌 VI，6 语言配音字幕齐全"
            type: normal
          - to_state: cp_render_failed
            trigger_action: 检测渲染失败
            required_evidence: "渲染任务异常退出"
            type: exception
      - id: cp_render_failed
        name: 合成失败
        description: "剪辑/配音/包装合成失败，需重试或降级"
        transitions:
          - to_state: cp_assembling
            trigger_action: 重试或降级标准模板后重新合成
            required_evidence: "重试成功或已切换降级模板"
            type: recovery
      - id: cp_asset_ready
        name: 内容成品就绪
        description: "内容成品已生成并含品牌包装，可进入平台适配与审核"
        transitions: []
    guardrails:
      - "脚本未经确认不得进入配音合成"
      - "配音语言未覆盖目标市场不得产出内容包"
      - "品牌元素不符合 VI 规范不得进入发布流程"
      - "事实必须与赛事数据一致，不得为效果夸大结果"
    dependency_mapping:
      - workstream: ws_publish
        condition: "内容成品到达 cp_asset_ready 状态"
        impact: "平台适配与发布流程解除等待，可开始适配"

  - id: ws_publish
    name: 平台适配与发布
    description: "从内容成品按平台规范适配、品牌审核放行到多平台发布的执行流"
    anchor_objects:
      - content_asset
      - platform_spec
      - brand_guideline
      - publish_record
    states:
      - id: pub_adapting
        name: 平台适配中
        description: "正在按各平台时长/比例/编码规范适配并生成标签与图文"
        transitions:
          - to_state: pub_review
            trigger_action: 完成适配并送审
            required_evidence: "多平台内容包生成且符合平台硬规范"
            type: normal
          - to_state: pub_adapt_failed
            trigger_action: 检测适配失败
            required_evidence: "编码转换或裁切失败"
            type: exception
      - id: pub_adapt_failed
        name: 适配失败
        description: "平台适配失败，需重试或降级标准编码"
        transitions:
          - to_state: pub_adapting
            trigger_action: 重试或降级标准编码后重新适配
            required_evidence: "适配成功或已切换降级方案"
            type: recovery
      - id: pub_review
        name: 品牌审核中
        description: "内容包正在接受品牌调性、红线与事实校验"
        transitions:
          - to_state: pub_approved
            trigger_action: 完成品牌终审并放行
            required_evidence: "品牌放行指令已签发，无红线命中"
            type: normal
          - to_state: pub_rejected
            trigger_action: 校验发现调性偏差或红线命中
            required_evidence: "审核结论为退回或拦截"
            type: exception
      - id: pub_rejected
        name: 审核退回
        description: "内容未通过品牌审核，需修改后重新送审"
        transitions:
          - to_state: pub_adapting
            trigger_action: 按审核意见修改后重新适配送审
            required_evidence: "修改项已完成并重新提交"
            type: recovery
      - id: pub_approved
        name: 已放行
        description: "内容已获品牌放行，等待按排期发布"
        transitions:
          - to_state: pub_published
            trigger_action: 按排期在多平台发布
            required_evidence: "发布成功且发布状态已回写"
            type: normal
      - id: pub_published
        name: 已发布
        description: "内容已在目标平台发布，可进入效果追踪"
        transitions: []
    guardrails:
      - "未经品牌终审不得对外发布"
      - "触碰内容红线一票否决，不得放行"
      - "超平台时长/编码硬约束不得强推，须先裁切/拆条"
      - "发布失败必须重试或转人工，不得静默丢弃"
    dependency_mapping:
      - workstream: ws_feedback
        condition: "内容到达 pub_published 状态"
        impact: "效果追踪流程可采集发布记录与互动数据"

  - id: ws_feedback
    name: 效果追踪与策略反馈
    description: "从采集互动数据、归因分析到更新高光偏好与内容策略的执行流"
    anchor_objects:
      - publish_record
      - performance_metric
      - highlight
    states:
      - id: fb_collecting
        name: 数据采集中
        description: "正在采集各平台互动与转化数据"
        transitions:
          - to_state: fb_analyzing
            trigger_action: 完成数据采集并校验完整性
            required_evidence: "互动指标数据集完整，样本量达标"
            type: normal
          - to_state: fb_data_delayed
            trigger_action: 检测数据延迟或缺失
            required_evidence: "平台数据延迟或指标缺失"
            type: exception
      - id: fb_data_delayed
        name: 数据延迟
        description: "效果数据延迟或缺失，需等待补齐"
        transitions:
          - to_state: fb_collecting
            trigger_action: 等待数据补齐后重新采集
            required_evidence: "数据延迟已恢复，指标可获取"
            type: recovery
      - id: fb_analyzing
        name: 归因分析中
        description: "正在对效果数据做归因并评估是否调整策略"
        transitions:
          - to_state: fb_optimized
            trigger_action: 输出归因结论并更新高光偏好
            required_evidence: "样本充分，归因结论可追溯"
            type: normal
          - to_state: fb_insufficient
            trigger_action: 检测样本不足或波动过大
            required_evidence: "样本量低于阈值或波动异常"
            type: exception
      - id: fb_insufficient
        name: 样本不足
        description: "样本不足或波动大，暂不调整策略，继续观察"
        transitions:
          - to_state: fb_collecting
            trigger_action: 继续采集样本后重新评估
            required_evidence: "累计样本量达到阈值"
            type: recovery
      - id: fb_optimized
        name: 策略已优化
        description: "高光偏好与内容策略已更新并留有可回溯记录"
        transitions: []
    guardrails:
      - "样本不足不得大幅调整内容策略"
      - "互动相关不得直接当作因果"
      - "策略调整必须留可回溯记录，便于复盘"
      - "不得忽略平台与市场差异做统一归因"
    dependency_mapping:
      - workstream: ws_footage_understanding
        condition: "高光偏好权重已更新（fb_optimized）"
        impact: "后续高光识别与打分的权重随之调整"
