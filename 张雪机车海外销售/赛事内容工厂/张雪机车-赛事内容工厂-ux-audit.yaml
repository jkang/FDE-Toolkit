# UX-Optimizer 定制设计系统 · 张雪机车海外销售 · 赛事内容工厂
# 企业品牌基因：ZXMOTO 雪刃蓝 #1A6BC4（主）+ 竞速红 #E63946（强调）｜赛道黑中性体系
# 业务主题：赛事内容 / 摩托运动 / 海外社媒（快节奏、内容驱动、品牌一致性优先）
meta:
  company: "张雪机车海外销售"
  scenario: "赛事内容工厂"
  businessDomain: "赛事内容营销"
  productName: "ZXMOTO 赛事内容工厂 Agent"
  mode: "Modern SaaS 工作台"
  brandSource: "discovery 提取（design.md / zxmoto-tokens.css）"

brandProfile:
  primaryTone: "雪刃蓝 · 赛道感"
  primaryColor: "#1A6BC4"
  userGroup: "内部员工"
  seriousness: "开放协同"
  maturity: "新锐"

designLanguage:
  colors:
    primary: "#1A6BC4"
    primaryDark: "#104586"
    primaryLight: "#6DB5EE"
    accent: "#E63946"
    success: "#16A34A"
    warning: "#F59E0B"
    danger: "#DC2626"
    info: "#1A6BC4"
    neutral:
      text: "#0F141D"
      textSecondary: "#45546C"
      border: "#D5DAE2"
      bg: "#FFFFFF"
      bgAlt: "#F7F8F9"
    gradient:
      from: "#08224A"
      to: "#1A6BC4"
  typography:
    fontFamily: "Inter, 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif"
    h1: { size: 28, weight: "600", lineHeight: 1.25, spacing: "-0.025em" }
    h2: { size: 22, weight: "600", lineHeight: 1.3, spacing: "0" }
    h3: { size: 18, weight: "600", lineHeight: 1.4, spacing: "0" }
    body: { size: 14, weight: "400", lineHeight: 1.5, spacing: "0" }
    label: { size: 12, weight: "600", lineHeight: 1.2, spacing: "0.05em", uppercase: true }
    caption: { size: 12, weight: "400", lineHeight: 1.4, spacing: "0" }
  spacing:
    scale: [4, 8, 12, 16, 24, 32, 48]
    contentMaxWidth: 1440
    cardPadding: 24
    sectionGap: 24
    elementGap: 16
  radius:
    sm: 4
    md: 8
    lg: 12
    pill: 999
  shadow:
    card: "0 1px 3px 0 rgba(15, 20, 29, 0.10), 0 1px 2px -1px rgba(15, 20, 29, 0.10)"
    raised: "0 4px 6px -1px rgba(15, 20, 29, 0.15), 0 2px 4px -2px rgba(15, 20, 29, 0.10)"
  border:
    color: "#D5DAE2"
    width: 1
  components:
    card: { radius: 8, shadow: "card", background: "#FFFFFF", border: true }
    button:
      radius: 8
      transition: "0.15s ease-out"
      hoverOpacity: 0.85
    table:
      density: "compact"
      rowHover: true
      headerBg: "#F7F8F9"
    input:
      radius: 8
      focusOutline: "#6DB5EE"
  states:
    hoverTime: "0.15s ease-out"
    focusOutline: "#6DB5EE"
    loadingType: "skeleton"
    emptyStyle: "icon + hint + cta"
  layout:
    mode: "side"
    siderWidth: 216
    headerHeight: 56
  motion:
    transition: "0.15s ease-out"
    enableSpring: false
  responsive:
    breakpoints: [375, 768, 1024, 1440]

componentSpecs:
  - { element: "steps", v2: { style: "progress accent · 赛事进程条" } }
  - { element: "uploadCard", v2: { style: "drag zone focus ring · 素材落地区" } }
  - { element: "aiResultCard", v2: { style: "AI insight panel · 高光候选卡" } }
  - { element: "table", v2: { style: "rowsZebra headerSticky · 高光分排序" } }
  - { element: "statRow", v2: { style: "metric hero · 时效/成本/互动/人力" } }
  - { element: "buttonRow", v2: { style: "primaryFullBleed hoverLift · 竞速红 CTA" } }
  - { element: "alert", v2: { style: "showIcon bordered · 品牌红线/文化禁忌" } }
  - { element: "timeline", v2: { style: "state tracker · 剪辑配音包装进程" } }
  - { element: "chatPanel", v2: { style: "AI copilot · 生成指令 chips" } }
  - { element: "formCard", v2: { style: "field group labelAbove · 生成指令" } }
  - { element: "tagRow", v2: { style: "status chips pill · 平台/语言/状态" } }

ux_scores:
  - { name: "信息层级", score: 9 }
  - { name: "布局节奏", score: 8 }
  - { name: "色彩体系", score: 9 }
  - { name: "组件状态", score: 8 }
  - { name: "微交互", score: 8 }
  - { name: "可访问性", score: 8 }

diff_before_after:
  - { dimension: "主色", before: "antd 默认蓝 #1677ff", after: "雪刃蓝 #1A6BC4（品牌映射）" }
  - { dimension: "强调/CTA", before: "antd 默认 gold #faad14", after: "竞速红 #E63946（品牌 CTA）" }
  - { dimension: "字体", before: "系统默认字体栈", after: "Inter + Noto Sans SC（ZXMOTO 字体栈）" }
  - { dimension: "卡片", before: "默认 8px 圆角 / 无边框阴影", after: "8px 圆角 + 赛道黑描边 + 轻阴影" }
  - { dimension: "表格", before: "默认行高、无表头强调", after: "紧凑密度 + label-caps 表头 + 行 hover" }
  - { dimension: "状态徽章", before: "默认 tag 低对比色", after: "语义色对达标（≥4.5:1）" }
  - { dimension: "空态/错误态", before: "默认 Empty 无引导", after: "icon + hint + CTA 空态、降级错误态" }
  - { dimension: "响应式", before: "仅桌面宽度", after: "375/768/1024/1440 断点 + cursor-pointer" }

diffChecklist:
  - "自定义主色是否已注入 ConfigProvider + CSS 变量"
  - "字体系统是否覆盖全局 + 标题层级"
  - "间距是否统一为 8pt 体系"
  - "圆角/阴影是否按产品气质定制（非默认 antd）"
  - "11 类元素是否按 componentSpecs 升级"
  - "六态（hover/focus/empty/loading/error/disabled）是否完备"
  - "响应式断点 375/768/1024/1440 是否生效"
  - "cursor-pointer 是否加到所有可交互区"
