subtitle: "单场景端到端：机会点定义 → AI画布 → To-be流程/CKD/任务拆解(P1)/规则挖掘(P2) → Agent本体 → Agent产品方案 → To-be旅程 → MVP原型 → UX优化 → 落地技术架构 → MVP成效指标 → 测试数据集"
executive_summary:
  - "一句话结论：把「人工逐帧剪辑 WSBK 赛事素材 + 外包多语言本地化 + 手工适配各平台」升级为「<b>多模态赛事理解 + 高光四因子打分 + 6 语言脚本配音 + 自动剪辑品牌包装 + 平台格式适配 + 品牌红线终审 + 发布排期 + 效果回流</b>」，赛事热点从 3 天出片收敛至 30 分钟，多语言单位成本下降 90%。"
  - "本报告沿 <b>理需求 → 挖知识 → 建本体 → 生智能 → 评测</b> 给出可施工证据链：1 个机会点 · 6 个 To-be 阶段 · 19 个 L5 深度任务 · 11 条业务规则 · 11 个本体实体 · 6 个编排 Skill · 6 个原型页面 · 24 条测试用例。"
  - "技术路线：<b>Autonomous Planner</b>（1 编排 Agent + 6 Skill + 1 本体 + 5 MCP + 1 RAG）；品牌红线终审与多平台自动发布为对外动作的强制人工闸门。"
