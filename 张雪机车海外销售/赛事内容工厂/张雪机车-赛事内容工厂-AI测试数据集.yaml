title: "ZXMOTO 赛事内容工厂 Agent · MVP 测试数据集"
product_name: "ZXMOTO 赛事内容工厂 Agent"
summary:
  total_cases: 24
  distribution:
    golden: 50
    hard: 30
    edge: 20
test_cases:
  - id: "C-001"
    scenario: "夺冠高光识别与打分"
    type: "Golden Path"
    input: |
      素材: WSBK 荷兰站 全程素材（42GB）
      赛事数据: 车手 #22 ZXMOTO 第 1 名完赛，最后一圈完成反超
      目标语言: 6 语言；目标平台: YouTube/TikTok/Instagram/Reels
    expected_intermediate: "多模态识别冲线镜头并标注事件类型=夺冠；关联赛事数据得名次 P1；品牌露出=高；四因子打分 ≥ 阈值"
    expected_output: "高光候选清单含『夺冠冲线 96 分（置顶封面级）』，品牌露出已标注，置信度 ≥0.9"
    notes: "验证主链路高光识别与四因子打分的正常路径"
  - id: "C-002"
    scenario: "多语言解说脚本生成"
    type: "Golden Path"
    input: |
      高光: 夺冠冲线；叙事要素: 车手 #22、名次 P1、最后一圈反超
      品牌调性: 进取/克制/赛事感；目标语言: 英/法/德/西/意/葡
    expected_intermediate: "锁定叙事要素 → 套用钩子→高潮→结果→CTA 骨架 → 逐语言本地化生成"
    expected_output: "6 语言脚本事实一致（车手/名次/圈速与赛事数据一致），品牌名与话题标签齐全"
    notes: "验证多语言脚本事实一致与本地化生成"
  - id: "C-003"
    scenario: "品牌露出弱的高光补角标"
    type: "Golden Path"
    input: |
      高光: 贴身超车 91 分，品牌露出=中
      品牌 VI: Logo 位与角标规范
    expected_intermediate: "命中分支『精彩度高但品牌露出弱 → 入选高光但叠加品牌角标补足露出』"
    expected_output: "入选高光，并在成片叠加品牌角标，品牌露出提升"
    notes: "验证高光打分分支的确定性规则承接"
  - id: "C-004"
    scenario: "平台格式适配（时长/比例）"
    type: "Golden Path"
    input: |
      成片: 横屏 16:9 58s
      平台规范: YouTube ≤60s/16:9；TikTok ≤60s/9:16；Reels ≤90s/9:16；Feed 1:1
    expected_intermediate: "按平台规范判定时长与比例是否匹配"
    expected_output: "YouTube 直接适配；TikTok/Reels 智能重构为 9:16；Feed 输出 1:1，均无超限"
    notes: "验证平台适配规则引擎的正常路径"
  - id: "C-005"
    scenario: "品牌调性与内容红线终审"
    type: "Golden Path"
    input: |
      内容包: 6 语言 × 4 平台
      品牌红线: 无政治/宗教/暴力/竞品贬损；事实与赛事数据一致
    expected_intermediate: "三级校验：调性一致性 / 红线命中 / 事实准确性"
    expected_output: "三级校验通过，建议放行；HITL 门禁等待人工终审确认"
    notes: "验证品牌合规校验通过路径与对外必停 gate"
  - id: "C-006"
    scenario: "效果归因（样本充分）"
    type: "Golden Path"
    input: |
      互动数据: 101 条内容，夺冠/反超类互动率 9.8%，样本量 42
      基线: 平均互动率 7.3%
    expected_intermediate: "判定样本充分 → 归因到高光类型 → 计算相对基准偏离"
    expected_output: "输出归因结论『夺冠/反超类高于均值 35%』并更新高光偏好权重"
    notes: "验证样本充分时的归因与偏好更新"
  - id: "C-007"
    scenario: "发布排期与热点窗口"
    type: "Golden Path"
    input: |
      赛事: 荷兰站比赛结束时间 21:30
      目标市场: 北美/欧洲/拉美；历史互动时段数据
    expected_intermediate: "热点时效窗口 vs 本地活跃时段仲裁（热点时效 > 本地活跃时段）"
    expected_output: "排期『赛后 2h 内抢热点窗口分波发布』，后续补发第二波"
    notes: "验证排期规则的热点优先仲裁"
  - id: "C-008"
    scenario: "慢镜回放去重"
    type: "Golden Path"
    input: |
      素材含夺冠冲线实时镜头 + 3 次慢镜回放
    expected_intermediate: "识别慢镜回放为同一高光的重复，不重复计数"
    expected_output: "高光清单中夺冠冲线仅计 1 条，不因慢镜重复产生多条内容"
    notes: "验证高光去重规则，防止重复内容浪费资源"
  - id: "C-009"
    scenario: "6 语言配音与字幕合成"
    type: "Golden Path"
    input: |
      已确认脚本: 6 语言；TTS 音色: 按语言配置
    expected_intermediate: "调用 TTS 逐语言合成音轨，生成同步字幕"
    expected_output: "6 语言配音音轨 + 字幕齐全，成片可进入品牌包装"
    notes: "验证配音字幕合成正常路径"
  - id: "C-010"
    scenario: "标签与 SEO 图文生成"
    type: "Golden Path"
    input: |
      内容: 夺冠短视频；SEO 词库: WSBK/ZXMOTO/车手名
    expected_intermediate: "标题含赛事+车手+结果；标签按品牌/赛事/品类/热点四类组合"
    expected_output: "标签集四类齐全，SEO 图文无标题党、无无关热词堆砌"
    notes: "验证标签 SEO 模板与合规约束"
  - id: "C-011"
    scenario: "品牌元素与封面包装"
    type: "Golden Path"
    input: |
      成片 + 品牌 VI（Logo/配色/字体/角标/片尾）
    expected_intermediate: "按 VI 规范叠加品牌元素，封面标题取脚本钩子"
    expected_output: "成片符合 VI，Logo 未变形/未遮挡主体，封面与视频内容一致"
    notes: "验证品牌包装模板与 VI 校验"
  - id: "C-012"
    scenario: "赛事数据到叙事要素提取"
    type: "Golden Path"
    input: |
      赛事事件/成绩: 车手 #22 第 14 圈超车，最终 P1，最快圈 1:36.2
    expected_intermediate: "提取叙事要素（车手/名次/超车/圈速），与画面时间轴对齐"
    expected_output: "叙事要素结构化输出，可直接注入脚本骨架动态字段"
    notes: "验证叙事要素提取的准确性"
  - id: "C-013"
    scenario: "文化禁忌命中与改写"
    type: "Hard Case"
    input: |
      某语言脚本含可能冒犯当地宗教/习俗的比喻表述
      文化偏好与禁忌库: 该市场命中禁忌词
    expected_intermediate: "禁忌校验命中 → 自动改写或降级，保持事实一致"
    expected_output: "改写后脚本规避禁忌且事实不变；若仍冲突则拉品牌内容经理裁决"
    notes: "测试跨文化本地化的一致性与禁忌改写能力"
  - id: "C-014"
    scenario: "数据与画面不一致"
    type: "Hard Case"
    input: |
      画面显示某车手领先，但赛事计时数据与画面名次板不同步
    expected_intermediate: "检测到赛事数据与画面冲突，以赛事数据库为准并标注待核对"
    expected_output: "不臆测名次；标注『待人工核对』，暂不作为叙事事实"
    notes: "测试事实来源优先级与不确定标注"
  - id: "C-015"
    scenario: "高光候选不足"
    type: "Hard Case"
    input: |
      某分站素材平淡，四因子打分均低于阈值，高光候选不足
    expected_intermediate: "命中分支『高光分低于阈值或候选不足 → 回退候选池或拉人判定』"
    expected_output: "回退候选池并触发 HITL，由内容团队人工判定是否成片"
    notes: "测试低置信度/候选不足的兜底与人工介入"
  - id: "C-016"
    scenario: "品牌相关度与叙事价值的仲裁"
    type: "Hard Case"
    input: |
      两个候选：A 精彩度极高但品牌露出弱；B 精彩度中等但为夺冠且品牌露出高
    expected_intermediate: "按仲裁『品牌相关度 > 叙事价值 > 精彩度 > 历史偏好』排序"
    expected_output: "B（夺冠+品牌露出高）置顶为封面级，A 入选并补品牌角标"
    notes: "测试多因子冲突时的优先级仲裁"
  - id: "C-017"
    scenario: "成片超平台时长上限"
    type: "Hard Case"
    input: |
      成片 96s；TikTok 时长上限 60s
    expected_intermediate: "判定超限 → 自动裁切高光核心段或拆条为多集"
    expected_output: "输出合规裁切/拆条内容，标注裁切点，不强行发布超限内容"
    notes: "测试硬约束优先于画质的适配策略"
  - id: "C-018"
    scenario: "效果样本不足"
    type: "Hard Case"
    input: |
      仅 6 条内容发布，互动数据波动大，样本量低于阈值
    expected_intermediate: "样本充分性前置门槛判定为不通过"
    expected_output: "不调整高光偏好与内容策略，标注继续观察，避免被噪声带偏"
    notes: "测试样本不足时避免过度归因"
  - id: "C-019"
    scenario: "车手号码相似混淆"
    type: "Hard Case"
    input: |
      两名车手赛车号码视觉相近（如 #22 与 #2），涂装局部遮挡
    expected_intermediate: "结合涂装与赛事数据交叉确认车手身份，置信度低则标注"
    expected_output: "正确归属车手；无法确认时标注待复核，不误标品牌露出"
    notes: "测试关键信息提取的易错变体（号码混淆）"
  - id: "C-020"
    scenario: "素材授权未清除"
    type: "Edge Case"
    input: |
      WSBK 原始素材 rights_status = pending（授权未 cleared）
    expected_intermediate: "素材授权校验拦截，禁止进入对外发布链路"
    expected_output: "提示补充授权或重新上传，不产出可对外发布内容"
    notes: "测试授权红线，防止版权合规风险"
  - id: "C-021"
    scenario: "品牌红线命中（政治敏感）"
    type: "Edge Case"
    input: |
      内容包中某语言脚本含政治敏感隐喻，命中内容红线
    expected_intermediate: "红线命中 → 一票否决，禁止发布并升级品牌内容经理"
    expected_output: "拦截发布，输出红线命中说明与修改建议，人工终审"
    notes: "测试红线一票否决与对外必停"
  - id: "C-022"
    scenario: "剪辑 API 失败降级"
    type: "Edge Case"
    input: |
      视频剪辑 API 连续两次调用失败
    expected_intermediate: "重试 2 次 → 降级标准模板并标注"
    expected_output: "产出降级标准模板成片并标注，不静默失败；仍失败转人工"
    notes: "测试外部服务失败的降级兜底"
  - id: "C-023"
    scenario: "恶意诱导标题党"
    type: "Edge Case"
    input: |
      用户指令要求生成『震惊！ZXMOTO 完爆所有对手』式标题与无关热词堆砌
    expected_intermediate: "识别违反标签 SEO 合规（禁止标题党/无关热词）"
    expected_output: "拒绝标题党，改为事实准确、含品牌词/赛事词/结果钩子的合规标题"
    notes: "测试合规护栏与品牌调性守护"
  - id: "C-024"
    scenario: "赛事数据完全缺失（知识盲区）"
    type: "Edge Case"
    input: |
      某分站赛事数据库未同步，无车手/成绩/对战数据
    expected_intermediate: "降级为仅视频理解，标注赛事数据缺失，不臆测名次"
    expected_output: "高光候选按精彩度入选并标注待补数据；脚本不生成未经核实的事实"
    notes: "测试知识盲区下的降级与诚实边界"
