  domain: "海外销售 · 赛事营销内容生产（WSBK 赛事内容工厂）"
  scenario: "赛事内容工厂"
  problemRef: "承接《AI赛事内容工厂》画布 userPains①：WSBK 赛事素材量大、人工剪辑耗时巨大且难以及时产出；②多语言内容制作成本高需雇佣本地化团队；③各平台格式要求不同人工适配效率低；④赛事热点转瞬即逝、内容产出速度跟不上传播窗口。"
  opportunitySource: "AI 机会场景地图 / AI 原生海外销售工作流 · 全球内容触达与需求激发（AI 内容工厂）"

opportunities:
  - id: "OP1"
    order: 1
    name: "赛事内容工厂 · WSBK 高光多语言内容自动生产 Agent"
    type: "innovation"
    rootCauseType: "素材量大靠人工剪辑 + 多语言本地化靠外包 + 平台适配重复劳动 + 传播窗口时效性强"
    capabilityMatch: "Agent / 多模态视频理解 / 语言理解与生成 / 语音合成 / 图像生成"
    e1: "为品牌内容经理与社媒运营构建「赛事内容工厂」，把 WSBK 赛事内容生产从「人工剪辑 + 外包本地化 + 手工适配平台」升级为「多模态赛事理解 → 高光片段识别 → 多语言脚本与配音 → 自动剪辑与品牌包装 → 平台格式适配 → 发布排期 → 效果回流」的 Agent 主驱动流水线，达成赛事热点分钟级出片、6 语言同步产出。"
    e2: "角色：品牌内容经理（设定品牌调性与内容红线、终审放行）、社媒运营专员（选择目标市场与语言、审核排期）、海外市场营销（内容策略与投放协同）、赛事运营负责人（提供 WSBK 原始素材）。\n场景：WSBK 分站比赛结束 → 上传原始赛事素材（视频/音频/数据）并选择目标市场语言 → Agent 自动识别高光、生成 6 语言解说与成品、适配各平台并排期发布，全程保留品牌红线人工放行。"
    e3: "WSBK 赛事素材量大、人工逐帧剪辑耗时巨大，单条内容产出约 3 天，跟不上赛事热点传播窗口；多语言内容依赖雇佣本地化团队，成本高；YouTube/TikTok/Instagram/Reels 各平台时长、比例、标签规范不同，人工适配效率低；社媒运营需 5 人支撑，人力瓶颈明显。"
    e4: "用 Agent 编排确定性服务（多模态视频理解 / 高光打分引擎 / 剪辑与合成 API / 平台适配引擎 / 社媒发布 API）按统一口径批量执行；LLM 负责多语言解说脚本生成、赛事数据到叙事的长尾理解与文化本地化改写；TTS/图像模型负责配音与封面缩略图；「对外发布」与「品牌调性/内容红线」保留人工闸门与规则护栏兜底 → 把赛事内容产出时效向 30 分钟、多语言单位成本向下降 90% 收敛。"
    e5: "赛事内容产出速度从 3 天缩短至 30 分钟；多语言内容制作成本降低 90%；内容互动率提升 35%（AI 精准把握高光时刻）；社媒运营人力需求从 5 人降至 1 人。"
    valueBreakdown:
      - dimension: "覆盖范围"
        aligns: "⑥ 影响范围"
        metric: "WSBK 全站赛事素材；6 语言（英/法/德/西/意/葡）；覆盖 YouTube/TikTok/Instagram/Reels 全平台；受益角色：品牌内容经理 + 社媒运营专员 + 海外市场营销 + 赛事运营负责人"
      - dimension: "发生频度"
        aligns: "⑤ 发生频度"
        metric: "随 WSBK 分站赛程高频触发（每站多轮比赛 + 日常高光二次剪辑），社媒日更 3-5 条多平台内容"
      - dimension: "单次收益"
        aligns: "⑦ 每次发生对业务的影响"
        metric: "单条内容产出 3 天 → 30 分钟；多语言本地化由外包转 AI 自产，单位制作成本下降 90%；人工平台适配转自动适配"
      - dimension: "累计影响"
        aligns: "⑧ 累计对业务影响"
        metric: "内容互动率 +35%；社媒运营人力 5 人 → 1 人；支撑增长维度 KPI（社媒粉丝 500,000+、官网月访问 100,000+）与北极星『海外月度新增车主数』的内容获客底盘"
