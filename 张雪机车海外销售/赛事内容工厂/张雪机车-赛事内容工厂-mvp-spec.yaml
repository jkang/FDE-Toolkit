meta:
  projectName: "zxmoto-race-content-factory"
  productName: "ZXMOTO 赛事内容工厂 Agent"
  businessDomain: "赛事内容营销"
  frontend: "react"
  designSystem: "antd"
  theme:
    source: "user"
    primary: "#0958d9"
    accent: "#faad14"
    layout: "side"
  ports:
    dev: 5273
    api: 18080
personas:
  - id: "brand_manager"
    name: "林岚"
    role: "品牌内容经理"
    department: "海外市场部 · 品牌组"
    goals:
      - "赛事热点第一时间出片，又不失品牌调性一致性"
      - "对外内容零红线风险，审核不被反复返工"
  - id: "social_ops"
    name: "苏晴"
    role: "社媒运营专员"
    department: "海外市场部 · 内容运营组"
    goals:
      - "脚本事实与调性抽检一次通过，排期不错过传播窗口"
      - "6 语言内容一次产出，不再等外包本地化"
  - id: "race_ops"
    name: "陈拓"
    role: "赛事运营负责人"
    department: "赛事运营部"
    goals:
      - "原始素材一次上传即进入工厂，不必配合逐帧剪辑"
      - "素材授权清晰，避免发布后被版权追责"
scenarios:
  - id: "s1"
    name: "分站赛后紧急出片"
    personaId: "race_ops"
    trigger: "WSBK 荷兰站比赛结束，赛事运营负责人上传原始素材，要求抢占热点传播窗口"
    goal: "单站素材在 30 分钟内产出高光短视频，不再等人工逐帧剪辑"
  - id: "s2"
    name: "6 语言同步发布"
    personaId: "social_ops"
    trigger: "高光脚本确认后，需一次产出 6 语言版本并适配 YouTube/TikTok/Instagram/Reels"
    goal: "6 语言 × 4 平台内容包一次产出并排期，多语言单位成本下降 90%"
  - id: "s3"
    name: "效果回流与下轮策略"
    personaId: "brand_manager"
    trigger: "内容发布后回收互动数据，需归因并优化下轮高光偏好与内容策略"
    goal: "把互动效果归因到高光类型/脚本风格/平台/时段，更新高光偏好权重"
dataModels:
  - name: "HighlightCandidate"
    description: "高光候选（四因子打分）"
    fields:
      - { key: "code", title: "高光编号", type: "string" }
      - { key: "eventType", title: "事件类型", type: "string" }
      - { key: "score", title: "高光分", type: "number" }
      - { key: "brandVisibility", title: "品牌露出", type: "string" }
      - { key: "status", title: "处理状态", type: "string" }
    mockData:
      - { code: "HL-01", eventType: "夺冠冲线", score: 96, brandVisibility: "高", status: "置顶封面级" }
      - { code: "HL-02", eventType: "贴身超车", score: 91, brandVisibility: "中", status: "入选" }
      - { code: "HL-03", eventType: "极限压弯", score: 84, brandVisibility: "低", status: "补加角标" }
  - name: "ContentAsset"
    description: "内容成品/内容包（多语言 × 多平台）"
    fields:
      - { key: "code", title: "内容编号", type: "string" }
      - { key: "languages", title: "语言", type: "string" }
      - { key: "platforms", title: "适配平台", type: "string" }
      - { key: "reviewStatus", title: "审核状态", type: "string" }
    mockData:
      - { code: "CA-0901-01", languages: "6 语言", platforms: "YouTube/TikTok/Reels", reviewStatus: "待审核" }
      - { code: "CA-0901-02", languages: "6 语言", platforms: "YouTube/TikTok", reviewStatus: "已放行" }
      - { code: "CA-0831-05", languages: "6 语言", platforms: "全平台", reviewStatus: "已发布" }
  - name: "PublishRecord"
    description: "发布记录"
    fields:
      - { key: "code", title: "发布编号", type: "string" }
      - { key: "market", title: "目标市场", type: "string" }
      - { key: "platform", title: "平台", type: "string" }
      - { key: "publishTime", title: "发布时间", type: "string" }
      - { key: "status", title: "状态", type: "string" }
    mockData:
      - { code: "PUB-0901-01", market: "北美", platform: "YouTube", publishTime: "2026-09-01 22:10", status: "已发布" }
      - { code: "PUB-0901-02", market: "欧洲", platform: "TikTok", publishTime: "2026-09-01 21:40", status: "已发布" }
      - { code: "PUB-0901-03", market: "拉美", platform: "Instagram", publishTime: "2026-09-02 08:00", status: "排队中" }
  - name: "PerformanceMetric"
    description: "效果归因指标"
    fields:
      - { key: "highlightType", title: "高光类型", type: "string" }
      - { key: "engagementRate", title: "互动率", type: "string" }
      - { key: "sampleSize", title: "样本量", type: "string" }
      - { key: "trend", title: "相对基准", type: "string" }
    mockData:
      - { highlightType: "夺冠/反超", engagementRate: "9.8%", sampleSize: "42 条", trend: "高于均值 35%" }
      - { highlightType: "贴身超车", engagementRate: "7.4%", sampleSize: "31 条", trend: "高于均值 12%" }
      - { highlightType: "极限动作", engagementRate: "5.1%", sampleSize: "28 条", trend: "接近均值" }
pages:
  - id: "dashboard"
    title: "内容工厂总览"
    route: "/dashboard"
    icon: "DashboardOutlined"
    description: "赛事内容工厂北极星贡献看板：内容产出时效 3 天 → 30 分钟，多语言成本 ↓90%"
    actions: []
    sections:
      - type: "steps"
        current: 0
        items: ["素材接入", "高光识别", "脚本生成", "剪辑配音", "平台适配", "审核发布", "效果回流"]
      - type: "statRow"
        stats:
          - { label: "内容产出时效", value: "30", suffix: "分钟（原 3 天）" }
          - { label: "多语言单位成本", value: "↓90", suffix: "%" }
          - { label: "内容互动率", value: "↑35", suffix: "%" }
          - { label: "社媒运营人力", value: "1", suffix: "人（原 5 人）" }
      - type: "alert"
        level: "info"
        message: "场景定位：AI 赛事内容工厂"
        description: "WSBK 高光 → 多语言解说短视频/图文 → 多平台适配发布 → 效果回流；Agent 主驱动，人工仅在品牌价值判断与风险兜底介入"
      - type: "table"
        title: "我的内容包"
        data: "mock:ContentAsset"
        columns:
          - { key: "code", title: "内容编号" }
          - { key: "languages", title: "语言" }
          - { key: "platforms", title: "适配平台" }
          - { key: "reviewStatus", title: "审核状态", tag: { "待审核": "warning", "已放行": "processing", "已发布": "success" } }
      - type: "buttonRow"
        buttons:
          - { text: "开始内容生产", type: "primary", action: "navigate:/ingest" }
  - id: "ingest"
    title: "素材接入与高光识别"
    route: "/ingest"
    icon: "CloudUploadOutlined"
    description: "上传 WSBK 原始素材，Agent 多模态理解并四因子打分产出高光候选"
    actions:
      - { name: "parseFootage", button: "多模态理解素材" }
      - { name: "scoreHighlights", button: "高光识别与打分" }
    sections:
      - type: "steps"
        current: 0
        items: ["素材接入", "高光识别", "脚本生成", "剪辑配音", "平台适配", "审核发布", "效果回流"]
      - type: "uploadCard"
        title: "WSBK 原始赛事素材"
        accept: ".mp4,.mov,.mkv,.wav,.zip,.json"
        hint: "示例：WSBK-荷兰站-全程素材-42GB（自动切分镜头、关联赛事数据、标注品牌露出）"
        action: "parseFootage"
      - type: "aiResultCard"
        title: "多模态理解结果"
        bind: "parseFootage"
        render: "table"
        columns:
          - { key: "clip", title: "镜头" }
          - { key: "eventType", title: "事件类型" }
          - { key: "brandVisibility", title: "品牌露出" }
          - { key: "confidence", title: "置信度" }
      - type: "buttonRow"
        buttons:
          - { text: "高光识别与打分（四因子）", type: "primary", action: "scoreHighlights" }
      - type: "aiResultCard"
        title: "高光候选清单"
        bind: "scoreHighlights"
        render: "table"
        columns:
          - { key: "code", title: "高光编号" }
          - { key: "eventType", title: "事件类型" }
          - { key: "score", title: "高光分" }
          - { key: "brandVisibility", title: "品牌露出", tag: { "高": "success", "中": "processing", "低": "warning" } }
          - { key: "status", title: "处理状态", tag: { "置顶封面级": "error", "入选": "success", "补加角标": "warning" } }
      - type: "alert"
        level: "info"
        message: "高光打分四因子"
        description: "品牌相关度 ＞ 叙事价值 ＞ 精彩度 ＞ 历史互动偏好；高光分低于阈值或候选不足 → 回退候选池或拉人判定"
      - type: "buttonRow"
        buttons:
          - { text: "进入脚本生成", type: "primary", action: "navigate:/script-clip" }
  - id: "script-clip"
    title: "多语言脚本与剪辑"
    route: "/script-clip"
    icon: "HighlightOutlined"
    description: "基于叙事要素生成 6 语言解说脚本并本地化改写，随后自动剪辑配音包装"
    actions:
      - { name: "generateScript", button: "生成 6 语言脚本" }
    sections:
      - type: "steps"
        current: 2
        items: ["素材接入", "高光识别", "脚本生成", "剪辑配音", "平台适配", "审核发布", "效果回流"]
      - type: "buttonRow"
        buttons:
          - { text: "生成 6 语言解说脚本", type: "primary", action: "generateScript" }
      - type: "aiResultCard"
        title: "多语言解说脚本（钩子 → 高潮 → 结果 → CTA）"
        bind: "generateScript"
        render: "kv"
      - type: "alert"
        level: "warning"
        message: "文化本地化红线"
        description: "命中文化禁忌/敏感表述自动改写或降级，仍冲突则拉人（品牌内容经理）裁决；某语种配音合成失败切换备用 TTS"
      - type: "timeline"
        items:
          - { title: "自动剪辑高光片段", color: "green" }
          - { title: "6 语言配音与字幕合成", color: "green" }
          - { title: "品牌元素与封面包装", color: "blue" }
      - type: "buttonRow"
        buttons:
          - { text: "脚本确认 → 平台适配", type: "primary", action: "navigate:/platform-adapt" }
  - id: "platform-adapt"
    title: "平台适配与内容包"
    route: "/platform-adapt"
    icon: "MobileOutlined"
    description: "按 YouTube/TikTok/Instagram/Reels 硬规范适配时长/比例/编码并生成标签与 SEO 图文"
    actions:
      - { name: "adaptPlatforms", button: "一键适配内容包" }
    sections:
      - type: "steps"
        current: 4
        items: ["素材接入", "高光识别", "脚本生成", "剪辑配音", "平台适配", "审核发布", "效果回流"]
      - type: "buttonRow"
        buttons:
          - { text: "一键适配 4 平台内容包", type: "primary", action: "adaptPlatforms" }
      - type: "aiResultCard"
        title: "多平台适配内容包"
        bind: "adaptPlatforms"
        render: "table"
        columns:
          - { key: "platform", title: "平台" }
          - { key: "ratio", title: "比例" }
          - { key: "duration", title: "时长" }
          - { key: "status", title: "状态", tag: { "已适配": "success", "拆条": "warning", "超限": "error" } }
      - type: "alert"
        level: "info"
        message: "标签与 SEO 图文"
        description: "标签按品牌词/赛事词/品类词/热点词四类组合；标题含赛事+车手+结果，禁止标题党与无关热词堆砌"
      - type: "buttonRow"
        buttons:
          - { text: "送品牌审核", type: "primary", action: "navigate:/review-publish" }
  - id: "review-publish"
    title: "品牌审核与发布"
    route: "/review-publish"
    icon: "SafetyCertificateOutlined"
    description: "品牌调性/内容红线/事实三级校验（对外必停），放行后按热点窗口排期发布"
    actions:
      - { name: "reviewCompliance", button: "品牌合规校验" }
      - { name: "publishContent", button: "确认放行并发布" }
    sections:
      - type: "steps"
        current: 5
        items: ["素材接入", "高光识别", "脚本生成", "剪辑配音", "平台适配", "审核发布", "效果回流"]
      - type: "buttonRow"
        buttons:
          - { text: "品牌调性与内容红线校验", type: "primary", action: "reviewCompliance" }
      - type: "aiResultCard"
        title: "品牌合规校验结果（调性/红线/事实）"
        bind: "reviewCompliance"
        render: "table"
        columns:
          - { key: "item", title: "校验项" }
          - { key: "result", title: "结论" }
          - { key: "status", title: "状态", tag: { "通过": "success", "待复核": "warning", "拦截": "error" } }
      - type: "alert"
        level: "warning"
        message: "对外必停确认（HITL gate）"
        description: "AI 无权代替品牌承诺：红线命中或事实重大错误一票否决；品牌调性与内容红线终审须人工放行后方可发布"
      - type: "buttonRow"
        buttons:
          - { text: "确认放行并排期发布", type: "primary", action: "publishContent" }
      - type: "aiResultCard"
        title: "发布结果"
        bind: "publishContent"
        render: "kv"
      - type: "buttonRow"
        buttons:
          - { text: "查看效果回流", type: "default", action: "navigate:/feedback" }
  - id: "feedback"
    title: "效果回流与策略优化"
    route: "/feedback"
    icon: "LineChartOutlined"
    description: "互动数据归因到高光类型/脚本风格/平台/时段，样本充分时更新高光偏好权重"
    actions:
      - { name: "attributePerformance", button: "AI 效果归因" }
    sections:
      - type: "steps"
        current: 6
        items: ["素材接入", "高光识别", "脚本生成", "剪辑配音", "平台适配", "审核发布", "效果回流"]
      - type: "statRow"
        stats:
          - { label: "内容互动率", value: "↑35", suffix: "%" }
          - { label: "归因样本量", value: 101, suffix: " 条" }
          - { label: "高光偏好更新", value: 3, suffix: " 类" }
          - { label: "内容合规通过率", value: "100", suffix: "%" }
      - type: "buttonRow"
        buttons:
          - { text: "AI 效果归因", type: "primary", action: "attributePerformance" }
      - type: "aiResultCard"
        title: "效果归因结论"
        bind: "attributePerformance"
        render: "table"
        columns:
          - { key: "highlightType", title: "高光类型" }
          - { key: "engagementRate", title: "互动率" }
          - { key: "sampleSize", title: "样本量" }
          - { key: "trend", title: "相对基准" }
      - type: "table"
        title: "发布记录"
        data: "mock:PublishRecord"
        columns:
          - { key: "code", title: "发布编号" }
          - { key: "market", title: "目标市场" }
          - { key: "platform", title: "平台" }
          - { key: "publishTime", title: "发布时间" }
          - { key: "status", title: "状态", tag: { "已发布": "success", "排队中": "processing", "失败": "error" } }
      - type: "alert"
        level: "success"
        message: "策略已优化"
        description: "样本充分时更新高光偏好权重；样本不足/波动大则保守微调或不调整，避免被噪声带偏"
aiMocks:
  - name: "parseFootage"
    latency: 1200
    response:
      summary: "已多模态理解 WSBK 荷兰站素材，识别镜头 1,286 段、赛事事件 57 个，关联 ZXMOTO 车手 2 名、品牌露出 23 处"
      items:
        - { clip: "冲线镜头", eventType: "夺冠", brandVisibility: "高", confidence: "98%" }
        - { clip: "第 14 圈超车", eventType: "超车", brandVisibility: "中", confidence: "93%" }
        - { clip: "第 6 圈压弯", eventType: "极限动作", brandVisibility: "低", confidence: "81%" }
        - { clip: "维修区回放", eventType: "慢镜回放", brandVisibility: "低", confidence: "64%（待复核）" }
  - name: "scoreHighlights"
    latency: 1100
    response:
      summary: "按精彩度/叙事价值/品牌相关度/历史互动偏好四因子打分，产出高光候选 Top 3"
      items:
        - { code: "HL-01", eventType: "夺冠冲线", score: 96, brandVisibility: "高", status: "置顶封面级" }
        - { code: "HL-02", eventType: "贴身超车", score: 91, brandVisibility: "中", status: "入选" }
        - { code: "HL-03", eventType: "极限压弯", score: 84, brandVisibility: "低", status: "补加角标" }
  - name: "generateScript"
    latency: 1400
    response:
      reply: "已生成 6 语言解说脚本（事实一致、逐语言本地化）"
      英文脚本: "Hook: ZXMOTO seals the win in the final corner! Build-up: lap 14 overtake... Payoff: P1. CTA: #ZXMOTO #WSBK"
      法文脚本: "Accroche : ZXMOTO s'impose dans le dernier virage ! ... CTA : #ZXMOTO #WSBK"
      德文脚本: "Hook: ZXMOTO siegt in der letzten Kurve! ... CTA: #ZXMOTO #WSBK"
      西文脚本: "Gancho: ¡ZXMOTO gana en la última curva! ... CTA: #ZXMOTO #WSBK"
      意文脚本: "Hook: ZXMOTO vince all'ultima curva! ... CTA: #ZXMOTO #WSBK"
      葡文脚本: "Gancho: ZXMOTO vence na última curva! ... CTA: #ZXMOTO #WSBK"
      事实校验: "车手/名次/圈速与 WSBK 赛事数据一致"
      本地化提示: "某语言命中宗教禁忌表述，已自动改写；品牌名与话题标签齐全"
  - name: "adaptPlatforms"
    latency: 1000
    response:
      summary: "按各平台硬规范适配完成，超限自动裁切/拆条"
      items:
        - { platform: "YouTube", ratio: "16:9", duration: "58s", status: "已适配" }
        - { platform: "TikTok", ratio: "9:16", duration: "34s", status: "已适配" }
        - { platform: "Instagram Reels", ratio: "9:16", duration: "30s", status: "已适配" }
        - { platform: "Instagram Feed", ratio: "1:1", duration: "30s", status: "拆条" }
  - name: "reviewCompliance"
    latency: 900
    response:
      summary: "品牌调性、内容红线、事实准确性三级校验完成"
      items:
        - { item: "品牌调性一致性", result: "一致", status: "通过" }
        - { item: "内容红线命中", result: "0 项命中", status: "通过" }
        - { item: "事实准确性", result: "与赛事数据一致", status: "通过" }
        - { item: "某语言本地化表述", result: "建议优化（非红线）", status: "待复核" }
  - name: "attributePerformance"
    latency: 1000
    response:
      summary: "样本充分，归因结论可追溯；已更新高光偏好权重"
      items:
        - { highlightType: "夺冠/反超", engagementRate: "9.8%", sampleSize: "42 条", trend: "高于均值 35%" }
        - { highlightType: "贴身超车", engagementRate: "7.4%", sampleSize: "31 条", trend: "高于均值 12%" }
        - { highlightType: "极限动作", engagementRate: "5.1%", sampleSize: "28 条", trend: "接近均值" }
businessMocks:
  - name: "getPublishRecords"
    system: "socialPlatform"
    latency: 300
    response:
      items:
        - { code: "PUB-0901-01", market: "北美", platform: "YouTube", publishTime: "2026-09-01 22:10", status: "已发布" }
        - { code: "PUB-0901-02", market: "欧洲", platform: "TikTok", publishTime: "2026-09-01 21:40", status: "已发布" }
        - { code: "PUB-0901-03", market: "拉美", platform: "Instagram", publishTime: "2026-09-02 08:00", status: "排队中" }
  - name: "publishContent"
    system: "socialPlatform"
