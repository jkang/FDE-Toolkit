title: "张雪机车 · 赛事内容工厂 To-be 旅程设计"
meta:
  mode: "to-be"
  source: "AI画布: 张雪机车海外销售/赛事内容工厂/张雪机车-赛事内容工厂-AI画布.yaml"
  scenarioName: "赛事内容工厂"
  productType: "AI 内容生产工作台（Web 端）+ 发布自动化插件 + 内容效果追踪仪表盘"
personas:
  - id: "brand_manager"
    name: "林岚"
    role: "品牌内容经理"
    department: "张雪机车海外市场部 · 品牌组"
    background: "负责 ZXMOTO 海外品牌调性、VI 规范与内容红线，对每一条对外内容终审放行，日均审核 30+ 条多平台内容"
    goals:
      - "赛事热点第一时间出片，又不失品牌调性一致性"
      - "对外内容零红线风险，审核不被反复返工"
    painPoints:
      - "内容多、审核慢，人工逐条核对调性与红线成为发布瓶颈"
      - "多语言版本逐语言判断禁忌，凭经验容易漏判"
    dataProfile:
      typicalValues:
        - "品牌调性与内容红线清单（<100 条红线条款）、品牌 VI 规范（Logo/配色/字体/角标）"
        - "待审内容包：单站赛后 6 语言 × 4 平台 = 24 条内容待放行"
      frequency: "高频"
      commonErrors:
        - "多语言禁忌漏判（某语言命中宗教/政治敏感）"
        - "为赶热点跳过事实核对"
  - id: "social_ops"
    name: "苏晴"
    role: "社媒运营专员"
    department: "张雪机车海外市场部 · 内容运营组"
    background: "负责 YouTube/TikTok/Instagram/Reels 多平台内容运营，选择目标市场与语言、抽检脚本、审核排期，日常支撑日更 3-5 条多平台内容"
    goals:
      - "脚本事实与调性抽检一次通过，排期不错过传播窗口"
      - "6 语言内容一次产出，不再等外包本地化"
    painPoints:
      - "逐平台手工调整比例/时长/标签，重复劳动多"
      - "赛事热点转瞬即逝，人工剪辑与本地化跟不上窗口"
    dataProfile:
      typicalValues:
        - "目标市场清单（英/法/德/西/意/葡 6 语言）；各平台内容规范（时长/比例/标签）"
        - "高光候选：夺冠冲线 96 分 / 贴身超车 91 分 / 极限压弯 84 分"
      frequency: "高频"
      commonErrors:
        - "平台时长超限未裁切直接发布"
        - "排期只按本地时段、错过热点黄金窗口"
  - id: "race_ops"
    name: "陈拓"
    role: "赛事运营负责人"
    department: "张雪机车赛事运营部"
    background: "随 WSBK 分站赛程提供原始赛事素材与赛事数据，是内容生产的素材源头"
    goals:
      - "原始素材一次上传即进入工厂，不必配合逐帧剪辑"
      - "素材授权清晰，避免发布后被版权追责"
    painPoints:
      - "单站素材体量大，人工整理与标注耗时"
      - "素材授权状态不清，易造成合规隐患"
    dataProfile:
      typicalValues:
        - "WSBK 原始赛事素材（视频/音频/赛事数据），单站数十 GB 级 [待确认]"
        - "赛事数据库：车手/分站成绩/历史对战"
      frequency: "随分站赛程（高频）"
      commonErrors:
        - "素材授权未 cleared 即提交"
        - "赛事数据与画面时间轴不同步"
handoff:
  paths:
    - "主路径：上传素材 → 确认高光 → 抽检脚本 → 审阅成片 → 适配内容包 → 品牌终审 → 发布 → 效果回流"
    - "分支：高光分低于阈值/候选不足 → 回退候选池或拉人判定"
    - "异常：命中文化禁忌/事实不符 → 自动改写或退回重生成，仍冲突则拉人"
    - "边界：触碰品牌红线 → 拦截，禁止未放行即对外发布"
scenarios:
  - id: "s1"
    name: "分站赛后紧急出片"
    personaId: "race_ops"
    trigger: "WSBK 荷兰站比赛结束，赛事运营负责人上传原始素材，要求抢占热点传播窗口"
    businessData:
      - "WSBK 荷兰站全程素材（视频/音频/赛事数据）"
      - "赛事数据库：车手信息、分站成绩、历史对战"
    goal: "单站素材在 30 分钟内产出高光短视频，不再等人工逐帧剪辑"
  - id: "s2"
    name: "6 语言同步发布"
    personaId: "social_ops"
    trigger: "高光脚本确认后，需一次产出 6 语言版本并适配 YouTube/TikTok/Instagram/Reels"
    businessData:
      - "6 语言解说脚本、品牌 VI 规范、各平台内容规范"
      - "各平台时长/比例/编码/标签规范"
    goal: "6 语言 × 4 平台内容包一次产出并排期，多语言单位成本下降 90%"
  - id: "s3"
    name: "效果回流与下轮策略"
    personaId: "brand_manager"
    trigger: "内容发布后回收互动数据，需归因并优化下轮高光偏好与内容策略"
    businessData:
      - "互动与转化效果数据（播放/互动/涨粉/转化）"
      - "历史高互动内容素材库"
    goal: "把互动效果归因到高光类型/脚本风格/平台/时段，更新高光偏好权重"
stages:
  - name: "素材接入与理解"
    actions:
      - name: "上传 WSBK 原始赛事素材"
        owner: "赛事运营负责人"
        touchpoints: "内容工厂工作台 · 素材接入区"
        thoughts:
          - "希望素材一次上传就自动切分镜头、关联赛事数据，不用我再整理"
        userInputs:
          - type: "文件上传"
            name: "WSBK 原始赛事素材"
            format: "视频/音频/赛事数据"
            example: "WSBK-荷兰站-全程素材-42GB"
            content: "原始视频、音频、赛事数据（车手/成绩/历史对战）"
        aiInteraction:
          aiAction: "多模态理解赛事素材，切分镜头并标注赛事事件，关联 WSBK 赛事数据库补齐叙事上下文"
          suggestions:
            - "多模态理解本场素材"
            - "关联赛事数据库上下文"
            - "标注品牌露出位置与时点"
        visibleData:
          - "素材已入库：42GB，识别镜头 1,286 段、赛事事件 57 个"
          - "关联结果：ZXMOTO 车手 2 名、品牌露出 23 处，其中 4 处露出过短已标注待复核"
        designNotes:
          - "素材整理与镜头标注由人工数小时降至 Agent 分钟级"
          - "低置信度镜头标注待复核，不进入高光候选"
      - name: "设定目标市场语言与品牌调性"
        owner: "品牌内容经理"
        touchpoints: "内容工厂工作台 · 生成指令区"
        thoughts:
          - "调性和红线要一次性下发给 Agent，别让我每条内容重复交代"
        userInputs:
          - type: "表单录入"
            name: "生成指令（语言/平台/调性/红线）"
            format: "页面内选择 + 文本"
            example: "6 语言（英/法/德/西/意/葡）· 4 平台 · 品牌调性：进取/克制/赛事感"
            content: "目标市场、目标语言、目标平台、品牌调性、内容红线"
        aiInteraction:
          aiAction: "将目标市场/语言/调性与内容红线写入本次任务上下文，作为全流程约束"
          suggestions:
            - "下发默认 6 语言与 4 平台"
            - "导入品牌调性与内容红线清单"
        visibleData:
          - "生成指令已生效：6 语言 × 4 平台"
          - "内容红线已加载：<100 条红线条款，命中即拦截"
        designNotes:
          - "调性与红线一次设定、全程约束，避免逐条重复"
          - "目标市场未覆盖时回退默认 6 语言并提示"

  - name: "高光识别与脚本生成"
    actions:
      - name: "确认高光候选"
        owner: "社媒运营专员"
        touchpoints: "内容工厂工作台 · 高光候选区"
        thoughts:
          - "高光分怎么来的我要看得懂，品牌露出弱的镜头要能补足"
        userInputs:
          - type: "系统自动带入"
            name: "镜头语义标签 + 事件时间轴 + 历史高互动素材库"
            format: "Agent 中间产物"
            example: "夺冠冲线 96 分 / 贴身超车 91 分 / 极限压弯 84 分"
            content: "镜头事件类型、精彩度、叙事价值、品牌相关度、历史互动偏好"
        aiInteraction:
          aiAction: "按精彩度/叙事价值/品牌相关度/历史互动偏好四因子打分，产出高光候选清单并标注置信度"
          suggestions:
            - "查看高光打分依据"
            - "为品牌露出弱的镜头补加角标"
            - "将夺冠高光置顶为封面级"
        visibleData:
          - "高光候选 Top 3：夺冠冲线 96 分（品牌相关度高）、贴身超车 91 分、极限压弯 84 分"
          - "低置信度镜头 6 段已标注待复核，未计入候选"
        designNotes:
          - "高光选择由经验拍脑袋转为可解释四因子打分"
          - "高光分低于阈值/候选不足 → 回退候选池或拉人判定"
      - name: "抽检多语言解说脚本"
        owner: "社媒运营专员"
        touchpoints: "内容工厂工作台 · 多语言脚本区"
        thoughts:
          - "6 语言脚本事实要一致，别出现直译腔或文化冒犯"
        userInputs:
          - type: "系统自动带入"
            name: "叙事要素 + 品牌调性 + 文化偏好与禁忌库"
            format: "Agent 中间产物"
            example: "钩子→高潮→结果→品牌 CTA；6 语言事实一致"
            content: "车手/名次/超车/圈速、品牌调性用语、各市场本地化表达"
        aiInteraction:
          aiAction: "先锁定叙事要素再逐语言本地化生成脚本，命中文化禁忌自动改写或降级"
          suggestions:
            - "抽检事实与赛事数据一致性"
            - "查看某语言命中禁忌的改写"
            - "确认并放行脚本"
        visibleData:
          - "6 语言脚本已生成，事实与赛事数据一致"
          - "本地化提示：某语言命中宗教禁忌表述，已自动改写；品牌名与话题标签齐全"
        designNotes:
          - "多语言由 LLM 自产替代外包团队，单位成本下降 90%"
          - "命中文化禁忌/敏感表述 → 改写或降级，仍冲突则拉人"

  - name: "智能剪辑、配音与品牌包装"
    actions:
      - name: "审阅成片与品牌包装"
        owner: "品牌内容经理"
        touchpoints: "内容工厂工作台 · 成片预览区"
        thoughts:
          - "成片要符合 VI，品牌元素不能压住关键画面"
        userInputs:
          - type: "系统自动带入"
            name: "已确认脚本 + 高光片段 + 品牌 VI 规范"
            format: "Agent 中间产物"
            example: "粗剪高光 + 6 语言配音字幕 + 品牌角标/封面"
            content: "剪辑成片、多语言配音字幕、品牌元素与封面缩略图"
        aiInteraction:
          aiAction: "按脚本节奏自动剪辑、调用 TTS 合成 6 语言配音字幕，并按 VI 规范叠加品牌元素与封面"
          suggestions:
            - "预览成片与配音字幕"
            - "检查品牌元素是否符合 VI"
            - "回退标准包装模板"
        visibleData:
          - "成片已生成：6 语言配音字幕齐全，品牌角标/片尾/封面符合 VI"
          - "异常兜底：某语种配音合成失败 → 切换备用 TTS 成功"
        designNotes:
          - "剪辑、配音、包装由确定性服务批量执行，产出时效大幅提升"
          - "品牌元素不符 VI → 回退标准包装模板"

  - name: "多平台格式适配与内容包"
    actions:
      - name: "确认多平台内容包"
        owner: "社媒运营专员"
        touchpoints: "内容工厂工作台 · 内容包适配区"
        thoughts:
          - "各平台时长/比例不一样，别再让我手工裁切与改标签"
        userInputs:
          - type: "系统自动带入"
            name: "成片 + 各平台内容规范 + SEO 关键词"
            format: "Agent 中间产物"
            example: "YouTube 16:9 58s / TikTok 9:16 34s / Reels 9:16 30s"
            content: "平台时长/比例/编码规范、标签集、SEO 图文"
        aiInteraction:
          aiAction: "按各平台硬规范适配时长/比例/编码，超限自动裁切或拆条，生成标签集与 SEO 图文"
          suggestions:
            - "一键适配 4 平台内容包"
            - "查看平台时长/比例适配结果"
            - "编辑标签与 SEO 图文"
        visibleData:
          - "内容包已生成：YouTube 16:9 58s / TikTok 9:16 34s / Instagram Reels 9:16 30s"
          - "标签集：品牌词 + WSBK + 车手 + 结果钩子四类齐全；SEO 图文已生成"
        designNotes:
          - "平台适配由规则引擎批量执行，人工适配效率大幅提升"
          - "超出平台时长限制 → 自动裁切/拆条并标注"

  - name: "品牌审核与发布编排"
    actions:
      - name: "品牌调性与内容红线终审"
        owner: "品牌内容经理"
        touchpoints: "内容工厂工作台 · 品牌审核待办"
        thoughts:
          - "红线必须一票否决，调性偏差可以退回改，但绝不能未审就发"
        userInputs:
          - type: "审核确认"
            name: "多平台内容包 + 品牌调性/内容红线"
            format: "审核清单"
            example: "调性一致 / 无红线命中 / 事实准确 → 放行"
            content: "品牌调性一致性、内容红线命中、事实准确性三级校验"
        aiInteraction:
          aiAction: "对内容包做品牌调性、内容红线与事实准确性三级校验，标记风险项并给出修改建议"
          suggestions:
            - "放行进入排期发布"
            - "退回修改后重新送审"
            - "拦截并升级（红线命中）"
        visibleData:
          - "审核结果：调性一致、无红线命中、事实准确 → 建议放行"
          - "风险提示：0 项红线命中；1 项调性表述建议优化（非红线）"
        designNotes:
          - "对外必停确认，AI 无权代替品牌承诺"
          - "红线命中/事实重大错误 → 一票否决并升级品牌内容经理"
      - name: "确认发布排期与发布"
        owner: "社媒运营专员"
        touchpoints: "内容工厂工作台 · 发布排期看板"
        thoughts:
          - "热点转瞬即逝，排期要抢黄金窗口，发布失败别静默丢失"
        userInputs:
          - type: "系统自动带入"
            name: "放行内容包 + 历史发布时间与互动数据"
            format: "排期建议"
            example: "赛后 2 小时内抢热点窗口发布，后续补发第二波"
            content: "目标市场时区、历史时段互动、热点时效窗口"
        aiInteraction:
          aiAction: "结合时区、历史互动与热点窗口生成发布排期，经社媒管理平台自动发布并回收状态"
          suggestions:
            - "按热点窗口立即排期"
            - "调整发布时间"
            - "查看发布状态"
        visibleData:
          - "发布排期：赛后 2h 内 6 语言 × 4 平台分波发布，抢热点黄金窗口"
          - "发布状态：YouTube/TikTok 已发布，Instagram/Reels 排队中"
        designNotes:
          - "热点时效性 ＞ 本地活跃时段，抢赛事传播黄金期"
          - "发布失败/账号异常 → 重试 2 次转人工；档期冲突/热点过期 → 顺延或提示"

  - name: "效果追踪与内容策略反馈"
    actions:
      - name: "查看效果回流与策略优化"
        owner: "品牌内容经理"
        touchpoints: "内容工厂工作台 · 效果回流仪表盘"
        thoughts:
          - "数据不够就别乱改策略，要看哪类高光真的能引爆"
        userInputs:
          - type: "系统自动带入"
            name: "互动指标数据集 + 历史高互动素材库"
            format: "分析数据"
            example: "夺冠类高光互动率高于均值 35%，样本量充分"
            content: "播放、互动、涨粉、转化数据；高光类型/脚本风格/平台/时段归因"
        aiInteraction:
          aiAction: "对效果数据做归因分析，样本充分时更新高光偏好权重并输出内容策略优化建议"
          suggestions:
            - "查看效果归因结论"
            - "采纳高光偏好更新"
            - "复盘并确定下轮选题方向"
        visibleData:
          - "归因结论：夺冠/反超类高光互动率领先，建议上调该类高光权重"
          - "样本提示：样本充分，归因结论可追溯；策略调整已留可回溯记录"
        designNotes:
          - "样本不足/波动大 → 保守微调或不调整，避免被噪声带偏"
          - "效果数据回流北极星增长 KPI 的内容获客底盘"
