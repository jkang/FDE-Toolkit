readingFlow:
  - "<b>先看全链路</b>：从素材接入到效果回流，形成赛事内容生产闭环"
  - "<b>再找高价值 L4</b>：「高光识别与脚本生成」承载最密集的专家判断（选什么镜头、讲什么事实、怎么说多语言）"
  - "<b>最后下钻 L5</b>：拆成「高光打分 / 叙事要素 / 多语言脚本」三个可独立挂规则的动作"

focusDrill:
  before:
    l4Name: "高光识别与脚本生成"
    whyTooCoarse: "它同时包含高光片段筛选打分、赛事事实叙事化、多语言脚本生成与文化本地化改写等不同动作，输入输出和异常各不相同，不能直接作为最小执行单元。"
  approach: "访谈走查＋材料还原 →"
  evidence:
    - "资深剪辑师先看完整站比赛，凭经验挑出超车/事故/夺冠等高光镜头并判断哪段最能引爆传播"
    - "编导把赛事成绩、车手对战历史翻译成有情绪张力的叙事，而非罗列数据"
    - "本地化团队按各市场文化偏好重写解说，规避禁忌并保留品牌调性"
  after: "下钻为 3 个能独立挂规则的动作，各自回答『选哪些镜头 / 讲什么事实 / 怎么说多语言』。"
focusSequence:
  - { id: "L5-1", name: "高光片段识别与打分", question: "选哪些镜头 · 高光分怎么定" }
  - { id: "L5-2", name: "赛事数据到叙事要素提取", question: "讲什么事实 · 哪些内容值得说" }
  - { id: "L5-3", name: "多语言解说脚本生成", question: "怎么说 · 多语言与文化本地化如何落地" }

taskTable:
  - l5: "高光片段识别与打分"
    inputs: "镜头语义标签+事件时间轴、历史高互动内容素材库、高光判定规则"
    outputs: "高光片段清单（含高光分）"
    ruleType: "决策模型类·高光片段判定与打分"
    exception: "高光分低于阈值/候选不足 → 回退候选池或拉人判定"
    actor: "agent"
  - l5: "赛事数据到叙事要素提取"
    inputs: "高光片段清单、WSBK 赛事事件/成绩/历史对战"
    outputs: "叙事要素（车手/名次/超车/圈速/对战）"
    ruleType: "关键信息提取要点·叙事要素提取"
    exception: "数据与画面对不上 → 标注待人工核对"
    actor: "agent"
  - l5: "多语言解说脚本生成"
    inputs: "叙事要素、品牌调性、目标市场文化偏好与禁忌库、多语言脚本模板"
    outputs: "6 语言解说脚本"
    ruleType: "模版范例类·多语言解说脚本模板"
    exception: "命中文化禁忌/敏感表述 → 自动改写或降级，仍冲突则拉人"
    actor: "agent"

ioChain:
  - "WSBK 原始素材 + 赛事数据"
  - "镜头语义标签 + 事件时间轴"
  - "高光片段清单（含高光分）"
  - "叙事要素"
  - "6 语言解说脚本"
  - "已确认脚本"
  - "下游：自动剪辑 → 多语言配音字幕 → 品牌包装 → 平台适配 → 审核发布"

learning:
  why: "三个焦点 L5 各自只有一个核心动词（识别打分 / 提取 / 生成），产出可观察，并可独立挂接决策模型、提取要点与模板三类规则。"
  key: "挖掘的关键不是改写名称，而是把资深剪辑与编导真实执行的动作顺序、输入输出、判断依据和异常链路结构化。"

