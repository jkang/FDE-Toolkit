title: "ZXMOTO 赛事内容工厂 Agent · MVP 验证方案"
product_name: "ZXMOTO 赛事内容工厂 Agent"
go_no_go_statement: "当 赛事内容产出时效 ≤30 分钟 且 多语言单位成本 ↓≥90% 且 高光识别召回率 ≥95% 且 脚本事实一致率 =100% 且 内容合规通过率 ≥95% 时，允许单站赛事实跑灰度上线。"
target_metrics:
  - name: "赛事内容产出时效"
    dimension: "业务"
    logic: "单条内容从素材上传到成品就绪的端到端时长（P95）"
    threshold: "≤30 分钟"
    source: "内容工厂任务日志"
  - name: "多语言内容单位成本"
    dimension: "业务"
    logic: "单条 6 语言内容制作成本相对原外包基线的下降比例"
    threshold: "↓≥90%"
    source: "财务 / 外包成本台账"
  - name: "内容互动率"
    dimension: "业务"
    logic: "发布内容互动率相对历史基线的提升幅度"
    threshold: "≥+35%"
    source: "各平台开放数据 / Google Analytics"
  - name: "内容合规通过率"
    dimension: "业务"
    logic: "品牌终审一次通过的内容数 / 送审内容数"
    threshold: "≥95%"
    source: "品牌审核台账"
  - name: "高光识别召回率"
    dimension: "模型"
    logic: "正确识别的高光事件数 / 应识别高光事件数（排除慢镜重复）"
    threshold: "≥95%"
    source: "离线高光标注测试集"
  - name: "品牌露出漏标率"
    dimension: "模型"
    logic: "漏标的品牌露出数 / 品牌露出总数"
    threshold: "≤1%"
    source: "品牌露出标注测试集"
  - name: "脚本事实一致率"
    dimension: "模型"
    logic: "与 WSBK 赛事数据一致的脚本事实数 / 脚本事实总数"
    threshold: "=100%"
    source: "脚本事实核对脚本"
  - name: "文化禁忌命中改写率"
    dimension: "模型"
    logic: "命中禁忌且正确改写/降级的脚本数 / 命中禁忌脚本数"
    threshold: "≥98%"
    source: "文化禁忌测试集"
  - name: "P95 端到端出片延迟"
    dimension: "系统"
    logic: "95% 任务从素材接入到内容包就绪的耗时"
    threshold: "≤30 分钟"
    source: "任务监控 / APM"
  - name: "平台适配一次成功率"
    dimension: "系统"
    logic: "一次适配通过的内容包数 / 适配任务数"
    threshold: "≥99%"
    source: "适配服务日志"
  - name: "服务可用性"
    dimension: "系统"
    logic: "内容工厂 API 月度可用率"
    threshold: "≥99.5%"
    source: "APM 监控"
  - name: "品牌审核一次通过率"
    dimension: "体验"
    logic: "无需退回的品牌终审通过数 / 送审内容数"
    threshold: "≥90%"
    source: "品牌审核台账"
  - name: "脚本抽检确认率"
    dimension: "体验"
    logic: "抽检确认放行的脚本数 / 抽检脚本数"
    threshold: "≥95%"
    source: "脚本抽检记录"
  - name: "发布排期采纳率"
    dimension: "体验"
    logic: "采纳 AI 排期建议的次数 / 排期建议总数"
    threshold: "≥85%"
    source: "发布排期看板"
monitoring_plan:
  - name: "脚本生成平均 Token 消耗"
    layer: "模型"
    logic: "单次 6 语言脚本生成的 Input+Output Token"
    range: "1500-3000"
    alert: ">5000"
    meaning: "上下文注入过多或 Prompt 冗余，成本与延迟上升"
  - name: "高光打分置信度中位数"
    layer: "模型"
    logic: "高光候选置信度分布的中位数"
    range: "≥0.80"
    alert: "<0.60"
    meaning: "多模态理解质量下降或素材质量异常"
  - name: "文化禁忌库命中准确率"
    layer: "检索"
    logic: "禁忌检索命中且判定正确的比例"
    range: "≥92%"
    alert: "<85%"
    meaning: "禁忌库覆盖不足或分段策略失效"
  - name: "脚本模板匹配命中率"
    layer: "检索"
    logic: "脚本骨架模板与场景匹配的比例"
    range: "≥90%"
    alert: "<80%"
    meaning: "模板库与场景错配，脚本质量下滑"
  - name: "API 错误率"
    layer: "系统"
    logic: "HTTP 5xx 错误请求占比"
    range: "<0.1%"
    alert: ">1%"
    meaning: "后端服务崩溃或第三方模型 API 限流"
  - name: "剪辑 / TTS 调用失败率"
    layer: "系统"
    logic: "外部剪辑与语音合成调用失败占比"
    range: "<1%"
    alert: ">5%"
    meaning: "外部服务不稳定，触发降级或人工补录"
  - name: "人工转接分布"
    layer: "业务"
    logic: "各 Skill 环节转人工的比例分布"
    range: "平衡分布"
    alert: "单一环节转接 >50%"
    meaning: "特定 Skill 能力缺口或规则覆盖不足"
  - name: "热点窗口错过率"
    layer: "业务"
    logic: "未在赛后黄金传播窗口内发布的内容占比"
    range: "<5%"
    alert: ">15%"
    meaning: "审核或排期成为时效瓶颈，损害内容获客"
test_set_strategy:
  golden_path: 50
  hard_cases: 30
  edge_cases: 20
