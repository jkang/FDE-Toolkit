meta:
  title: "张雪机车海外销售 · 赛事内容工厂 To-be 流程"
  version: "v1.0"
  date: "2026-09-10"
  scenarioName: "赛事内容工厂（WSBK 高光多语言内容自动生产）"
  businessStage: "挖知识 阶段1 任务流程挖掘 · 步骤1.1"
  methodology: "挖知识 阶段1方法（业务环节 L3 → 主要活动 L4 → 深度任务 L5）"
  inputs:
    - "定场景《AI赛事内容工厂-AI画布》（场景定义/数据知识/工作流/系统集成/业务收益）"
    - "定场景《张雪机车-赛事内容工厂-机会点定义》（5 要素 + 价值收益拆解）"
    - "公司级《张雪机车-海外销售战略与北极星指标分析报告》（北极星/增长·留存 KPI）"
    - "公司级《AI原生DTC vs 传统DTC对比分析报告》（AI 内容工厂获客逻辑）"
  sourceRef: "_src-content_factory.yaml 画布 + 公司级战略/机会地图锚点"
  kpi:
    - "赛事内容产出时效"
    - "多语言内容单位成本"
    - "内容互动率"
    - "社媒内容日更量"
    - "内容合规通过率"

legend:
  execution:
    - { type: "agent",  label: "Agent=AI 自动执行", icon: "🤖" }
    - { type: "human",  label: "人工=人工执行",     icon: "👤" }
    - { type: "hybrid", label: "混合=人机协同",     icon: "🤝" }
  hitlFocus:
    - { level: "low",    label: "低 · 人机介入",      desc: "全自动，无人工介入" }
    - { level: "medium", label: "中 · 人机交错/审核", desc: "AI 产出，人工抽检/确认" }
    - { level: "high",   label: "高 · 人机终审",      desc: "人类担任最终裁决" }
    - { level: "gate",   label: "必停确认",           desc: "对外动作，强制人工放行" }
  flowConventions:
    - "Agent 主驱动内容流水线：素材理解 → 高光识别 → 脚本配音 → 剪辑包装 → 平台适配 → 发布编排 → 效果回流"
    - "人工只在价值判断/风险兜底介入：品牌调性与内容红线终审（gate）、脚本抽检、策略复盘"
  valueAnchors:
    - "赛事内容产出时效"
    - "多语言内容单位成本"
    - "内容互动率"
    - "社媒内容日更量"
    - "内容合规通过率"

phases:
  - { id: "P1", order: 1, name: "素材接入", fullName: "赛事素材接入与多模态理解", description: "上传 WSBK 素材 → 多模态理解 → 关联赛事数据 → 设定市场语言与调性" }
  - { id: "P2", order: 2, name: "高光与脚本", fullName: "高光识别与多语言脚本生成", description: "高光识别打分 → 叙事要素提取 → 6 语言脚本生成 → 抽检确认" }
  - { id: "P3", order: 3, name: "剪辑与配音", fullName: "智能剪辑、配音与品牌包装", description: "自动剪辑 → 多语言配音字幕 → 品牌元素与封面包装" }
  - { id: "P4", order: 4, name: "平台适配", fullName: "多平台格式适配与内容包", description: "按平台规范适配时长/比例/编码 → 标签与 SEO 图文生成" }
  - { id: "P5", order: 5, name: "审核与发布", fullName: "品牌审核与发布编排", description: "品牌调性/红线终审 → 发布排期 → 多平台自动发布" }
  - { id: "P6", order: 6, name: "效果与反馈", fullName: "效果追踪与内容策略反馈", description: "互动数据采集 → 效果归因与策略优化 → 复盘调整" }

lanes:
  - { id: "source",       order: 1, name: "赛事素材源",         group: "客户/外部", description: "赛事运营负责人：提供 WSBK 原始素材与赛事数据" }
  - { id: "content_team", order: 2, name: "社媒运营与市场团队", group: "内容团队",   description: "社媒运营专员 + 海外市场营销：市场语言/审核排期/策略协同" }
  - { id: "brand_review", order: 3, name: "品牌内容经理",       group: "品牌把关",   description: "品牌内容经理：品牌调性与内容红线终审放行" }
  - { id: "factory_agent",order: 4, name: "赛事内容工厂 Agent", group: "AI 主驱动",  description: "多模态理解/高光识别/脚本/剪辑编排/适配/排期/反馈" }
  - { id: "backend_sys",  order: 5, name: "后台系统与模型服务", group: "后台系统",   description: "赛事数据库/TTS/剪辑API/社媒平台/数据分析平台" }

tasks:
  - { id: "t01", order: 1, phaseId: "P1", laneId: "source",
      name: "上传 WSBK 原始赛事素材", actor: "human",
      inputs: ["WSBK 原始视频/音频/赛事数据"], outputs: ["已入库赛事素材集"],
      ruleType: "关键信息提取要点·素材元数据识别",
      valueAnchors: ["赛事内容产出时效"], hitlFocus: "low",
      exception: "素材损坏/缺失/授权不明 → 提示重新上传或补充授权",
      description: "赛事运营负责人上传原始素材并触发内容工厂" }
  - { id: "t02", order: 2, phaseId: "P1", laneId: "factory_agent",
      name: "多模态理解赛事素材", actor: "agent",
      inputs: ["赛事素材集", "赛事数据"], outputs: ["镜头语义标签+事件时间轴"],
      ruleType: "关键信息提取要点·赛事镜头与事件识别",
      valueAnchors: ["赛事内容产出时效"], hitlFocus: "low",
      exception: "低置信度镜头 → 标注待复核，不进入高光候选",
      description: "Agent 多模态理解视频，切分镜头并标注赛事事件" }
  - { id: "t03", order: 3, phaseId: "P1", laneId: "backend_sys",
      name: "关联赛事数据库上下文", actor: "agent",
      inputs: ["事件时间轴", "WSBK赛事数据库（车手/成绩/历史对战）"], outputs: ["带车手/成绩/对战上下文的赛事事件"],
      ruleType: "关联关系类·赛事事件与车手成绩关联",
      valueAnchors: ["内容互动率"], hitlFocus: "low",
      exception: "赛事数据缺失 → 降级为仅视频理解并标注",
      description: "后台把事件时间轴与赛事数据关联，补齐叙事上下文" }
  - { id: "t04", order: 4, phaseId: "P1", laneId: "content_team",
      name: "设定目标市场语言与品牌调性", actor: "human",
      inputs: ["目标市场清单", "品牌调性/内容红线", "各平台内容规范"], outputs: ["生成指令（语言/平台/调性/红线）"],
      ruleType: "术语字典类·品牌调性与市场语言口径",
      valueAnchors: ["内容合规通过率"], hitlFocus: "medium",
      exception: "目标市场未覆盖 → 回退默认 6 语言并提示",
      description: "社媒运营专员选择市场与语言，设定调性与红线" }

  - { id: "t05", order: 5, phaseId: "P2", laneId: "factory_agent",
      name: "高光片段识别与打分", actor: "agent",
      inputs: ["镜头语义标签+事件时间轴", "历史高互动内容素材库"], outputs: ["高光片段清单（含高光分）"],
      ruleType: "决策模型类·高光片段判定与打分",
      valueAnchors: ["内容互动率"], hitlFocus: "medium",
      exception: "高光分低于阈值 → 回退候选池或拉人判定",
      description: "Agent 按精彩度/叙事价值/品牌相关度打分筛选高光" }
  - { id: "t06", order: 6, phaseId: "P2", laneId: "backend_sys",
      name: "赛事数据到叙事要素提取", actor: "agent",
      inputs: ["高光片段清单", "赛事事件/成绩"], outputs: ["叙事要素（车手/名次/超车/圈速）"],
      ruleType: "关键信息提取要点·叙事要素提取",
      valueAnchors: ["内容互动率"], hitlFocus: "low",
      exception: "数据与画面对不上 → 标注待人工核对",
      description: "后台从赛事数据提取可叙述的关键事实要素" }
  - { id: "t07", order: 7, phaseId: "P2", laneId: "factory_agent",
      name: "多语言解说脚本生成", actor: "agent",
      inputs: ["叙事要素", "品牌调性", "目标市场文化偏好与禁忌库"], outputs: ["6 语言解说脚本"],
      ruleType: "模版范例类·多语言解说脚本模板",
      valueAnchors: ["内容互动率", "多语言内容单位成本"], hitlFocus: "medium",
      exception: "命中文化禁忌/敏感表述 → 自动改写或降级，仍冲突则拉人",
      description: "Agent 基于赛事数据生成多语言解说脚本并本地化改写" }
  - { id: "t08", order: 8, phaseId: "P2", laneId: "content_team",
      name: "脚本抽检确认", actor: "hybrid",
      inputs: ["6 语言解说脚本"], outputs: ["已确认脚本"],
      ruleType: "决策模型类·脚本抽检放行",
      valueAnchors: ["内容合规通过率"], hitlFocus: "medium",
      exception: "语义偏差/事实错误 → 退回重生成并记录",
      description: "社媒运营专员抽检脚本，确认事实与调性后放行" }

  - { id: "t09", order: 9, phaseId: "P3", laneId: "factory_agent",
      name: "自动剪辑高光片段", actor: "agent",
      inputs: ["已确认脚本", "高光片段清单"], outputs: ["粗剪高光视频"],
      ruleType: "决策模型类·剪辑节奏与镜头选择规则",
      valueAnchors: ["赛事内容产出时效"], hitlFocus: "low",
      exception: "剪辑 API 失败 → 重试 2 次→降级标准模板",
      description: "Agent 按脚本节奏自动剪辑高光镜头" }
  - { id: "t10", order: 10, phaseId: "P3", laneId: "backend_sys",
      name: "多语言配音与字幕合成", actor: "agent",
      inputs: ["6 语言解说脚本"], outputs: ["6 语言配音音轨+字幕"],
      ruleType: "模版范例类·配音字幕合成模板",
      valueAnchors: ["多语言内容单位成本"], hitlFocus: "low",
      exception: "某语种合成失败 → 切换备用 TTS 或标注人工补录",
      description: "后台调用 TTS 生成多语言配音与同步字幕" }
  - { id: "t11", order: 11, phaseId: "P3", laneId: "factory_agent",
      name: "品牌元素与封面包装", actor: "agent",
      inputs: ["粗剪高光视频", "品牌VI规范与视觉标准手册"], outputs: ["含品牌元素/封面缩略图的成片"],
      ruleType: "模版范例类·品牌包装与封面模板",
      valueAnchors: ["内容合规通过率", "内容互动率"], hitlFocus: "low",
      exception: "VI 规范不符 → 回退标准包装模板",
      description: "Agent 叠加品牌元素并生成封面缩略图" }

  - { id: "t12", order: 12, phaseId: "P4", laneId: "factory_agent",
      name: "平台格式适配", actor: "agent",
      inputs: ["成片", "各平台内容规范（时长/比例/标签）"], outputs: ["多平台适配内容包"],
      ruleType: "决策模型类·平台适配规则（时长/比例/编码）",
      valueAnchors: ["社媒内容日更量"], hitlFocus: "low",
      exception: "超出平台时长限制 → 自动裁切/拆条并标注",
      description: "Agent 按 YouTube/TikTok/Instagram/Reels 规范适配" }
  - { id: "t13", order: 13, phaseId: "P4", laneId: "factory_agent",
      name: "标签与 SEO 图文生成", actor: "agent",
      inputs: ["适配内容包", "平台标签规范", "SEO 关键词"], outputs: ["标签集+SEO 图文内容"],
      ruleType: "模版范例类·标签与SEO图文模板",
      valueAnchors: ["内容互动率"], hitlFocus: "low",
      exception: "关键词无覆盖 → 走通用标签并记录待补充",
      description: "Agent 生成平台标签与 SEO 优化图文内容" }

  - { id: "t14", order: 14, phaseId: "P5", laneId: "brand_review",
      name: "品牌调性与内容红线终审", actor: "human",
      inputs: ["多平台适配内容包", "品牌调性/内容红线"], outputs: ["放行/退回指令"],
      ruleType: "决策模型类·品牌红线与合规分级",
      valueAnchors: ["内容合规通过率"], hitlFocus: "gate",
      exception: "触碰品牌红线/文化禁忌 → 退回修改或拦截（对外必停确认）",
      description: "品牌内容经理对对外内容做调性与红线终审放行" }
  - { id: "t15", order: 15, phaseId: "P5", laneId: "factory_agent",
      name: "发布排期与最佳时间选择", actor: "agent",
      inputs: ["放行内容包", "历史发布时间与互动数据"], outputs: ["发布排期表"],
      ruleType: "决策模型类·最佳发布时间与排期规则",
      valueAnchors: ["内容互动率", "社媒内容日更量"], hitlFocus: "medium",
      exception: "档期冲突/热点过期 → 顺延或提示人工调整",
      description: "Agent 生成发布排期并选择各市场最佳发布时间" }
  - { id: "t16", order: 16, phaseId: "P5", laneId: "backend_sys",
      name: "多平台自动发布", actor: "agent",
      inputs: ["发布排期表", "放行内容包"], outputs: ["已发布内容+发布状态"],
      ruleType: "关联关系类·社媒平台发布接口",
      valueAnchors: ["社媒内容日更量"], hitlFocus: "gate",
      exception: "发布失败/账号异常 → 重试→转人工发布",
      description: "后台按排期经社媒管理平台自动发布多平台内容" }

  - { id: "t17", order: 17, phaseId: "P6", laneId: "backend_sys",
      name: "互动数据采集", actor: "agent",
      inputs: ["已发布内容", "各平台开放数据/Google Analytics"], outputs: ["互动指标数据集"],
      ruleType: "关联关系类·平台效果数据接口",
      valueAnchors: ["内容互动率"], hitlFocus: "low",
      exception: "数据延迟/缺失 → 标注更新时间并等待补齐",
      description: "后台采集播放/互动/转化等效果指标" }
  - { id: "t18", order: 18, phaseId: "P6", laneId: "factory_agent",
      name: "效果归因与内容策略优化", actor: "agent",
      inputs: ["互动指标数据集", "历史高互动内容素材库"], outputs: ["内容策略优化建议+高光偏好更新"],
      ruleType: "决策模型类·效果归因与策略优化",
      valueAnchors: ["内容互动率", "多语言内容单位成本"], hitlFocus: "medium",
      exception: "样本不足/波动大 → 保守微调或不调整",
      description: "Agent 归因效果并回流优化高光选择与内容策略" }
  - { id: "t19", order: 19, phaseId: "P6", laneId: "content_team",
      name: "策略复盘与下轮调整", actor: "human",
      inputs: ["内容策略优化建议", "市场反馈"], outputs: ["下轮内容策略与选题方向"],
      ruleType: "决策模型类·策略复盘决策",
      valueAnchors: ["内容互动率"], hitlFocus: "high",
      exception: "策略方向冲突/资源受限 → 人工裁决优先级",
      description: "海外市场营销与社媒运营复盘并确定下轮策略" }

flowNotes:
  - "主链路 P1→P2→P3→P4→P5→P6，赛事内容工厂 Agent 主驱动全程，人工仅在品牌价值判断与风险兜底介入"
  - "全场景核心确认点（HITL 高）：P5 品牌调性与内容红线终审（gate，对外必停）、P5 多平台自动发布（gate）、P6 策略复盘（high）"
  - "多语言与文化本地化由 LLM + TTS 自产替代外包团队，平台适配由规则引擎批量执行，是 3 天→30 分钟、成本降 90% 的关键"
returnNodes:
  - "素材损坏/授权不明 → 提示重新上传，不阻塞后续分站赛流程"
  - "高光分低/脚本事实错误/文化禁忌 → 回退候选池或退回重生成"
  - "触碰品牌红线 → 退回修改/拦截，禁止未放行即对外发布"
